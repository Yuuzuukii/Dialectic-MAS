<script>
const DATA = {"animal_dissection": {"no_schema": [{"run": 1, "question": "Should students dissect animals?", "elements": [{"data": {"id": "arg-93fb6b1078", "kind": "main", "label": "AG1 main\nStudents should dissect animals. First, ", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-93fb6b1078\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nStudents should dissect animals. First, dissection gives learning opportunities that simulations can’t fully replace: students handle real biological structures, which builds fine motor skills, strengthens hand-eye coordination, and develops critical thinking through careful observation and interpretation of anatomy. Second, it can spark genuine interest in science and even encourage career pursuit by turning abstract biology into a hands-on “aha moment.” Finally, the ethical cost is mitigated because dissection typically uses animals that were already deceased—over 98% of dissected animals were already dead—and in many cases (e.g., fetal pigs) the animals are meat-industry byproducts destined for disposal, making school use a productive alternative rather than additional harm."}, "position": {"x": 85.0, "y": 0}}, {"data": {"id": "arg-a2be3b9c1d", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals beca", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-a2be3b9c1d\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-93fb6b1078\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"the ethical cost is mitigated because dissection typically uses animals that were already deceased—over 98% of dissected animals were already dead—and in many cases (e.g., fetal pigs) the animals are meat-industry byproducts\"\n}\n\nStudents should not dissect animals because dissection practices are ethically and environmentally harmful: about 99% of dissection animals are caught in the wild, and wild-catching decreases local populations and reduces biodiversity. The “ethical cost is mitigated” framing doesn’t match the sourcing reality, so dissection still involves substantial animal harm. Also, animal dissection is unnecessary for the learning goals—synthetic models and computer simulations can teach anatomy and related skills at least as effectively, and medical training standards (as reflected in what’s required/used in education) do not depend on student dissection of real animals."}, "position": {"x": 85.0, "y": 140}}, {"data": {"id": "e-arg-a2be3b9c1d", "source": "arg-a2be3b9c1d", "target": "arg-93fb6b1078", "ls": "dashed", "label": "undercut", "detail": "arg-a2be3b9c1d (AG2 defeat) → arg-93fb6b1078\nattack: undercut\ntarget_field: Ass\ntarget_statement: the ethical cost is mitigated because dissection typically uses animals that were already deceased—over 98% of dissected animals were already dead—and in many cases (e.g., fetal pigs) the animals are meat-industry byproducts"}}, {"data": {"id": "arg-7607f91efe", "kind": "counter", "label": "AG1 counter\nStudents should dissect animals. The opp", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-7607f91efe\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a2be3b9c1d\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals because dissection practices are ethically and environmentally harmful ... and animal dissection is unnecessary for the learning goals.\"\n}\n\nStudents should dissect animals. The opponent’s ethical/environmental objection depends on the claim that most dissection animals are taken from the wild (e.g., “about 99% … caught in the wild”), but that premise doesn’t hold for typical school dissection supply: over 98% of dissected animals were already deceased, and in many cases (such as fetal pigs) the specimens are meat-industry byproducts that would otherwise be discarded. If the animals are already dead/byproducts, school dissection doesn’t generate new wild-catching pressure that would plausibly drive the biodiversity harm they predict, and it can convert waste-bound byproducts into educational use. \n\nThe opponent also argues dissection is “unnecessary” because synthetic models/computer simulations can teach anatomy “at least as effectively,” but that overstates what non-real specimens can provide: students learn anatomy most deeply when they must work with genuine biological tissue and real spatial relationships in a hands-on setting. And the claim about medical “standards” being independent of student dissection doesn’t settle the school-education question—schools can reasonably choose a method that yields more authentic anatomical engagement even if it’s not the only pathway used in clinical training."}, "position": {"x": 0.0, "y": 280}}, {"data": {"id": "e-arg-7607f91efe", "source": "arg-7607f91efe", "target": "arg-a2be3b9c1d", "ls": "solid", "label": "rebut", "detail": "arg-7607f91efe (AG1 counter) → arg-a2be3b9c1d\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals because dissection practices are ethically and environmentally harmful ... and animal dissection is unnecessary for the learning goals."}}, {"data": {"id": "arg-afcd914b37", "kind": "defeat", "label": "AG2 defeat\nThe target’s key “ethical cost is mitiga", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-afcd914b37\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-7607f91efe\",\n  \"target_field\": \"Ass\"\n}\n\nThe target’s key “ethical cost is mitigated” move depends on assuming that typical dissection specimens largely are already-dead/byproducts and therefore don’t involve meaningful wild capture. But on the sourcing reality I’m relying on, approximately 99% of dissection animals are caught in the wild. If wild-catching is the dominant supply source, then dissection demand predictably sustains capture pressure that decreases local populations and reduces biodiversity. In that case, the claim that school dissection “doesn’t generate new wild-catching pressure” doesn’t hold, because the harm isn’t limited to incremental killing of already-held animals—it’s tied to the continued wild capture required to supply dissection specimens."}, "position": {"x": 0, "y": 420}}, {"data": {"id": "e-arg-afcd914b37", "source": "arg-afcd914b37", "target": "arg-7607f91efe", "ls": "dashed", "label": "undercut", "detail": "arg-afcd914b37 (AG2 defeat) → arg-7607f91efe\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-28d7e0c4eb", "kind": "counter", "label": "AG1 counter\nStudents should dissect animals because ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-28d7e0c4eb\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a2be3b9c1d\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals\"\n}\n\nStudents should dissect animals because dissection is educationally more than “learning anatomy content”: it directly cultivates fine motor skills, hand-eye coordination, and critical thinking through the real procedural demands of working with biological tissue and making careful observations and interpretations. It also produces a hands-on “aha moment” that can generate genuine interest in science and encourage students toward science careers—outcomes that go beyond what the opponent’s “synthetic models/computer simulations” claim covers when they treat dissection as unnecessary. If dissection is uniquely effective at building these transferable skills and motivating students, then it is not the case that student dissection can be safely replaced by simulations “at least as effectively.”"}, "position": {"x": 170, "y": 280}}, {"data": {"id": "e-arg-28d7e0c4eb", "source": "arg-28d7e0c4eb", "target": "arg-a2be3b9c1d", "ls": "solid", "label": "rebut", "detail": "arg-28d7e0c4eb (AG1 counter) → arg-a2be3b9c1d\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals"}}, {"data": {"id": "arg-50983dcb2d", "kind": "main", "label": "AG2 main\nStudents should not dissect animals beca", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-50983dcb2d\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nStudents should not dissect animals because student dissection is not necessary to meet the actual educational and professional goals schools claim to serve. College Board AP Biology and the Next Generation Science Standards do not require dissection of real animals to teach the relevant biology concepts, and U.S./Canadian medical education does not use animals for physician training in a way that would make student dissection indispensable. When dissection is not required to achieve the curriculum or medical training outcomes, the ethical harm inherent in using real animals for dissection cannot be justified, especially given that alternatives (synthetic models and computer simulations) are available to teach anatomy without involving dead animals."}, "position": {"x": 425.0, "y": 0}}, {"data": {"id": "arg-b84f535046", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals because ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-b84f535046\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-50983dcb2d\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals\"\n}\n\nStudents should dissect animals because ethical justification for school dissection does not turn on whether AP/NGSS or medical education explicitly require real-animal dissection; it turns on whether the practice meaningfully advances students’ learning while minimizing additional harm. When dissection uses animals that were already deceased—such as the “over 98% already dead” situation, and fetal pigs as meat-industry byproducts destined for disposal—school dissection does not create the kind of new animal-killing pressure the ethical objection is worried about. Given that harm is thereby reduced, it is reasonable for schools to choose dissection because it provides distinctive hands-on development of fine motor skills, hand-eye coordination, and critical thinking/observation, and it can motivate students toward science interests and careers—educational aims beyond merely meeting a minimum standard requirement."}, "position": {"x": 340.0, "y": 140}}, {"data": {"id": "e-arg-b84f535046", "source": "arg-b84f535046", "target": "arg-50983dcb2d", "ls": "solid", "label": "rebut", "detail": "arg-b84f535046 (AG1 defeat) → arg-50983dcb2d\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals"}}, {"data": {"id": "arg-4d7f8f333d", "kind": "defeat", "label": "AG2 defeat\nA key assumption in the target is: “if t", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-4d7f8f333d\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-b84f535046\",\n  \"target_field\": \"Ass\"\n}\n\nA key assumption in the target is: “if the specimens are already dead / byproducts, school dissection does not meaningfully increase killing pressure (so harm is thereby reduced).” That assumption is not true.\n\nEven when a specimen is described as “already dead,” dissection still depends on supply chains that involve intentional procurement—i.e., animals must be killed/obtained to meet classroom demand. Adding a new buyer (schools) can increase the quantity of specimens sourced. That means dissection can still generate additional animal deaths rather than merely reuse losses that would have happened anyway.\n\nLikewise, describing fetal pigs as “meat-industry byproducts destined for disposal” doesn’t eliminate harm; it only reframes it. If additional demand from schools makes more specimens commercially valuable, it can increase slaughter/production volumes and thus the total harms those animals faced. So the target’s claim that byproduct/already-dead sourcing prevents the “new animal-killing pressure” at issue is an invalid assumption: dissection demand can still incentivize more procurement and thereby sustain or expand ethical and environmental harms."}, "position": {"x": 340, "y": 280}}, {"data": {"id": "e-arg-4d7f8f333d", "source": "arg-4d7f8f333d", "target": "arg-b84f535046", "ls": "dashed", "label": "undercut", "detail": "arg-4d7f8f333d (AG2 defeat) → arg-b84f535046\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-1667ae2703", "kind": "defeat", "label": "AG1 defeat\nI hold that whether school dissection is", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-1667ae2703\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-50983dcb2d\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"When dissection is not required to achieve the curriculum or medical training outcomes, the ethical harm inherent in using real animals for dissection cannot be justified.\"\n}\n\nI hold that whether school dissection is ethically justified does not hinge on whether AP/NGSS or professional medical training *requires* student dissection. Ethical justification depends on the incremental harm produced by the practice. When dissection specimens are already deceased (e.g., the situation where over 98% of dissected animals were already dead) and—such as with fetal pigs—are meat-industry byproducts destined for disposal, using them in class is better seen as productive use of material that would otherwise be discarded rather than as additional killing driven by the lesson. Given that, dissection can be ethically permissible even if it is not strictly “indispensable” to meet curriculum/outcome requirements."}, "position": {"x": 510.0, "y": 140}}, {"data": {"id": "e-arg-1667ae2703", "source": "arg-1667ae2703", "target": "arg-50983dcb2d", "ls": "dashed", "label": "undercut", "detail": "arg-1667ae2703 (AG1 defeat) → arg-50983dcb2d\nattack: undercut\ntarget_field: Ass\ntarget_statement: When dissection is not required to achieve the curriculum or medical training outcomes, the ethical harm inherent in using real animals for dissection cannot be justified."}}, {"data": {"id": "arg-63444d45c9", "kind": "counter", "label": "AG2 counter\nI hold that dissection cannot be treated", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-63444d45c9\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-1667ae2703\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"when dissection specimens are already deceased (and fetal pigs are meat-industry byproducts destined for disposal), using them in class is better seen as productive use of material that would otherwise be discarded rather than as additional killing driven by the lesson\"\n}\n\nI hold that dissection cannot be treated as ethically permissible on the grounds that the specimens are “already deceased” or “meat-industry byproducts destined for disposal,” because those materials still originate from animal killing and the availability of “byproducts” depends on slaughter levels. When schools use these tissues in dissection, they increase demand and market value for them, which can shift production incentives upstream—meaning the practice produces additional animal-killing and environmental cost rather than merely converting unavoidable waste. Therefore, ethical justification cannot rely on the idea that dissection adds no incremental harm just because the specimens used in class are dead."}, "position": {"x": 510, "y": 280}}, {"data": {"id": "e-arg-63444d45c9", "source": "arg-63444d45c9", "target": "arg-1667ae2703", "ls": "dashed", "label": "undercut", "detail": "arg-63444d45c9 (AG2 counter) → arg-1667ae2703\nattack: undercut\ntarget_field: Ass\ntarget_statement: when dissection specimens are already deceased (and fetal pigs are meat-industry byproducts destined for disposal), using them in class is better seen as productive use of material that would otherwise be discarded rather than as additional killing driven by the lesson"}}, {"data": {"id": "end-arg-93fb6b1078", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 170, "y": 385.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "end-arg-50983dcb2d", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 510, "y": 385.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG1", "label": "AG1: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 680, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 680, "y": 84.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>10<\/td><\/tr><tr><td>attack_turn_count<\/td><td>8<\/td><\/tr><tr><td>main_argument_count<\/td><td>2<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>0<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.041091<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Students should **not** dissect animals in typical school science classes.\n\n### Why the “pro dissection” case isn’t strong enough to override the ethical and necessity concerns\n1. **Real-animal dissection can have genuine learning benefits—but those benefits aren’t shown to be uniquely irreplaceable.**  \n   Dissection may improve **fine motor skills**, **hand–eye coordination**, and **critical thinking** through handling tissue and interpreting anatomy. It can also create motivating **“aha” moments** that encourage interest in science careers.  \n   However, the strongest requirement for allowing dissection is not that it helps *some*, but that it provides learning opportunities **simulations/other alternatives cannot fully replace**. The case presented supports that dissection is valuable, but it does not establish that alternatives (synthetic models, prepared specimens that don’t require cutting living/captured wildlife, high-fidelity digital tools, etc.) cannot achieve the same core learning outcomes.\n\n2. **The ethical justification is not sufficiently secured given the sourcing uncertainty and potential for incremental harm.**  \n   Supporters argue harm is mitigated because most specimens are **already dead** (e.g., “over 98%”) and sometimes come from **fetal pigs as meat-industry byproducts** destined for disposal/landfills.  \n   But there are serious challenges to treating that as ethically “safe”:\n   - One side argues the opposite sourcing reality: around **99% are caught in the wild**, which would mean dissection demand can worsen biodiversity loss and local population declines.\n   - Even if animals are “already dead” or “byproducts,” increasing classroom demand can still create incentives upstream (e.g., higher production volume), meaning dissection may not merely reuse unavoidable losses.\n\n   Because the debate contains **conflicting sourcing claims** and also highlights plausible “incremental demand” harm, the ethical mitigation is not convincingly established.\n\n3. **Dissection is not shown to be required to meet educational or professional goals, while alternatives are available.**  \n   The anti-dissection argument is that real-animal dissection is **not required** by major biology education frameworks (AP Biology / Next Generation Science Standards) and that it is **not indispensable** for medical training in a way that would make classroom dissection uniquely necessary.  \n   If dissection is not required for the outcomes schools must teach, then the ethical burden becomes much harder to justify—especially when alternatives exist that can teach anatomy and related scientific reasoning without involving animal procurement for cutting.\n\n### Addressing the main remaining uncertainties (what the debate did *not* fully settle)\n- **Which sourcing picture is actually correct (already-dead/byproduct vs. wild-caught)?** The discussion relies on competing statistics (“over 98% already dead” vs. “about 99% wild-caught”). Because these cannot be reconciled from the information given, the claim that harm is plausibly mitigated is not firmly supported.\n- **Whether alternatives teach “equally well or better”**: the anti-dissection side asserts this; the pro-dissection side asserts dissection is more authentic and irreplaceable. Neither side provided strong comparative evidence beyond plausibility claims.\n\n### Bottom line\nEven granting that dissection can provide engaging hands-on experience, the better-supported overall position is **opposition**, because:\n- the case for dissection being **necessary or uniquely irreplaceable** for the required educational goals is not demonstrated convincingly, and\n- the ethical justification depends on uncertain and possibly misleading claims about animal sourcing and incremental harm.\n\nSo, the most defensible policy for schools is to **teach biology with non-animal alternatives** rather than require or routinely use real-animal dissection.<\/pre><\/details><div>justification_status: <b>fallback_no_consensus<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}], "schema": [{"run": 1, "question": "Should students dissect animals?", "elements": [{"data": {"id": "arg-f9d6a25244", "kind": "main", "label": "AG1 main\nAllowing students to dissect animals is ", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-f9d6a25244\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Classroom dissection requires students to manipulate real anatomical specimens (e.g., cutting, opening, and examining internal structures) rather than only observing.\",\n            \"Biology instruction benefits when students gain experiential, firsthand learning opportunities instead of purely observational exposure.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection provides students with more direct, experiential learning opportunities than observation-only approaches.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection provides students with more direct, experiential learning opportunities than observation-only approaches.\",\n            \"Dissection tasks require using dissection tools and carefully coordinating hand movements while visually tracking structures during cutting and examination.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Through specimen manipulation, dissection develops fine motor skills, hand-eye coordination, and related critical-thinking habits used in biology.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Through specimen manipulation, dissection develops fine motor skills, hand-eye coordination, and related critical-thinking habits used in biology.\",\n            \"Active skill-building and hands-on problem-solving tend to increase student engagement and motivation to learn biology.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection can spark student enthusiasm and increase interest in pursuing science-related study and careers.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection can spark student enthusiasm and increase interest in pursuing science-related study and careers.\",\n            \"In typical school dissection use, over 98% of dissected animals are already deceased, so the practice is not primarily driven by killing animals for the classroom activity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Because over 98% of dissected animals are already deceased, dissection is a productive use of animals that are not being killed for the classroom activity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Because over 98% of dissected animals are already deceased, dissection is a productive use of animals that are not being killed for the classroom activity.\",\n            \"When fetal pigs are used, they are meat industry byproducts destined for landfill, so classroom educational use can reduce waste by giving them an alternative to disposal.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"When fetal pigs are used, dissection can reduce waste by giving a valuable educational use to animals that would otherwise be discarded.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"When fetal pigs are used, dissection can reduce waste by giving a valuable educational use to animals that would otherwise be discarded.\",\n            \"The educational gains supported above (experiential learning, skill development, and increased interest in science) justify the remaining ethical tradeoffs when the specimens are already deceased byproducts rather than animals killed for dissection.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Allowing students to dissect animals is justified as a worthwhile educational practice with ethical tradeoffs that are meaningfully mitigated by the use of already-deceased byproduct specimens.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection provides students with more direct, experiential learning opportunities than observation-only approaches.\",\n      \"Through specimen manipulation, dissection develops fine motor skills, hand-eye coordination, and related critical-thinking habits used in biology.\",\n      \"Dissection can spark student enthusiasm and increase interest in pursuing science-related study and careers.\",\n      \"Because over 98% of dissected animals are already deceased, dissection is a productive use of animals that are not being killed for the classroom activity.\",\n      \"When fetal pigs are used, dissection can reduce waste by giving a valuable educational use to animals that would otherwise be discarded.\",\n      \"Allowing students to dissect animals is justified as a worthwhile educational practice with ethical tradeoffs that are meaningfully mitigated by the use of already-deceased byproduct specimens.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0.0, "y": 0}}, {"data": {"id": "arg-e4638d7617", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals.", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-e4638d7617\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-f9d6a25244\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Allowing students to dissect animals is justified as a worthwhile educational practice with ethical tradeoffs that are meaningfully mitigated by the use of already-deceased byproduct specimens.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target’s justification relies on the claim that classroom dissection uses already-deceased/byproduct specimens rather than primarily involving wild-catching.\",\n            \"I hold that approximately 99% of dissection animals are caught in the wild, and wild-catching decreases local populations and reduces biodiversity.\",\n            \"If dissection relies on wild-caught animals, then it contributes to harm to local populations and biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Most classroom dissection animals are sourced through wild-catching that harms local populations and reduces biodiversity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Most classroom dissection animals are sourced through wild-catching that harms local populations and reduces biodiversity.\",\n            \"Using inhumane, biodiversity-harming animal-supply methods is bad and should not be supported for schooling.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection is unethical because it relies on inhumane, biodiversity-harming sourcing.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"I hold that medical studies and physician training do not require or benefit from animal dissection for education (it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training).\",\n            \"I hold that effective non-animal alternatives (synthetic models and computer simulations) teach equally well or better, and students learn just as well or better with alternatives versus dead animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection is unnecessary because effective non-animal alternatives meet learning needs at least as well.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection is unethical because it relies on inhumane, biodiversity-harming sourcing.\",\n            \"Animal dissection is unnecessary because effective non-animal alternatives meet learning needs at least as well.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals.\"\n      }\n    ],\n    \"Conc\": [\n      \"Most classroom dissection animals are sourced through wild-catching that harms local populations and reduces biodiversity.\",\n      \"Dissection is unethical because it relies on inhumane, biodiversity-harming sourcing.\",\n      \"Animal dissection is unnecessary because effective non-animal alternatives meet learning needs at least as well.\",\n      \"Students should not dissect animals.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0.0, "y": 140}}, {"data": {"id": "e-arg-e4638d7617", "source": "arg-e4638d7617", "target": "arg-f9d6a25244", "ls": "solid", "label": "rebut", "detail": "arg-e4638d7617 (AG2 defeat) → arg-f9d6a25244\nattack: rebut\ntarget_field: Conc\ntarget_statement: Allowing students to dissect animals is justified as a worthwhile educational practice with ethical tradeoffs that are meaningfully mitigated by the use of already-deceased byproduct specimens."}}, {"data": {"id": "arg-e2bff8b028", "kind": "counter", "label": "AG1 counter\nStudents should be allowed to dissect an", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-e2bff8b028\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-e4638d7617\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In typical school dissection use, over 98% of dissected animals are already deceased and are sourced as byproducts rather than being sourced mainly through wild-catching.\",\n            \"If dissection primarily uses already-deceased byproduct animals (not wild-catching), then dissection does not primarily rely on wild-catch practices that would drive population and biodiversity harm in the source ecosystem.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In typical school dissection use, over 98% of dissected animals are already deceased byproducts rather than being sourced mainly through wild-catching.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In typical school dissection use, over 98% of dissected animals are already deceased byproducts rather than being sourced mainly through wild-catching.\",\n            \"Therefore, dissection does not primarily rely on wild-catch practices that would drive population and biodiversity harm in the source ecosystem.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection does not primarily cause biodiversity harm via wild-capture sourcing in typical classroom practice.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Non-animal alternatives (e.g., synthetic models and simulations) can support some anatomy learning but cannot provide the same tactile, tool-mediated specimen manipulation.\",\n            \"Therefore, non-animal alternatives cannot straightforwardly replace the psychomotor learning produced by real specimen manipulation.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Non-animal alternatives cannot straightforwardly replicate the psychomotor learning produced by real specimen manipulation.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection does not primarily cause biodiversity harm via wild-capture sourcing in typical classroom practice.\",\n            \"Non-animal alternatives cannot straightforwardly replicate the psychomotor learning produced by real specimen manipulation.\",\n            \"So the attack’s rationale that dissection should be rejected on (a) wild-capture/biodiversity grounds and (b) “alternatives are at least equally effective” grounds is not supported for typical classroom dissection.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The attack’s two key premises (wild-capture biodiversity harm and equivalently effective alternatives) do not establish that dissection should be rejected in typical classroom settings.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The attack’s two key premises (wild-capture biodiversity harm and equivalently effective alternatives) do not establish that dissection should be rejected in typical classroom settings.\",\n            \"When dissection is conducted with already-deceased byproduct specimens, its educational benefits can outweigh the remaining ethical tradeoffs.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should be allowed to dissect animals when the specimens are already-deceased byproducts.\"\n      }\n    ],\n    \"Conc\": [\n      \"In typical school dissection use, over 98% of dissected animals are already deceased byproducts rather than being sourced mainly through wild-catching.\",\n      \"Dissection does not primarily cause biodiversity harm via wild-capture sourcing in typical classroom practice.\",\n      \"Non-animal alternatives cannot straightforwardly replicate the psychomotor learning produced by real specimen manipulation.\",\n      \"The attack’s two key premises (wild-capture biodiversity harm and equivalently effective alternatives) do not establish that dissection should be rejected in typical classroom settings.\",\n      \"Students should be allowed to dissect animals when the specimens are already-deceased byproducts.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0.0, "y": 280}}, {"data": {"id": "e-arg-e2bff8b028", "source": "arg-e2bff8b028", "target": "arg-e4638d7617", "ls": "solid", "label": "rebut", "detail": "arg-e2bff8b028 (AG1 counter) → arg-e4638d7617\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals."}}, {"data": {"id": "arg-d084195697", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals.", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-d084195697\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-e2bff8b028\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should be allowed to dissect animals when the specimens are already-deceased byproducts.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target assumes classroom dissection mostly involves already-deceased byproduct animals rather than wild-caught animals.\",\n            \"I hold that approximately 99% of dissection animals are caught in the wild, and wild-catching decreases local populations and reduces biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical classroom dissection still relies heavily on wild-catching that reduces biodiversity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Typical classroom dissection still relies heavily on wild-catching that reduces biodiversity.\",\n            \"I hold that using inhumane, biodiversity-harming animal-supply methods for schooling is bad and should not be supported.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection is unethical because it depends on inhumane, biodiversity-harming sourcing.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"I hold that medical studies and physician training do not require or benefit from animal dissection for education, and no U.S. or Canadian medical schools use animals for physician training.\",\n            \"I hold that effective non-animal alternatives (synthetic models and computer simulations) teach equally well or better, and students learn just as well or better with alternatives versus dead animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection is unnecessary because alternatives meet learning needs at least as well, and dissection is not medically required for education.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is unethical because it depends on inhumane, biodiversity-harming sourcing.\",\n            \"Animal dissection is unnecessary because alternatives meet learning needs at least as well, and dissection is not medically required for education.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals.\"\n      }\n    ],\n    \"Conc\": [\n      \"Typical classroom dissection still relies heavily on wild-catching that reduces biodiversity.\",\n      \"Animal dissection is unethical because it depends on inhumane, biodiversity-harming sourcing.\",\n      \"Animal dissection is unnecessary because alternatives meet learning needs at least as well, and dissection is not medically required for education.\",\n      \"Students should not dissect animals.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0.0, "y": 420}}, {"data": {"id": "e-arg-d084195697", "source": "arg-d084195697", "target": "arg-e2bff8b028", "ls": "solid", "label": "rebut", "detail": "arg-d08419569 tion, and critical-thinking habits used in biology.\",\n            \"Hands-on experience can create “aha moments” that increase engagement and inspire interest in science careers.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection can increase student engagement and enthusiasm, supporting interest in science and related careers.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In typical school dissection use, over 98% of dissected animals are already deceased.\",\n            \"Fetal pigs used for dissection are meat-industry byproducts destined for landfill, meaning dissection can redirect waste toward an educational use rather than adding to killing for the classroom.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical school dissection uses mostly already-deceased byproducts, and can reduce landfill waste by giving animals an alternative educational use.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection builds fine motor skills, hand-eye coordination, and critical-thinking habits used in biology.\",\n            \"Dissection can increase student engagement and enthusiasm, supporting interest in science and related careers.\",\n            \"Typical school dissection uses mostly already-deceased byproducts, and can reduce landfill waste by giving animals an alternative educational use.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should be allowed to dissect animals in typical school settings.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection provides students with distinctive firsthand experiential learning in biology.\",\n      \"Dissection builds fine motor skills, hand-eye coordination, and critical-thinking habits used in biology.\",\n      \"Dissection can increase student engagement and enthusiasm, supporting interest in science and related careers.\",\n      \"Typical school dissection uses mostly already-deceased byproducts, and can reduce landfill waste by giving animals an alternative educational use.\",\n      \"Students should be allowed to dissect animals in typical school settings.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0, "y": 560}}, {"data": {"id": "e-arg-7393c5f4c3", "source": "arg-7393c5f4c3", "target": "arg-d084195697", "ls": "solid", "label": "rebut", "detail": "arg-7393c5f4c3 (AG1 counter) → arg-d084195697\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals."}}, {"data": {"id": "arg-11b1d592bf", "kind": "main", "label": "AG2 main\nStudents should not dissect animals.", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-11b1d592bf\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"AP Biology does not require animal dissection for biology learning objectives.\",\n            \"NGSS does not require animal dissection for biology learning objectives.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection is not required by AP Biology or NGSS for biology learning objectives.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is not required by AP Biology or NGSS for biology learning objectives.\",\n            \"I oppose animal dissection because the methods used to supply dissection animals are inhumane and environmentally harmful.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Because dissection is not required by learning standards, the ethical harms from dissection cannot be justified as part of required education.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of dissection animals are caught in the wild.\",\n            \"Wild-catching decreases local populations and reduces biodiversity.\",\n            \"I believe animal-supply methods used for dissections are inhumane.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection relies on inhumane wild-catching that harms local populations and reduces biodiversity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Because dissection is not required by learning standards, the ethical harms from dissection cannot be justified as part of required education.\",\n            \"Dissection relies on inhumane wild-catching that harms local populations and reduces biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection is not required by AP Biology or NGSS for biology learning objectives.\",\n      \"Because dissection is not required by learning standards, the ethical harms from dissection cannot be justified as part of required education.\",\n      \"Dissection relies on inhumane wild-catching that harms local populations and reduces biodiversity.\",\n      \"Students should not dissect animals.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170.0, "y": 0}}, {"data": {"id": "arg-c38969b785", "kind": "defeat", "label": "AG1 defeat\nStudents should be allowed to dissect an", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-c38969b785\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-11b1d592bf\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"AP Biology and NGSS specify biology learning objectives, but they do not by themselves establish a rule that a teaching method is ethically impermissible whenever it is not explicitly required by those standards.\",\n            \"If a classroom activity meaningfully supports biology learning and is structured to limit harm (e.g., by using specimens that are already-deceased byproducts rather than being obtained mainly by killing for the activity), then ethical tradeoffs can be justified even if the method is not required by standards.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The fact that animal dissection is not explicitly required by AP Biology/NGSS does not, by itself, make dissection ethically unjustifiable.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In typical school dissection use, over 98% of dissected animals are already deceased, sourced as byproducts rather than sourced mainly through killing for the classroom activity.\",\n            \"Using already-deceased/byproduct specimens limits the harm compared to practices that require killing animals for the activity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical classroom dissection is harm-limited because it uses already-deceased/byproduct specimens rather than primarily involving killing for the activity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Typical classroom animal dissection involves firsthand manipulation of real anatomical specimens (e.g., cutting/opening and examining structures), which provides distinctive experiential learning beyond observation-only approaches.\",\n            \"Meaningful experiential learning is a relevant educational reason for using dissection to teach biology.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection can meaningfully support biology learning objectives through firsthand specimen manipulation.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The fact that animal dissection is not explicitly required by AP Biology/NGSS does not, by itself, make dissection ethically unjustifiable.\",\n            \"Typical classroom dissection is harm-limited because it uses already-deceased/byproduct specimens rather than primarily involving killing for the activity.\",\n            \"Animal dissection can meaningfully support biology learning objectives through firsthand specimen manipulation.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should be allowed to dissect animals in typical school settings when the specimens are already-deceased byproducts.\"\n      }\n    ],\n    \"Conc\": [\n      \"The fact that animal dissection is not explicitly required by AP Biology/NGSS does not, by itself, make dissection ethically unjustifiable.\",\n      \"Typical classroom dissection is harm-limited because it uses already-deceased/byproduct specimens rather than primarily involving killing for the activity.\",\n      \"Animal dissection can meaningfully support biology learning objectives through firsthand specimen manipulation.\",\n      \"Students should be allowed to dissect animals in typical school settings when the specimens are already-deceased byproducts.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170.0, "y": 140}}, {"data": {"id": "e-arg-c38969b785", "source": "arg-c38969b785", "target": "arg-11b1d592bf", "ls": "solid", "label": "rebut", "detail": "arg-c38969b785 (AG1 defeat) → arg-11b1d592bf\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals."}}, {"data": {"id": "arg-0fa1b6a4b1", "kind": "counter", "label": "AG2 counter\nStudents should not dissect animals.", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-0fa1b6a4b1\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-c38969b785\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should be allowed to dissect animals in typical school settings when the specimens are already-deceased byproducts.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"I oppose animal dissection because dissection depends on inhumane and environmentally harmful animal-supply practices.\",\n            \"I hold that if an activity is not educationally necessary because effective alternatives meet learning needs at least as well, then it is ethically unjustified to impose the harmful practice in schooling.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Using animal death in school dissection is ethically justifiable only if it is educationally necessary.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"I hold that effective non-animal alternatives (synthetic models and computer simulations) teach equally well or better than dissection, and students learn just as well or better with alternatives versus dead animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Non-animal alternatives can meet anatomy/biology learning needs at least as well as dissection, so dissection is not educationally necessary.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Using animal death in school dissection is ethically justifiable only if it is educationally necessary.\",\n            \"Non-animal alternatives can meet anatomy/biology learning needs at least as well as dissection, so dissection is not educationally necessary.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection is ethically unjustified in schooling because it is not educationally necessary given effective alternatives.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection is ethically unjustified in schooling because it is not educationally necessary given effective alternatives.\",\n            \"I hold that approximately 99% of dissection animals are caught in the wild, and wild-catching decreases local populations and reduces biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection adds inhumane/environmental harm without educational necessity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection adds inhumane/environmental harm without educational necessity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals.\"\n      }\n    ],\n    \"Conc\": [\n      \"Using animal death in school dissection is ethically justifiable only if it is educationally necessary.\",\n      \"Non-animal alternatives can meet anatomy/biology learning needs at least as well as dissection, so dissection is not educationally necessary.\",\n      \"Dissection is ethically unjustified in schooling because it is not educationally necessary given effective alternatives.\",\n      \"Dissection adds inhumane/environmental harm without educational necessity.\",\n      \"Students should not dissect animals.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170.0, "y": 280}}, {"data": {"id": "e-arg-0fa1b6a4b1", "source": "arg-0fa1b6a4b1", "target": "arg-c38969b785", "ls": "solid", "label": "rebut", "detail": "arg-0fa1b6a4b1 (AG2 counter) → arg-c38969b785\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should be allowed to dissect animals in typical school settings when the specimens are already-deceased byproducts."}}, {"data": {"id": "arg-7cf26e1f54", "kind": "defeat", "label": "AG1 defeat\nStudents should be allowed to dissect an", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-7cf26e1f54\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-0fa1b6a4b1\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Ethical permissibility in schooling should be assessed by weighing foreseeable educational benefits against foreseeable harms, not by treating an activity as ethically impermissible whenever it is not strictly “educationally necessary” given that alternatives may exist.\",\n            \"Non-animal alternatives existing does not automatically remove the ethical justification for dissection if dissection’s harms are minimized and its educational benefits are meaningful.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"An activity can be ethically justified in school even if effective alternatives exist, as long as harms are minimized and educational benefits are meaningful.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In typical school dissection use, over 98% of dissected animals are already deceased and are used as byproducts rather than being obtained mainly by killing for the classroom activity.\",\n            \"Using already-deceased byproduct specimens minimizes the added harm attributable to the classroom dissection activity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical classroom dissection uses already-deceased byproduct specimens, so the added harm from the educational activity is minimized.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection requires students to manipulate real anatomical specimens (e.g., cutting/opening and examining internal structures), creating firsthand experiential learning.\",\n            \"Hands-on specimen manipulation builds practical scientific skills such as fine motor control, hand-eye coordination, and critical-thinking habits in biology.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection provides distinctive, meaningful educational benefits through firsthand specimen manipulation that builds biology-relevant skills.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"An activity can be ethically justified in school even if effective alternatives exist, as long as harms are minimized and educational benefits are meaningful.\",\n            \"Typical classroom dissection uses already-deceased byproduct specimens, so the added harm from the educational activity is minimized.\",\n            \"Dissection provides distinctive, meaningful educational benefits through firsthand specimen manipulation that builds biology-relevant skills.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In typical classroom settings using already-deceased byproducts, the harm–benefit tradeoff can justify animal dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In typical classroom settings using already-deceased byproducts, the harm–benefit tradeoff can justify animal dissection.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should be allowed to dissect animals when the specimens are already-deceased byproducts.\"\n      }\n    ],\n    \"Conc\": [\n      \"An activity can be ethically justified in school even if effective alternatives exist, as long as harms are minimized and educational benefits are meaningful.\",\n      \"Typical classroom dissection uses already-deceased byproduct specimens, so the added harm from the educational activity is minimized.\",\n      \"Dissection provides distinctive, meaningful educational benefits through firsthand specimen manipulation that builds biology-relevant skills.\",\n      \"In typical classroom settings using already-deceased byproducts, the harm–benefit tradeoff can justify animal dissection.\",\n      \"Students should be allowed to dissect animals when the specimens are already-deceased byproducts.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170.0, "y": 420}}, {"data": {"id": "e-arg-7cf26e1f54", "source": "arg-7cf26e1f54", "target": "arg-0fa1b6a4b1", "ls": "solid", "label": "rebut", "detail": "arg-7cf26e1f54 (AG1 defeat) → arg-0fa1b6a4b1\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals."}}, {"data": {"id": "arg-ff72e0ead5", "kind": "counter", "label": "AG2 counter\nStudents should not dissect animals. ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-ff72e0ead5\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-7cf26e1f54\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should be allowed to dissect animals when the specimens are already-deceased byproducts.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target’s justification depends on the idea that typical school dissection mostly uses already-deceased byproduct specimens so that the added harms are minimized.\",\n            \"I hold that approximately 99% of dissection animals are caught in the wild.\",\n            \"Wild-catching decreases local populations and reduces biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical classroom dissection therefore still relies heavily on wild-catching that harms local populations and reduces biodiversity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Typical classroom dissection therefore still relies heavily on wild-catching that harms local populations and reduces biodiversity.\",\n            \"Using inhumane, biodiversity-harming animal-supply methods for schooling is bad and should not be supported.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Classroom dissection cannot be ethically justified by a harm-minimization rationale when it still relies on biodiversity-harming wild-catching.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Classroom dissection cannot be ethically justified by a harm-minimization rationale when it still relies on biodiversity-harming wild-catching.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals. \"\n      }\n    ],\n    \"Conc\": [\n      \"Typical classroom dissection therefore still relies heavily on wild-catching that harms local populations and reduces biodiversity.\",\n      \"Classroom dissection cannot be ethically justified by a harm-minimization rationale when it still relies on biodiversity-harming wild-catching.\",\n      \"Students should not dissect animals.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170, "y": 560}}, {"data": {"id": "e-arg-ff72e0ead5", "source": "arg-ff72e0ead5", "target": "arg-7cf26e1f54", "ls": "solid", "label": "rebut", "detail": "arg-ff72e0ead5 (AG2 counter) → arg-7cf26e1f54\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should be allowed to dissect animals when the specimens are already-deceased byproducts."}}, {"data": {"id": "end-arg-f9d6a25244", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 0, "y": 665.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "end-arg-11b1d592bf", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 170, "y": 665.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG1", "label": "AG1: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 340, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 340, "y": 84.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>10<\/td><\/tr><tr><td>attack_turn_count<\/td><td>8<\/td><\/tr><tr><td>main_argument_count<\/td><td>2<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>0<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.106934<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Students should **generally not** dissect animals. The better-supported position is to **use alternatives**—and only allow dissection in exceptional cases where schools can **verify** that the specimens are **already-deceased meat-industry byproducts** (not obtained via killing/wild-capture for the classroom) and where dissection can be shown to provide educational value that alternatives cannot match.\n\n### Rationale (weighing the main points on both sides)\n\n1. **Dissection is not required by major learning standards**\n   - The strongest shared fact in the debate is that animal dissection is **not required by AP Biology or NGSS** for biology learning objectives.\n   - When something is not required, the ethical bar is higher: it must be justified as necessary or clearly superior, not merely traditional.\n\n2. **The animal-supply harm concern is not adequately resolved**\n   - One side argues that most specimens are already dead and are byproducts (including the landfill-waste reduction claim for fetal pigs).\n   - The other side argues the opposite—that a large share of dissection animals are **caught in the wild**, harming local populations and biodiversity.\n   - Because these sourcing claims directly conflict and the debate did not decisively settle which is correct for “typical classroom dissection,” we cannot confidently say that dissection is reliably harm-minimized by byproduct sourcing.\n   - Under the relevant decision framework, that kind of **unclear/mixed sourcing** means the “allow” justification (byproduct + sufficient educational gains) is not established.\n\n3. **Alternatives appear to meet learning needs at least as well**\n   - The anti-dissection case emphasizes that synthetic models and computer simulations can teach anatomy effectively, making dissection **unnecessary** when effective alternatives exist.\n   - The pro-dissection case replies that alternatives may not replicate the full tactile, tool-mediated psychomotor learning.\n   - But given (a) dissection is not required by standards and (b) the supply-harm issue is unresolved, the remaining “hands-on skills and engagement” benefits do not clearly outweigh the ethical costs in typical settings.\n\n4. **What the pro-dissection argument gets right—but doesn’t fully settle**\n   - It is plausible that real dissection can build **fine motor skills, hand–eye coordination, critical thinking**, and can create motivating “aha moments” and career interest.\n   - It is also plausible that using truly byproduct specimens could reduce waste (e.g., landfill disposal of fetal pigs).\n   - However, those benefits only justify dissection when the sourcing is reliably byproduct-driven and the net tradeoff is meaningfully justified—conditions that the debate did not conclusively establish.\n\n### Bottom line\n- **Default policy:** No dissection in typical classes; use alternatives.\n- **Narrow exception:** Dissection could be acceptable **only if** schools can **verify** that specimens are **already-deceased meat-industry byproducts** (not wild-caught or killed for the activity) and can demonstrate that dissection provides educational value that alternatives cannot provide.\n\nThe key unresolved point is the **real-world sourcing** of “typical” dissection animals (how much is byproduct versus wild-captured/killed for dissection). Because that’s not settled, the justification to allow dissection broadly is not established.<\/pre><\/details><div>justification_status: <b>fallback_no_consensus<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}]}};
