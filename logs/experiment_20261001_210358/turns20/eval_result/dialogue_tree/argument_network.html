<script>
const DATA = {"animal_dissection": {"free_debate": [{"run": 1, "question": "Should students dissect animals?", "elements": [{"data": {"id": "t0", "kind": "turn", "label": "AG1 R1\nYes—students should dissect animals beca", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 1,\n  \"has_new_point\": true\n}\n\nYes—students should dissect animals because it’s a valuable, hands-on way to learn biology. Dissection helps students directly observe real anatomical structures instead of only viewing diagrams, which strengthens understanding and critical thinking. It also builds practical skills like fine motor control and hand‑eye coordination, and the “aha” moments from seeing organs and systems firsthand can inspire some students to stay curious and consider science careers. Finally, ethical concerns are addressed in many school programs by using animals that are already dead—often meat-industry byproducts—so dissection can be a productive use of materials rather than waste."}, "position": {"x": 0, "y": 0}}, {"data": {"id": "t1", "kind": "turn", "label": "AG2 R1\nStudents should not dissect animals beca", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 1,\n  \"has_new_point\": true\n}\n\nStudents should not dissect animals because the learning gains don’t justify the harm. Most dissection animals are obtained through practices that are widely considered inhumane and environmentally damaging—about 99% are caught in the wild, reducing local populations and biodiversity. Meanwhile, the same (or better) biology understanding can be achieved with humane, effective alternatives like synthetic models and computer simulations, which build observation and inquiry skills without killing animals. Also, animal dissection isn’t required by AP Biology or Next Generation Science Standards, and medical training in the U.S. and Canada doesn’t rely on animal dissection—so it’s unnecessary for legitimate educational outcomes."}, "position": {"x": 130, "y": 220}}, {"data": {"id": "e-t1", "source": "t1", "target": "t0", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t2", "kind": "turn", "label": "AG1 R2\nMy updated argument: Even if alternative", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 2,\n  \"has_new_point\": true\n}\n\nMy updated argument: Even if alternatives like simulations or plastic models exist, they can’t fully replicate what real dissection uniquely teaches—students learn anatomy through irreversible, spatial, step-by-step decision-making: how structures are positioned relative to each other, how tissue resists and separates differently, and how an entire organ system is discovered through actual dissection pathways. That tactile, 3D, “follow the anatomy you’re seeing” process is central to building deep understanding and critical thinking, not just visual recognition.\n\nAlso, the “harm doesn’t justify it” claim doesn’t hold if the animals used are already dead from regulated sources and, in many programs, are meat-industry byproducts—so dissection is making productive educational use of existing material rather than driving new animal killing or harming wild populations. Finally, even if animal dissection isn’t explicitly mandated by standards, schools don’t need to rely only on minimum requirements when a method clearly supports learning and engagement."}, "position": {"x": 260, "y": 0}}, {"data": {"id": "e-t2", "source": "t2", "target": "t1", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t3", "kind": "turn", "label": "AG2 R2\nAG1 claims dissection provides uniquely ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 2,\n  \"has_new_point\": true\n}\n\nAG1 claims dissection provides uniquely “real” 3D/tactile learning and that animals are often already dead, but both points fail to justify it.\n\nFirst, the “can’t replicate” argument overlooks that alternatives can match the actual learning targets: modern virtual labs and 3D/synthetic models let students rotate, zoom, label, and repeat steps—so students can learn the spatial relationships and organ systems without irreversible, death-based “hands-on” work. In practice, the key outcomes (anatomy comprehension, diagramming/observation skills) don’t depend on killing animals.\n\nSecond, “already dead/regulated sources” doesn’t eliminate the underlying harms I’m opposing. If dissection increases demand for specimens, it still encourages sourcing practices that are inhumane and/or environmentally damaging (including wild-capture). And even if some animals come from other channels, using them is still unnecessary when effective alternatives exist.\n\nSo the ethical trade doesn’t work: schools should choose methods that teach the same content and skills without killing animals."}, "position": {"x": 390, "y": 220}}, {"data": {"id": "e-t3", "source": "t3", "target": "t2", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t4", "kind": "turn", "label": "AG1 R3\nAG2 argues that alternatives can “match ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 3,\n  \"has_new_point\": true\n}\n\nAG2 argues that alternatives can “match the learning targets” and that dissection still creates ethical harms because it may increase demand for specimens. Two rebuttals:\n\n1) In the typical classroom context I’m defending, dissection specimens are already dead and come from the meat industry—often fetal pig byproducts that would otherwise be destined for disposal. In that case, using them for education doesn’t increase slaughter or wild-capture demand, so the “harm” tradeoff doesn’t apply the way AG2 suggests.\n\n2) Even if virtual/synthetic options can cover some diagram-based learning, they don’t provide the same full set of skills and cognitive benefits: students build understanding through the real, spatial process of opening tissue pathways and encountering authentic anatomical structure (including tactile/visual variability) in a way that’s hard to replicate with a screen.\n\nSo the most responsible approach is to keep dissection in school science—using appropriate, regulated sources—because it meaningfully improves learning and makes practical use of animals that are already going to be disposed of anyway."}, "position": {"x": 520, "y": 0}}, {"data": {"id": "e-t4", "source": "t4", "target": "t3", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t5", "kind": "turn", "label": "AG2 R3\nAG1’s “typical classroom uses meat-indus", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 3,\n  \"has_new_point\": true\n}\n\nAG1’s “typical classroom uses meat-industry byproducts” point doesn’t fully address why schools shouldn’t use real animals for dissection.\n\n1) **“Already dead” isn’t a guarantee**: even if some specimens are sourced as byproducts, programs vary widely and schools generally can’t ensure (or audit) that every dissection shipment consistently comes from non-wild, non-escalating supply chains. Since dissection demand creates incentives for suppliers, the ethical/environmental risk remains—so the most responsible choice is to avoid animal bodies in the first place.\n\n2) **Alternatives can outperform dissection for learning process**: real dissection is largely a one-time, irreversible procedure. Virtual labs/models let students **repeat**, **pause**, **zoom**, and **take multiple “try again” pathways**, which supports mastery and assessment in a way a single dissection can’t. So the argument that alternatives “can’t replicate” misses that learning isn’t just about “what students see,” but about how much practice and feedback they can get."}, "position": {"x": 650, "y": 220}}, {"data": {"id": "e-t5", "source": "t5", "target": "t4", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t6", "kind": "turn", "label": "AG1 R4\nAG2’s updated points are: (1) schools ca", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 4,\n  \"has_new_point\": true\n}\n\nAG2’s updated points are: (1) schools can’t be sure every specimen is truly a byproduct, so demand could still drive harmful sourcing; (2) virtual labs are better because they let students repeat and get feedback.\n\nNew rebuttal:\n1) **Ethical sourcing can be controlled, not waved away.** The proper response isn’t to eliminate dissection, but to require *documented, regulated* origins (e.g., certification that materials come from existing meat-production and are already dead/culled). If a school can specify and verify acceptable suppliers, the “we can’t guarantee” objection becomes a policy fix—not a reason to remove dissection entirely.\n\n2) **Repeatable doesn’t equal learning equivalent.** Yes, simulations let students redo steps, but that’s not the only (or even the main) learning value of dissection. Dissection teaches students to work within real constraints—exact spatial relationships, real tissue resistance, and the need to follow an anatomical process without the luxury of “undo.” That experiential problem-solving can’t be fully replaced by replay.\n\n3) **Practicality and access matter in schools.** High-quality virtual/synthetic options can be costly and unevenly available. Dissection—using appropriate, already-dead materials—often delivers a high-impact, hands-on biology experience that many classrooms can actually afford.\n\nSo the most responsible approach remains: **students should dissect animals using properly sourced, dead/regulated specimens**, while improving safeguards and combining with alternatives when appropriate."}, "position": {"x": 780, "y": 0}}, {"data": {"id": "e-t6", "source": "t6", "target": "t5", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t7", "kind": "turn", "label": "AG2 R4\nAG1’s latest reply (“schools can require", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 4,\n  \"has_new_point\": true\n}\n\nAG1’s latest reply (“schools can require verified, regulated byproducts”) still doesn’t justify animal dissection, and it adds risks that alternatives avoid.\n\n1) **Verification doesn’t eliminate the problem in real school systems.** Even if a district writes sourcing rules, enforcing and auditing every shipment across multiple schools/classes is difficult. The outcome is a “best-case” supply chain rather than a reliably non-harmful one—so the precautionary choice is to use alternatives.\n\n2) **Dissection adds harms unrelated to animal death.** Students can be exposed to hazardous disinfectants/embalming chemicals (e.g., formaldehyde/formalin) and biological waste/disposal burdens. Alternatives (models, simulations, virtual labs) teach anatomy without those safety and environmental risks.\n\n3) **Equal-or-better learning with repeatable alternatives matters.** Dissection is essentially a one-time, irreversible activity with limited feedback. Virtual/synthetic options let students practice, revise, and demonstrate mastery—so the supposed “learning superiority” doesn’t outweigh the avoidable harms.\n\nGiven that effective alternatives exist and dissections create multiple layers of preventable harm, students should not dissect animals."}, "position": {"x": 910, "y": 220}}, {"data": {"id": "e-t7", "source": "t7", "target": "t6", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t8", "kind": "turn", "label": "AG1 R5\nAG2 adds that dissection “adds harms” li", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 5,\n  \"has_new_point\": true\n}\n\nAG2 adds that dissection “adds harms” like chemical exposure (e.g., formaldehyde) and disposal burdens. My updated rebuttal is: those risks are **not inherent to dissection itself** and are **addressable through standard school lab safeguards and specimen practices**.\n\n- **Safety controls are routine and effective.** Schools can (and do) use PPE, proper ventilation, trained supervision, and compliant biohazard waste handling—just like other permitted lab activities. So the ethical/health concern becomes a matter of *implementation quality*, not a reason to eliminate hands-on anatomy.\n\n- **Specimen handling can be chosen to reduce chemical exposure.** Many programs use sourcing and preparation methods that minimize or avoid the most hazardous preservatives (e.g., fresh/frozen specimens or lower-toxicity preparation where available), rather than assuming every classroom uses the same high-exposure setup.\n\nGiven that dissection can be done with **regulated, already-dead materials** and with **managed safety procedures**, it remains a productive, high-impact teaching tool—especially for students who benefit from real 3D, tactile learning that alternatives can’t fully match."}, "position": {"x": 1040, "y": 0}}, {"data": {"id": "e-t8", "source": "t8", "target": "t7", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t9", "kind": "turn", "label": "AG2 R5\nAG1’s point that safety controls make di", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 5,\n  \"has_new_point\": true\n}\n\nAG1’s point that safety controls make dissection acceptable misses the core question: **even if risks can be managed, do they justify using dead animals when effective alternatives exist?** \n\n- **Safety is not guaranteed or uniform across classrooms.** “Routine safeguards” depend on trained staff, ventilation, correct PPE use, proper training, and consistent disposal practices—things that vary by district and teacher capacity. That means there is always residual risk (splashes, exposure during prep/cleanup, improper handling).\n\n- **Chemical/safety and environmental harms don’t disappear just because they’re handled compliantly.** Even with PPE and waste protocols, dissection can involve toxic preservatives and generates regulated biological/chemical waste. Alternatives (3D models, virtual labs) teach anatomy without adding these preventable safety and disposal burdens.\n\nBecause we have alternatives that can teach the same biology learning goals without killing animals and without these avoidable risk/waste layers, the most responsible policy is: **students should not dissect animals.**"}, "position": {"x": 1170, "y": 220}}, {"data": {"id": "e-t9", "source": "t9", "target": "t8", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t10", "kind": "turn", "label": "AG1 R6\nAG2 argues that because there’s residual", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 6,\n  \"has_new_point\": true\n}\n\nAG2 argues that because there’s residual chemical/safety risk and disposal burdens, we should ban dissection when alternatives exist. My rebuttal is: **managed risk is already how school science works, and dissection is not an exceptional case.**\n\n- In chemistry and other biology labs, schools routinely use hazardous substances and still require PPE, ventilation, training, and proper waste disposal. Dissection’s hazards (if any toxic preservatives are used, and cleanup waste) are **likewise governable** by standard lab safety procedures—so the existence of residual risk doesn’t automatically justify eliminating the learning activity.\n\n- Meanwhile, the ethical premise supports dissection: the vast majority of classroom specimens are **already dead/regulated sources and often meat-industry byproducts**, so dissection is typically **productive use of existing material** rather than a driver of new harm.\n\nSo the responsible policy is not “ban,” but: **allow dissection when specimens are appropriately sourced and safety procedures are in place**, because its educational value (real 3D/tactile anatomy + engagement) meaningfully outweighs the preventable, managed risks."}, "position": {"x": 1300, "y": 0}}, {"data": {"id": "e-t10", "source": "t10", "target": "t9", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t11", "kind": "turn", "label": "AG2 R6\nAG1 argues that because school science a", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 6,\n  \"has_new_point\": true\n}\n\nAG1 argues that because school science already manages hazardous risks (like chemistry labs), dissection is fine if safeguards are in place, and that most specimens are already dead/regulated.\n\nMy updated rebuttal is: **the “managed risk” comparison misses the ethical core**. Even if chemical/safety hazards can be managed, dissection still involves **killing/using dead animal bodies when it’s not necessary to meet biology learning goals**—especially when effective alternatives exist.\n\nAlso, dissection creates a classroom ethics/access problem that alternatives solve: **students with moral or religious objections can be forced into opt-out arrangements that are often stigmatizing or academically unequal** (e.g., sitting out or doing different work). Alternatives (models/virtual labs) allow *everyone* to meet the same objectives without placing students in a moral conflict.\n\nSo the decision shouldn’t be framed as “can we do it safely?” but “why do it at all, when schools can achieve the same learning outcomes without using animal bodies?”"}, "position": {"x": 1430, "y": 220}}, {"data": {"id": "e-t11", "source": "t11", "target": "t10", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t12", "kind": "turn", "label": "AG1 R7\nAG2’s latest point is that dissection cr", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 7,\n  \"has_new_point\": true\n}\n\nAG2’s latest point is that dissection creates an ethics/access problem for students with moral or religious objections (opt-outs, stigma, unequal learning). My response is: **you can solve the accommodation issue without removing dissection as an option and learning pathway.**\n\n- **Respect-based classroom policy is compatible with offering dissection.** Schools can provide *equally rigorous* alternative labs (models/virtual dissections) for students who opt out, while still allowing dissection for students who want that hands-on anatomy experience—so no one is forced into a moral conflict.\n- **Eliminating dissection punishes the majority for a problem that can be mitigated.** Ethical concerns should lead to better choice and support, not to deleting a high-impact teaching method for everyone.\n- **Hands-on dissection provides benefits those alternatives may not fully replace** (real 3D structure navigation, tactile/visual variability, and the “follow the anatomy you’re seeing” problem-solving process). Keeping dissection available preserves those learning benefits.\n\nSo the most responsible stance is: **students should have the opportunity to dissect using properly sourced, already-dead specimens**, with non-dissection alternatives available for students who opt out."}, "position": {"x": 1560, "y": 0}}, {"data": {"id": "e-t12", "source": "t12", "target": "t11", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t13", "kind": "turn", "label": "AG2 R7\nAG1’s reply assumes the issue is just cl", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 7,\n  \"has_new_point\": true\n}\n\nAG1’s reply assumes the issue is just classroom accommodation (opt-out/stigma) and that you can “solve” it by giving alternatives to objecting students while still letting others dissect. My rebuttal is that accommodation doesn’t address the ethical reason to oppose dissection in the first place: **as long as dissection is offered, schools are still using dead animals when effective alternatives exist**.\n\nAlso, the “equal rigor” claim is not guaranteed in real schools: opt-out labs are often treated as the “easy/less serious” option, which can translate into lower engagement, different grading, and continued inequity even if two versions are nominally similar.\n\nSo the most responsible policy is **not** “dissection for some, alternatives for others,” but **alternatives for everyone** (models, simulations, virtual labs) so no student is put into a moral conflict and no animal bodies are used unnecessarily."}, "position": {"x": 1690, "y": 220}}, {"data": {"id": "e-t13", "source": "t13", "target": "t12", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t14", "kind": "turn", "label": "AG1 R8\nAG2 argues that dissection is unnecessar", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 8,\n  \"has_new_point\": true\n}\n\nAG2 argues that dissection is unnecessary because alternatives “can match” learning goals, but that misses *what* schools are trying to build. Animal dissection isn’t only content delivery (labeling organs); it’s a full scientific investigation routine: setting up a specimen, making careful observations, documenting findings, dealing with real tissue variability, and synthesizing what you see into an organ-system model. Those are transferable lab habits—observation-to-interpretation—that many purely virtual or one-off simulation activities don’t cultivate as strongly because they can’t reproduce the same messy, adaptive decision-making students face when working with real anatomy.\n\nSo even if simulations/virtual labs can teach anatomy concepts, dissection provides an additional, distinct learning pathway that strengthens scientific thinking and engagement—especially when schools use appropriate, already-dead/regulated specimens and offer non-dissection options when needed."}, "position": {"x": 1820, "y": 0}}, {"data": {"id": "e-t14", "source": "t14", "target": "t13", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t15", "kind": "turn", "label": "AG2 R8\nAG1 claims dissection uniquely builds “s", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 8,\n  \"has_new_point\": true\n}\n\nAG1 claims dissection uniquely builds “scientific investigation routines” (setup, observation-to-interpretation, handling real variability, and messy decision-making). But those transferable skills don’t require dead animals.\n\n- **Observation-to-interpretation can be taught without killing specimens.** Students can still make structured observations, record data, classify/analyze findings, and draw conclusions in model-based or virtual investigations.\n- **“Real tissue variability” is not inherently tied to using animals.** Alternatives can be built to include variation (different model specimens, parameterized virtual cases, different imaging/scan datasets), so students practice how to interpret imperfect information—without relying on an animal body.\n- **The core learning targets in standards don’t hinge on dissection.** If the goal is inquiry, evidence, and interpretation, schools can meet it while avoiding the ethical/environmental harms of using animal bodies.\n\nSo even if dissection can provide a certain kind of hands-on experience, it’s not the only route to the lab habits students need—meaning schools should choose alternatives for the same educational outcomes."}, "position": {"x": 1950, "y": 220}}, {"data": {"id": "e-t15", "source": "t15", "target": "t14", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t16", "kind": "turn", "label": "AG1 R9\nAG2 keeps arguing that alternatives can ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 9,\n  \"has_new_point\": true\n}\n\nAG2 keeps arguing that alternatives can replace the *content*, but my key point is about the *overall educational and societal tradeoff* when real, already-dead specimens are used.\n\nA lot of classroom dissection material comes from animals that are **already deceased** and, in the case of many fetal pig specimens, are **meat-industry byproducts that would otherwise be discarded**. Using them in a biology lab is therefore a form of **productive, non-wasteful use** of material that’s already going to be out of the animal life cycle.\n\nSo the decision isn’t only “content equivalence.” When dissection uses regulated, already-dead byproducts, schools get high-impact hands-on learning *and* avoid treating the specimen as pure waste—making dissection a worthwhile option rather than an ethically avoidable step."}, "position": {"x": 2080, "y": 0}}, {"data": {"id": "e-t16", "source": "t16", "target": "t15", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t17", "kind": "turn", "label": "AG2 R9\nAG1’s “byproducts/non-wasteful use” argu", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 9,\n  \"has_new_point\": true\n}\n\nAG1’s “byproducts/non-wasteful use” argument still doesn’t justify animal dissection as a policy choice.\n\n1) **Even if some specimens are byproducts, that’s not a reason to treat animal bodies as a default teaching resource.** If effective alternatives exist, the ethical question is whether using dead animals is *necessary*, not whether the material avoids total “waste.” “Non-waste” doesn’t erase the harm of using animals instead of avoiding animal bodies altogether.\n\n2) **Byproduct sourcing isn’t reliably guaranteed across schools.** Dissection demand creates incentives that can affect sourcing practices (and students/teachers typically can’t audit every shipment), so the “productive use” framing can’t cover the real-world variation.\n\n3) **Alternatives also support full inquiry** (observation, recording, interpreting, modeling) without normalizing harm or adding animal-material supply-chain risk.\n\nFor these reasons, the most responsible approach is: **use alternatives for everyone, rather than dissection even when some specimens are claimed to be byproducts.**"}, "position": {"x": 2210, "y": 220}}, {"data": {"id": "e-t17", "source": "t17", "target": "t16", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t18", "kind": "turn", "label": "AG1 R10\nAG2’s “use alternatives for everyone” pr", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 10,\n  \"has_new_point\": true\n}\n\nAG2’s “use alternatives for everyone” proposal treats alternatives as if they are equally available, equally rigorous, and equally engaging in *real schools*. But in practice, replacing dissection across districts can reduce hands-on lab quality for many students because:\n\n- **Access/equity:** high-quality virtual/synthetic options require devices, software licenses, and reliable tech support; under-resourced schools may get lower-quality substitutes or less lab time.\n- **Career/engagement tradeoff:** dissection is often the “aha” moment that pulls students toward biology. If dissection is removed and replaced with less engaging setups, fewer students may opt into advanced science.\n\nSo even if alternatives exist, mandating alternatives for everyone risks shrinking the *learning opportunity* dissection provides—especially for students who otherwise wouldn’t get rich, hands-on biology experiences."}, "position": {"x": 2340, "y": 0}}, {"data": {"id": "e-t18", "source": "t18", "target": "t17", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t19", "kind": "turn", "label": "AG2 R10\nAG1 argues that replacing dissection wit", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 10,\n  \"has_new_point\": true\n}\n\nAG1 argues that replacing dissection with alternatives could hurt learning quality or equity in under-resourced schools. I agree implementation matters—but that’s exactly why schools should switch to alternatives, not keep using animal bodies as the default.\n\n1) **Equity doesn’t justify animal use.** Under-resourced schools may also have weaker safety oversight and less consistent lab standards when dissecting real specimens. Alternatives reduce harms while still allowing high-quality instruction if schools are supported.\n\n2) **“Alternatives aren’t available” is a policy choice, not a reason.** Schools can adopt scalable options—shared model kits (including lower-cost 3D/synthetic anatomy sets), offline activities, and virtual labs that run on existing devices. If the goal is equitable access to good biology education, the fix is funding/training for alternatives, not relying on dead animals.\n\n3) **Dissection isn’t required by major standards.** Since AP Biology/NGSS don’t depend on dissection, there’s no justification to trade avoidable ethical/environmental harms for a hands-on moment when alternatives can meet the same educational objectives.\n\nSo the updated bottom line is: even if tech access varies, the most responsible and ethical path is to move to alternatives for everyone and invest in making them available—rather than normalizing animal dissection as an “equity solution.”"}, "position": {"x": 2470, "y": 220}}, {"data": {"id": "e-t19", "source": "t19", "target": "t18", "ls": "dotted", "inferred": 1}}], "lane": true, "meta": "<table><tr><td>total_cost_usd<\/td><td>0.02832<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Students generally should **not** dissect animals in school biology. Instead, schools should teach the same anatomy and scientific-investigation objectives using **high-quality synthetic/3D model labs, offline physical activities, and/or virtual lab experiences**—with real support to make these options work in **under-resourced** schools.\n\n### Rationale (addressing the main considerations)\n\n1. **Dissection is not necessary to meet core biology standards**\n   Major curriculum frameworks (e.g., AP Biology/NGSS-type objectives) focus on biology understanding and inquiry skills; they do not depend on using animal bodies specifically. So dissection is, at best, a method choice—not a requirement. That matters because there is no strong “must-use” pressure that would justify preventable animal and environmental harms.\n\n2. **Effective alternatives can still deliver hands-on and scientific skills**\n   The pro-dissection case emphasizes real 3D/tactile learning and engagement (“aha moments,” fine motor and hand-eye coordination, and scientific habits). Those benefits are real—but they are not uniquely achievable with animal death:\n   - **Tactile/spatial learning** can be addressed with **physical 3D/synthetic anatomy model kits** and well-designed hands-on activities (not just screen-only content).\n   - **Scientific thinking and investigation habits** (observing, recording, interpreting, synthesizing findings) can be built through structured labs that use models, imaging datasets, and virtual cases—often with the added advantage of **repeatability and feedback** (students can practice and correct misconceptions rather than doing a one-time irreversible procedure).\n\n   In short: alternatives can be engineered to preserve the educational goals that dissection is often claimed to provide, even if they may not perfectly replicate every nuance of tissue resistance or “irreversible” sequencing.\n\n3. **Ethical and environmental risks are hard to guarantee away**\n   The strongest ethical objection is not merely that dissection involves dead animals, but that the **sourcing pathway** commonly associated with dissection can include practices that are harmful to animals and biodiversity.\n   - Even if some classrooms use specimens claimed to be “already deceased” or byproducts, real-world implementation varies, and schools generally can’t reliably audit every shipment across many schools/classes.\n   - There’s also a practical concern that any remaining dissection demand can create incentives that affect sourcing.\n\n   Given that alternatives avoid these risks entirely, the “we use byproducts” argument is not enough to justify making animal-material use the default.\n\n4. **There are preventable safety and disposal burdens**\n   Dissection can add real classroom burdens beyond animal ethics—e.g., exposure to preservatives and disposal/handling requirements for biological/chemical waste. Those burdens may be manageable in well-run settings, but they are not identical to the risks created by using models/simulations, which are inherently cleaner and easier to standardize.\n\n5. **Equity and classroom inclusion favor alternatives**\n   Dissection can create ethical/religious conflicts for some students, leading to opt-out arrangements that can be stigmatizing or unequally graded in practice. Using alternatives **for everyone** avoids turning students into a “main group vs. substitute task” situation and reduces variability in educational treatment.\n\n### A practical way to implement this\n- Replace routine animal dissection with **model-based and virtual/interactive labs**.\n- Ensure under-resourced schools get the necessary materials and support (e.g., shared kits, offline-capable activities, basic device compatibility, and sufficient lab time).\n- If a district is transitioning, use a phased approach focused on preventing any drop in engagement/learning opportunity—rather than keeping animal dissection as the default “because it’s easier.”\n\n### Bottom line\nBecause animal dissection is **not required by major educational objectives**, and because the **ethical/environmental and safety risks** are avoidable while **alternatives can be designed to preserve learning goals and engagement**, the best-supported policy is: **don’t make animal dissection a standard classroom practice; use alternatives for everyone.**\n\n**Confidence:** moderate-high. The debate’s strongest unresolved issue is whether alternatives perfectly match every aspect of dissection’s unique tactile/irreversible learning experience, especially across all real schools. But the lack of necessity for dissection plus the practical difficulty of guaranteeing non-harmful sourcing and the added safety/waste and inclusion concerns make the overall balance favor alternatives.<\/pre><\/details>"}], "mad": [{"run": 1, "question": "Should students dissect animals?", "elements": [{"data": {"id": "t0", "kind": "turn", "label": "AG1 R1\nYes—students should dissect animals, bec", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 1,\n  \"has_new_point\": true\n}\n\nYes—students should dissect animals, because it provides uniquely effective hands-on biology learning. Dissection helps students build fine motor skills, improves hand–eye coordination, and strengthens critical thinking by requiring them to observe structures directly, make predictions, and verify what they find. It can also create real “aha” moments that make biology memorable and can spark interest in science careers through experiential learning. Finally, school dissection often uses animals that are already dead; for example, fetal pigs are commonly sourced as meat-industry byproducts rather than animals taken specifically for students—turning otherwise wasted materials into meaningful educational use."}, "position": {"x": 0, "y": 0}}, {"data": {"id": "t1", "kind": "turn", "label": "AG2 R1\nAG1’s case relies on “effective hands-on", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 1,\n  \"has_new_point\": true\n}\n\nAG1’s case relies on “effective hands-on learning,” but that benefit doesn’t justify harming animals when better alternatives exist—and the animal supply chain is often the real problem.\n\n1) **The learning advantage isn’t unique or necessary.** Synthetic models, preserved specimens (without creating new demand), and computer simulations/virtual labs can teach anatomy and experimental reasoning just as well or better. Students can practice identifying structures, interpreting observations, and applying concepts without cutting dead animals.\n\n2) **Dissection depends on ethically troubling sourcing—and it harms ecosystems.** In practice, the majority of dissection animals are obtained through **wild capture**, which reduces local populations and biodiversity. Even if some schools claim animals are “byproducts,” it’s still demand-driven: dissection requires animals to be produced and transported for this purpose, incentivizing additional collection.\n\n3) **It’s not required for biology standards or real medical training.** AP Biology and NGSS do not require animal dissection, and medical schools in the U.S./Canada do not use animals to train physicians—so we’re not filling an essential educational gap.\n\n**Therefore: students should not dissect animals.** Schools can meet educational goals with alternatives that avoid animal harm and reduce environmental harm."}, "position": {"x": 130, "y": 220}}, {"data": {"id": "e-t1", "source": "t1", "target": "t0", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t2", "kind": "turn", "label": "AG1 R2\nAG2’s points say (1) alternatives can te", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 2,\n  \"has_new_point\": true\n}\n\nAG2’s points say (1) alternatives can teach just as well, (2) sourcing often involves wild capture and ecological harm, and (3) dissection isn’t required by standards or medical training. I can’t accept those conclusions—here’s why.\n\n1) **Alternatives can supplement, but they don’t replicate the learning package.** AG1 already argued dissection builds fine motor skills, hand–eye coordination, and critical observation. AG2’s “virtual labs/models are just as good” claim ignores that dissection uniquely forces students to navigate real tissue texture, organ relationships, and variable anatomy—skills tied to the tactile, spatial learning dissection provides. Even if simulations teach names/functions, they don’t deliver the same psychomotor + analytical experience.\n\n2) **The “wild capture / ecosystem harm” premise doesn’t fit how most school dissection animals are used.** AG1’s stance is that **over 98% of dissected animals are already deceased**, and common fetal pig sources are **meat-industry byproducts destined for landfills**. That directly undercuts AG2’s inference that dissection creates meaningful additional capture demand. If the animals are already part of existing slaughter/processing streams, the ethical tradeoff is more like “using what would otherwise go to waste” rather than “increasing harm through capture.”\n\n3) **“Not required” doesn’t mean “shouldn’t.”** Even if NGSS/AP don’t mandate dissection, schools can choose effective methods that achieve biological literacy and reasoning. Standards often specify what students should know—not that every engaging learning modality is excluded.\n\n**Updated position:** Students should dissect animals when schools use animals that are already dead (e.g., byproducts) because it offers educational benefits—tactile anatomy understanding, skill building, and genuine engagement—without the added harm AG2 claims."}, "position": {"x": 260, "y": 0}}, {"data": {"id": "e-t2", "source": "t2", "target": "t1", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t3", "kind": "turn", "label": "AG2 R2\nAG1’s latest reply rehashes two main poi", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 2,\n  \"has_new_point\": true\n}\n\nAG1’s latest reply rehashes two main points we’ve already challenged: (a) dissection is uniquely effective because it provides tactile/psychomotor learning, and (b) sourcing is mostly “already dead” byproducts, so harm is minimized. I’m not going to repeat those same rebuttals verbatim; instead, here are two updated/stronger counters.\n\n1) **When harm to animals exists, “it helps learning” isn’t enough—schools must justify why killing is necessary.** AG1 argues that because dissection can be engaging, schools may choose it even if it’s not required by AP/NGSS. But the ethical burden of proof is on dissection: if a non-lethal method teaches the required biology outcomes, then “more engaging” doesn’t justify the morally relevant downside.\n\n2) **“Already dead/byproduct” doesn’t erase the demand problem or the ethical issue.** Even if some animals are labeled as byproducts, dissection still creates an education-driven market (procurement, packaging, and distribution). That can increase incentives to obtain animals that otherwise wouldn’t be used for this purpose, and it still involves students handling dead animals rather than using humane alternatives. We shouldn’t rely on marketing claims about sourcing to excuse a practice that can be harmful and doesn’t have to be.\n\n**Updated position:** Students should not dissect animals; schools should meet learning goals with synthetic/virtual alternatives that avoid animal killing, reduce ecological harm, and don’t require a justification based on tactile benefits when non-lethal methods can teach the same biology."}, "position": {"x": 390, "y": 220}}, {"data": {"id": "e-t3", "source": "t3", "target": "t2", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t4", "kind": "turn", "label": "AG1 R3\nAG2’s latest argument adds two things: (", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 3,\n  \"has_new_point\": true\n}\n\nAG2’s latest argument adds two things: (1) the idea that “learning” doesn’t justify killing, because schools must prove killing is necessary; and (2) “already dead/byproduct” doesn’t remove the ethical/demand concerns. I’ll address both—but I want to add a key new angle and tighten the reasoning.\n\n**1) The ethical question is about *marginal* harm, not whether a dissection involves dead animals at all.** AG1’s core factual premise is that **over 98% of dissected animals were already deceased** before they reached the classroom, and fetal pigs are **meat-industry byproducts destined for landfills**. If the relevant animals are already going to be wasted, then dissection is not “killing for convenience”; it’s using remains that already exist in the supply chain. That directly undermines AG2’s “burden of proof” framing as if dissection inherently requires additional animal death.\n\n**2) Waste reduction is a legitimate ethical/environmental justification that AG2 didn’t grapple with.** AG2 treats “byproduct sourcing” as a mere marketing label, but AG1’s stance is that these are **animals headed for landfill**. Using them for education turns unavoidable byproducts into value rather than discarding them—an ethical consideration beyond “tactile learning.”\n\n**3) Non-lethal alternatives are fine—but AG2 still can’t erase the distinctive skill-building dissection provides.** Even if models/virtual labs teach many concepts, AG1’s point was about what students practice: real anatomical relationships and hands-on observation/analysis. Ethically and educationally, a “no killing” rule only makes sense if non-lethal methods fully replace those outcomes *for the majority of students* and *without materially reducing learning quality*. AG2 hasn’t shown that replacement equivalence.\n\n**Updated position:** Students should be allowed to dissect animals when those animals are **already deceased byproducts** (e.g., sources headed for landfill), because this provides unique hands-on biological learning while minimizing—and in many cases avoiding—additional harm through waste-reducing use."}, "position": {"x": 520, "y": 0}}, {"data": {"id": "e-t4", "source": "t4", "target": "t3", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t5", "kind": "turn", "label": "AG2 R3\nAG1’s reply mainly leans on two claims: ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 3,\n  \"has_new_point\": true\n}\n\nAG1’s reply mainly leans on two claims: (1) the “marginal harm” argument—animals are already dead byproducts headed for landfill—and (2) dissection uniquely builds tactile skills. I disagree with both, and I’ll add a more principled objection to AG1’s reasoning.\n\n1) **“Marginal harm” and “waste reduction” rest on unverifiable counterfactuals.** AG1 says animals are destined for landfill, so dissection isn’t additional harm. But that depends on what *would actually happen* to those animals without dissection. Schools can’t reliably demonstrate that, so using “it was going to be wasted anyway” is not a sound basis for a practice that isn’t required.\n\n2) **Even if some sourcing is byproduct-based, that doesn’t remove the ethical burden of doing it at all.** Dissection isn’t medically necessary for standards-based biology learning, and alternatives can meet learning goals. When a practice isn’t necessary, the ethical default should be to avoid killing and avoid turning animal death into an educational necessity.\n\n3) **Environmental/health impacts aren’t limited to animal capture.** Dissection also involves preservatives/chemicals, regulated disposal, and waste from specimen handling. So “waste reduction” doesn’t automatically make dissection environmentally neutral.\n\n**Updated position:** Students should not dissect animals. Schools should use synthetic models, preserved materials where appropriate, and virtual labs to meet required biology learning outcomes—without relying on uncertain “byproduct/landfill” claims to justify animal death."}, "position": {"x": 650, "y": 220}}, {"data": {"id": "e-t5", "source": "t5", "target": "t4", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t6", "kind": "turn", "label": "AG1 R4\nAG2’s latest push is: (1) “byproduct/lan", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 4,\n  \"has_new_point\": true\n}\n\nAG2’s latest push is: (1) “byproduct/landfill” claims are unverifiable counterfactuals, (2) even if some are byproducts, killing/using deaths is still ethically impermissible when not medically necessary, and (3) dissection has environmental/chemical/waste downsides.\n\nI disagree, and I’ll focus on what AG2 adds here rather than redoing the earlier “alternatives vs tactile learning” point.\n\n1) **The “unverifiable counterfactual” problem is solvable with procurement standards.** Schools don’t have to rely on vague marketing; they can require documentation that specimens come from existing slaughter/processing streams (i.e., true byproducts). In that case, the relevant moral question becomes whether students are *adding* new animal death—not whether a hypothetical about “what would have happened otherwise” can be proved. AG1’s underlying point (already-deceased byproduct use) becomes an operational policy, not a guess.\n\n2) **AG2’s “ethical default = avoid even unnecessary killing” misfires when there is no incremental killing.** If (as AG1 argued) the vast majority of classroom specimens are already deceased before reaching the classroom and are commonly meat-industry byproducts, then dissection is not “killing for education.” It’s responsible educational use of remains that are already part of the supply chain—so the proportionality calculus changes.\n\n3) **Environmental/chemical concerns are real but addressable; they don’t justify a blanket ban.** Preservatives and disposal are handled under lab safety and waste regulations, and practices can be improved (approved disposal, minimizing quantities, using safer-preservation options where appropriate). That’s different from saying the *core educational practice* should be prohibited altogether.\n\n**Updated position:** Students should be allowed to dissect when schools use **documented, already-deceased byproduct specimens** and follow strict handling/disposal standards—because that preserves the unique educational benefits while minimizing (and often avoiding) added animal harm."}, "position": {"x": 780, "y": 0}}, {"data": {"id": "e-t6", "source": "t6", "target": "t5", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t7", "kind": "turn", "label": "AG2 R4\nAG1’s latest answer tries to “solve” the", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 4,\n  \"has_new_point\": true\n}\n\nAG1’s latest answer tries to “solve” the problem by (1) requiring documentation that specimens are true byproducts, (2) arguing this removes incremental killing, and (3) saying chemical/waste concerns are manageable under regulations.\n\nHere’s the new core rebuttal: even if some specimens are labeled as byproducts, **a permissive policy still has unacceptable uncertainty and doesn’t justify overriding the availability of non-animal alternatives.**\n\n1) **Documentation doesn’t eliminate the problem; it shifts it to verification.** Schools generally can’t run an independent chain-of-custody audit that confirms each batch truly came from the relevant existing processing stream (vs. substitutions, mixed sources, or inflated “byproduct” claims). So AG1’s “operational policy” still depends on trust rather than proof.\n\n2) **“No incremental killing” isn’t enough when alternatives exist.** Even if some classrooms aren’t increasing deaths directly, dissection is still a choice to pay for, transport, preserve, and handle animal carcasses—i.e., it perpetuates an animal-material pipeline. When effective synthetic/virtual alternatives exist, the ethical default should be **least-harm**, not “harm-minimized if we can document it.”\n\n3) **We don’t need to accept extra ethical risk to get the learning.** AG1 and AG2 both agree dissection is educationally engaging; the question is whether any added moral/environmental risk is justified. Since standards can be met with non-animal methods, there’s no strong justification to gamble on uncertain sourcing.\n\n**Updated position:** Students should not dissect animals; schools should use non-animal alternatives rather than policies that rely on unverifiable “byproduct” assurances and still normalize animal death as a default learning tool."}, "position": {"x": 910, "y": 220}}, {"data": {"id": "e-t7", "source": "t7", "target": "t6", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t8", "kind": "turn", "label": "AG1 R5\nAG2’s latest argument says: (1) “byprodu", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 5,\n  \"has_new_point\": true\n}\n\nAG2’s latest argument says: (1) “byproduct” documentation can’t be fully verified, (2) even without incremental killing, dissection sustains an animal-material pipeline, and (3) since alternatives exist, least-harm should default to non-animal methods.\n\nI won’t rehash the earlier tactile/learning-quality points already made on my side. Instead, here’s a new rebuttal:\n\n1) **Even if verification is imperfect, schools can use risk-managed sourcing—“uncertain” isn’t the same as “substantial.”** Procurement standards, supplier attestations, and category controls (“existing slaughter byproducts”) are how institutions handle many sourcing risks. Ethical policy doesn’t require perfect certainty; it requires reasonable safeguards. With “already deceased” specimens, the *marginal* animal harm is plausibly very low, which changes the ethical calculus.\n\n2) **AG2 ignores the ethical cost of forcing non-animal alternatives when they may be less accessible or less effective in practice.** In real classrooms, virtual/synthetic options can be limited by hardware, budgets, and training time. If banning dissection reduces hands-on biology opportunities—especially for under-resourced schools—that’s an educational harm, not just an animal-safety choice. A proportional approach weighs both.\n\n**Updated position:** Students should be allowed to dissect when schools procure and handle **documented, already-deceased byproduct specimens** under reasonable safeguards, because this can minimize animal harm while preserving educational access and effectiveness; an outright ban over verification uncertainty and “least-harm” alone overstates the tradeoff."}, "position": {"x": 1040, "y": 0}}, {"data": {"id": "e-t8", "source": "t8", "target": "t7", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t9", "kind": "turn", "label": "AG2 R5\nAG1’s latest reply adds two main ideas: ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 5,\n  \"has_new_point\": true\n}\n\nAG1’s latest reply adds two main ideas: (1) procurement can “risk-manage” imperfect verification, so dissection’s marginal harm is acceptably low; and (2) banning dissection could reduce educational access for under-resourced schools. I won’t rehash earlier points about standards/alternatives generally; here are the new counters.\n\n1) **Even “risk-managed” sourcing doesn’t remove the core ethical problem: dissection still normalizes paying for animal death when alternatives exist.** The question isn’t whether schools can reduce risk; it’s whether they should rely on any animal-killing supply chain at all to meet biology learning goals. If non-animal methods can achieve the required outcomes, the ethical default should be to avoid creating continued demand for dead animals—especially when verification can’t be absolute.\n\n2) **Equity cuts both ways—and alternatives are often *more* scalable for under-resourced schools.** Buying animals, shipping them, preserving them, and handling/disposal of biological waste all cost money and require infrastructure. Synthetic models, reusable anatomical kits, and virtual labs can be distributed once and reused across classes/years, providing consistent quality without recurring procurement/handling barriers.\n\n**Updated position:** Students should not dissect animals. Schools should use non-animal, reusable synthetic/virtual alternatives and allocate funding to ensure all schools—especially under-resourced ones—can access those materials and instruction."}, "position": {"x": 1170, "y": 220}}, {"data": {"id": "e-t9", "source": "t9", "target": "t8", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t10", "kind": "turn", "label": "AG1 R6\nAG2’s latest rebuttal says (1) dissectio", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 6,\n  \"has_new_point\": true\n}\n\nAG2’s latest rebuttal says (1) dissection “normalizes” a supply chain for dead animals even if demand is small, and (2) alternatives are more scalable/equitable for under-resourced schools. I disagree, and I’ll add a distinct ethical and practical point.\n\n1) **“Ongoing demand” doesn’t mean students are responsible for *creating* animal death.** In most school settings, dissection specimens come from animals already killed for the food/processing system. That matters ethically: students aren’t authorizing slaughter or causing suffering; they’re using biological remains for education. The moral comparison should be between *educational reuse of existing carcasses* versus *discarding them unused* while claiming that “alternatives” solve the ethical issue.\n\n2) **Scalability cuts the other way too: many alternatives degrade learning quality and engagement.** Reusable/synthetic/virtual tools can help, but they often reduce realism and variability—especially at the tissue level (how structures actually look/relate in a real organ system). If alternatives are less effective for a meaningful portion of students, then switching away from dissection can become an educational harm even if it’s well-intended.\n\n**Updated position:** Students should be allowed to dissect animals when specimens are already deceased and sourced from existing processing streams, because that approach minimizes animal harm (no additional killing/suffering) while preserving the distinctive, high-impact learning value that many alternatives struggle to match—without forcing under-resourced schools into lower-quality substitutes."}, "position": {"x": 1300, "y": 0}}, {"data": {"id": "e-t10", "source": "t10", "target": "t9", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t11", "kind": "turn", "label": "AG2 R6\nAG1’s last reply is basically: (1) stude", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 6,\n  \"has_new_point\": true\n}\n\nAG1’s last reply is basically: (1) students aren’t morally responsible for slaughter because animals are already dead/processed, and (2) alternatives might lower realism so removing dissection could hurt some learning.\n\n1) **“Not responsible for slaughter” doesn’t remove ethical responsibility for the *choice to use animals*.** Even if carcasses were killed for another market, schools choosing dissection still *pay for and legitimize* an education-based animal-killing supply chain (procurement, transport, packaging, and handling). Moral responsibility follows the educational decision to normalize that pipeline—not just the origin story of each individual animal.\n\n2) **“Some students may learn less with alternatives” isn’t a valid justification to default to animal use.** Our stance is that standards-based biology can be taught without dissection, and alternatives can be improved/combined (high-quality models, simulations, and additional instruction) to address differences in learning preferences. If there’s any gap, the ethical path is to invest in non-animal methods rather than keep a system that requires cutting dead animals.\n\n**Updated position:** Students should not dissect animals; schools should choose non-animal teaching methods and improve access/quality of those methods instead of relying on dissection as the default way to teach anatomy."}, "position": {"x": 1430, "y": 220}}, {"data": {"id": "e-t11", "source": "t11", "target": "t10", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t12", "kind": "turn", "label": "AG1 R7\nAG2’s latest reply claims (1) schools ch", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 7,\n  \"has_new_point\": true\n}\n\nAG2’s latest reply claims (1) schools choosing dissection is still morally problematic because it sustains an animal-killing pipeline, and (2) learning tradeoffs don’t justify using dissection.\n\nA new way to resolve this—without repeating earlier points about tactile learning or byproduct sourcing—is to question AG2’s “all-or-nothing” policy. Even if some people object to any animal use, that doesn’t logically require banning it for everyone.\n\n1) **Consent/opt-out policy can meet ethical concerns while preserving educational benefits.** Many schools already allow exemptions from dissection. A fair approach is: dissection is offered as an instructional option under humane, regulated procurement and lab practices, while students who object can use high-quality non-animal alternatives.\n\n2) **Ethical responsibility can be proportionate to choice.** AG2 frames dissection as a generalized wrongdoing by institutions. But when students/parents are informed and provide opt-in, the moral analysis shifts from “forcing an objectionable practice on all” to “offering a legitimate educational pathway to those who choose it.”\n\n3) **Blanket bans treat alternatives as universally equivalent.** AG2 assumes non-animal methods fully replace dissection outcomes for all learners. The more defensible policy is to avoid denying a proven hands-on learning method to willing students when alternatives exist for those who don’t want dissection.\n\n**Updated stance:** Students should be allowed to dissect animals (with strict safeguards and clear opt-out alternatives for students/parents who object), rather than enforcing a blanket ban."}, "position": {"x": 1560, "y": 0}}, {"data": {"id": "e-t12", "source": "t12", "target": "t11", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t13", "kind": "turn", "label": "AG2 R7\nAG1’s “opt-out/opt-in” idea tries to sof", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 7,\n  \"has_new_point\": true\n}\n\nAG1’s “opt-out/opt-in” idea tries to soften the ethical issue by letting objecting students choose alternatives. I agree it can reduce harm for *individual students*, but it doesn’t address the core problems with dissection as an educational practice.\n\n1) **Opt-out doesn’t remove institutional support for an animal-killing supply chain.** Even if only some students participate, schools still must purchase, transport, preserve, and dispose of animal specimens. That means the school is still choosing (and funding) an animal-material pipeline rather than using non-animal methods.\n\n2) **“Consent” in classrooms often isn’t truly voluntary.** Students can face pressure from grades, attendance requirements, lab roles/peer dynamics, or the practical reality that “alternatives” may be limited, time-consuming, or lower-quality. So the opt-out framing can look like choice while still coercing participation.\n\n3) **Opt-out can create stigma and unequal learning experiences.** Students who decline dissection may be singled out or offered different instruction. That doesn’t solve the ethical issue—it redistributes it onto a subset of students.\n\n**Updated position:** Students should not dissect animals; schools should use non-animal alternatives for everyone and invest in making those alternatives high-quality and broadly accessible, rather than running dissection as an optional track."}, "position": {"x": 1690, "y": 220}}, {"data": {"id": "e-t13", "source": "t13", "target": "t12", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t14", "kind": "turn", "label": "AG1 R8\nAG2’s reply says opt-out/opt-in doesn’t ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 8,\n  \"has_new_point\": true\n}\n\nAG2’s reply says opt-out/opt-in doesn’t solve the institutional pipeline, that “consent” may be coerced, and that opting out causes stigma/unequal learning.\n\nI agree those risks matter—but the conclusion (“therefore dissection should be banned for everyone”) doesn’t follow, because those risks are policy problems, not inevitable features.\n\n1) **Consent and coercion can be handled with real, enforceable classroom safeguards.** Schools can require *prior* parent/guardian informed consent (or student assent where appropriate) and make dissection participation **non-graded**, with alternative activities that are timed and resourced to the same learning objectives. If participation affects grades/placement/lab roles, that’s exactly what should be corrected.\n\n2) **Unequal learning experience is avoidable if alternatives are equivalent.** AG2 assumes alternatives are second-rate. A better policy is: opt-out students do *the same curriculum goals* using high-quality non-animal tools (e.g., cadaver-model dissections, simulation + guided microscope work), not a “watch others” substitute.\n\n3) **“Institutional pipeline” isn’t a knockdown argument against permitting a practice when harms are minimized.** If specimens are **documented already-deceased byproducts** and disposal/handling comply with lab safety rules, then the moral question becomes one of proportionality and harm reduction—not whether schools can eliminate every indirect step in the supply chain.\n\n**Updated stance:** Students should be allowed to dissect animals **only under strict safeguards** (documented already-deceased sources, non-coercive opt-in with prior consent, non-penalized participation, and truly equivalent non-animal alternatives), rather than enforcing a blanket ban that removes hands-on learning options from willing students."}, "position": {"x": 1820, "y": 0}}, {"data": {"id": "e-t14", "source": "t14", "target": "t13", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t15", "kind": "turn", "label": "AG2 R8\nAG1’s latest proposal says we can permit", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 8,\n  \"has_new_point\": true\n}\n\nAG1’s latest proposal says we can permit dissection only with “strict safeguards”: documented byproduct sources, prior consent, non-graded opt-in, and truly equivalent alternatives for objecting students.\n\nI oppose that, because the safeguard model doesn’t actually remove the core ethical issue—animal death as a classroom activity.\n\n1) **Safeguards shift responsibility, they don’t eliminate the harm.** Even if participation is “opt-in,” the school still organizes procurement, transport, preservation, and disposal of animal bodies. That means dissection remains an institutional commitment to using animal death for education—something we can avoid entirely.\n\n2) **“Equivalent alternatives” is the weak link and the reason blanket permission is unsafe.** AG1 assumes objecting students will receive the same learning outcomes and quality. In practice, alternatives often differ in realism, time, training, and availability. Making dissection optional still risks creating a two-tier experience.\n\n3) **A permissive policy undermines the incentive to fully transition away from dissection.** If dissection remains an accepted option for willing students, districts have less pressure (and less motivation to budget) to improve and standardize non-animal methods—so the harmful practice persists.\n\n**Updated position:** Students should not dissect animals at all; schools should use non-animal alternatives as the standard option for everyone, rather than permitting dissection based on safeguards that can’t reliably guarantee equal learning or remove the institutional reliance on animal death."}, "position": {"x": 1950, "y": 220}}, {"data": {"id": "e-t15", "source": "t15", "target": "t14", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t16", "kind": "turn", "label": "AG1 R9\nAG2’s latest objection is that (1) safeg", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 9,\n  \"has_new_point\": true\n}\n\nAG2’s latest objection is that (1) safeguards don’t eliminate the ethical issue of “animal death,” (2) non-animal alternatives can’t reliably match dissection, and (3) allowing dissection reduces incentives to transition away.\n\nI disagree, and here’s a new way to answer the “safeguards vs harm” and “incentives” parts without repeating my earlier tactile/byproduct points.\n\n1) **Prohibiting dissection for everyone is an overcorrection when the policy can target *risk and choice*.** If specimens are already deceased and schools follow strict lab handling/sourcing documentation, the remaining ethical question is whether the educational use is proportionate to the remaining harm. A blanket ban treats all dissection contexts as equally morally unacceptable, even though districts can operationalize lower-harm conditions.\n\n2) **“Alternative quality can’t be equivalent” is solvable with implementation requirements, not with prohibition.** The right response isn’t “no dissection,” but “no bad alternatives.” Districts can be required to provide trained instructors, comparable time-on-task, and properly validated non-animal materials for opt-out students—so the comparison is fair rather than assuming inequality by default.\n\n3) **Permitting dissection doesn’t block transition; it can coexist with mandatory investment.** Districts can both (a) allow opt-in dissection under safeguards and (b) fund and standardize non-animal instruction, with timelines/benchmarks for when alternatives meet defined learning outcomes. That preserves hands-on opportunities while still pushing improvement.\n\n**Updated stance:** Students should be allowed to dissect animals **when schools use documented, already-deceased specimens and enforce non-coercive opt-in with fully resourced, validated non-animal alternatives**, alongside district requirements to invest in and improve those alternatives over time—so we reduce harm without eliminating effective hands-on biology learning."}, "position": {"x": 2080, "y": 0}}, {"data": {"id": "e-t16", "source": "t16", "target": "t15", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t17", "kind": "turn", "label": "AG2 R9\nAG1’s latest proposal is essentially: (1", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 9,\n  \"has_new_point\": true\n}\n\nAG1’s latest proposal is essentially: (1) don’t do an all-or-nothing ban; permit dissection under “lower-harm” conditions, (2) make non-animal alternatives “equivalent” via better implementation, and (3) require districts to invest in alternatives too.\n\nI oppose this because it still treats animal death as an acceptable default learning method whenever safeguards can be promised.\n\n1) **Ethical permissibility doesn’t depend on “equivalence” or “implementation.”** If effective non-animal methods can meet the learning goals, then using dissection remains an ethically unjustifiable choice: it instrumentalizes animals as disposable classroom materials. An opt-in model may reduce harms for some students, but it still authorizes an activity that’s avoidable.\n\n2) **“Safeguards + validated non-animal alternatives” is a policy promise, not a guarantee.** In real district practice, enforcing documented sourcing, non-coercive participation, and truly comparable time/training for alternatives across classrooms is administratively difficult. Since the ethical baseline is already “alternatives exist,” the burden shouldn’t be on the animal-use policy to prove it’s reliably safe and comparable.\n\n3) **The two-track approach undermines the educational goal of moving away from dissection.** Even with investment timelines, permitting dissection keeps demand and institutional momentum for the practice, making complete transition slower and inconsistent.\n\n**Updated position:** Students should not dissect animals. Schools should meet biology learning objectives with non-animal alternatives as the standard option, rather than maintaining a permitted dissection pathway that depends on hard-to-verify safeguards and still relies on an avoidable use of animal death in classrooms."}, "position": {"x": 2210, "y": 220}}, {"data": {"id": "e-t17", "source": "t17", "target": "t16", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t18", "kind": "turn", "label": "AG1 R10\nAG2’s latest position treats dissection ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG1\",\n  \"round\": 10,\n  \"has_new_point\": true\n}\n\nAG2’s latest position treats dissection as categorically unjustifiable whenever effective non-animal methods exist, and it dismisses “equivalence/implementation” as ethically irrelevant. I disagree—ethical policy should be proportional and conditional, not absolute.\n\n1) **AG2’s “equivalence doesn’t matter” is too rigid for real ethical tradeoffs.** If an approach reliably produces meaningfully better educational outcomes for many students, then the moral evaluation can reasonably incorporate benefit (proportionality). A blanket “never” approach ignores that education itself has ethical value (developing scientific literacy, skills, and informed decision-making).\n\n2) **“Non-animal alternatives exist” doesn’t establish that they’re consistently effective in every classroom context.** Even if alternatives can work in principle, districts differ in training, equipment, class time, and material quality. Policy should respond to whether the alternatives meet *validated learning outcomes*, not just whether they’re available somewhere.\n\n3) **A standards-based, evidence-driven permission model beats a categorical ban.** Schools could permit dissection only when (a) specimens are already deceased (no active killing for the class), and (b) independently validated alternatives fail to meet defined competency targets. Meanwhile, districts must have a funded transition plan with measurable milestones for phasing dissection out as non-animal methods improve.\n\n**Updated stance:** Students should be allowed to dissect animals only under strictly defined, evidence-based conditions (already-deceased specimens and validated non-animal learning benchmarks), with mandatory investment and a transition plan—rather than an unconditional blanket ban that ignores proportionality and classroom realities."}, "position": {"x": 2340, "y": 0}}, {"data": {"id": "e-t18", "source": "t18", "target": "t17", "ls": "dotted", "inferred": 1}}, {"data": {"id": "t19", "kind": "turn", "label": "AG2 R10\nAG1’s latest proposal is that dissection", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"agent\": \"AG2\",\n  \"round\": 10,\n  \"has_new_point\": true\n}\n\nAG1’s latest proposal is that dissection can be permitted *conditionally* (already-deceased specimens + “validated” non-animal alternatives that “fail” competency targets), instead of a blanket ban. \n\nI oppose that, and I’ll focus on a new ethical/practical issue rather than rehashing earlier “alternatives vs tactile” or “byproduct sourcing” points.\n\n1) **“Proportionality/conditions” doesn’t remove the underlying moral objection: animal death becomes a default educational tool.** Even if it’s less-bad in some cases, authorization still treats killing as an acceptable instrument when education could proceed without it.\n\n2) **Evidence-based thresholds are not stable—permission policies tend to expand.** Once dissection is permitted in principle, districts/suppliers have incentives to argue that alternatives “aren’t equivalent enough” and to lower the bar over time (different classrooms, budgets, and definitions of “competency”). That makes the “strict conditions” premise brittle.\n\n3) **Institutionalizing dissection also has an ethical-education component.** Biology education should cultivate respect for living beings and responsibility toward ecosystems. Normalizing routine cutting up of animal bodies undermines that educational mission, even if particular specimens are already dead.\n\n**Updated position:** Students should not dissect animals. Schools should meet biology learning goals with non-animal alternatives as the standard option and invest in scaling/quality so every student can learn the required content without making animal death part of the curriculum."}, "position": {"x": 2470, "y": 220}}, {"data": {"id": "e-t19", "source": "t19", "target": "t18", "ls": "dotted", "inferred": 1}}], "lane": true, "meta": "<table><tr><td>total_cost_usd<\/td><td>0.030836<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Students should **not** dissect animals.\n\nThe core reason is ethical and practical: even if some dissection specimens are described as “byproducts” or “already dead,” dissection is still an **avoidable choice** to use animal bodies as classroom materials when non-animal alternatives can teach the required biology content. AG2’s position is stronger because it doesn’t hinge on hard-to-verify assumptions about sourcing or “marginal harm” being negligible; instead, it applies a clearer standard—**if alternatives can meet learning goals, schools should default to methods that don’t involve animal death**.\n\nKey points supporting AG2’s conclusion:\n- **Learning can be achieved without animal dissection** through synthetic models, preserved materials where appropriate, and virtual/simulation-based labs, supplemented by strong instruction.\n- **“Byproduct” sourcing is not reliably verifiable at the classroom level**, so policies that depend on it introduce ethical uncertainty.\n- **Permitting dissection creates institutional momentum** and weak incentives to fully transition to non-animal teaching tools, even if participation is optional or safeguarded.\n- **A uniform non-animal approach avoids coercion, stigma, and unequal experiences** that tend to accompany opt-in/opt-out models.\n\nTherefore, the best policy is for schools to meet biology learning objectives using **non-animal alternatives as the standard option**, rather than maintaining dissection as an authorized pathway.<\/pre><\/details>"}]}};

function btn(parent,label,on,fn){const b=document.createElement('button');b.textContent=label;
  if(on)b.className='on';b.onclick=fn;parent.appendChild(b);}
function renderTabs(){
  const T=document.getElementById('topics'),M=document.getElementById('methods'),R=document.getElementById('runs');
  for(const el of [T,M,R]){while(el.children.length>1)el.removeChild(el.lastChild);}
  Object.keys(DATA).forEach(t=>btn(T,t,t===st.topic,()=>{st.topic=t;st.run=0;
    if(!DATA[t][st.method])st.method=METHODS.find(m=>DATA[t][m]);show();}));
  METHODS.filter(m=>DATA[st.topic][m]).forEach(m=>btn(M,m,m===st.method,()=>{st.method=m;st.run=0;show();}));
  DATA[st.topic][st.method].forEach((r,i)=>btn(R,'#'+r.run,i===st.run,()=>{st.run=i;show();}));
}
function show(){
  renderTabs();
  const r=DATA[st.topic][st.method][st.run];
  document.getElementById('q').textContent=r.question;
  document.getElementById('legend2').textContent=r.lane
    ?'点線: 発話順からの推定（直前の相手発話への応答）'
    :'木構造: 上 = 攻撃された論証、下 = それを攻撃/反論した論証（矢印は攻撃の向き）。実線 rebut / 破線 undercut ／ 枠 緑=justified 黄=defensible 灰=overruled';
  document.getElementById('meta').innerHTML=r.meta;
  document.getElementById('detail').textContent='ノードをクリック';
  cy.elements().remove(); cy.add(r.elements);
  cy.layout({name:'preset',fit:true,padding:40}).run();
}
st.topic=Object.keys(DATA)[0];st.method=METHODS.find(m=>DATA[st.topic][m]);show();
