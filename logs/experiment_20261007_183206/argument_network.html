 it doesn’t follow that requiring student dissection would necessarily drive the large-scale wild capture harms they describe.\n\nGiven (1) dissection’s more dependable fit with the hands-on learning outcomes schools aim for and (2) the ethical supply realities, students should dissect animals."}, "position": {"x": 0.0, "y": 280}}, {"data": {"id": "e-arg-72e9383e08", "source": "arg-72e9383e08", "target": "arg-7365da2866", "ls": "dashed", "label": "undercut", "detail": "arg-72e9383e08 (AG1 counter) → arg-7365da2866\nattack: undercut\ntarget_field: Ass\ntarget_statement: non-animal alternatives can teach the same anatomy and help students develop comparable observational and reasoning skills without killing animals."}}, {"data": {"id": "arg-bafcc0dd47", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals beca", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-bafcc0dd47\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-72e9383e08\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"students should dissect animals\"\n}\n\nStudents should not dissect animals because dissection is not necessary for biology learning goals and it carries major ethical/environmental harms.\n\nFirst, the target treats dissection as “uniquely reliable” for tactile and procedural skills, but biology education does not hinge on killing animals for those competencies: established curricula/benchmarks can be met without animal dissection, and physician training in the U.S. and Canada does not rely on animal dissection. If the same learning objectives can be achieved without dissecting live organisms, then “uniquely reliable” is not enough to justify requiring animal death.\n\nSecond, the supposed classroom-equivalence problem doesn’t justify requiring dissection. Non-animal alternatives (synthetic models and computer simulations) are designed specifically to teach anatomy, observation, and reasoning, and they allow repeated practice without ethical and ecological costs.\n\nThird, the target’s attempt to neutralize the wild-capture/biodiversity-loss concern by pointing to “already dead” or byproduct animals does not remove the central problem: the dominant supply method for dissection animals is still wild capture (approximately 99%), which decreases local populations and reduces biodiversity. So even if some dissections use byproducts in some cases, requiring dissection still drives harmful wild-capture demand at scale.\n\nBecause dissection is not required to achieve educational outcomes and because the supply system harms biodiversity, students should not be required to dissect animals."}, "position": {"x": 0.0, "y": 420}}, {"data": {"id": "e-arg-bafcc0dd47", "source": "arg-bafcc0dd47", "target": "arg-72e9383e08", "ls": "solid", "label": "rebut", "detail": "arg-bafcc0dd47 (AG2 defeat) → arg-72e9383e08\nattack: rebut\ntarget_field: Conc\ntarget_statement: students should dissect animals"}}, {"data": {"id": "arg-eaf04b25b9", "kind": "counter", "label": "AG1 counter\nI hold that students should be allowed (", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-eaf04b25b9\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-bafcc0dd47\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"the biodiversity-loss premise works because requiring dissection ‘still drives harmful wild-capture demand at scale,’ given that the dominant supply method is still wild capture (~99%)\"\n}\n\nI hold that students should be allowed (and often assigned) to dissect animals because the main ethical reason to ban it in the target depends on a specific harm-inference: that requiring school dissections will necessarily increase wild capture and biodiversity loss at scale. But that inference doesn’t follow when dissection specimens can be sourced from already-deceased animals and meat-industry byproducts rather than requiring new wild-capture collection to meet classroom demand. If additional classroom demand is met through such byproduct/already-deceased supply, then requiring dissection does not inherently “drive” wild capture at the level needed for the biodiversity-loss conclusion.\n\nOnce that key causal link is weakened, the target’s remaining “not necessary” claim is still not decisive for a policy choice. Education can legitimately include high-impact, hands-on learning experiences even when alternatives exist to cover the bare minimum of knowledge; banning dissection solely because learning could be achieved without it ignores the value of providing students richer practical biology training using specimens that do not require added killing to satisfy demand."}, "position": {"x": 0.0, "y": 560}}, {"data": {"id": "e-arg-eaf04b25b9", "source": "arg-eaf04b25b9", "target": "arg-bafcc0dd47", "ls": "dashed", "label": "undercut", "detail": "arg-eaf04b25b9 (AG1 counter) → arg-bafcc0dd47\nattack: undercut\ntarget_field: Ass\ntarget_statement: the biodiversity-loss premise works because requiring dissection ‘still drives harmful wild-capture demand at scale,’ given that the dominant supply method is still wild capture (~99%)"}}, {"data": {"id": "arg-f09e38df4f", "kind": "defeat", "label": "AG2 defeat\nThe target’s key move is conditional: it", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-f09e38df4f\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-eaf04b25b9\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"If additional classroom demand is met through such byproduct/already-deceased supply, then requiring dissection does not inherently “drive” wild capture at the level needed for the biodiversity-loss conclusion.\"\n}\n\nThe target’s key move is conditional: it claims the wild-capture/biodiversity-loss inference “doesn’t follow” if classroom demand can be met with “already-deceased animals and meat-industry byproducts rather than requiring new wild-capture collection.”\n\nBut the substantive reality is that dissection-animal supply is overwhelmingly wild-caught (about 99%). That means the “byproduct instead of wild capture” assumption can’t be doing the work the target needs: byproduct sourcing may cover some portion of specimens, but it cannot, at scale, absorb an increase in required dissection specimens without suppliers expanding beyond byproducts. When additional demand is created by requiring dissections, the supply chain responds—primarily through wild capture—so the biodiversity-loss causal link remains.\n\nOnce that causal link is not actually weakened, the target’s attempt to justify dissection as ethically acceptable “hands-on education” collapses: killing/wild-harvesting animals for added educational richness is not justified when non-animal alternatives can meet biology learning goals without harming wildlife.\n\nSo I hold that students should not be allowed (or often assigned) to dissect animals."}, "position": {"x": 0.0, "y": 700}}, {"data": {"id": "e-arg-f09e38df4f", "source": "arg-f09e38df4f", "target": "arg-eaf04b25b9", "ls": "dashed", "label": "undercut", "detail": "arg-f09e38df4f (AG2 defeat) → arg-eaf04b25b9\nattack: undercut\ntarget_field: Ass\ntarget_statement: If additional classroom demand is met through such byproduct/already-deceased supply, then requiring dissection does not inherently “drive” wild capture at the level needed for the biodiversity-loss conclusion."}}, {"data": {"id": "arg-16aea8fb8f", "kind": "counter", "label": "AG1 counter\nStudents should be allowed to dissect an", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-16aea8fb8f\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-f09e38df4f\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"byproduct sourcing cannot, at scale, absorb an increase in required dissection specimens without suppliers expanding beyond byproducts, so when additional demand is created the supply chain responds—primarily through wild capture\"\n}\n\nStudents should be allowed to dissect animals when the dissection programs are implemented with strict sourcing rules—specifically, using specimens that are already deceased or meat-industry byproducts rather than requiring suppliers to expand into wild-capture. If classroom dissection demand is met through regulated procurement of already-deceased/byproduct animals, then the causal chain the target depends on—“more demand → suppliers expand beyond byproducts → primarily wild capture → biodiversity loss”—is not forced to occur. \n\nGiven that dissection provides valuable hands-on biology learning and can be carried out using non-wild-capture sources, there is a straightforward ethical basis to allow (and sometimes assign) animal dissection under sourcing constraints."}, "position": {"x": 0, "y": 840}}, {"data": {"id": "e-arg-16aea8fb8f", "source": "arg-16aea8fb8f", "target": "arg-f09e38df4f", "ls": "dashed", "label": "undercut", "detail": "arg-16aea8fb8f (AG1 counter) → arg-f09e38df4f\nattack: undercut\ntarget_field: Ass\ntarget_statement: byproduct sourcing cannot, at scale, absorb an increase in required dissection specimens without suppliers expanding beyond byproducts, so when additional demand is created the supply chain responds—primarily through wild capture"}}, {"data": {"id": "arg-5c1c04a654", "kind": "main", "label": "AG2 main\nStudents should not dissect animals.\n\nMy", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-5c1c04a654\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nStudents should not dissect animals.\n\nMy argument relies on this chain of reasoning:\n1) A required school activity must have a clear educational necessity tied to the learning objectives students are expected to meet.\n2) College Board AP Biology and the Next Generation Science Standards do not require animal dissection as part of meeting biology learning goals.\n3) Likewise, medical education/training in the U.S. and Canada does not rely on animal dissection for physician training.\n4) If a practice is not needed to achieve the required biology outcomes, then the ethical cost of doing it becomes unjustified—especially when alternatives (synthetic models/computer simulations) can teach the same anatomy/skills as well or better.\n\nTherefore, because animal dissection is not required by the standards that define what students must learn, and because non-animal alternatives can meet those outcomes without killing animals, schools should not require students to dissect animals."}, "position": {"x": 170.0, "y": 0}}, {"data": {"id": "arg-109c475c80", "kind": "defeat", "label": "AG1 defeat\nI support students dissecting animals be", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-109c475c80\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-5c1c04a654\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Therefore, because animal dissection is not required by the standards that define what students must learn, and because non-animal alternatives can meet those outcomes without killing animals, schools should not require students to dissect animals.\"\n}\n\nI support students dissecting animals because dissection is not just an optional add-on; it directly enables biology-learning goals that go beyond “knowing facts,” including specimen-level observation, realistic tissue handling, and the fine-motor/procedural competence and critical thinking that come from working with real anatomy.\n\nThe target assumes that if AP Biology/NGSS do not explicitly require dissection, then dissection is unnecessary for the education students are expected to achieve. That doesn’t follow: standards function as minimum learning objectives, and schools can appropriately choose instructional methods that deliver higher-impact, practical competencies—precisely the kind dissection provides (hands-on “aha” moments and strengthened skill development).\n\nFinally, the ethical cost is substantially reduced when dissections use animals that are already deceased and fetal pigs that are meat-industry byproducts. With such sourcing constraints, requiring dissection doesn’t imply creating new animal harm at the level needed to justify a blanket prohibition.\n\nTherefore, students should dissect animals (with appropriate sourcing rules) as a valuable part of biology education."}, "position": {"x": 170.0, "y": 140}}, {"data": {"id": "e-arg-109c475c80", "source": "arg-109c475c80", "target": "arg-5c1c04a654", "ls": "solid", "label": "rebut", "detail": "arg-109c475c80 (AG1 defeat) → arg-5c1c04a654\nattack: rebut\ntarget_field: Conc\ntarget_statement: Therefore, because animal dissection is not required by the standards that define what students must learn, and because non-animal alternatives can meet those outcomes without killing animals, schools should not require students to dissect animals."}}, {"data": {"id": "arg-11453a504d", "kind": "counter", "label": "AG2 counter\nEven if some dissection specimens are al", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-11453a504d\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-109c475c80\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"the ethical cost is substantially reduced when dissections use animals that are already deceased and fetal pigs that are meat-industry byproducts\"\n}\n\nEven if some dissection specimens are already dead or are “meat-industry byproducts,” that does not substantially reduce the ethical cost of requiring students to perform dismemberment of animal bodies.\n\nThe moral issue isn’t only whether a particular classroom creates new killing; it’s also that schools would be compelling students to treat animals’ remains as disposable teaching materials and to participate in cutting apart animal tissues when non-animal alternatives exist to meet biology learning goals. In other words, byproduct sourcing may change the logistical origin of specimens, but it doesn’t remove the ethical wrongness of imposing animal dissection on students and of using alternatives only to the extent that it’s convenient.\n\nSo the conclusion that students should dissect animals “with appropriate sourcing rules” does not follow: sourcing cannot erase the core ethical harm, especially when alternatives can achieve the instructional aims without involving animal dismemberment."}, "position": {"x": 170.0, "y": 280}}, {"data": {"id": "e-arg-11453a504d", "source": "arg-11453a504d", "target": "arg-109c475c80", "ls": "dashed", "label": "undercut", "detail": "arg-11453a504d (AG2 counter) → arg-109c475c80\nattack: undercut\ntarget_field: Ass\ntarget_statement: the ethical cost is substantially reduced when dissections use animals that are already deceased and fetal pigs that are meat-industry byproducts"}}, {"data": {"id": "arg-e8241ff53a", "kind": "defeat", "label": "AG1 defeat\nEven if students are required to cut apa", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-e8241ff53a\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-11453a504d\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Even if some dissection specimens are already dead or are “meat-industry byproducts,” that does not substantially reduce the ethical cost of requiring students to perform dismemberment of animal bodies—and sourcing cannot erase the core ethical harm, so the dissection conclusion does not follow.\"\n}\n\nEven if students are required to cut apart animal bodies, the core ethical question is whether doing so causes additional harm (killing or suffering) beyond what would already occur. With sourcing rules that use animals that are already dead—over 98% in typical dissection contexts—and fetal pigs that are meat-industry byproducts destined for landfill, the activity does not impose the same kind of ethical harm the target highlights, because it does not require new killing or new suffering.\n\nSo the claim that byproduct/already-deceased sourcing “does not substantially reduce the ethical cost” is wrong: it substantially changes the moral tradeoff by turning dissection into a productive use of existing dead/byproduct materials rather than an added demand for animals. And where the educational benefits include specimen-level observation and the hands-on procedural skills the target does not dispute, the remaining ethical concerns about “disposability” are not decisive against allowing dissection under those strict sourcing constraints."}, "position": {"x": 170.0, "y": 420}}, {"data": {"id": "e-arg-e8241ff53a", "source": "arg-e8241ff53a", "target": "arg-11453a504d", "ls": "solid", "label": "rebut", "detail": "arg-e8241ff53a (AG1 defeat) → arg-11453a504d\nattack: rebut\ntarget_field: Conc\ntarget_statement: Even if some dissection specimens are already dead or are “meat-industry byproducts,” that does not substantially reduce the ethical cost of requiring students to perform dismemberment of animal bodies—and sourcing cannot erase the core ethical harm, so the dissection conclusion does not follow."}}, {"data": {"id": "arg-8d880c6947", "kind": "counter", "label": "AG2 counter\nThe target narrows the ethical question ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-8d880c6947\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-e8241ff53a\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"the core ethical question is whether doing so causes additional harm (killing or suffering) beyond what would already occur, and with animals that are already dead/byproducts the activity does not impose the same kind of ethical harm\"\n}\n\nThe target narrows the ethical question to whether dissection adds “killing or suffering beyond what would already occur,” and then treats “already dead / byproduct” sourcing as eliminating the key harm. But dissection’s harms are not only incremental at the moment of cutting.\n\nIn practice, dissection animals are overwhelmingly obtained through wild capture (about 99%), and that wild-catching harms local populations and reduces biodiversity. Those are real ethical/environmental costs tied to the dissection supply chain, and they are not erased just because an animal is dead by the time it reaches the classroom.\n\nBecause (1) dissection is not required to meet biology learning goals (AP Biology/NGSS) and (2) non-animal alternatives can teach the same anatomy/skills without linking classrooms to wild-capture biodiversity loss, schools should not require students to dissect animals—even under “already dead/byproduct” sourcing claims."}, "position": {"x": 170.0, "y": 560}}, {"data": {"id": "e-arg-8d880c6947", "source": "arg-8d880c6947", "target": "arg-e8241ff53a", "ls": "dashed", "label": "undercut", "detail": "arg-8d880c6947 (AG2 counter) → arg-e8241ff53a\nattack: undercut\ntarget_field: Ass\ntarget_statement: the core ethical question is whether doing so causes additional harm (killing or suffering) beyond what would already occur, and with animals that are already dead/byproducts the activity does not impose the same kind of ethical harm"}}, {"data": {"id": "arg-879819984c", "kind": "defeat", "label": "AG1 defeat\nStudents should be allowed to dissect an", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-879819984c\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-8d880c6947\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"In practice, dissection animals are overwhelmingly obtained through wild capture (about 99%), and therefore wild-capture biodiversity harms are not erased just because an animal is dead by the time it reaches the classroom.\"\n}\n\nStudents should be allowed to dissect animals because the biodiversity/wild-capture premise in the target does not match typical dissection sourcing. Where dissection programs use animals that were already deceased (over 98% in common dissection contexts) and use meat-industry byproducts (e.g., fetal pigs destined for landfill), requiring classroom dissection does not meaningfully create new demand for wild capture. If the activity is drawing on animals already dead/byproducts, then the claim that dissection inherently entails wild-capture-driven biodiversity loss that is “not erased” by the animal being dead at the classroom stage is not warranted. With that key premise undermined, the ethical objection on wild-capture/biodiversity grounds loses its basis, and the educational gains of working with real specimens still provide a strong justification for dissection in biology education."}, "position": {"x": 170.0, "y": 700}}, {"data": {"id": "e-arg-879819984c", "source": "arg-879819984c", "target": "arg-8d880c6947", "ls": "dashed", "label": "undercut", "detail": "arg-879819984c (AG1 defeat) → arg-8d880c6947\nattack: undercut\ntarget_field: Ass\ntarget_statement: In practice, dissection animals are overwhelmingly obtained through wild capture (about 99%), and therefore wild-capture biodiversity harms are not erased just because an animal is dead by the time it reaches the classroom."}}, {"data": {"id": "arg-bf9976ba2e", "kind": "counter", "label": "AG2 counter\nStudents should not dissect animals.\n\nEv", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-bf9976ba2e\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-879819984c\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"With the wild-capture/biodiversity premise undermined by byproduct/already-deceased sourcing, the ethical objection on wild-capture/biodiversity grounds loses its basis (i.e., dissection’s remaining ethical/environmental costs are effectively addressed).\"\n}\n\nStudents should not dissect animals.\n\nEven if some dissection specimens are already dead or are byproducts, animal dissection still has major environmental costs that go beyond wild capture/biodiversity: dissection labs typically rely on hazardous preservation chemicals and generate regulated biological/chemical waste from cutting up animal tissues. Those harms remain whenever dissection is required, regardless of whether the animal was caught or is a byproduct.\n\nSo the conclusion that students should be allowed to dissect because the wild-capture premise is “undermined” does not follow: the ethical/environmental objection is not limited to biodiversity loss from wild capture, and dissection still imposes preventable ecological harm that non-animal methods can avoid."}, "position": {"x": 170.0, "y": 840}}, {"data": {"id": "e-arg-bf9976ba2e", "source": "arg-bf9976ba2e", "target": "arg-879819984c", "ls": "dashed", "label": "undercut", "detail": "arg-bf9976ba2e (AG2 counter) → arg-879819984c\nattack: undercut\ntarget_field: Ass\ntarget_statement: With the wild-capture/biodiversity premise undermined by byproduct/already-deceased sourcing, the ethical objection on wild-capture/biodiversity grounds loses its basis (i.e., dissection’s remaining ethical/environmental costs are effectively addressed)."}}, {"data": {"id": "arg-5969b84ad8", "kind": "defeat", "label": "AG1 defeat\nThe target treats dissection’s chemical/", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-5969b84ad8\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-bf9976ba2e\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"Those harms remain whenever dissection is required, regardless of whether the animal was caught or is a byproduct.\"\n}\n\nThe target treats dissection’s chemical/waste aspect as an inevitable, decisive environmental harm (“those harms remain whenever dissection is required”). But that claim overstates necessity.\n\nIn real school lab contexts, regulated biological/chemical waste is handled under established hazardous-waste/disposal procedures; the key question is whether chemicals and waste are ultimately released into the environment, not merely whether they exist in the lab. With standard compliance and proper waste treatment, dissection labs can prevent ecological release and keep risks managed within regulatory limits.\n\nAlso, “hazardous preservation chemicals” are not a fixed feature of dissection; preservation approaches can be selected to reduce toxicity and chemical load (e.g., minimizing amounts used, using less hazardous fixatives where feasible, and disposing of residues correctly). Once you allow for appropriate lab practices and safer handling, the target’s premise that dissection inherently and persistently causes major avoidable environmental harm does not hold in the strong sense needed to justify prohibiting student dissection.\n\nTherefore, the chemical/waste point does not negate the view that students can dissect animals as part of biology education, when programs follow sourcing rules and responsible lab/waste controls."}, "position": {"x": 170.0, "y": 980}}, {"data": {"id": "e-arg-5969b84ad8", "source": "arg-5969b84ad8", "target": "arg-bf9976ba2e", "ls": "dashed", "label": "undercut", "detail": "arg-5969b84ad8 (AG1 defeat) → arg-bf9976ba2e\nattack: undercut\ntarget_field: Ass\ntarget_statement: Those harms remain whenever dissection is required, regardless of whether the animal was caught or is a byproduct."}}, {"data": {"id": "arg-f9c120dd17", "kind": "counter", "label": "AG2 counter\nStudents should not dissect animals.\n\nTh", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-f9c120dd17\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-5969b84ad8\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"In real school lab contexts, regulated biological/chemical waste is handled under established hazardous-waste/disposal procedures; the key question is whether chemicals and waste are ultimately released into the environment... With standard compliance and proper waste treatment, dissection labs can prevent ecological release and keep risks managed within regulatory limits.\"\n}\n\nStudents should not dissect animals.\n\nThe opponent’s response relies on a narrow framing: that the only relevant environmental issue is whether chemicals/waste are ultimately released into the environment, and that “standard compliance and proper waste treatment” can prevent that and keep risks within regulatory limits.\n\nI dispute that assumption. Hazardous preservation chemicals and biological waste don’t vanish just because they’re handled under procedures. They must be transported and treated via systems such as licensed disposal, incineration, and/or landfill—processes that carry environmental footprints and residual leakage/emissions risks. Also, even where rules exist, schools vary in staffing, training, budgets, and oversight, so “standard compliance” can’t be assumed across classrooms. So the chemical/waste aspect remains a real, preventable ecological/risk cost of requiring dissection.\n\nSince dissection creates avoidable hazardous-waste burdens and non-animal alternatives can meet biology learning goals, schools should not require students to dissect animals."}, "position": {"x": 170.0, "y": 1120}}, {"data": {"id": "e-arg-f9c120dd17", "source": "arg-f9c120dd17", "target": "arg-5969b84ad8", "ls": "dashed", "label": "undercut", "detail": "arg-f9c120dd17 (AG2 counter) → arg-5969b84ad8\nattack: undercut\ntarget_field: Ass\ntarget_statement: In real school lab contexts, regulated biological/chemical waste is handled under established hazardous-waste/disposal procedures; the key question is whether chemicals and waste are ultimately released into the environment... With standard compliance and proper waste treatment, dissection labs can prevent ecological release and keep risks managed within regulatory limits."}}, {"data": {"id": "arg-0195ee94e8", "kind": "defeat", "label": "AG1 defeat\nStudents should be allowed (and in some ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-0195ee94e8\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-f9c120dd17\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"even where rules exist, schools vary in staffing, training, budgets, and oversight, so “standard compliance” can’t be assumed across classrooms\"\n}\n\nStudents should be allowed (and in some cases required) to dissect animals when schools implement dissection programs that explicitly require regulated hazardous-waste management—e.g., using licensed hazardous-waste contractors, keeping required disposal records/manifest documentation, and limiting dissection to classrooms that meet the relevant hazardous-waste handling and lab-safety standards.\n\nThat directly undermines the target’s move from “chemicals/waste create environmental footprints and residual risks” to “the chemical/waste aspect remains a real, preventable ecological/risk cost of requiring dissection.” Even if transport and treatment have footprints, schools are not left to “varying compliance” in the relevant way: hazardous-waste disposal is governed by enforceable rules (handled by certified providers and tracked through documentation), so a school’s day-to-day variation cannot reasonably be treated as showing that dissection inherently imposes unmanageable or broadly preventable environmental/risk harm.\n\nSo the chemical/waste consideration does not justify prohibiting student dissection; it supports requiring specific waste-handling safeguards—conditions under which dissection can still be a worthwhile, hands-on biology activity."}, "position": {"x": 170, "y": 1260}}, {"data": {"id": "e-arg-0195ee94e8", "source": "arg-0195ee94e8", "target": "arg-f9c120dd17", "ls": "dashed", "label": "undercut", "detail": "arg-0195ee94e8 (AG1 defeat) → arg-f9c120dd17\nattack: undercut\ntarget_field: Ass\ntarget_statement: even where rules exist, schools vary in staffing, training, budgets, and oversight, so “standard compliance” can’t be assumed across classrooms"}}, {"data": {"id": "arg-a565c2a7c9", "kind": "main", "label": "AG1 main\nStudents should dissect animals.\n\nThis f", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-a565c2a7c9\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nStudents should dissect animals.\n\nThis follows from evaluating (A) educational necessity and unique learning value plus (B) ethical cost given how specimens are sourced.\n\n**(A) Dissection is demonstrably educationally necessary for meeting biology learning objectives.** Biology education isn’t only about memorizing structures; students are expected to be able to *investigate and interpret* real biological systems. Dissection uniquely provides specimen-level, tactile evidence of anatomy that students must observe and reason from—producing concrete “aha” learning opportunities and strengthening fine-motor/procedural competence (including hand-eye coordination) and critical thinking about structure–function relationships. Because those are core competencies tied to biology learning objectives (not merely optional enrichment), dissection functions as a necessary instructional method, not just a nice add-on.\n\n**(B) The ethical cost is mitigated because dissection commonly uses animals that are already dead and byproducts.** In typical school dissection contexts, the vast majority of specimens are already deceased (over 98%), and fetal pigs used in many school dissections are meat-industry byproducts destined for landfill—so the classroom activity is largely a productive use of existing dead/byproduct animals rather than requiring new killing.\n\nWhen both conditions are satisfied—clear, standards-aligned educational necessity through real anatomical investigation, and mitigated ethical cost through common already-deceased/byproduct sourcing—there is a straightforward ethical and educational justification to allow (and often assign) animal dissection in schools."}, "position": {"x": 340.0, "y": 0}}, {"data": {"id": "arg-0a4e34fe24", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals.\n\n1)", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-0a4e34fe24\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a565c2a7c9\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should dissect animals.\"\n}\n\nStudents should not dissect animals.\n\n1) Dissection is not educationally necessary for the biology learning goals students are expected to meet. If students can achieve the required biology outcomes using non-animal alternatives like synthetic models and computer simulations (which teach anatomy/structure and support observation and reasoning without killing animals), then dissection is not a justified “necessary instructional method,” even if it can provide a hands-on experience.\n\n2) The ethical-cost premise is wrong: dissection harm is not meaningfully mitigated by the claim that most specimens are already dead or byproducts. The dominant reality is that roughly 99% of dissection animals are caught in the wild, and wild-capture reduces local populations and biodiversity—so requiring dissection creates demand that harms wildlife. Therefore, the “already-dead/byproduct” framing does not remove the underlying ethical and environmental problem.\n\nGiven that non-animal methods can meet biology objectives and that dissection relies on a harmful supply system, requiring students to dissect animals is unjustified."}, "position": {"x": 340.0, "y": 140}}, {"data": {"id": "e-arg-0a4e34fe24", "source": "arg-0a4e34fe24", "target": "arg-a565c2a7c9", "ls": "solid", "label": "rebut", "detail": "arg-0a4e34fe24 (AG2 defeat) → arg-a565c2a7c9\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should dissect animals."}}, {"data": {"id": "arg-739b9c008c", "kind": "counter", "label": "AG1 counter\nStudents should dissect animals when sch", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-739b9c008c\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-0a4e34fe24\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Therefore, the “already-dead/byproduct” framing does not remove the underlying ethical and environmental problem. Given that non-animal methods can meet biology objectives and that dissection relies on a harmful supply system, requiring students to dissect animals is unjustified.\"\n}\n\nStudents should dissect animals when schools offer dissection as an **opt-in** (with non-animal alternatives for students who choose not to). This responds directly to the target’s rationale for prohibition: it hinges on dissection being unjustified when non-animal methods can meet required outcomes and when requiring it would drive ethical costs.\n\nEven if dissection isn’t necessary for everyone to meet minimum biology outcomes, that does not imply schools must ban it outright. Schools can allow students to participate in dissection because it provides meaningful hands-on learning for those who choose it, while **not requiring** all students to do it. \n\nCrucially, making dissection elective also **limits the ethical impact**: the supply-chain harm the target worries about (e.g., wild capture) tracks the number of animals demanded. If only willing students dissect, the animal-demand pressure—and therefore the ethical/environmental costs—are reduced compared with a blanket requirement. \n\nTherefore, schools should allow (not ban) animal dissection as an elective option for students."}, "position": {"x": 340, "y": 280}}, {"data": {"id": "e-arg-739b9c008c", "source": "arg-739b9c008c", "target": "arg-0a4e34fe24", "ls": "solid", "label": "rebut", "detail": "arg-739b9c008c (AG1 counter) → arg-0a4e34fe24\nattack: rebut\ntarget_field: Conc\ntarget_statement: Therefore, the “already-dead/byproduct” framing does not remove the underlying ethical and environmental problem. Given that non-animal methods can meet biology objectives and that dissection relies on a harmful supply system, requiring students to dissect animals is unjustified."}}, {"data": {"id": "end-arg-f80aa1a4eb", "label": "終了: overruled（反論できず敗北）", "detail": "終了: overruled（反論できず敗北）"}, "position": {"x": 0, "y": 1386.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-f80aa1a4eb", "source": "end-arg-f80aa1a4eb", "target": "arg-16aea8fb8f", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-5c1c04a654", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 170, "y": 1536.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-5c1c04a654", "source": "end-arg-5c1c04a654", "target": "arg-0195ee94e8", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-a565c2a7c9", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 340, "y": 1686.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-a565c2a7c9", "source": "end-arg-a565c2a7c9", "target": "arg-739b9c008c", "ls": "dotted", "inferred": 1}}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 510, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>20<\/td><\/tr><tr><td>attack_turn_count<\/td><td>17<\/td><\/tr><tr><td>main_argument_count<\/td><td>3<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>1<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.118416<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>**Students should not be required to dissect animals.** Animal dissection may be offered **only as an opt-in elective** if schools can meet strict safeguards—especially around **verifiable sourcing (no wild-caught animals)** and **hazardous chemical/waste compliance**—and if **non-animal alternatives are available** so all required learning goals can be met without dissection.\n\n### Baseline rule (required for everyone)\n- **Dissection must not be required.**\n- **Schools must provide non-animal alternatives** (e.g., synthetic models, computer simulations, and other approved non-animal methods) so the **biology learning objectives can be achieved without dissection**.\n- This preserves the point that dissection is **not a prerequisite** for meeting standard biology outcomes.\n\n### When dissection may be offered (opt-in only)\nA school **may offer** animal dissection **only if all of the following are true**:\n\n1) **Real opt-in / meaningful opt-out**\n- Students can choose dissection **without penalty**.\n- Students who decline still receive instruction that covers the **same learning objectives** via non-animal alternatives.\n- Schools must respect ethical, cultural, or personal reasons for opting out.\n\n2) **Verified humane/non-wild sourcing**\nBecause the underlying supply claims are disputed, policy can’t rely on any one side’s general statistic as “always true.” Instead:\n- Dissection specimens must be sourced from **already-deceased animals and/or meat-industry byproducts**, **and this must be documented** (e.g., supplier documentation / chain-of-custody records / equivalent proof).\n- **Wild-caught procurement must be prohibited.**\n- If a school **cannot verify** sourcing under these constraints, dissection **must not be offered**.\n\n3) **Enforceable hazardous-waste and safety controls**\nDissection may only be offered where the school can demonstrate compliance with lab and waste requirements, including:\n- **Licensed hazardous-waste management** for transport/treatment/disposal,\n- **Required documentation/records** (e.g., manifests or equivalent),\n- **Trained staff and appropriate oversight**, and\n- Practical steps to **minimize hazard and waste** (including limiting chemical quantities and proper containment and disposal).\nIf these safeguards cannot be reliably met, dissection **must not** be offered.\n\n### What this policy intentionally does *not* decide\n- It doesn’t settle whether dissection is universally educationally “equal vs superior” to alternatives in every setting.\n- It doesn’t rely on a single definitive “typical” supply-chain percentage; it instead uses **documentation and a wild-caught prohibition** as the controlling rule.\n\n### Bottom line\n**No—animal dissection should not be required.**  \n**Yes—optionally allowed** only when students can opt in without penalty, non-animal alternatives cover the objectives for everyone else, specimens are **verifiably from already-deceased/byproduct sources (no wild-caught)**, and the school can prove **proper hazardous chemical and waste handling safeguards**.<\/pre><\/details><div>justification_status: <b>fallback_full_dialogue_synthesis<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}], "schema": [{"run": 1, "question": "Should students dissect animals?", "elements": [{"data": {"id": "arg-691f2d307d", "kind": "main", "label": "AG1 main\nYes—students should dissect animals as p", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"arg-691f2d307d\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"overruled\",\n  \"closed_by_budget\": false\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is a valuable part of teaching biology in schools because it gives students direct, hands-on learning opportunities.\",\n            \"Biology instruction benefits from hands-on activities that let students learn through direct observation and procedure.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection meaningfully improves students’ biology learning experience.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection practice develops students’ fine motor skills.\",\n            \"Dissection practice improves students’ hand-eye coordination.\",\n            \"Dissection requires careful observation and procedure, which develops students’ critical thinking.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection builds key scientific skills (fine motor control, hand-eye coordination, and critical thinking) beyond passive learning.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Hands-on dissection can create engaging ‘aha moments.’\",\n            \"Engaging hands-on science experiences can increase students’ interest in pursuing science-related careers.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection can increase students’ motivation to pursue science careers.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Over 98% of dissected animals were already deceased before being used in classrooms.\",\n            \"Fetal pigs used in dissection are meat industry byproducts destined for landfills.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Using these animals in dissection is a productive use of dead animals that would otherwise be discarded.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection meaningfully improves students’ biology learning experience.\",\n            \"Dissection builds key scientific skills beyond passive learning.\",\n            \"Dissection can increase students’ motivation to pursue science careers.\",\n            \"Using these animals in dissection is a productive use of dead animals that would otherwise be discarded.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Yes—students should dissect animals as part of biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection meaningfully improves students’ biology learning experience.\",\n      \"Dissection builds key scientific skills (fine motor control, hand-eye coordination, and critical thinking) beyond passive learning.\",\n      \"Dissection can increase students’ motivation to pursue science careers.\",\n      \"Using these animals in dissection is a productive use of dead animals that would otherwise be discarded.\",\n      \"Yes—students should dissect animals as part of biology education.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0.0, "y": 0}}, {"data": {"id": "arg-ce20c9d3b3", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals as p", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-ce20c9d3b3\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-691f2d307d\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Yes—students should dissect animals as part of biology education.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of dissection animals are caught in the wild (not already dead by default).\",\n            \"Wild-catching decreases local populations and reduces biodiversity.\",\n            \"Therefore, using wild-caught animals in dissection entails inhumane animal sourcing and environmental harm.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection typically involves inhumane animal sourcing and environmental harm.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations teach biology concepts with at least equal effectiveness to dead-animal dissection.\",\n            \"Students learn just as well or better with alternatives versus dead animals.\",\n            \"AP Biology and NGSS do not require animal dissection.\",\n            \"No U.S. or Canadian medical schools use animals for physician training.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection is unnecessary for achieving biology/medical education learning objectives when alternatives are available.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection typically involves inhumane animal sourcing and environmental harm.\",\n            \"Animal dissection is unnecessary for achieving biology/medical education learning objectives when alternatives are available.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection does not provide a unique educational benefit that justifies its harms (so it does not meaningfully improve learning relative to alternatives).\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Students learn just as well or better with alternatives versus dead animals.\",\n            \"Dissection does not provide a unique educational benefit that justifies its harms.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals as part of biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection typically involves inhumane animal sourcing and environmental harm.\",\n      \"Animal dissection is unnecessary for achieving biology/medical education learning objectives when alternatives are available.\",\n      \"Dissection does not provide a unique educational benefit that justifies its harms (so it does not meaningfully improve learning relative to alternatives).\",\n      \"Students should not dissect animals as part of biology education.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0.0, "y": 140}}, {"data": {"id": "e-arg-ce20c9d3b3", "source": "arg-ce20c9d3b3", "target": "arg-691f2d307d", "ls": "solid", "label": "rebut", "detail": "arg-ce20c9d3b3 (AG2 defeat) → arg-691f2d307d\nattack: rebut\ntarget_field: Conc\ntarget_statement: Yes—students should dissect animals as part of biology education."}}, {"data": {"id": "arg-d06b727d49", "kind": "counter", "label": "AG1 counter\nStudents should dissect animals as part ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-d06b727d49\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-ce20c9d3b3\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals as part of biology education.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Real dissection requires manipulating real animal tissues (e.g., cutting/opening organs) under genuine physical/spatial constraints where errors cannot simply be reversed or “reset” like in a digital environment.\",\n            \"Dissection is an instructional method that develops students’ critical thinking through performing real biological procedures.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection uniquely trains adaptive procedural reasoning (critical thinking via real, non-repairable lab constraints).\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations typically provide standardized representations and usually allow pausing/resetting or repeated attempts without the same real tissue variability and irreversibility as physical dissection.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Simulations/models do not train adaptive procedural reasoning to the same extent as real dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Students learn meaningfully from educational experiences that specifically train adaptive procedural reasoning and lab-based critical thinking.\",\n            \"Dissection uniquely provides that training beyond what simulations/models provide.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection provides a meaningful educational advantage over simulations/models.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection provides a meaningful educational advantage over simulations/models.\",\n            \"Animal dissection is a valuable part of teaching biology in schools.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should dissect animals as part of biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"Dissection uniquely trains adaptive procedural reasoning (critical thinking via real, non-repairable lab constraints).\",\n      \"Simulations/models do not train adaptive procedural reasoning to the same extent as real dissection.\",\n      \"Dissection provides a meaningful educational advantage over simulations/models.\",\n      \"Students should dissect animals as part of biology education.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0, "y": 280}}, {"data": {"id": "e-arg-d06b727d49", "source": "arg-d06b727d49", "target": "arg-ce20c9d3b3", "ls": "solid", "label": "rebut", "detail": "arg-d06b727d49 (AG1 counter) → arg-ce20c9d3b3\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals as part of biology education."}}, {"data": {"id": "arg-fb0d0ff118", "kind": "main", "label": "AG2 main\nStudents should not dissect animals in b", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"arg-fb0d0ff118\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"overruled\",\n  \"closed_by_budget\": false\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of dissection animals are caught in the wild.\",\n            \"Requiring students to dissect animals increases institutional demand for dissection animals.\",\n            \"Wild-catching decreases local populations and reduces biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Requiring animal dissection in schools tends to increase wild-catching and cause biodiversity loss.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations teach biology concepts with at least equal effectiveness to dead-animal dissection.\",\n            \"Students learn just as well or better with alternatives versus dead animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students can reach biology learning goals without using real animals for dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Requiring animal dissection in schools tends to increase wild-catching and cause biodiversity loss.\",\n            \"Students can reach biology learning goals without using real animals for dissection.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Real-animal dissection is an avoidable practice that offers no compensating educational need.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Real-animal dissection is an avoidable practice that offers no compensating educational need.\"\n          ],\n          \"weak_negation\": [\n            \"Real-animal dissection uniquely improves learning compared to synthetic models/computer simulations in a way that alternatives do not.\"\n          ]\n        },\n        \"consequent\": \"Students should not dissect animals in biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"Requiring animal dissection in schools tends to increase wild-catching and cause biodiversity loss.\",\n      \"Students can reach biology learning goals without using real animals for dissection.\",\n      \"Real-animal dissection is an avoidable practice that offers no compensating educational need.\",\n      \"Students should not dissect animals in biology education.\"\n    ],\n    \"Ass\": [\n      \"Real-animal dissection uniquely improves learning compared to synthetic models/computer simulations in a way that alternatives do not.\"\n    ]\n  }\n}"}, "position": {"x": 170.0, "y": 0}}, {"data": {"id": "arg-827eb90f1c", "kind": "defeat", "label": "AG1 defeat\nReal-animal dissection uniquely improves", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-827eb90f1c\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-fb0d0ff118\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"Real-animal dissection uniquely improves learning compared to synthetic models/computer simulations in a way that alternatives do not.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Real dissection requires manipulating real animal tissues (e.g., cutting/opening organs) under genuine physical/spatial constraints where errors are effectively non-repairable and cannot be simply reset like in digital environments.\",\n            \"Dissection therefore forces students to adapt their actions based on real-time, irreversible feedback from complex biological variability.\"\n          ],\n          \"weak_negation\": [\n            \"Simulations/models are designed and used in a way that recreates the same non-repairable, highly variable, real-tissue constraints.\"\n          ]\n        },\n        \"consequent\": \"Real-animal dissection uniquely trains adaptive procedural reasoning (real lab-based critical thinking) more than synthetic models/computer simulations.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Students learn in ways that track the type of reasoning and constraints the activity actually trains.\",\n            \"If an activity uniquely trains adaptive procedural reasoning more than alternatives, then it provides a unique educational learning advantage over those alternatives.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Real-animal dissection uniquely improves learning compared to synthetic models/computer simulations in a way alternatives do not.\"\n      }\n    ],\n    \"Conc\": [\n      \"Real-animal dissection uniquely trains adaptive procedural reasoning (real lab-based critical thinking) more than synthetic models/computer simulations.\",\n      \"Real-animal dissection uniquely improves learning compared to synthetic models/computer simulations in a way alternatives do not.\"\n    ],\n    \"Ass\": [\n      \"Simulations/models are designed and used in a way that recreates the same non-repairable, highly variable, real-tissue constraints.\"\n    ]\n  }\n}"}, "position": {"x": 170.0, "y": 140}}, {"data": {"id": "e-arg-827eb90f1c", "source": "arg-827eb90f1c", "target": "arg-fb0d0ff118", "ls": "dashed", "label": "undercut", "detail": "arg-827eb90f1c (AG1 defeat) → arg-fb0d0ff118\nattack: undercut\ntarget_field: Ass\ntarget_statement: Real-animal dissection uniquely improves learning compared to synthetic models/computer simulations in a way that alternatives do not."}}, {"data": {"id": "arg-970476c180", "kind": "counter", "label": "AG2 counter\nStudents should not dissect animals in b", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-970476c180\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-827eb90f1c\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Real-animal dissection uniquely improves learning compared to synthetic models/computer simulations in a way alternatives do not.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"AP Biology and NGSS do not require animal dissection to meet the biology learning objectives they specify.\",\n            \"A school practice is educationally justified only to the extent it is needed to achieve required learning objectives (not merely because it might add extra activities beyond what is required).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"If a practice is not required by AP/NGSS to achieve the required learning objectives, then it cannot be considered a uniquely educationally advantageous substitute over alternatives for curriculum purposes.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations teach biology concepts with at least equal effectiveness to dead-animal dissection.\",\n            \"Therefore, alternatives can meet the biology learning objectives for AP/NGSS without using real animals for dissection.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection does not provide a curriculum-relevant unique learning advantage over alternatives.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection animals are approximately 99% caught in the wild.\",\n            \"Wild-catching decreases local populations and reduces biodiversity.\",\n            \"And there is no curriculum-relevant unique educational need for dissection.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals in biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"If a practice is not required by AP/NGSS to achieve the required learning objectives, then it cannot be considered a uniquely educationally advantageous substitute over alternatives for curriculum purposes.\",\n      \"Dissection does not provide a curriculum-relevant unique learning advantage over alternatives.\",\n      \"Students should not dissect animals in biology education.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170, "y": 280}}, {"data": {"id": "e-arg-970476c180", "source": "arg-970476c180", "target": "arg-827eb90f1c", "ls": "solid", "label": "rebut", "detail": "arg-970476c180 (AG2 counter) → arg-827eb90f1c\nattack: rebut\ntarget_field: Conc\ntarget_statement: Real-animal dissection uniquely improves learning compared to synthetic models/computer simulations in a way alternatives do not."}}, {"data": {"id": "arg-242609590b", "kind": "main", "label": "AG1 main\nYes—students should dissect animals as p", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"arg-242609590b\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"overruled\",\n  \"closed_by_budget\": false\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In school dissection, over 98% of the animals used were already deceased before classroom use.\",\n            \"Fetal pigs used in dissection are meat-industry byproducts destined for landfills.\"\n          ],\n          \"weak_negation\": [\n            \"No evidence that classroom dissection procurement materially relies on large-scale live wild capture beyond the already-deceased/byproduct rates.\"\n          ]\n        },\n        \"consequent\": \"Animal use in school dissection is largely a productive use of already-deceased/byproduct animals rather than a driver of wild-capture harms.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Real dissection requires students to observe and handle real tissues to see true anatomical structure and natural biological variation (e.g., genuine differences/asymmetries).\",\n            \"Understanding structure–function relationships in biology depends on accurate perception of real anatomical structure and variation, not just abstract depiction.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Real animal dissection gives students uniquely accurate tactile/structural learning for structure–function understanding in biology.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations necessarily provide representations rather than direct tactile experience of real tissues and their full natural variability.\",\n            \"Synthetic models and computer simulations are used as alternatives to dissection for biology learning.\"\n          ],\n          \"weak_negation\": [\n            \"No evidence that synthetic models/computer simulations teach structure–function understanding (based on tactile/real-anatomy fidelity) equally well as real dissection in comparable school settings.\"\n          ]\n        },\n        \"consequent\": \"Alternatives have not been shown to provide a comparable educational outcome to real dissection for structure–function learning.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Real animal dissection provides a unique educational advantage for structure–function learning over alternatives that have not been shown to match it.\",\n            \"Animal use in school dissection is largely ethically/environmentally justified as a productive use of already-deceased/byproduct animals rather than wild-capture harms.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Yes—students should dissect animals as part of biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal use in school dissection is largely a productive use of already-deceased/byproduct animals rather than a driver of wild-capture harms.\",\n      \"Real animal dissection gives students uniquely accurate tactile/structural learning for structure–function understanding in biology.\",\n      \"Alternatives have not been shown to provide a comparable educational outcome to real dissection for structure–function learning.\",\n      \"Yes—students should dissect animals as part of biology education.\"\n    ],\n    \"Ass\": [\n      \"No evidence that classroom dissection procurement materially relies on large-scale live wild capture beyond the already-deceased/byproduct rates.\",\n      \"No evidence that synthetic models/computer simulations teach structure–function understanding (based on tactile/real-anatomy fidelity) equally well as real dissection in comparable school settings.\"\n    ]\n  }\n}"}, "position": {"x": 340.0, "y": 0}}, {"data": {"id": "arg-f4abc5a171", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals in b", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-f4abc5a171\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-242609590b\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"No evidence that classroom dissection procurement materially relies on large-scale live wild capture beyond the already-deceased/byproduct rates.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of dissection animals are caught in the wild (i.e., not already dead by default and not merely limited to byproducts).\",\n            \"If the overwhelming majority of used animals are wild-caught, then dissection procurement materially relies on live wild capture beyond already-deceased/byproduct sources.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection procurement materially relies on live wild capture beyond already-deceased/byproduct sources.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Wild-catching decreases local populations and reduces biodiversity.\",\n            \"Animal dissection procurement materially relies on live wild capture beyond already-deceased/byproduct sources.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Requiring animal dissection increases harms from wild-capture (inhumane sourcing and biodiversity loss).\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"AP Biology and NGSS do not require animal dissection to meet their specified learning objectives.\",\n            \"Synthetic models and computer simulations can teach biology concepts with at least equal effectiveness to dead-animal dissection (students learn just as well or better with alternatives).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection is unnecessary to achieve the required biology learning objectives.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Requiring animal dissection increases harms from wild-capture (inhumane sourcing and biodiversity loss).\",\n            \"Animal dissection is unnecessary to achieve the required biology learning objectives.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals in biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection procurement materially relies on live wild capture beyond already-deceased/byproduct sources.\",\n      \"Requiring animal dissection increases harms from wild-capture (inhumane sourcing and biodiversity loss).\",\n      \"Animal dissection is unnecessary to achieve the required biology learning objectives.\",\n      \"Students should not dissect animals in biology education.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 340, "y": 140}}, {"data": {"id": "e-arg-f4abc5a171", "source": "arg-f4abc5a171", "target": "arg-242609590b", "ls": "dashed", "label": "undercut", "detail": "arg-f4abc5a171 (AG2 defeat) → arg-242609590b\nattack: undercut\ntarget_field: Ass\ntarget_statement: No evidence that classroom dissection procurement materially relies on large-scale live wild capture beyond the already-deceased/byproduct rates."}}, {"data": {"id": "arg-1499366fa7", "kind": "main", "label": "AG2 main\nStudents should not dissect animals.", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"arg-1499366fa7\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"overruled\",\n  \"closed_by_budget\": false\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"AP Biology and NGSS do not require animal dissection to achieve the specified biology learning objectives.\",\n            \"No U.S. or Canadian medical schools use animals for physician training.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection lacks a required/compelling educational necessity for school biology (it is not demanded by AP/NGSS objectives and is not used for physician training).\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations teach biology concepts with at least equal effectiveness to dead-animal dissection.\",\n            \"Students learn just as well or better with alternatives versus dead animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students can achieve the relevant biology learning objectives without real-animal dissection using alternatives.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection lacks a required/compelling educational necessity for school biology.\",\n            \"Students can achieve the relevant biology learning objectives without real-animal dissection using alternatives.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"There is no compensating educational need that would justify using real animals for dissection in schools.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of dissection animals are caught in the wild (not already dead by default).\",\n            \"Wild-catching decreases local populations and reduces biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Using animals for dissection in schools is associated with inhumane sourcing and biodiversity/environmental harm.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"There is no compensating educational need that would justify using real animals for dissection in schools.\",\n            \"Using animals for dissection in schools is associated with inhumane sourcing and biodiversity/environmental harm.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection lacks a required/compelling educational necessity for school biology (it is not demanded by AP/NGSS objectives and is not used for physician training).\",\n      \"Students can achieve the relevant biology learning objectives without real-animal dissection using alternatives.\",\n      \"There is no compensating educational need that would justify using real animals for dissection in schools.\",\n      \"Using animals for dissection in schools is associated with inhumane sourcing and biodiversity/environmental harm.\",\n      \"Students should not dissect animals.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 510.0, "y": 0}}, {"data": {"id": "arg-10b5b90897", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals as part ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-10b5b90897\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-1499366fa7\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is a valuable part of teaching biology in schools because it gives students direct, hands-on learning opportunities.\",\n            \"Biology instruction benefits from hands-on activities that let students learn through direct observation and procedure.\",\n            \"Dissection practice develops students’ fine motor skills and hand-eye coordination, and requires careful observation and procedure that develops critical thinking.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection meaningfully improves students’ biology learning experience and builds key scientific skills.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Real dissection requires students to observe and handle real animal tissues to see true anatomical structure and natural biological variation.\",\n            \"Real lab constraints (e.g., having only one real specimen and real tissue behavior) require adaptive procedural reasoning that cannot simply be repeated/reset like in a digital environment.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Real-animal dissection provides unique, curriculum-relevant learning advantages over alternatives like models or simulations.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"A school practice can be educationally justified when it meaningfully improves learning outcomes and skills, even if it is not explicitly required by AP Biology/NGSS.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Non-requirement by standards does not remove the justification for dissection when it provides real educational benefits.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Over 98% of dissected animals were already deceased before being used in classrooms.\",\n            \"Fetal pigs used in dissection are meat industry byproducts destined for landfills.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Classroom dissection largely uses already-deceased/byproduct animals, making it a productive use of dead animals rather than a major driver of wild-capture harms.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection meaningfully improves students’ biology learning experience and builds key scientific skills.\",\n            \"Real-animal dissection provides unique, curriculum-relevant learning advantages over alternatives.\",\n            \"Non-requirement by standards does not remove the justification for dissection when it provides real educational benefits.\",\n            \"Classroom dissection largely uses already-deceased/byproduct animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should dissect animals as part of biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection meaningfully improves students’ biology learning experience and builds key scientific skills.\",\n      \"Real-animal dissection provides unique, curriculum-relevant learning advantages over alternatives like models or simulations.\",\n      \"Non-requirement by standards does not remove the justification for dissection when it provides real educational benefits.\",\n      \"Classroom dissection largely uses already-deceased/byproduct animals, making it a productive use of dead animals rather than a major driver of wild-capture harms.\",\n      \"Students should dissect animals as part of biology education.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 510, "y": 140}}, {"data": {"id": "e-arg-10b5b90897", "source": "arg-10b5b90897", "target": "arg-1499366fa7", "ls": "solid", "label": "rebut", "detail": "arg-10b5b90897 (AG1 defeat) → arg-1499366fa7\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect
