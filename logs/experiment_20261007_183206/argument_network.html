 animals."}}, {"data": {"id": "arg-1cfb78f3a1", "kind": "main", "label": "AG1 main\nYes—students should dissect animals as p", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"arg-1cfb78f3a1\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"overruled\",\n  \"closed_by_budget\": false\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In classroom dissection, students directly manipulate real animal tissues, which builds fine motor skills.\",\n            \"That same real manipulation improves students’ hand-eye coordination.\",\n            \"Dissection also requires careful real-time observation and procedure that develops critical thinking.\",\n            \"Synthetic models/computer simulations mainly provide representations rather than the same real tissue manipulation experience.\"\n          ],\n          \"weak_negation\": [\n            \"No evidence shows synthetic models/computer simulations teach fine-motor/hand-eye coordination and procedure-based critical thinking at least as well as real dissection in comparable school settings.\"\n          ]\n        },\n        \"consequent\": \"Real-animal dissection provides a compensating unique educational advantage over common alternatives (skill learning beyond passive instruction).\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Over 98% of the animals used for classroom dissection were already deceased before being used in class.\",\n            \"Fetal pigs used for dissection are meat-industry byproducts destined for disposal (e.g., landfill) rather than primarily live-captured animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The animal-sourcing basis for school dissection is largely already-deceased/byproduct rather than wild-capture-driven.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The “NO” side’s sourcing-harm rationale depends on wild-capture being the dominant source (about ~99% being caught in the wild) that drives biodiversity/environment harms.\",\n            \"School dissection uses animals that are over 98% already-deceased before classroom use.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Because wild-capture is not the dominant source, the sourcing-harm pattern supporting “students should not dissect animals” is not supported in the integrated decision rule.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Real-animal dissection provides a compensating unique educational advantage over common alternatives (skill learning beyond passive instruction).\",\n            \"The animal-sourcing basis for school dissection is largely already-deceased/byproduct rather than wild-capture-driven.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Yes—students should dissect animals as part of biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"Real-animal dissection provides a compensating unique educational advantage over common alternatives (skill learning beyond passive instruction).\",\n      \"The animal-sourcing basis for school dissection is largely already-deceased/byproduct rather than wild-capture-driven.\",\n      \"Because wild-capture is not the dominant source, the sourcing-harm pattern supporting “students should not dissect animals” is not supported in the integrated decision rule.\",\n      \"Yes—students should dissect animals as part of biology education.\"\n    ],\n    \"Ass\": [\n      \"No evidence shows synthetic models/computer simulations teach fine-motor/hand-eye coordination and procedure-based critical thinking at least as well as real dissection in comparable school settings.\"\n    ]\n  }\n}"}, "position": {"x": 680.0, "y": 0}}, {"data": {"id": "arg-297c5e7149", "kind": "defeat", "label": "AG2 defeat\nTherefore, real-animal dissection is not", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-297c5e7149\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-1cfb78f3a1\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Real-animal dissection provides a compensating unique educational advantage over common alternatives (skill learning beyond passive instruction).\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations teach biology concepts with at least equal effectiveness to dead-animal dissection.\",\n            \"Students learn just as well or better with alternatives versus dead animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Real-animal dissection does not provide a uniquely compensating educational advantage over common alternatives for required biology learning outcomes.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"AP Biology and NGSS do not require animal dissection to meet the biology learning objectives they specify.\",\n            \"There are effective alternatives that let students reach those learning objectives.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Because dissection is not required to achieve the stated objectives and alternatives can reach them, any claimed “skill learning beyond passive instruction” is not an educationally necessary, uniquely compensating justification.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of dissection animals are caught in the wild.\",\n            \"Wild-catching decreases local populations and reduces biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal sourcing for dissection carries substantial inhumane and environmental harms rather than being meaningfully offset by already-deceased/byproduct use.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Real-animal dissection does not provide a uniquely compensating educational advantage over common alternatives for required biology learning outcomes.\",\n            \"Animal sourcing for dissection carries substantial inhumane and environmental harms.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, real-animal dissection is not justified by a compensating unique educational advantage.\"\n      }\n    ],\n    \"Conc\": [\n      \"Real-animal dissection does not provide a uniquely compensating educational advantage over common alternatives for required biology learning outcomes.\",\n      \"Because dissection is not required to achieve the stated objectives and alternatives can reach them, any claimed “skill learning beyond passive instruction” is not an educationally necessary, uniquely compensating justification.\",\n      \"Animal sourcing for dissection carries substantial inhumane and environmental harms rather than being meaningfully offset by already-deceased/byproduct use.\",\n      \"Therefore, real-animal dissection is not justified by a compensating unique educational advantage.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 680, "y": 140}}, {"data": {"id": "e-arg-297c5e7149", "source": "arg-297c5e7149", "target": "arg-1cfb78f3a1", "ls": "solid", "label": "rebut", "detail": "arg-297c5e7149 (AG2 defeat) → arg-1cfb78f3a1\nattack: rebut\ntarget_field: Conc\ntarget_statement: Real-animal dissection provides a compensating unique educational advantage over common alternatives (skill learning beyond passive instruction)."}}, {"data": {"id": "arg-b22c3b7f30", "kind": "main", "label": "AG2 main\nStudents should not dissect animals in b", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"arg-b22c3b7f30\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"overruled\",\n  \"closed_by_budget\": false\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations are designed to be repeatable (students can retry steps and re-run activities without exhausting a single specimen).\",\n            \"Synthetic models and computer simulations teach biology concepts with at least equal effectiveness to dead-animal dissection (students learn just as well or better with alternatives versus dead animals).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternatives can provide procedural practice and learning at least as effectively as one-time dead-animal dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"If alternatives enable at least equally effective procedural learning, then real-animal dissection does not supply a compensating unique educational need beyond what alternatives already deliver.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Real-animal dissection is educationally avoidable and lacks a compensating unique learning justification over alternatives.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of dissection animals are caught in the wild (not already dead by default).\",\n            \"Wild-catching decreases local populations and reduces biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Requiring animal dissection is associated with inhumane sourcing and biodiversity/environmental harm.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"A practice that is educationally avoidable (alternatives work at least as well) does not justify proceeding when it causes inhumane sourcing and biodiversity/environmental harm.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals in biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"Alternatives can provide procedural practice and learning at least as effectively as one-time dead-animal dissection.\",\n      \"Real-animal dissection is educationally avoidable and lacks a compensating unique learning justification over alternatives.\",\n      \"Requiring animal dissection is associated with inhumane sourcing and biodiversity/environmental harm.\",\n      \"Students should not dissect animals in biology education.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 935.0, "y": 0}}, {"data": {"id": "arg-d7fb2139a1", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals as part ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-d7fb2139a1\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-b22c3b7f30\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals in biology education.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Real animal dissection requires students to manipulate real tissues and respond to real-time, irreversible physical feedback under natural anatomical variability.\",\n            \"Real dissection training builds fine motor skills and hand-eye coordination and engages procedure-based critical thinking through those real constraints.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Real dissection provides procedural learning outcomes that depend on fine-motor handling plus non-repairable, real-time tissue constraints.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations provide representations rather than the full fine-motor, tactile, and non-repairable tissue constraints of real dissection.\",\n            \"Such representations typically allow repeated attempts without the same exhaustion/irreversibility effects that occur with one real specimen.\"\n          ],\n          \"weak_negation\": [\n            \"No evidence shows that common alternatives teach fine-motor handling, hand-eye coordination, and non-repairable procedural adaptation at least as effectively as real dissection in comparable school settings.\"\n          ]\n        },\n        \"consequent\": \"Alternatives generally do not provide procedural practice and learning at least as effectively as one-time dead-animal dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"If alternatives do not provide procedural learning at least as effectively as dissection, then dissection remains educationally relevant rather than educationally avoidable in the sense the target claims.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Real-animal dissection supplies a compensating educational role beyond what alternatives deliver.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In school dissection, over 98% of the animals used were already deceased before classroom use.\",\n            \"Fetal pigs used in dissection are meat-industry byproducts destined for landfills.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"School dissection is largely a productive use of already-deceased/byproduct animals, limiting wild-capture-driven sourcing harms.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Real-animal dissection supplies compensating educational role beyond alternatives.\",\n            \"School dissection is largely a productive use of already-deceased/byproduct animals that limits sourcing harms.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should dissect animals as part of biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"Real dissection provides procedural learning outcomes that depend on fine-motor handling plus non-repairable, real-time tissue constraints.\",\n      \"Alternatives generally do not provide procedural practice and learning at least as effectively as one-time dead-animal dissection.\",\n      \"Real-animal dissection supplies a compensating educational role beyond what alternatives deliver.\",\n      \"School dissection is largely a productive use of already-deceased/byproduct animals, limiting wild-capture-driven sourcing harms.\",\n      \"Students should dissect animals as part of biology education.\"\n    ],\n    \"Ass\": [\n      \"No evidence shows that common alternatives teach fine-motor handling, hand-eye coordination, and non-repairable procedural adaptation at least as effectively as real dissection in comparable school settings.\"\n    ]\n  }\n}"}, "position": {"x": 850, "y": 140}}, {"data": {"id": "e-arg-d7fb2139a1", "source": "arg-d7fb2139a1", "target": "arg-b22c3b7f30", "ls": "solid", "label": "rebut", "detail": "arg-d7fb2139a1 (AG1 defeat) → arg-b22c3b7f30\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals in biology education."}}, {"data": {"id": "arg-924069e46d", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals as part ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-924069e46d\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-b22c3b7f30\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals in biology education.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In classroom dissection, over 98% of the animals used were already deceased before classroom use.\",\n            \"Fetal pigs used in dissection are meat-industry byproducts destined for landfills.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"School dissection largely relies on already-deceased/byproduct animals rather than live wild-caught sourcing.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Substantial inhumane sourcing and biodiversity/environmental harm in dissection procurement mainly arise from relying on live wild capture rather than already-deceased/byproduct animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"If procurement largely avoids live wild capture, then dissection is not expected to be associated with substantial inhumane sourcing and biodiversity/environmental harm.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is a valuable part of teaching biology because it gives students direct, hands-on learning opportunities.\",\n            \"Dissection practice develops fine motor skills, hand-eye coordination, and critical thinking through careful real observation and procedure.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection provides meaningful educational benefits for school biology.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection provides meaningful educational benefits for school biology.\",\n            \"Dissection is not expected to be associated with substantial inhumane sourcing and biodiversity/environmental harm because it largely uses already-deceased/byproduct animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection is a justified educational practice in schools (benefits outweigh the harms cited by the opposing view).\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection is a justified educational practice in schools.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should dissect animals as part of biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"School dissection largely relies on already-deceased/byproduct animals rather than live wild-caught sourcing.\",\n      \"If procurement largely avoids live wild capture, then dissection is not expected to be associated with substantial inhumane sourcing and biodiversity/environmental harm.\",\n      \"Dissection provides meaningful educational benefits for school biology.\",\n      \"Dissection is a justified educational practice in schools (benefits outweigh the harms cited by the opposing view).\",\n      \"Students should dissect animals as part of biology education.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 1020, "y": 140}}, {"data": {"id": "e-arg-924069e46d", "source": "arg-924069e46d", "target": "arg-b22c3b7f30", "ls": "solid", "label": "rebut", "detail": "arg-924069e46d (AG1 defeat) → arg-b22c3b7f30\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals in biology education."}}, {"data": {"id": "arg-b18cce6164", "kind": "main", "label": "AG1 main\n(No-op)", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-b18cce6164\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection gives students direct, hands-on learning opportunities.\",\n            \"Hands-on experiences can create engaging ‘aha moments.’\",\n            \"Engaging hands-on science experiences can increase students’ interest in pursuing science-related careers.\",\n            \"Dissection practice is careful and procedure-based, which is the kind of real engagement that can make ‘aha moments’ concrete rather than purely abstract.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Real-animal dissection can uniquely produce engaging ‘aha’ experiences that translate into increased motivation and science-career interest (an educational benefit beyond passive learning).\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations provide learning largely through representations rather than real-tissue engagement.\",\n            \"A uniquely educationally compensating justification requires that alternatives are not shown to deliver the same compensating benefit.\"\n          ],\n          \"weak_negation\": [\n            \"No evidence shows that alternatives (models/simulations) generate ‘aha moments’ that translate into increased motivation/science-career interest at least as effectively as real dissection in comparable school settings.\"\n          ]\n        },\n        \"consequent\": \"Alternatives have not been shown to match dissection’s compensating motivational/career-learning advantage.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"If dissection uniquely produces a compensating educational benefit (skills/engagement beyond passive learning) and alternatives are not shown to match that benefit, then the educational case for dissection is not an avoidable practice.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Real-animal dissection is educationally non-avoidable because it offers a compensating unique advantage over common alternatives.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In classroom dissection, over 98% of the animals used were already deceased before classroom use.\",\n            \"Fetal pigs used in dissection are meat-industry byproducts destined for disposal (e.g., landfill).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The animal-use basis for school dissection is largely already-deceased/byproduct rather than requiring live wild-capture animals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"When animal-use is largely already-deceased/byproduct, the animal-sourcing harms central to opposition (from acquiring live animals) are largely avoided.\"\n          ],\n          \"weak_negation\": [\n            \"No evidence shows that school dissection procurement primarily depends on large-scale live wild capture despite the >98% already-deceased/byproduct rate.\"\n          ]\n        },\n        \"consequent\": \"Animal sourcing is ethically/environmentally justified enough to balance the educational benefits cited for dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Real-animal dissection is educationally non-avoidable because it offers a compensating unique advantage over common alternatives.\",\n            \"Animal sourcing for school dissection is largely already-deceased/byproduct and thus ethically/environmentally justified.\",\n            \"If both educational non-avoidability and ethical sourcing justification are supported, then students should dissect animals as part of biology education.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Yes—students should dissect animals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [],\n          \"weak_negation\": [\n            \"\"\n          ]\n        },\n        \"consequent\": \"(No-op)\"\n      }\n    ],\n    \"Conc\": [\n      \"Real-animal dissection can uniquely produce engaging ‘aha’ experiences that translate into increased motivation and science-career interest (an educational benefit beyond passive learning).\",\n      \"Alternatives have not been shown to match dissection’s compensating motivational/career-learning advantage.\",\n      \"Real-animal dissection is educationally non-avoidable because it offers a compensating unique advantage over common alternatives.\",\n      \"The animal-use basis for school dissection is largely already-deceased/byproduct rather than requiring live wild-capture animals.\",\n      \"Animal sourcing is ethically/environmentally justified enough to balance the educational benefits cited for dissection.\",\n      \"Yes—students should dissect animals.\",\n      \"(No-op)\"\n    ],\n    \"Ass\": [\n      \"No evidence shows that alternatives (models/simulations) generate ‘aha moments’ that translate into increased motivation/science-career interest at least as effectively as real dissection in comparable school settings.\",\n      \"No evidence shows that school dissection procurement primarily depends on large-scale live wild capture despite the >98% already-deceased/byproduct rate.\"\n    ]\n  }\n}"}, "position": {"x": 1190.0, "y": 0}}, {"data": {"id": "arg-8ebb055192", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals in b", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-8ebb055192\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-b18cce6164\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"No evidence shows that school dissection procurement primarily depends on large-scale live wild capture despite the >98% already-deceased/byproduct rate.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of dissection animals are caught in the wild (i.e., not already dead by default).\",\n            \"If ~99% of the animals used in dissection are wild-caught, then dissection procurement primarily relies on live wild capture rather than largely avoiding it.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"School dissection procurement primarily depends on live wild capture.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"School dissection procurement primarily depends on live wild capture.\",\n            \"Wild-catching decreases local populations and reduces biodiversity.\",\n            \"Wild-capture sourcing is inhumane.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Requiring dissection in schools entails inhumane animal sourcing and biodiversity/environmental harm.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"AP Biology and NGSS do not require animal dissection to achieve their specified learning objectives.\",\n            \"Synthetic models and computer simulations teach biology concepts with at least equal effectiveness to dead-animal dissection, and students learn just as well or better with alternatives.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"There is no curriculum-necessary educational need to use real animals for dissection when effective alternatives exist.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Requiring dissection in schools entails inhumane animal sourcing and biodiversity/environmental harm.\",\n            \"There is no curriculum-necessary educational need to use real animals for dissection when effective alternatives exist.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals in biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"School dissection procurement primarily depends on live wild capture.\",\n      \"Requiring dissection in schools entails inhumane animal sourcing and biodiversity/environmental harm.\",\n      \"There is no curriculum-necessary educational need to use real animals for dissection when effective alternatives exist.\",\n      \"Students should not dissect animals in biology education.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 1190.0, "y": 140}}, {"data": {"id": "e-arg-8ebb055192", "source": "arg-8ebb055192", "target": "arg-b18cce6164", "ls": "dashed", "label": "undercut", "detail": "arg-8ebb055192 (AG2 defeat) → arg-b18cce6164\nattack: undercut\ntarget_field: Ass\ntarget_statement: No evidence shows that school dissection procurement primarily depends on large-scale live wild capture despite the >98% already-deceased/byproduct rate."}}, {"data": {"id": "arg-ab5d6d4906", "kind": "counter", "label": "AG1 counter\nThe sourcing-based premise driving the ‘", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-ab5d6d4906\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-8ebb055192\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"School dissection procurement primarily depends on live wild capture.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In classroom dissection, over 98% of the animals used were already deceased before being used in class.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"For the vast majority (>98%) of classroom specimens, procurement did not involve obtaining live animals for dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"If an animal was already deceased before classroom use, then live wild capture is not the procurement method for that animal.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Thus, live wild capture cannot account for the majority of animals used in school dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Live wild capture cannot account for the majority of animals used in school dissection.\",\n            \"‘Primarily depends’ means the method accounts for the majority of the relevant procurement.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"School dissection procurement does not primarily depend on live wild capture.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"School dissection procurement does not primarily depend on live wild capture.\",\n            \"The opponent’s undercut relies on the opposite—that procurement primarily depends on live wild capture (to ground sourcing harms).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The sourcing-based premise driving the ‘should not dissect’ conclusion is not supported as stated.\"\n      }\n    ],\n    \"Conc\": [\n      \"For the vast majority (>98%) of classroom specimens, procurement did not involve obtaining live animals for dissection.\",\n      \"Thus, live wild capture cannot account for the majority of animals used in school dissection.\",\n      \"School dissection procurement does not primarily depend on live wild capture.\",\n      \"The sourcing-based premise driving the ‘should not dissect’ conclusion is not supported as stated.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 1190, "y": 280}}, {"data": {"id": "e-arg-ab5d6d4906", "source": "arg-ab5d6d4906", "target": "arg-8ebb055192", "ls": "solid", "label": "rebut", "detail": "arg-ab5d6d4906 (AG1 counter) → arg-8ebb055192\nattack: rebut\ntarget_field: Conc\ntarget_statement: School dissection procurement primarily depends on live wild capture."}}, {"data": {"id": "arg-b738ad2233", "kind": "main", "label": "AG2 main\nStudents should not dissect animals.", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-b738ad2233\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Wild capture involves capturing live animals from the wild, and those animals can still be dead by the time they are used in dissection.\",\n            \"Wild-catching decreases local populations and reduces biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Even if animals are already dead when used, their wild-capture origin is still associated with biodiversity/environmental loss.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of dissection animals are caught in the wild.\",\n            \"Even if animals are already dead when used, their wild-capture origin is still associated with biodiversity/environmental loss.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection is associated with inhumane sourcing and biodiversity/environmental harm despite any “already deceased” status.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Medical studies do not require or benefit from animal dissection for their goals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection is not scientifically necessary or beneficial for medical research purposes.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"AP Biology and NGSS do not require animal dissection to meet their specified learning objectives.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection is not required to achieve mandated school biology learning objectives.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is not scientifically necessary or beneficial for medical research purposes.\",\n            \"Animal dissection is not required to achieve mandated school biology learning objectives.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"There is no compensating educational/scientific need to justify using real animals for dissection in schools.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations teach biology concepts with at least equal effectiveness to dead-animal dissection.\",\n            \"Students learn just as well or better with alternatives versus dead animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students can meet biology learning objectives without real-animal dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"There is no compensating educational/scientific need to justify using real animals for dissection in schools.\",\n            \"Students can meet biology learning objectives without real-animal dissection.\",\n            \"Animal dissection is associated with inhumane sourcing and biodiversity/environmental harm despite any “already deceased” status.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals.\"\n      }\n    ],\n    \"Conc\": [\n      \"Even if animals are already dead when used, their wild-capture origin is still associated with biodiversity/environmental loss.\",\n      \"Animal dissection is associated with inhumane sourcing and biodiversity/environmental harm despite any “already deceased” status.\",\n      \"Animal dissection is not scientifically necessary or beneficial for medical research purposes.\",\n      \"Animal dissection is not required to achieve mandated school biology learning objectives.\",\n      \"There is no compensating educational/scientific need to justify using real animals for dissection in schools.\",\n      \"Students can meet biology learning objectives without real-animal dissection.\",\n      \"Students should not dissect animals.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 1360.0, "y": 0}}, {"data": {"id": "arg-a5a377975d", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals as part ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-a5a377975d\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-b738ad2233\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In classroom dissection, over 98% of the animals used were already deceased before classroom use.\",\n            \"Fetal pigs used in dissection are meat-industry byproducts destined for landfills.\"\n          ],\n          \"weak_negation\": [\n            \"No evidence shows classroom dissection procurement materially depends on large-scale live wild capture beyond these already-deceased/byproduct rates.\"\n          ]\n        },\n        \"consequent\": \"School dissection largely relies on already-deceased/meat-byproduct animals rather than depending primarily on live wild capture.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Wild-capture biodiversity/environmental harms are primarily a concern when live wild capture is the dominant procurement source.\",\n            \"School dissection largely relies on already-deceased/meat-byproduct animals rather than depending primarily on live wild capture.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The target’s biodiversity/environmental objection based on wild capture is not decisive for most school dissection cases.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection gives students direct, hands-on learning opportunities.\",\n            \"Dissection practice develops fine motor skills and hand-eye coordination, and it requires careful observation and procedure that builds critical thinking.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection meaningfully improves students’ biology learning experience and builds key scientific skills beyond passive learning.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Engaging hands-on science experiences can create concrete ‘aha moments.’\",\n            \"Hands-on dissection can provide that concrete engagement by involving real biological tissues and procedures.\"\n          ],\n          \"weak_negation\": [\n            \"No evidence shows that common alternatives (models/simulations) generate motivation/career-interest ‘aha moments’ and procedure-based skill gains at least as effectively in comparable school settings.\"\n          ]\n        },\n        \"consequent\": \"Dissection provides a compensating educational benefit that alternatives have not been shown to match.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target’s biodiversity/environmental objection is not decisive for most school dissection cases.\",\n            \"Dissection meaningfully improves learning and builds key skills, and provides compensating educational benefits beyond what alternatives have been shown to match.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should dissect animals as part of biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"School dissection largely relies on already-deceased/meat-byproduct animals rather than depending primarily on live wild capture.\",\n      \"The target’s biodiversity/environmental objection based on wild capture is not decisive for most school dissection cases.\",\n      \"Dissection meaningfully improves students’ biology learning experience and builds key scientific skills beyond passive learning.\",\n      \"Dissection provides a compensating educational benefit that alternatives have not been shown to match.\",\n      \"Students should dissect animals as part of biology education.\"\n    ],\n    \"Ass\": [\n      \"No evidence shows classroom dissection procurement materially depends on large-scale live wild capture beyond these already-deceased/byproduct rates.\",\n      \"No evidence shows that common alternatives (models/simulations) generate motivation/career-interest ‘aha moments’ and procedure-based skill gains at least as effectively in comparable school settings.\"\n    ]\n  }\n}"}, "position": {"x": 1360, "y": 140}}, {"data": {"id": "e-arg-a5a377975d", "source": "arg-a5a377975d", "target": "arg-b738ad2233", "ls": "solid", "label": "rebut", "detail": "arg-a5a377975d (AG1 defeat) → arg-b738ad2233\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals."}}, {"data": {"id": "end-arg-691f2d307d", "label": "終了: overruled（反論できず敗北）", "detail": "終了: overruled（反論できず敗北）"}, "position": {"x": 0, "y": 406.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-691f2d307d", "source": "end-arg-691f2d307d", "target": "arg-d06b727d49", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-fb0d0ff118", "label": "終了: overruled（反論できず敗北）", "detail": "終了: overruled（反論できず敗北）"}, "position": {"x": 170, "y": 556.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-fb0d0ff118", "source": "end-arg-fb0d0ff118", "target": "arg-970476c180", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-242609590b", "label": "終了: overruled（反論できず敗北）\nAG1 反論なし: Repeats a reason I already used (closest earlier argument: arg-691f2d307d); there is no new reason to add.", "detail": "終了: overruled（反論できず敗北）\nAG1 反論なし: Repeats a reason I already used (closest earlier argument: arg-691f2d307d); there is no new reason to add."}, "position": {"x": 340, "y": 706.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-242609590b", "source": "end-arg-242609590b", "target": "arg-f4abc5a171", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-1499366fa7", "label": "終了: overruled（反論できず敗北）\nAG2 反論なし: Any substantive counter to AG1’s claims in arg-10b5b90897 (that dissection provides unique learning benefits, that byproducts avoid major harms, and that non-requirement doesn’t matter) would rely on …", "detail": "終了: overruled（反論できず敗北）\nAG2 反論なし: Any substantive counter to AG1’s claims in arg-10b5b90897 (that dissection provides unique learning benefits, that byproducts avoid major harms, and that non-requirement doesn’t matter) would rely on the same core grounds already used in my earlier argument arg-1499366fa7—(1) AP/NGSS and medical training don’t require dissection, (2) alternatives can achieve the learning goals without animals, and (3) dissection supply is inhumane and environmentally harmful. Because that would be substantially repetitive under the non-repetition constraint, I cannot construct a non-repeating counterargument that can defeat the target."}, "position": {"x": 510, "y": 856.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-1499366fa7", "source": "end-arg-1499366fa7", "target": "arg-10b5b90897", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-1cfb78f3a1", "label": "終了: overruled（反論できず敗北）\nAG1 反論なし: To defeat the target (arg-297c5e7149) we would need to rebut its core substantive claims: (i) that synthetic models/simulations are at least as effective for biology learning outcomes and thus dissect…", "detail": "終了: overruled（反論できず敗北）\nAG1 反論なし: To defeat the target (arg-297c5e7149) we would need to rebut its core substantive claims: (i) that synthetic models/simulations are at least as effective for biology learning outcomes and thus dissection lacks a uniquely compensating educational advantage, and (ii) that dissection’s sourcing causes substantial harms because ~99% are wild-caught. Any rebut that directly addresses these premises would rely on the same substantive grounds I already used in my prior main argument (arg-1cfb78f3a1)—the real-tissue hands-on educational advantage and the largely already-deceased/byproduct sourcing basis—and any alternative would require introducing a new ground from my stance that isn’t available. Under the non-repetition constraint, that blocks constructing a permissible counterargument that could defeat this specific attack."}, "position": {"x": 680, "y": 1006.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-1cfb78f3a1", "source": "end-arg-1cfb78f3a1", "target": "arg-297c5e7149", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-b22c3b7f30", "label": "終了: overruled（反論できず敗北）\nAG2 反論なし: Target [14] has already been defeated in this thread by my earlier main argument [13]. Substantively, I hold that school animal dissection is not educationally necessary (AP/NGSS objectives can be met…", "detail": "終了: overruled（反論できず敗北）\nAG2 反論なし: Target [14] has already been defeated in this thread by my earlier main argument [13]. Substantively, I hold that school animal dissection is not educationally necessary (AP/NGSS objectives can be met using alternatives that teach at least as effectively), while the practice is still associated with inhumane sourcing and environmental harms because most dissection animals are wild-caught, which reduces local populations and biodiversity—so students should not dissect animals."}, "position": {"x": 1020, "y": 1156.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-b22c3b7f30", "source": "end-arg-b22c3b7f30", "target": "arg-924069e46d", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-b18cce6164", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 1190, "y": 1306.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-b18cce6164", "source": "end-arg-b18cce6164", "target": "arg-ab5d6d4906", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-b738ad2233", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 1360, "y": 1456.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-b738ad2233", "source": "end-arg-b738ad2233", "target": "arg-a5a377975d", "ls": "dotted", "inferred": 1}}, {"data": {"id": "nomain-AG1", "label": "AG1: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 1530, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 1530, "y": 84.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>20<\/td><\/tr><tr><td>attack_turn_count<\/td><td>12<\/td><\/tr><tr><td>main_argument_count<\/td><td>8<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>6<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.184522<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Students generally **should not dissect animals** in school biology. **Dissection should only be used conditionally**, when **both** of these conditions are satisfied:\n\n1) **Sourcing / harm condition (Condition A):** The school must be able to substantiate that the animals used are **predominantly already-deceased and/or byproducts** (i.e., not primarily obtained through live wild-capture).  \n   - If credible evidence shows procurement is **mostly already-deceased/byproduct**, then the sourcing-based ethical/environmental objections are treated as **substantially reduced**.  \n   - If credible evidence shows procurement is **predominantly wild-caught**, then dissection is **not justified**.\n\n2) **Educational necessity condition (Condition B):** The school must be able to show that dissection provides a **demonstrable unique educational advantage** over the **specific** alternatives being used (e.g., synthetic models/computer simulations) in that curriculum—especially regarding the pro-dissection claims about **real-tissue structure–function understanding** and **procedural/adaptive reasoning under non-repairable constraints** (not just “hands-on” in general).\n\n### Default policy implication\n- If dissection is being treated as a **default/traditional** activity rather than something meeting the two conditions above, then the appropriate choice is: **use non-animal alternatives**.\n\n### Unresolved points that affect the decision\nThe record doesn’t definitively settle:\n1) **Which sourcing pattern is truly dominant in practice** (whether most animals are closer to “already-deceased/byproduct” vs. “wild-caught”).  \n2) **How well alternatives match dissection** for the specific claimed benefits—particularly **fine-motor/tactile learning** and **adaptive reasoning**—in realistic school settings.\n\n**Bottom line:** Follow a **non-dissection default**, and allow dissection only if the school can meet **both** the sourcing/harm threshold and the requirement for **unique, demonstrated educational benefit** over alternatives.<\/pre><\/details><div>justification_status: <b>fallback_full_dialogue_synthesis<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}]}, "election_day": {"no_schema": [{"run": 1, "question": "Should Election Day Be a National Holiday?", "elements": [{"data": {"id": "arg-5b438e9651", "kind": "main", "label": "AG1 main\nElection Day should be a national holida", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"arg-5b438e9651\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"overruled\",\n  \"closed_by_budget\": false\n}\n\nElection Day should be a national holiday because the biggest practical barrier to voting for millions of Americans is scheduling: people have school, work, and caregiving obligations that make it hard or impossible to take time off to vote. Making Election Day an official holiday would directly remove those time constraints, lowering the cost of participation and making voting possible for more people.\n\nMoreover, treating Election Day as a celebration—not a chore—helps reinforce the importance of civic participation and democracy, encouraging turnout beyond those already motivated or able to fit voting into their existing routines.\n\nThis approach also has broad political support: 71% of Democrats and 59% of Republicans support Election Day as a holiday. And it aligns with how voting is handled internationally, since 27 of 36 OECD countries hold elections on weekends or holidays—suggesting this is a workable policy design rather than an outlier."}, "position": {"x": 0.0, "y": 0}}, {"data": {"id": "arg-7dd576f0fe", "kind": "defeat", "label": "AG2 defeat\nA national Election Day holiday would no", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-7dd576f0fe\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-5b438e9651\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"Making Election Day an official holiday would directly remove those time constraints, lowering the cost of participation and making voting possible for more people.\"\n}\n\nA national Election Day holiday would not “directly remove those time constraints” for millions of voters in practice. Federal holiday designation primarily affects federal workplaces; it does not require private employers—especially in retail, service, and other low-wage sectors—to close or provide paid time off. Many of the people most constrained by work schedules are precisely those employed by private firms, and they can face wage loss or staffing requirements that keep them working even when Election Day is a holiday. \n\nSo the scheduling barrier the target highlights would remain for a large share of low-income workers, meaning an election holiday would not reliably lower their cost of participation. Because the policy would be unevenly effective—helping some workers while leaving many others still needing to choose between work and voting—I oppose making Election Day a national holiday, and would instead favor approaches like state laws guaranteeing time off to vote and reforms that improve registration/access."}, "position": {"x": 0, "y": 140}}, {"data": {"id": "e-arg-7dd576f0fe", "source": "arg-7dd576f0fe", "target": "arg-5b438e9651", "ls": "dashed", "label": "undercut", "detail": "arg-7dd576f0fe (AG2 defeat) → arg-5b438e9651\nattack: undercut\ntarget_field: Ass\ntarget_statement: Making Election Day an official holiday would directly remove those time constraints, lowering the cost of participation and making voting possible for more people."}}, {"data": {"id": "arg-0491fc9233", "kind": "main", "label": "AG2 main\nA national Election Day holiday should n", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"arg-0491fc9233\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"overruled\",\n  \"closed_by_budget\": false\n}\n\nA national Election Day holiday should not be adopted because, by itself, it is not a reliable turnout strategy. The key practical reason is that election-day scheduling is only one contributor to low turnout; other access barriers—such as registration problems, deadlines, and obstacles in how people can obtain and use ballots (e.g., limited options for voting outside Election Day)—can still prevent many eligible voters from participating even if the calendar is changed.\n\nResearch summarized by my stance indicates that simply adding a holiday does not meaningfully increase turnout compared with other voting-access reforms that directly reduce specific constraints on voters. In contrast, targeted reforms—like automatic voter registration and state-level changes that ensure voters can take time off to vote—are more dependable because they address concrete failure points in the voting process rather than assuming that a single scheduling fix will overcome all barriers.\n\nTherefore, making Election Day a national holiday is a low-return policy that risks diverting attention from reforms with more measurable turnout impact; I oppose the proposal."}, "position": {"x": 170.0, "y": 0}}, {"data": {"id": "arg-5555864e52", "kind": "defeat", "label": "AG1 defeat\nA national Election Day holiday *should*", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-5555864e52\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-0491fc9233\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"A national Election Day holiday should not be adopted because, by itself, it is not a reliable turnout strategy.\"\n}\n\nA national Election Day holiday *should* be adopted because the scheduling constraint is not a minor, removable detail—it is one of the biggest reasons people can’t vote. When people face school, work, and caregiving obligations, they often can’t take time off or reliably coordinate voting around their shifts. Designating Election Day as a holiday directly reduces that time cost, so it enables turnout for the many voters whose primary problem is not registration or ballot access mechanics but the inability to get time away.\n\nEven if other barriers (deadlines, registration issues, limited voting options) persist, that doesn’t make the holiday ineffective—it means the holiday won’t magically solve *every* barrier, not that it can’t increase turnout for those blocked by scheduling. In policy terms, removing a major constraint still yields participation gains even when other constraints remain.\n\nFinally, calling it “by itself” misses the point: a national holiday is compatible with—and can be pursued alongside—targeted reforms (like registration access and voting options). So the scheduling barrier removal remains a dependable, additive benefit, not a low-return distraction."}, "position": {"x": 170.0, "y": 140}}, {"data": {"id": "e-arg-5555864e52", "source": "arg-5555864e52", "target": "arg-0491fc9233", "ls": "solid", "label": "rebut", "detail": "arg-5555864e52 (AG1 defeat) → arg-0491fc9233\nattack: rebut\ntarget_field: Conc\ntarget_statement: A national Election Day holiday should not be adopted because, by itself, it is not a reliable turnout strategy."}}, {"data": {"id": "arg-99d85e62da", "kind": "counter", "label": "AG2 counter\nA national Election Day holiday does not", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-99d85e62da\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-5555864e52\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"Designating Election Day as a holiday directly reduces that time cost, enabling turnout for many voters who cannot get time away.\"\n}\n\nA national Election Day holiday does not reliably “directly reduce” the time cost of voting, because the time burden is not just the calendar date. To vote in person, people still must show up during polling hours and spend time traveling and—often most importantly—waiting while polls process voters. A holiday designation does not automatically extend polling hours, increase staffing, or create additional capacity to shorten waits.\n\nIn fact, making the day a holiday can concentrate voting on that single day, which can increase congestion and waiting time—negating the time savings for the voters AG1 is focused on. So the mechanism AG1 relies on (holiday → fewer time constraints → higher turnout) is not dependable in practice, and that is why Election Day should not be made a national holiday."}, "position": {"x": 170.0, "y": 280}}, {"data": {"id": "e-arg-99d85e62da", "source": "arg-99d85e62da", "target": "arg-5555864e52", "ls": "dashed", "label": "undercut", "detail": "arg-99d85e62da (AG2 counter) → arg-5555864e52\nattack: undercut\ntarget_field: Ass\ntarget_statement: Designating Election Day as a holiday directly reduces that time cost, enabling turnout for many voters who cannot get time away."}}, {"data": {"id": "arg-ad76350d93", "kind": "defeat", "label": "AG1 defeat\nEven if a holiday label doesn’t automati", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-ad76350d93\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-99d85e62da\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"A national Election Day holiday does not reliably “directly reduce” the time cost of voting, and the mechanism (holiday → fewer time constraints → higher turnout) is not dependable in practice.\"\n}\n\nEven if a holiday label doesn’t automatically extend polling hours or add staff, it still directly lowers a large component of “time cost”: the opportunity cost of missing work, school, or caregiving duties to get to the polls. On a holiday, many people are not required to be at work or in school, so voting time no longer competes with a shift or a school day in the first place.\n\nAlso, the target’s congestion concern cuts the wrong way for individual voters. If people are free throughout the day (because it’s a holiday), many can vote earlier or later rather than stacking mainly into the narrow after-work window. That reduces the likelihood that a voter’s personal waiting/travel time becomes the deciding factor.\n\nSo the “holiday → fewer scheduling constraints → higher ability to vote” mechanism is dependable for the very barrier my stance emphasizes: inability to take time away from work/school/caregiving. A holiday can therefore be a meaningful turnout-supporting policy, even though it isn’t the only reform needed for every barrier."}, "position": {"x": 170.0, "y": 420}}, {"data": {"id": "e-arg-ad76350d93", "source": "arg-ad76350d93", "target": "arg-99d85e62da", "ls": "solid", "label": "rebut", "detail": "arg-ad76350d93 (AG1 defeat) → arg-99d85e62da\nattack: rebut\ntarget_field: Conc\ntarget_statement: A national Election Day holiday does not reliably “directly reduce” the time cost of voting, and the mechanism (holiday → fewer time constraints → higher turnout) is not dependable in practice."}}, {"data": {"id": "arg-421c4989eb", "kind": "counter", "label": "AG2 counter\nA national holiday may reduce the work/s", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-421c4989eb\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-ad76350d93\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"So the “holiday → fewer scheduling constraints → higher ability to vote” mechanism is dependable for the very barrier my stance emphasizes: inability to take time away from work/school/caregiving. A holiday can therefore be a meaningful turnout-supporting policy.\"\n}\n\nA national holiday may reduce the work/school conflict for some people, but the target’s mechanism is still not dependable for the “can’t take time away” barrier because it bundles “work, school, or caregiving” together and then treats the holiday label as resolving that time competition. For many voters—especially in low-income households—caregiving obligations don’t disappear just because it’s a holiday. People often still must supervise children or other dependents throughout the day, and that can make voting time-dependent even when workplaces and schools are closed.\n\nSo even if voters are technically free from a shift or class schedule, the binding constraint for many remains caregiving time. That means fewer people can actually change their voting routine in response to the holiday, and waiting/travel still have to fit into the caregiving-constrained window. Because a national holiday does not reliably eliminate the time cost imposed by caregiving, it cannot reliably increase turnout in the way the target suggests."}, "position": {"x": 170.0, "y": 560}}, {"data": {"id": "e-arg-421c4989eb", "source": "arg-421c4989eb", "target": "arg-ad76350d93", "ls": "solid", "label": "rebut", "detail": "arg-421c4989eb (AG2 counter) → arg-ad76350d93\nattack: rebut\ntarget_field: Conc\ntarget_statement: So the “holiday → fewer scheduling constraints → higher ability to vote” mechanism is dependable for the very barrier my stance emphasizes: inability to take time away from work/school/caregiving. A holiday can therefore be a meaningful turnout-supporting policy."}}, {"data": {"id": "arg-14d10a9d3a", "kind": "defeat", "label": "AG1 defeat\nCaregiving obligations may not “disappea", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-14d10a9d3a\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-421c4989eb\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"the relevant constraint for many voters remains caregiving time even on a holiday—so a national Election Day holiday does not reliably eliminate the time cost imposed by caregiving and therefore cannot reliably increase turnout\"\n}\n\nCaregiving obligations may not “disappear,” but the target’s premise is that caregiving remains the binding, unchanged constraint even when the day is a holiday—so voters still can’t rearrange their voting routine.\n\nThat premise often doesn’t hold, because for many parents and caregivers the biggest day-to-day friction is not the existence of caregiving itself, but the *coverage problem* created by working/school schedules. When Election Day is a holiday, caregivers are no longer required to be at work or in school, so they can supervise dependents themselves *while* voting rather than needing to arrange paid or substitute coverage for the hours they’d otherwise miss. In that common situation, a holiday reduces the practical time cost of voting for caregivers: they gain a larger flexible window across the day and don’t have to trade off voting against maintaining dependable supervision arrangements.\n\nSo even if caregiving still matters, a national holiday can still meaningfully lower the real opportunity cost for a substantial share of would-be voters who are constrained by scheduling—undercutting the claim that the holiday therefore “cannot reliably” increase turnout due to caregiving remaining binding."}, "position": {"x": 170, "y": 700}}, {"data": {"id": "e-arg-14d10a9d3a", "source": "arg-14d10a9d3a", "target": "arg-421c4989eb", "ls": "dashed", "label": "undercut", "detail": "arg-14d10a9d3a (AG1 defeat) → arg-421c4989eb\nattack: undercut\ntarget_field: Ass\ntarget_statement: the relevant constraint for many voters remains caregiving time even on a holiday—so a national Election Day holiday does not reliably eliminate the time cost imposed by caregiving and therefore cannot reliably increase turnout"}}, {"data": {"id": "arg-4a4651ec34", "kind": "main", "label": "AG1 main\nElection Day should be a national holida", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"arg-4a4651ec34\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"overruled\",\n  \"closed_by_budget\": false\n}\n\nElection Day should be a national holiday because, in the policy design that makes the holiday meaningful, it reduces the dominant practical barrier for many would-be voters—difficulty getting time away from school, work, and caregiving—while avoiding the key concern that only federal employees would benefit.\n\nFirst, the practical “cost of participation” is largely scheduling/time-off: when voting competes with a work shift, a school day, or coverage needs for dependents, many people either cannot vote or must incur real losses (wages, childcare/coverage, or forced disruption). Making Election Day an official holiday can lower that time cost by creating a broad window to vote without forcing people to choose between voting and their daily obligations.\n\nSecond, the opponent’s objection—that a federal holiday alone doesn’t compel private employers (especially in retail/service) to give time off—can be addressed directly by the way the national holiday is enacted: a holiday can come with a required right to take paid time (or guaranteed no-wage-loss time) to vote. That design choice matters because it ensures the very low-income workers who most often face inflexible private-sector schedules actually receive real time away, instead of merely getting a different calendar date.\n\nThird, when this specific scheduling barrier is reduced, a holiday also serves as a civic celebration (not just another task), which can increase turnout beyond those already motivated to vote—so even if other barriers (like registration rules or ballot logistics) remain, meaningful marginal gains are still plausible.\n\nFinally, feasibility supports adoption: 71% of Democrats and 59% of Republicans support this measure, and 27 of 36 OECD countries hold elections on weekends or holidays, indicating that this kind of calendar/civic-participation approach is workable.\n\nTherefore, Election Day should be made a national holiday—implemented in a way that delivers real, enforceable time off—because it meaningfully lowers the scheduling barrier for millions and encourages civic participation as a shared democratic event."}, "position": {"x": 340.0, "y": 0}}, {"data": {"id": "arg-417b63badd", "kind": "defeat", "label": "AG2 defeat\nAG1 argues that the “only federal employ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-417b63badd\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-4a4651ec34\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"a national holiday can be enacted with a required right to take paid time (or guaranteed no-wage-loss time) to vote, ensuring the low-income workers most constrained by private-sector schedules receive real time away rather than just a different calendar date.\"\n}\n\nAG1 argues that the “only federal employees would benefit” problem can be addressed by how the holiday is enacted—i.e., the holiday can include a required right to take paid/no-wage-loss time to vote, ensuring low-income private-sector workers actually get time away. \n\nI oppose that assumption. A federal “holiday” designation by itself primarily changes schedules for government/federal workplaces; it does not automatically compel private employers (especially in retail and service) to close or provide paid or protected time off. Low-wage workers in private jobs—who are the most constrained by inflexible schedules—would still face wage loss or staffing pressures that keep them working unless there is a specific employer leave/voting-time-pay requirement. \n\nAnd if lawmakers do add that specific enforceable leave/voting-time-pay requirement, then the beneficial mechanism is the separate leave mandate (the same kind of reform I support at the state level), not the holiday calendar itself. That means making Election Day a national holiday is not a reliable way to deliver the promised time-off benefit to low-income workers."}, "position": {"x": 340.0, "y": 140}}, {"data": {"id": "e-arg-417b63badd", "source": "arg-417b63badd", "target": "arg-4a4651ec34", "ls": "dashed", "label": "undercut", "detail": "arg-417b63badd (AG2 defeat) → arg-4a4651ec34\nattack: undercut\ntarget_field: Ass\ntarget_statement: a national holiday can be enacted with a required right to take paid time (or guaranteed no-wage-loss time) to vote, ensuring the low-income workers most constrained by private-sector schedules receive real time away rather than just a different calendar date."}}, {"data": {"id": "arg-6f4665ad99", "kind": "counter", "label": "AG1 counter\nAG2 claims that a national holiday mainl", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-6f4665ad99\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-417b63badd\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"a federal “holiday” designation by itself primarily changes schedules for government/federal workplaces; it does not automatically compel private employers (especially in retail and service) to close or provide paid or protected time off\"\n}\n\nAG2 claims that a national holiday mainly shifts schedules for government workplaces and therefore can’t reliably help low-wage workers unless a separate voting-time-pay/leave mandate is added. I hold a more direct view: a *national* Election Day holiday changes the everyday scheduling baseline for large portions of the economy—not just federal offices—because schools and many workplaces align their calendars to public holidays.\n\nSo even without an added wage-protection mandate, for many voters the relevant scheduling barrier is that they would otherwise have to miss work/school time to vote. When Election Day is a public holiday, a substantial share of workers do not face the same need to be on the clock or in class that day, which reduces the opportunity cost of voting. That means the holiday calendar itself supplies real, not merely symbolic, scheduling relief.\n\nIn other words, AG2’s conclusion that “the beneficial mechanism is the separate leave mandate, not the holiday calendar itself” assumes the holiday does not materially change whether people must be working. That assumption is not warranted: the calendar change is the mechanism for many voters, and leave mandates (if added) can improve results further, but they aren’t the only pathway by which the holiday reduces time barriers."}, "position": {"x": 340.0, "y": 280}}, {"data": {"id": "e-arg-6f4665ad99", "source": "arg-6f4665ad99", "target": "arg-417b63badd", "ls": "dashed", "label": "undercut", "detail": "arg-6f4665ad99 (AG1 counter) → arg-417b63badd\nattack: undercut\ntarget_field: Ass\ntarget_statement: a federal “holiday” designation by itself primarily changes schedules for government/federal workplaces; it does not automatically compel private employers (especially in retail and service) to close or provide paid or protected time off"}}, {"data": {"id": "arg-79dc5393d2", "kind": "defeat", "label": "AG2 defeat\nAG1’s claim that a national Election Day", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-79dc5393d2\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-6f4665ad99\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"a substantial share of workers do not face the same need to be on the clock or in class that day, which reduces the opportunity cost of voting (i.e., the holiday calendar itself materially changes everyday scheduling for many voters).\"\n}\n\nAG1’s claim that a national Election Day holiday meaningfully changes the everyday scheduling baseline because schools and many workplaces align to public holidays overstates how much time pressure is actually removed for the voters most constrained by it.\n\nFirst, even if some schools close, that doesn’t guarantee that low-income workers—disproportionately employed in private retail/service and other operations that still run on holidays—can stop being “on the clock.” Without an enforceable paid leave or wage-protection requirement, private-employer scheduling can keep many workers working or facing wage loss if they miss shifts.\n\nSecond, school closure can worsen the practical timing problem for caregivers rather than solve it: children are home, so parents who are working still face supervision demands throughout the day, which can keep voting time-dependent. In other words, calendar alignment for schools does not necessarily translate into a wider usable window for parents in inflexible jobs.\n\nSo the premise that the holiday calendar itself supplies “real, not merely symbolic” scheduling relief for a substantial share of workers—especially low-income workers—is not warranted. The mechanism AG1 relies on is not reliable without additional employer/leave protections."}, "position": {"x": 340.0, "y": 420}}, {"data": {"id": "e-arg-79dc5393d2", "source": "arg-79dc5393d2", "target": "arg-6f4665ad99", "ls": "dashed", "label": "undercut", "detail": "arg-79dc5393d2 (AG2 defeat) → arg-6f4665ad99\nattack: undercut\ntarget_field: Ass\ntarget_statement: a substantial share of workers do not face the same need to be on the clock or in class that day, which reduces the opportunity cost of voting (i.e., the holiday calendar itself materially changes everyday scheduling for many voters)."}}, {"data": {"id": "arg-1ee490b23b", "kind": "counter", "label": "AG1 counter\nAG2’s critique treats “time barriers” as", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-1ee490b23b\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-79dc5393d2\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"So the premise that the holiday calendar itself supplies “real, not merely symbolic” scheduling relief for a substantial share of workers—especially low-income workers—is not warranted. The mechanism AG1 relies on is not reliable without additional employer/leave protections.\"\n}\n\nAG2’s critique treats “time barriers” as if they only disappear when an employer is legally required to grant paid leave. But for many low-income voters, the practical barrier is broader than just whether a specific employer closes: it’s whether they can (1) find hours when they’re not constrained by their day-to-day obligations and (2) reliably cover dependents during the time they vote.\n\nA national Election Day holiday changes both at the same time. When schools and large parts of the community follow the holiday calendar, more potential caregivers and household/community supports are also off duty. That makes it more feasible for a parent or caregiver to secure supervision for the hours needed to vote, even if their own workplace doesn’t fully shut down.\n\nIn addition, even where private businesses remain open, holiday schedules often involve reduced staffing or altered/shorter shifts relative to a normal workday, which can create usable voting windows (e.g., before/after shifts) rather than forcing the voter into a head-on conflict with a full school/work day.\n\nSo the mechanism is not solely “holiday label → everyone gets paid time off.” The holiday calendar can still supply real scheduling relief for a substantial share of constrained voters—especially caregivers—by synchronizing off-work availability and enabling workable supervision coverage, even before considering any extra employer/leave protections."}, "position": {"x": 340.0, "y": 560}}, {"data": {"id": "e-arg-1ee490b23b", "source": "arg-1ee490b23b", "target": "arg-79dc5393d2", "ls": "solid", "label": "rebut", "detail": "arg-1ee490b23b (AG1 counter) → arg-79dc5393d2\nattack: rebut\ntarget_field: Conc\ntarget_statement: So the premise that the holid
