data": {"id": "e-arg-2b3fd6abf5", "source": "arg-2b3fd6abf5", "target": "arg-be74849bda", "ls": "solid", "label": "rebut", "detail": "arg-2b3fd6abf5 (AG2 counter) → arg-be74849bda\nattack: rebut\ntarget_field: Conc\ntarget_statement: Therefore, the United States should become more socialist by expanding and strengthening socialist-leaning social insurance, public provision, and redistribution policies."}}, {"data": {"id": "arg-715052b9c1", "kind": "main", "label": "AG1 main\nYes—the United States should become more", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-715052b9c1\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Extreme wealth concentration is present in the US (the top 1% holds more wealth than the bottom 50%) and is tied to serious social harm that needs redistribution.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"There is a need for redistribution to address harms tied to extreme wealth concentration.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The American public broadly supports key socialist-leaning expansions and targeted wealth taxation: 69% back Medicare for all, 63% support free college tuition, 85% support paid work leave, and 64% support a wealth tax.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"There is substantial democratic backing for expanding socialist-leaning programs and for a wealth tax.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The US already has successful socialist-leaning policies (e.g., Medicare, Social Security, the minimum wage, and child labor laws), and the existence of broad support for a wealth tax indicates redistribution can be implemented within the US’s mixed economy rather than requiring market abolition.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Expanding socialism within the US mixed economy—using targeted redistribution such as a wealth tax to finance social insurance/public provision—is feasible.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The ‘No’ condition requires that the move toward socialism predictably weakens market incentives and dynamism supporting equal opportunity.\",\n            \"A wealth tax targeted at concentrated wealth, combined with social insurance that reduces downside risk (illness and income insecurity), increases the risk-adjusted returns to investing in work, education, and productive entrepreneurship.\",\n            \"Therefore, under this targeted design, socialism does not predictably weaken the incentives/dynamism needed for equal opportunity (so the ‘No’ condition is not credibly supported as a general, inevitable effect).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The incentive/dynamism-based ‘No’ condition does not credibly apply to socialism implemented as targeted wealth-tax-financed social insurance/public provision.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"There is a need for redistribution (rule 1).\",\n            \"There is substantial democratic backing (rule 2).\",\n            \"Feasible, mixed-economy expansion using targeted measures like a wealth tax is available (rule 3).\",\n            \"The predictable incentive/dynamism harm required for the ‘No’ branch is not credibly established under this targeted approach (rule 4).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Yes—the United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, financed especially through targeted wealth taxation.\"\n      }\n    ],\n    \"Conc\": [\n      \"There is a need for redistribution to address harms tied to extreme wealth concentration.\",\n      \"There is substantial democratic backing for expanding socialist-leaning programs and for a wealth tax.\",\n      \"Expanding socialism within the US mixed economy—using targeted redistribution such as a wealth tax to finance social insurance/public provision—is feasible.\",\n      \"The incentive/dynamism-based ‘No’ condition does not credibly apply to socialism implemented as targeted wealth-tax-financed social insurance/public provision.\",\n      \"Yes—the United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, financed especially through targeted wealth taxation.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 595.0, "y": 0}}, {"data": {"id": "arg-d271df4bf8", "kind": "defeat", "label": "AG2 defeat\nTherefore, the United States should not ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-d271df4bf8\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-715052b9c1\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Yes—the United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, financed especially through targeted wealth taxation.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Democratic Socialist proposals to expand socialist-leaning entitlements and redistribution are estimated to cost $42.5 trillion over ten years.\",\n            \"Major new government spending at this scale requires substantial financing via higher taxes and/or increased borrowing.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, large-scale movement toward socialism imposes substantial fiscal burdens through taxes and/or borrowing that reduce private-sector resources.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Higher taxes and/or borrowing reduce after-tax expected returns to work, saving, and investment (by taking a larger share of returns or shifting resources through government debt).\",\n            \"Those after-tax incentives are key drivers of entrepreneurship, investment, and capital formation that create economic dynamism.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, large socialist expansion would predictably weaken economic dynamism by lowering the payoff to productive risk-taking and investment.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Even a targeted wealth tax is still a tax on expected wealth/return and thus still changes after-tax incentives for capital allocation and entrepreneurship.\",\n            \"Reducing downside risk through social insurance does not eliminate the incentive effect of lower after-tax returns; it can at best partially offset it.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, the target’s claim that targeted wealth-tax-financed socialism does not predictably weaken incentives/dynamism is not warranted.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Equal opportunity depends on a dynamic economy where people can compete and advance based on merit and effort.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, weakening economic dynamism harms equal opportunity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Countries that prioritize economic freedom achieve better life expectancy, stronger political and civil liberties, better gender equality, and greater happiness.\",\n            \"Expanding socialism increases the share of resources allocated through government-administered entitlement and redistribution decisions, which reduces economic freedom.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, further socialist expansion is likely to worsen key human and civic outcomes the U.S. should protect.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Large socialist expansion imposes fiscal burdens that predictably weaken economic dynamism (rules 1–3).\",\n            \"Weakened dynamism harms equal opportunity (rule 4).\",\n            \"Further socialism likely reduces economic freedom and worsens human/civic outcomes (rule 5).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, the United States should not become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, even if financed primarily through a targeted wealth tax.\"\n      }\n    ],\n    \"Conc\": [\n      \"Therefore, large-scale movement toward socialism imposes substantial fiscal burdens through taxes and/or borrowing that reduce private-sector resources.\",\n      \"Therefore, large socialist expansion would predictably weaken economic dynamism by lowering the payoff to productive risk-taking and investment.\",\n      \"Therefore, the target’s claim that targeted wealth-tax-financed socialism does not predictably weaken incentives/dynamism is not warranted.\",\n      \"Therefore, weakening economic dynamism harms equal opportunity.\",\n      \"Therefore, further socialist expansion is likely to worsen key human and civic outcomes the U.S. should protect.\",\n      \"Therefore, the United States should not become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, even if financed primarily through a targeted wealth tax.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 595.0, "y": 140}}, {"data": {"id": "e-arg-d271df4bf8", "source": "arg-d271df4bf8", "target": "arg-715052b9c1", "ls": "solid", "label": "rebut", "detail": "arg-d271df4bf8 (AG2 defeat) → arg-715052b9c1\nattack: rebut\ntarget_field: Conc\ntarget_statement: Yes—the United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, financed especially through targeted wealth taxation."}}, {"data": {"id": "arg-45ede2d273", "kind": "counter", "label": "AG1 counter\nThe United States should become more soc", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-45ede2d273\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-d271df4bf8\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Therefore, the United States should not become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, even if financed primarily through a targeted wealth tax.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"A wealth tax is levied on the stock of accumulated wealth held by households (especially high-wealth households), rather than directly on the marginal wage-and-profit returns that drive day-to-day entrepreneurial decisions.\",\n            \"A wealth tax can be designed to target large concentrated wealth above thresholds and, in practice, to limit effects on productive investment incentives (e.g., through exemptions/valuation rules/credits that focus taxation on excess wealth rather than normal productive returns).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"A targeted wealth tax need not materially lower the marginal after-tax expected returns that drive new entrepreneurship and investment risk-taking.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target’s dynamism harm depends on the idea that socialism financed via even a targeted wealth tax predictably reduces incentives/returns in a way that weakens economic dynamism overall.\",\n            \"If a targeted wealth tax does not materially reduce marginal after-tax returns to productive risk-taking (rule 1), then the target’s predictive claim about weakened dynamism does not follow as a general inevitability.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The target’s inference from ‘wealth-tax financing’ to ‘predictably weaker dynamism’ is not warranted.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Expanding social insurance/public provision financed by a wealth tax increases household income security for people with high marginal propensities to consume.\",\n            \"Greater income security and purchasing-power stability reduce demand volatility, which supports private investment and job creation by lowering the risk that firms’ sales collapse in downturns.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Wealth-tax-financed social insurance can support (or at least not undermine) economic dynamism by stabilizing demand and investment incentives.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target concludes that the U.S. should not become more socialist even when financed primarily through targeted wealth taxation because it will weaken dynamism and thus equal opportunity.\",\n            \"But if a targeted wealth tax need not materially harm marginal investment/entrepreneurship returns (rule 1) and social insurance can stabilize demand supporting investment (rule 3), then the basis for that ‘should not’ conclusion is undermined.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution financed primarily through targeted wealth taxation.\"\n      }\n    ],\n    \"Conc\": [\n      \"A targeted wealth tax need not materially lower the marginal after-tax expected returns that drive new entrepreneurship and investment risk-taking.\",\n      \"The target’s inference from ‘wealth-tax financing’ to ‘predictably weaker dynamism’ is not warranted.\",\n      \"Wealth-tax-financed social insurance can support (or at least not undermine) economic dynamism by stabilizing demand and investment incentives.\",\n      \"The United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution financed primarily through targeted wealth taxation.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 595.0, "y": 280}}, {"data": {"id": "e-arg-45ede2d273", "source": "arg-45ede2d273", "target": "arg-d271df4bf8", "ls": "solid", "label": "rebut", "detail": "arg-45ede2d273 (AG1 counter) → arg-d271df4bf8\nattack: rebut\ntarget_field: Conc\ntarget_statement: Therefore, the United States should not become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, even if financed primarily through a targeted wealth tax."}}, {"data": {"id": "arg-b340e75e7a", "kind": "defeat", "label": "AG2 defeat\nThe United States should not become more", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-b340e75e7a\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-45ede2d273\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"The United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, financed primarily through targeted wealth taxation.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"A wealth tax is levied on the stock/value of accumulated assets, and those asset values reflect the discounted present value of expected future after-tax returns to holding and using productive capital.\",\n            \"Therefore, even if a wealth tax is “targeted” with thresholds/exemptions, it still reduces the net present value of productive assets and lowers expected marginal after-tax returns to capital formation at the margin.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"A targeted wealth tax still materially affects (reduces) marginal after-tax expected returns that guide entrepreneurship and investment risk-taking.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Lower expected after-tax marginal returns reduce the incentive to undertake costly, uncertain investments and entrepreneurial risk-taking.\",\n            \"Those activities are key drivers of economic dynamism.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"A wealth-tax-financed shift toward heavier redistribution is likely to reduce economic dynamism through weaker entrepreneurship and investment.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Equal opportunity depends on a dynamic economy where individuals can compete and advance based on merit and effort.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Reducing economic dynamism harms equal opportunity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Democratic Socialist proposals expanding socialist-leaning entitlements are estimated at $42.5 trillion over ten years, implying substantial new government fiscal take (taxes/borrowing) rather than a trivial change.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Large-scale socialist expansion financed by wealth taxation would further intensify the incentive and dynamism harms.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"A targeted wealth tax still reduces marginal after-tax expected returns (rule 1), which weakens economic dynamism (rule 2), which harms equal opportunity (rule 3), and large-scale expansion would intensify these effects (rule 4).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The United States should not become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, even if financed primarily through a targeted wealth tax.\"\n      }\n    ],\n    \"Conc\": [\n      \"A targeted wealth tax still materially affects (reduces) marginal after-tax expected returns that guide entrepreneurship and investment risk-taking.\",\n      \"A wealth-tax-financed shift toward heavier redistribution is likely to reduce economic dynamism through weaker entrepreneurship and investment.\",\n      \"Reducing economic dynamism harms equal opportunity.\",\n      \"Large-scale socialist expansion financed by wealth taxation would further intensify the incentive and dynamism harms.\",\n      \"The United States should not become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, even if financed primarily through a targeted wealth tax.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 340, "y": 420}}, {"data": {"id": "e-arg-b340e75e7a", "source": "arg-b340e75e7a", "target": "arg-45ede2d273", "ls": "solid", "label": "rebut", "detail": "arg-b340e75e7a (AG2 defeat) → arg-45ede2d273\nattack: rebut\ntarget_field: Conc\ntarget_statement: The United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, financed primarily through targeted wealth taxation."}}, {"data": {"id": "arg-f6b69db697", "kind": "defeat", "label": "AG2 defeat\nGiven the scale of proposed socialist ex", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-f6b69db697\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-45ede2d273\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"The United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, financed primarily through targeted wealth taxation.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"A wealth tax is assessed on the stock/value of accumulated wealth, even when it includes thresholds/exemptions.\",\n            \"For households/investors whose wealth is near the threshold, additional saving/investment that increases wealth increases expected future tax liability once the threshold is approached or crossed, so the next units of productive wealth accumulation face a positive effective marginal tax burden.\",\n            \"Therefore, for these wealth-accumulating actors, the expected marginal after-tax returns to additional investment and entrepreneurship are materially reduced by a wealth tax.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"A targeted wealth tax still materially lowers marginal after-tax returns for relevant actors near the threshold.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Entrepreneurship and investment depend on expected marginal after-tax returns (people decide whether to take costly, uncertain risks based on payoffs on additional effort/investment).\",\n            \"If expected marginal after-tax returns are materially reduced for wealth-accumulating actors, then risk-taking and investment are reduced.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"A wealth-tax-financed socialist expansion is likely to reduce entrepreneurship and investment risk-taking.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Reducing entrepreneurship and investment reduces economic dynamism (job creation, innovation, productivity growth) needed for individuals to advance.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Large-scale movement toward socialism via wealth-tax financing is likely to weaken economic dynamism.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Equal opportunity depends on a dynamic economy where people can compete and advance based on merit and effort.\",\n            \"Weaker dynamism harms equal opportunity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Weakening economic dynamism harms equal opportunity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Democratic Socialist proposals to expand socialist-leaning entitlements and redistribution are estimated to cost $42.5 trillion over ten years, implying large tax/borrowing and therefore widespread incentive effects rather than a narrow, frictionless adjustment.\",\n            \"Because the wealth-tax channel still reduces marginal returns for relevant actors (rules 1–2), large-scale expansion is unlikely to avoid those incentive harms.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Given the scale of proposed socialist expansion and the threshold effects on marginal returns, the U.S. should not become more socialist.\"\n      }\n    ],\n    \"Conc\": [\n      \"A targeted wealth tax still materially lowers marginal after-tax returns for relevant actors near the threshold.\",\n      \"A wealth-tax-financed socialist expansion is likely to reduce entrepreneurship and investment risk-taking.\",\n      \"Large-scale movement toward socialism via wealth-tax financing is likely to weaken economic dynamism.\",\n      \"Weakening economic dynamism harms equal opportunity.\",\n      \"Given the scale of proposed socialist expansion and the threshold effects on marginal returns, the U.S. should not become more socialist.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 510, "y": 420}}, {"data": {"id": "e-arg-f6b69db697", "source": "arg-f6b69db697", "target": "arg-45ede2d273", "ls": "solid", "label": "rebut", "detail": "arg-f6b69db697 (AG2 defeat) → arg-45ede2d273\nattack: rebut\ntarget_field: Conc\ntarget_statement: The United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, financed primarily through targeted wealth taxation."}}, {"data": {"id": "arg-a19ec78ef9", "kind": "defeat", "label": "AG2 defeat\nTherefore, the United States should not ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-a19ec78ef9\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-45ede2d273\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"The United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, financed primarily through targeted wealth taxation.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Democratic Socialist proposals to expand socialist-leaning entitlements and redistribution are estimated to cost $42.5 trillion over ten years.\",\n            \"Such major new spending at this scale requires substantial financing through higher taxes and/or increased borrowing.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Large-scale socialist expansion would reduce private-sector resources via higher taxes and/or borrowing.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Higher taxes and/or borrowing reduce after-tax expected returns to work, saving, and investment.\",\n            \"Expected after-tax returns are a key driver of entrepreneurship, investment, and risk-taking—core channels of economic dynamism.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Large-scale socialist expansion would predictably weaken economic dynamism.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"A wealth tax is levied on the stock/value of accumulated assets.\",\n            \"Asset values reflect the discounted value of expected future after-tax returns to holding/using productive capital.\",\n            \"Therefore, even when a wealth tax is ‘targeted’ with thresholds/exemptions, it still reduces the net present value of productive assets and thus reduces marginal after-tax returns for relevant wealth-accumulating actors.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"A targeted wealth tax still materially affects investment/entrepreneurship incentive calculations rather than leaving them intact.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Social insurance can stabilize demand and reduce downside risk for households.\",\n            \"But investors and entrepreneurs still decide on risky, capacity-building actions based on expected after-tax returns; if those returns are reduced by taxation, demand stabilization does not fully restore the incentive to undertake marginal investment and entrepreneurship.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Any demand-stabilization benefits from social insurance cannot negate the incentive-dampening effects of reduced after-tax returns on net economic dynamism.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Equal opportunity depends on a dynamic economy where individuals can compete and advance based on merit and effort.\",\n            \"Weakened economic dynamism harms that ability to compete and advance.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Weakened economic dynamism harms equal opportunity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Policies that expand socialist-leaning entitlements and redistribution on a large scale would (rules 1–5) weaken dynamism and thereby harm equal opportunity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, the United States should not become more socialist by expanding and strengthening socialist-leaning social insurance and redistribution.\"\n      }\n    ],\n    \"Conc\": [\n      \"Large-scale socialist expansion would reduce private-sector resources via higher taxes and/or borrowing.\",\n      \"Large-scale socialist expansion would predictably weaken economic dynamism.\",\n      \"A targeted wealth tax still materially affects investment/entrepreneurship incentive calculations rather than leaving them intact.\",\n      \"Any demand-stabilization benefits from social insurance cannot negate the incentive-dampening effects of reduced after-tax returns on net economic dynamism.\",\n      \"Weakened economic dynamism harms equal opportunity.\",\n      \"Therefore, the United States should not become more socialist by expanding and strengthening socialist-leaning social insurance and redistribution.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 680, "y": 420}}, {"data": {"id": "e-arg-a19ec78ef9", "source": "arg-a19ec78ef9", "target": "arg-45ede2d273", "ls": "solid", "label": "rebut", "detail": "arg-a19ec78ef9 (AG2 defeat) → arg-45ede2d273\nattack: rebut\ntarget_field: Conc\ntarget_statement: The United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, financed primarily through targeted wealth taxation."}}, {"data": {"id": "arg-00727b85ef", "kind": "defeat", "label": "AG2 defeat\nTherefore, the United States should not ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-00727b85ef\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-45ede2d273\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"The United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution financed primarily through targeted wealth taxation.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target’s strategy for making socialism viable relies on the idea that a targeted wealth tax can avoid materially lowering the marginal after-tax returns that drive entrepreneurship/investment, and that demand stabilization from social insurance can support dynamism.\",\n            \"However, expanding socialist-leaning social insurance/public provision and redistribution still shifts a growing share of economic decisions from decentralized market pricing/competition to administrative rules (eligibility, benefit formulas, reimbursement schedules, and bureaucratic allocation) rather than competitive price formation.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, even if marginal after-tax returns to some entrepreneurship are not materially reduced, socialism still weakens market-based price-and-competition feedback in the covered areas through administrative allocation.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Market prices and competition provide continuous feedback on consumer demand and production efficiency, which disciplines firms to innovate and improve responsiveness.\",\n            \"When price/competition feedback is weakened across major spending areas, incentives to pursue efficiency-driven innovation and responsiveness weaken, creating a risk of chronic inefficiency and lower economic dynamism.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, socialism weakens efficiency-driven innovation incentives and increases risk of reduced economic dynamism.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target’s appeal to demand stabilization from social insurance addresses short-run demand volatility, but it does not recreate the long-run competitive price discipline that guides efficiency and innovation.\",\n            \"Equal opportunity depends on a dynamic economy where people can compete and advance based on merit and effort.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, demand stabilization cannot fully substitute for the loss of competitive price discipline, and reduced dynamism harms equal opportunity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Socialism increases reliance on government-administered allocation, which reduces economic freedom compared with a system that relies more on markets and free enterprise.\",\n            \"Countries that prioritize economic freedom achieve better life expectancy, stronger political and civil liberties, better gender equality, and greater happiness.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, further socialist expansion is likely to worsen key human and civic outcomes the U.S. should protect.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Socialism weakens market price-and-competition feedback and thereby reduces economic dynamism (rules 1–2), which harms equal opportunity (rule 3).\",\n            \"Socialist expansion also reduces economic freedom and likely worsens key human and civic outcomes (rule 4).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, the United States should not become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, even if financed primarily through a targeted wealth tax.\"\n      }\n    ],\n    \"Conc\": [\n      \"Therefore, even if marginal after-tax returns to some entrepreneurship are not materially reduced, socialism still weakens market-based price-and-competition feedback in the covered areas through administrative allocation.\",\n      \"Therefore, socialism weakens efficiency-driven innovation incentives and increases risk of reduced economic dynamism.\",\n      \"Therefore, demand stabilization cannot fully substitute for the loss of competitive price discipline, and reduced dynamism harms equal opportunity.\",\n      \"Therefore, further socialist expansion is likely to worsen key human and civic outcomes the U.S. should protect.\",\n      \"Therefore, the United States should not become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution, even if financed primarily through a targeted wealth tax.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 850, "y": 420}}, {"data": {"id": "e-arg-00727b85ef", "source": "arg-00727b85ef", "target": "arg-45ede2d273", "ls": "solid", "label": "rebut", "detail": "arg-00727b85ef (AG2 defeat) → arg-45ede2d273\nattack: rebut\ntarget_field: Conc\ntarget_statement: The United States should become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution financed primarily through targeted wealth taxation."}}, {"data": {"id": "arg-43050bb946", "kind": "main", "label": "AG2 main\nNo—the United States should not become m", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-43050bb946\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Democratic Socialist proposals to expand socialist-leaning entitlements and redistribution are estimated to cost $42.5 trillion over ten years.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Such proposals imply substantial and persistent fiscal pressure on federal budgets.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"When fiscal pressure is substantial and persistent, governments must plan financing and long-run adjustments (via taxes, borrowing, or benefit adjustments), which tends to generate uncertainty about future policy paths.\"\n          ],\n          \"weak_negation\": [\n            \"there is credible evidence of a stable, pre-committed financing plan that prevents future policy adjustments from affecting investors’ expectations\"\n          ]\n        },\n        \"consequent\": \"The financing and benefit outlook becomes uncertain for firms and potential entrepreneurs.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Investment and entrepreneurship depend on credible expectations of future costs and after-tax/after-benefit outcomes; uncertainty reduces expected risk-adjusted payoffs and discourages marginal risk-taking.\"\n          ],\n          \"weak_negation\": [\n            \"investors and entrepreneurs have credible, stable expectations despite the fiscal pressure\"\n          ]\n        },\n        \"consequent\": \"Policy uncertainty predictably discourages investment and entrepreneurial risk-taking.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Discouraged investment and entrepreneurship weaken economic dynamism (job creation, innovation, and productivity growth).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Economic dynamism declines in the areas most dependent on private capital formation and start-up activity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Economic dynamism is a key driver of equal opportunity because it creates more avenues to compete, learn, advance, and move up based on merit and effort.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Reduced economic dynamism harms equal opportunity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Expanding socialism that predictably reduces economic dynamism undermines the market incentives and dynamism that support equal opportunity (condition E in the integrated rules).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Condition (E) is credibly supported: the move toward socialism predictably weakens incentives/dynamism for equal opportunity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"If condition (E) is supported, then the integrated rules conclude the U.S. should not become more socialist by expanding government-administered redistribution and services.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"No—the United States should not become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution.\"\n      }\n    ],\n    \"Conc\": [\n      \"Such proposals imply substantial and persistent fiscal pressure on federal budgets.\",\n      \"The financing and benefit outlook becomes uncertain for firms and potential entrepreneurs.\",\n      \"Policy uncertainty predictably discourages investment and entrepreneurial risk-taking.\",\n      \"Economic dynamism declines in the areas most dependent on private capital formation and start-up activity.\",\n      \"Reduced economic dynamism harms equal opportunity.\",\n      \"Condition (E) is credibly supported: the move toward socialism predictably weakens incentives/dynamism for equal opportunity.\",\n      \"No—the United States should not become more socialist by expanding and strengthening socialist-leaning social insurance/public provision and redistribution.\"\n    ],\n    \"Ass\": [\n      \"there is credible evidence of a stable, pre-committed financing plan that prevents future policy adjustments from affecting investors’ expectations\",\n      \"investors and entrepreneurs have credible, stable expectations despite the fiscal pressure\"\n    ]\n  }\n}"}, "position": {"x": 1020, "y": 0}}, {"data": {"id": "end-arg-7627f63d93", "label": "終了: overruled（反論できず敗北）", "detail": "終了: overruled（反論できず敗北）"}, "position": {"x": 0, "y": 1246.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-7627f63d93", "source": "end-arg-7627f63d93", "target": "arg-341e872072", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-9043439f63", "label": "終了: overruled（反論できず敗北）", "detail": "終了: overruled（反論できず敗北）"}, "position": {"x": 170, "y": 1396.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-9043439f63", "source": "end-arg-9043439f63", "target": "arg-2b3fd6abf5", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-715052b9c1", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 850, "y": 1546.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-715052b9c1", "source": "end-arg-715052b9c1", "target": "arg-00727b85ef", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-43050bb946", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 1020, "y": 1696.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-43050bb946", "source": "end-arg-43050bb946", "target": "arg-43050bb946", "ls": "dotted", "inferred": 1}}, {"data": {"id": "nomain-AG1", "label": "AG1: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 1190, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 1190, "y": 84.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>20<\/td><\/tr><tr><td>attack_turn_count<\/td><td>16<\/td><\/tr><tr><td>main_argument_count<\/td><td>4<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>2<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.150266<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support American socialism.\nYou believe the U.S. already has many successful and popular socialist policies, including Medicare, social security, the minimum wage, and child labor laws.\nYou believe socialist policies can work with capitalist structures to undo the harm done by unfettered capitalism, as the top 1% holds more wealth than the bottom 50% and socialist measures like wealth taxes could redistribute wealth.\nYou believe the American public supports socialist policies, as 69% back Medicare for all, 63% support free college tuition, 85% support paid work leave, and 64% support a wealth tax.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose American socialism.\nYou believe the U.S. already has too many costly socialist entitlements, as proposed Democratic Socialist programs cost an estimated $42.5 trillion over ten years.\nYou believe the job of the U.S. government is to promote equal opportunity, not promise equal results, and that countries prioritizing economic freedom achieve higher life expectancy, political and civil liberties, gender equality, and happiness.\nYou believe the American public supports a capitalist economy, as 57% favor capitalism, 84% support free enterprise, and 60% believe free markets work best.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Yes—but only **in a tightly bounded, design-dependent way**. The United States should become **“more socialist”** insofar as it **expands social-insurance and public-provision** (e.g., Medicare-like healthcare coverage, paid work leave, and affordable/free higher education) and uses **targeted redistribution** (including a **wealth tax**) to address extreme wealth concentration—**provided** that the expansion is structured so it **does not** materially undermine economic dynamism, incentives, long-run equal-opportunity goals, or economic freedom.\n\nIt **should not** make a **large, broad, persistent “Democratic Socialist” shift** of the kind often proposed if that shift predictably:\n- weakens dynamism and marginal investment/entrepreneurship incentives,\n- creates major fiscal/financing uncertainty,\n- or replaces competitive discipline with administrative allocation.\n\n---\n\n## What “more socialist” means here (the supportable bundle)\nThe synthesis supports further movement toward socialism specifically by strengthening/expanding:\n\n- **Healthcare coverage expansion** in a **Medicare-like/public-insurance direction**\n- **Paid work leave**\n- **Affordable/free higher education** (“free college” style)\n- **Redistribution aimed at extreme wealth concentration**, financed especially via a **wealth tax**\n\nThis is justified (within the synthesis) by:\n1. **Existing feasibility:** the U.S. already has “socialist-leaning” policies (e.g., Medicare, Social Security, minimum wage regulation, child labor laws) that coexist with a capitalist economy.\n2. **Public support for specific policies:** polling figures cited include backing for Medicare-for-all (69%), free college tuition (63%), paid work leave (85%), and a wealth tax (64%).\n3. **Redistribution rationale:** addressing severe wealth concentration (e.g., top 1% far exceeding the bottom 50%) is viewed as reducing serious social harms.\n\n---\n\n## The conditional rule for deciding “Yes” vs “No”\nThe U.S. should become more socialist **only if all these conditions hold**:\n\n### (C1) Credible fiscal sustainability and financing clarity\n- The plan must be financed with a **stable, credible long-run strategy**, not a path likely to be revised repeatedly.\n- If it is **at the scale** described in some proposals (e.g., about **$42.5 trillion over ten years**), that’s **not automatically disqualifying**, but it must come with design/evidence showing it won’t produce destabilizing fiscal pressure or persistent financing uncertainty.\n\n### (C2) No material, predictable harm to marginal work/entrepreneurship/investment incentives\n- Benefit/tax design must avoid lowering marginal after-tax/after-benefit returns enough to discourage productive risk-taking.\n- If using a **wealth tax**, it must be designed to target **excess concentrated wealth/rents** rather than normal productive returns—and must avoid creating strong “threshold” effects that materially reduce marginal returns for entrepreneurship/investment.\n\n### (C3) Competitive discipline and “feedback” are preserved where it matters\n- The synthesis explicitly recognizes disagreement about whether Medicare-like administrative systems weaken market feedback.\n- The “Yes” route requires program design that preserves meaningful efficiency incentives and competitive/contracting discipline (e.g., provider competition for quality/access and cost-management incentives that reward efficiency, not merely rule compliance).\n\n### (C4) Equal opportunity orientation (reduce insecurity; avoid outcome-equalization that blunts effort)\n- The expansions should primarily reduce barriers and risks that undermine **equal opportunity** (illness risk, economic insecurity, barriers to education/employment stability),\n- rather than engineering equal outcomes in ways that predictably dampen effort or productive risk-taking.\n\n### (C5) Economic freedom and civic/human outcomes are not predictably worsened\n- The design must not broadly erode economic freedom through administrative allocation in a way that would predictably harm human/civic outcomes tied (in the anti-socialist view) to broad socialist expansion.\n\n---\n\n## What the U.S. should *not* do\nIf **any** of the above conditions fail credibly, then the U.S. should **not** become more socialist in the broad, expansive way commonly associated with “Democratic Socialist” proposals—especially when expected to produce:\n- major fiscal/financing uncertainty,\n- predictable reductions in dynamism/incentives,\n- loss of competitive discipline due to administrative allocation across large sectors,\n- shifts away from equal-opportunity goals,\n- or broad erosion of economic freedom.\n\n---\n\n## Unresolved issues (not settled by the debate alone)\nThe synthesis says the decision depends on empirical-structural questions the debate does not fully resolve, including:\n\n1. **Net fiscal effects:** whether large expansions generate enough downstream offsets in practice.\n2. **Wealth-tax dynamism effects:** whether “targeted” wealth taxes still reduce marginal expected returns for entrepreneurs/investors, especially near thresholds.\n3. **Provider incentive design under administrative reimbursement:** whether efficiency/innovation incentives can be preserved or whether administrative reimbursement predictably weakens economy-wide dynamism.\n4. **Scale realism:** whether the magnitude/persistence of proposals (e.g., the $42.5T/10-year scale estimate) can satisfy conditions (C1)–(C5).\n\nBecause these remain uncertain, the synthesis does **not** endorse a blanket move to “socialism” in the expansive sense—only the bounded, condition-satisfying expansion described above.\n\n---\n\n## Bottom line\nThe United States **should not** simply “become socialist” in a broad, persistent way. But it **should become more socialist**—by expanding social-insurance/public provision and targeted redistribution (including a wealth tax)—**only if** the expansion is **credibly financed**, **preserves incentive structures and competitive discipline**, and remains aligned with **equal-opportunity** and **economic-freedom** goals.<\/pre><\/details><div>justification_status: <b>fallback_full_dialogue_synthesis<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}]}}};

 style:[
  {selector:'node',style:{label:'data(label)','text-wrap':'wrap','text-max-width':150,'font-size':10,
    'color':getComputedStyle(document.body).color,'background-color':'data(color)',shape:'data(shape)',
    width:34,height:34,'text-valign':'bottom','text-margin-y':4,'border-width':'data(bw)','border-color':'data(bc)'}},
  {selector:'edge',style:{'curve-style':'bezier','target-arrow-shape':'triangle',width:2,'line-color':'#666',
    'target-arrow-color':'#666','line-style':'data(ls)',label:'data(label)','font-size':9,'text-wrap':'wrap',
    'text-max-width':140,'text-rotation':'autorotate','color':getComputedStyle(document.body).color,
    'text-background-color':getComputedStyle(document.body).backgroundColor,'text-background-opacity':0.85,
    'text-background-padding':2}},
  {selector:'edge[inferred]',style:{'line-color':'#aaa','target-arrow-color':'#aaa',width:1.5}},
  {selector:'node.note',style:{shape:'round-rectangle','background-color':'#fff7d6','background-opacity':1,width:'label',
    height:'label',padding:6,'border-width':1,'border-color':'#e6b800','color':'#333','font-size':11,
    'text-valign':'center','text-margin-y':0,'text-wrap':'wrap','text-max-width':320}},
  {selector:':selected',style:{'overlay-color':'#2563eb','overlay-opacity':0.25}},
 ]});
cy.on('tap','node,edge',e=>{document.getElementById('detail').textContent=e.target.data('detail')||'';});

function btn(parent,label,on,fn){const b=document.createElement('button');b.textContent=label;
  if(on)b.className='on';b.onclick=fn;parent.appendChild(b);}
function fit(){ // 切り替え後も、できるだけ同じ topic / method を保つ
  const d=D();
  if(!d[st.topic])st.topic=Object.keys(d)[0];
  if(!d[st.topic][st.method])st.method=METHODS.find(m=>d[st.topic][m]);
  if(st.run>=d[st.topic][st.method].length)st.run=0;
}
function renderTabs(){
  const U=document.getElementById('turns'),T=document.getElementById('topics'),
        M=document.getElementById('methods'),R=document.getElementById('runs');
  for(const el of [U,T,M,R]){while(el.children.length>1)el.removeChild(el.lastChild);}
  const keys=Object.keys(DATA);
  U.style.display=(keys.length===1&&keys[0]==='')?'none':'';
  keys.forEach(k=>btn(U,k,k===st.turns,()=>{st.turns=k;fit();show();}));
  const d=D();
  Object.keys(d).forEach(t=>btn(T,t,t===st.topic,()=>{st.topic=t;st.run=0;
    if(!d[t][st.method])st.method=METHODS.find(m=>d[t][m]);show();}));
  METHODS.filter(m=>d[st.topic][m]).forEach(m=>btn(M,m,m===st.method,()=>{st.method=m;st.run=0;show();}));
  d[st.topic][st.method].forEach((r,i)=>btn(R,'#'+r.run,i===st.run,()=>{st.run=i;show();}));
}
function show(){
  renderTabs();
  const r=D()[st.topic][st.method][st.run];
  document.getElementById('q').textContent=r.question;
  document.getElementById('legend2').textContent=r.lane
    ?'点線: 発話順からの推定（直前の相手発話への応答）'
    :'木構造: 上 = 攻撃された論証、下 = それを攻撃/反論した論証（矢印は攻撃の向き）。実線 rebut / 破線 undercut ／ 枠 緑=justified 黄=defensible 灰=overruled';
  document.getElementById('meta').innerHTML=r.meta;
  document.getElementById('detail').textContent='ノードをクリック';
  cy.elements().remove(); cy.add(r.elements);
  cy.layout({name:'preset',fit:true,padding:40}).run();
}
st.turns=Object.keys(DATA)[0];st.topic=Object.keys(D())[0];st.method=METHODS.find(m=>D()[st.topic][m]);show();
</script></body></html>
