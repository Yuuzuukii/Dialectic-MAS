const DATA = {"animal_dissection": {"no_schema": [{"run": 1, "question": "Should students dissect animals?", "elements": [{"data": {"id": "arg-44beb2ed62", "kind": "main", "label": "AG1 main\nYes—students should dissect animals, bec", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"arg-44beb2ed62\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"overruled\",\n  \"closed_by_budget\": false\n}\n\nYes—students should dissect animals, because it delivers uniquely valuable biology learning while making effective use of animals that are already dead. First, dissection is a hands-on teaching method that gives students concrete learning opportunities and builds practical competencies: it develops fine motor skills and hand-eye coordination and strengthens critical thinking through careful observation and analysis. Second, it can encourage students to pursue science careers by creating real “aha moments” that translate curiosity into sustained interest in scientific work. Third, the ethical tradeoff is reduced because, as used in many school settings, over 98% of dissected animals were already deceased, and fetal pigs used for dissection are meat-industry byproducts destined for landfills rather than being otherwise available for living use. Taken together, dissection both improves student learning and supports education goals at the same time as it uses already-deceased animals in a productive way—so students should dissect animals as part of biology education."}, "position": {"x": 85.0, "y": 0}}, {"data": {"id": "arg-f4b74f4be3", "kind": "defeat", "label": "AG2 defeat\nThe key ethical premise in the “reduced ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-f4b74f4be3\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-44beb2ed62\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"over 98% of dissected animals were already deceased, and fetal pigs used for dissection are meat-industry byproducts destined for landfills rather than being otherwise available for living use\"\n}\n\nThe key ethical premise in the “reduced tradeoff” claim is not reliably true: in most real school-dissection supply chains, dissection animals are not “already deceased” in the way the target suggests. Approximately 99% of dissection animals are caught in the wild, and that wild-capture harms local ecosystems by reducing local populations and biodiversity. If the animals are largely taken from the wild (rather than being already dead byproducts), then dissection does not offer a low-ethical-cost alternative; it still drives biodiversity loss and is environmentally harmful. Therefore the argument that dissection’s ethical tradeoff is reduced because most animals were already dead (and that fetal pigs are mainly harmless byproducts) rests on a false assumption about animal sourcing."}, "position": {"x": 85.0, "y": 140}}, {"data": {"id": "e-arg-f4b74f4be3", "source": "arg-f4b74f4be3", "target": "arg-44beb2ed62", "ls": "dashed", "label": "undercut", "detail": "arg-f4b74f4be3 (AG2 defeat) → arg-44beb2ed62\nattack: undercut\ntarget_field: Ass\ntarget_statement: over 98% of dissected animals were already deceased, and fetal pigs used for dissection are meat-industry byproducts destined for landfills rather than being otherwise available for living use"}}, {"data": {"id": "arg-d4dd03a341", "kind": "counter", "label": "AG1 counter\nEven if some dissection specimens involv", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-d4dd03a341\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-f4b74f4be3\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"in most real school-dissection supply chains, dissection animals are not “already deceased” in the way the target suggests (i.e., they are largely taken from the wild rather than being already dead byproducts).\"\n}\n\nEven if some dissection specimens involve nontrivial sourcing questions, the opponent’s core challenge doesn’t remove the ethical basis in the specific school case that matters most: fetal pigs used for dissection are meat-industry byproducts that are already dead and are otherwise destined for landfill. That means dissection in these common classrooms does not require new wild capture of animals for the purpose of the class, and it converts otherwise-wasted, already-dead animals into a productive educational use. So the ethical “reduced tradeoff” rationale isn’t undermined in the way the attack claims; at least for fetal pig dissections, the animals are byproducts rather than primarily newly taken from the wild."}, "position": {"x": 85.0, "y": 280}}, {"data": {"id": "e-arg-d4dd03a341", "source": "arg-d4dd03a341", "target": "arg-f4b74f4be3", "ls": "dashed", "label": "undercut", "detail": "arg-d4dd03a341 (AG1 counter) → arg-f4b74f4be3\nattack: undercut\ntarget_field: Ass\ntarget_statement: in most real school-dissection supply chains, dissection animals are not “already deceased” in the way the target suggests (i.e., they are largely taken from the wild rather than being already dead byproducts)."}}, {"data": {"id": "arg-ac46335726", "kind": "defeat", "label": "AG2 defeat\nThe premise that “fetal pigs used for di", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-ac46335726\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-d4dd03a341\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"fetal pigs used for dissection are meat-industry byproducts that are already dead and are otherwise destined for landfill\"\n}\n\nThe premise that “fetal pigs used for dissection are meat-industry byproducts that are already dead and destined for landfill” does not hold reliably enough to treat dissection as a low-ethical-cost educational use. Even when pigs come from the broader meat supply chain, they are not “otherwise-wasted, already-dead” animals being salvaged; they are killed/produced in ways that increase (or at least maintain) demand for animals as part of that supply. That means dissection still entails welfare harms from producing and killing sentient animals, and it carries environmental harms associated with industrial animal agriculture—so it does not eliminate the ethical/environmental tradeoff the original argument claims to reduce."}, "position": {"x": 85.0, "y": 420}}, {"data": {"id": "e-arg-ac46335726", "source": "arg-ac46335726", "target": "arg-d4dd03a341", "ls": "dashed", "label": "undercut", "detail": "arg-ac46335726 (AG2 defeat) → arg-d4dd03a341\nattack: undercut\ntarget_field: Ass\ntarget_statement: fetal pigs used for dissection are meat-industry byproducts that are already dead and are otherwise destined for landfill"}}, {"data": {"id": "arg-84ed384172", "kind": "counter", "label": "AG1 counter\nThe opponent’s challenge treats upstream", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-84ed384172\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-ac46335726\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"The premise that “fetal pigs used for dissection are meat-industry byproducts that are already dead and destined for landfill” does not hold reliably enough to treat dissection as a low-ethical-cost educational use; dissection still entails welfare harms and therefore it does not eliminate the ethical/environmental tradeoff.\"\n}\n\nThe opponent’s challenge treats upstream harms in industrial agriculture as if they directly translate into an added ethical cost caused by school dissection itself. But the relevant ethical question for classroom practice is the marginal impact on animal suffering: whether dissection requires additional animals to be killed or subjected to suffering for the purpose of the lesson. In typical school dissection settings, that marginal impact is low because the vast majority of specimens are already dead by the time they are used—over 98% were already deceased (and only a small fraction would involve any special sourcing concerns). Using already-deceased specimens means students are not creating new animal suffering for the class, which is exactly why the “reduced tradeoff” rationale is still substantively supported even if industrial animal agriculture is ethically problematic in general. Therefore, dissection remains a comparatively low-ethical-cost educational use on the level that matters for the classroom decision."}, "position": {"x": 0, "y": 560}}, {"data": {"id": "e-arg-84ed384172", "source": "arg-84ed384172", "target": "arg-ac46335726", "ls": "solid", "label": "rebut", "detail": "arg-84ed384172 (AG1 counter) → arg-ac46335726\nattack: rebut\ntarget_field: Conc\ntarget_statement: The premise that “fetal pigs used for dissection are meat-industry byproducts that are already dead and destined for landfill” does not hold reliably enough to treat dissection as a low-ethical-cost educational use; dissection still entails welfare harms and therefore it does not eliminate the ethical/environmental tradeoff."}}, {"data": {"id": "arg-abbb26a13f", "kind": "counter", "label": "AG1 counter\nThe opponent’s challenge assumes that us", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-abbb26a13f\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-ac46335726\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"even when pigs come from the broader meat supply chain, they are not “otherwise-wasted, already-dead” animals being salvaged; they are killed/produced in ways that increase (or at least maintain) demand for animals as part of that supply\"\n}\n\nThe opponent’s challenge assumes that using fetal pigs for school dissection typically works by increasing (or even maintaining) the number of animals killed/produced for the meat supply. But for the classroom practice at issue, the relevant factual basis is that fetal pigs used for dissection are meat-industry byproducts that are already dead and are otherwise destined for landfill. If the specimens are already dead byproducts, then school dissection does not require additional wild capture or additional killing “for the class”; it instead diverts an already-dead byproduct into a productive educational use. So the ethical “reduced tradeoff” rationale still applies to the school-dissection case—because the dissection activity itself does not add incremental animal deaths for the lesson in the way the opponent’s causal framing suggests."}, "position": {"x": 170, "y": 560}}, {"data": {"id": "e-arg-abbb26a13f", "source": "arg-abbb26a13f", "target": "arg-ac46335726", "ls": "dashed", "label": "undercut", "detail": "arg-abbb26a13f (AG1 counter) → arg-ac46335726\nattack: undercut\ntarget_field: Ass\ntarget_statement: even when pigs come from the broader meat supply chain, they are not “otherwise-wasted, already-dead” animals being salvaged; they are killed/produced in ways that increase (or at least maintain) demand for animals as part of that supply"}}, {"data": {"id": "arg-7b477dcd79", "kind": "main", "label": "AG2 main\nNo—students should not dissect animals. ", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-7b477dcd79\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nNo—students should not dissect animals. I rely on three substantive points.\n\nFirst, animal dissection is not education-required for the biology learning goals. The College Board AP Biology curriculum and Next Generation Science Standards do not require or benefit from doing real animal dissections to achieve the core competencies students are expected to learn.\n\nSecond, medical training does not depend on dissection. In the U.S. and Canada, no medical schools use animals for physician training, so dissection isn’t necessary to prepare students for real medical career pathways.\n\nThird, effective alternatives exist. Synthetic models and computer simulations can teach anatomy and biological structures as well as—often better than—working with dead animals, and they avoid the need to harm or kill sentient animals.\n\nGiven that dissection is not required for the stated learning standards, does not provide a unique preparation benefit for medical training, and can be replaced by equally effective alternatives that avoid animal suffering and additional environmental harm, students should not dissect animals."}, "position": {"x": 850.0, "y": 0}}, {"data": {"id": "arg-db914317ba", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals because ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-db914317ba\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-7b477dcd79\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"No—students should not dissect animals.\"\n}\n\nStudents should dissect animals because dissection provides learning experiences that are not just optional add-ons: it lets students directly observe real anatomical structure and real tissue behavior, while also building fine motor control and hand-eye coordination and strengthening critical thinking through careful, first-hand specimen analysis. That kind of hands-on, structure-function learning is valuable even when medical training doesn’t require dissection—dissection is used for core biology education and can also spark lasting interest in science. And the ethical concern about “killing for the class” is reduced in typical classroom practice because many dissection specimens (including fetal pigs) come from animals that are already dead as meat-industry byproducts destined for other outcomes like landfill, turning otherwise-wasted specimens into a productive educational use."}, "position": {"x": 340.0, "y": 140}}, {"data": {"id": "e-arg-db914317ba", "source": "arg-db914317ba", "target": "arg-7b477dcd79", "ls": "solid", "label": "rebut", "detail": "arg-db914317ba (AG1 defeat) → arg-7b477dcd79\nattack: rebut\ntarget_field: Conc\ntarget_statement: No—students should not dissect animals."}}, {"data": {"id": "arg-b2a8d5b32a", "kind": "defeat", "label": "AG2 defeat\nThe target relies on a specific ethical ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-b2a8d5b32a\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-db914317ba\",\n  \"target_field\": \"Ass\"\n}\n\nThe target relies on a specific ethical tradeoff assumption: that many (including fetal pigs) dissection specimens are “already dead as meat-industry byproducts destined for landfill,” so dissection does not require additional killing/wild capture “for the class.” That assumption is not reliably true. In most real school dissection supply chains, approximately 99% of specimens are sourced from wild capture rather than being already-dead byproducts, and wild-catching reduces local populations and biodiversity. If the animals are largely not already-dead landfill byproducts, then dissection is not a low-ethical-cost alternative, so the claim that the “killing for the class” concern is reduced in typical classroom practice doesn’t hold."}, "position": {"x": 340, "y": 280}}, {"data": {"id": "e-arg-b2a8d5b32a", "source": "arg-b2a8d5b32a", "target": "arg-db914317ba", "ls": "dashed", "label": "undercut", "detail": "arg-b2a8d5b32a (AG2 defeat) → arg-db914317ba\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-c73219b11c", "kind": "defeat", "label": "AG1 defeat\nDissection can be education-valuable eve", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-c73219b11c\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-7b477dcd79\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Given that dissection is not required for the stated learning standards, does not provide a unique preparation benefit for medical training, and can be replaced by equally effective alternatives that avoid animal suffering and additional environmental harm, students should not dissect animals.\"\n}\n\nDissection can be education-valuable even if it is not explicitly “required” by AP/NGSS, because it directly supports core biology learning goals in practice: students learn anatomy and structure–function relationships by making real observations of actual tissues, while also developing fine motor control, hand-eye coordination, and critical thinking through careful specimen analysis. Likewise, the fact that medical training does not depend on dissection does not settle the classroom question, because school dissection is used to teach biology skills and deepen scientific interest—not to train future physicians directly. Finally, claims that simulations/models teach “as well or better” overlook that they do not provide the same hands-on tactile experience with real anatomical structure that dissection offers, so viable alternatives typically supplement rather than fully replace dissection’s unique learning benefits. Therefore, students should dissect animals as part of biology education."}, "position": {"x": 510.0, "y": 140}}, {"data": {"id": "e-arg-c73219b11c", "source": "arg-c73219b11c", "target": "arg-7b477dcd79", "ls": "solid", "label": "rebut", "detail": "arg-c73219b11c (AG1 defeat) → arg-7b477dcd79\nattack: rebut\ntarget_field: Conc\ntarget_statement: Given that dissection is not required for the stated learning standards, does not provide a unique preparation benefit for medical training, and can be replaced by equally effective alternatives that avoid animal suffering and additional environmental harm, students should not dissect animals."}}, {"data": {"id": "arg-e034dd08b9", "kind": "defeat", "label": "AG2 defeat\nThe target relies on a weak-negation ass", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-e034dd08b9\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-c73219b11c\",\n  \"target_field\": \"Ass\"\n}\n\nThe target relies on a weak-negation assumption that alternatives “typically supplement rather than fully replace” dissection because they “do not provide the same hands-on tactile experience.” I hold that this assumption is not the case: synthetic models and computer simulations can teach the same anatomy/structure–function relationships effectively (often equally well or better) without requiring students to handle real dead animals. Since the core learning goals the target cites—anatomy observation and structure–function understanding—can be achieved using non-animal alternatives, dissection does not have the unique, irreplaceable educational role that the target’s argument depends on."}, "position": {"x": 510, "y": 280}}, {"data": {"id": "e-arg-e034dd08b9", "source": "arg-e034dd08b9", "target": "arg-c73219b11c", "ls": "dashed", "label": "undercut", "detail": "arg-e034dd08b9 (AG2 defeat) → arg-c73219b11c\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-32c1c13a14", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals as part ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-32c1c13a14\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-7b477dcd79\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Given that dissection is not required for the stated learning standards, does not provide a unique preparation benefit for medical training, and can be replaced by equally effective alternatives that avoid animal suffering and additional environmental harm, students should not dissect animals.\"\n}\n\nStudents should dissect animals as part of biology education because dissection uniquely achieves core learning aims that the opponent treats as replaceable. Even if AP Biology/NGSS do not explicitly require dissection, they set expected learning goals—not the full menu of methods—so providing direct observation of real anatomical structures and tissue behavior is a substantively relevant way to teach biology. Models and simulations are helpful, but they are idealized; they do not reproduce real anatomical variability and real tissue properties that students must interpret during authentic specimen-based analysis. Finally, the ethical concern is mitigated in common classroom practice because most dissection specimens are already dead (e.g., over 98%) and fetal pigs are meat-industry byproducts, so dissection can be an educational use of animals that would otherwise be wasted rather than a practice that necessarily requires new animal deaths for the class."}, "position": {"x": 680.0, "y": 140}}, {"data": {"id": "e-arg-32c1c13a14", "source": "arg-32c1c13a14", "target": "arg-7b477dcd79", "ls": "solid", "label": "rebut", "detail": "arg-32c1c13a14 (AG1 defeat) → arg-7b477dcd79\nattack: rebut\ntarget_field: Conc\ntarget_statement: Given that dissection is not required for the stated learning standards, does not provide a unique preparation benefit for medical training, and can be replaced by equally effective alternatives that avoid animal suffering and additional environmental harm, students should not dissect animals."}}, {"data": {"id": "arg-356244f8e1", "kind": "defeat", "label": "AG2 defeat\nThe target’s central weak-negation assum", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-356244f8e1\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-32c1c13a14\",\n  \"target_field\": \"Ass\"\n}\n\nThe target’s central weak-negation assumption is that alternatives (models/simulations) are “idealized” and therefore cannot reproduce the anatomical variability and tissue properties that make dissection uniquely effective (“so providing direct observation of real anatomical structures and tissue behavior is substantively relevant,” and models don’t achieve that). I hold the opposite: high-quality synthetic models and computer/virtual dissection can replicate the relevant structure–function relationships and observable anatomical differences well enough for students to learn what dissection is supposed to teach. They can show multiple structures and variants, let students repeat observations, and present tissue layers/relationships in a controlled way—so students still practice the same core biology reasoning (identifying structures, interpreting function, analyzing spatial relationships) without requiring dead, harmed animals. Therefore dissection does not have a uniquely irreplaceable educational advantage; the premise that simulations/models can’t provide substantively equivalent learning is not true."}, "position": {"x": 680, "y": 280}}, {"data": {"id": "e-arg-356244f8e1", "source": "arg-356244f8e1", "target": "arg-32c1c13a14", "ls": "dashed", "label": "undercut", "detail": "arg-356244f8e1 (AG2 defeat) → arg-32c1c13a14\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-c30123a124", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals because ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-c30123a124\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-7b477dcd79\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Given that dissection is not required for the stated learning standards, does not provide a unique preparation benefit for medical training, and can be replaced by equally effective alternatives that avoid animal suffering and additional environmental harm, students should not dissect animals.\"\n}\n\nStudents should dissect animals because dissection uniquely advances educational goals beyond “meeting standards” or providing information: it creates real hands-on “aha moments” that turn curiosity into sustained engagement and can meaningfully encourage students to pursue science careers. Even if simulations/models can teach anatomical facts, they typically do not replicate the motivation and career-sparking impact that comes from first-hand interaction with real specimens and guided analysis. Since dissection’s distinctive benefit is learner engagement and scientific interest (not only content delivery), it is not fully replaceable by simulations in the way the anti-dissection case requires. In addition, in common classroom practice dissection often uses animals that are already dead (e.g., the over-98% figure cited for many dissection settings) and fetal pigs that are meat-industry byproducts, so the ethical burden is reduced in the classroom decision."}, "position": {"x": 850.0, "y": 140}}, {"data": {"id": "e-arg-c30123a124", "source": "arg-c30123a124", "target": "arg-7b477dcd79", "ls": "solid", "label": "rebut", "detail": "arg-c30123a124 (AG1 defeat) → arg-7b477dcd79\nattack: rebut\ntarget_field: Conc\ntarget_statement: Given that dissection is not required for the stated learning standards, does not provide a unique preparation benefit for medical training, and can be replaced by equally effective alternatives that avoid animal suffering and additional environmental harm, students should not dissect animals."}}, {"data": {"id": "arg-581c0d872b", "kind": "defeat", "label": "AG2 defeat\nThe target’s ethical premise assumes tha", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-581c0d872b\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-c30123a124\",\n  \"target_field\": \"Ass\"\n}\n\nThe target’s ethical premise assumes that, in typical classrooms, dissection relies on animals that are already dead (e.g., the “over-98%” claim) or on fetal pigs that are meat-industry byproducts—so “the ethical burden is reduced.” That assumption is not reliably true: approximately 99% of dissection animals are caught in the wild, and wild-capture harms local ecosystems by lowering local populations and reducing biodiversity. If most specimens are sourced via wild capture rather than being already-dead byproducts, then dissection does not have a reduced ethical/environmental cost in the classroom decision; it still contributes to biodiversity loss and ecosystem damage. Without that “reduced ethical burden” premise, the argument’s justification for dissecting falls apart."}, "position": {"x": 850, "y": 280}}, {"data": {"id": "e-arg-581c0d872b", "source": "arg-581c0d872b", "target": "arg-c30123a124", "ls": "dashed", "label": "undercut", "detail": "arg-581c0d872b (AG2 defeat) → arg-c30123a124\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-de512f584a", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals because ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-de512f584a\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-7b477dcd79\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Given that dissection is not required for the stated learning standards, does not provide a unique preparation benefit for medical training, and can be replaced by equally effective alternatives that avoid animal suffering and additional environmental harm, students should not dissect animals.\"\n}\n\nStudents should dissect animals because the opponent treats “not required by AP/NGSS” as if that means dissection lacks educational value, but curriculum standards set target outcomes—not a ban on effective hands-on methods. Dissection directly supports core biology learning by requiring students to make real, first-hand observations of anatomical structures and relate them to function, while also building practical psychomotor skills (fine motor control and hand-eye coordination) and critical reasoning from what students actually see. Simulations and models can supplement this, but they don’t fully replicate the real biological variability and tactile experience that make dissection effective for developing those competencies. Finally, the ethical concern is reduced in common classrooms because the specimens used are typically already dead (often reported as over 98%) and fetal pigs are meat-industry byproducts destined for disposal rather than living use, so dissection can be an educational use of animals that otherwise would not be used productively."}, "position": {"x": 1020.0, "y": 140}}, {"data": {"id": "e-arg-de512f584a", "source": "arg-de512f584a", "target": "arg-7b477dcd79", "ls": "solid", "label": "rebut", "detail": "arg-de512f584a (AG1 defeat) → arg-7b477dcd79\nattack: rebut\ntarget_field: Conc\ntarget_statement: Given that dissection is not required for the stated learning standards, does not provide a unique preparation benefit for medical training, and can be replaced by equally effective alternatives that avoid animal suffering and additional environmental harm, students should not dissect animals."}}, {"data": {"id": "arg-eee3558356", "kind": "defeat", "label": "AG2 defeat\nA key weak assumption in the target is: ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-eee3558356\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-de512f584a\",\n  \"target_field\": \"Ass\"\n}\n\nA key weak assumption in the target is: “simulations and models don’t fully replicate the real biological variability and tactile experience that make dissection effective.” That assumption is not required to hold.\n\nOn the relevant learning task—understanding anatomy and structure–function relationships—virtual/3D simulation tools and synthetic models can provide (1) real anatomical structure through high-resolution, manipulable 3D views (zoom/rotate/section), and (2) practical variability by letting instructors or software switch between multiple specimens, conditions, or model variants for comparison. They also let students repeat the same “inspection steps” until they master the concepts, rather than being constrained by one physical specimen per group. For any tactile component, non-animal models (e.g., synthetic organs/tissue analogs) can supply the hand-on practice without using dead or sentient animals.\n\nSo the target’s premise that dissection is uniquely effective because simulations/models cannot replicate variability and tactile learning conditions is false: alternatives can replicate the learning-relevant aspects sufficiently (and can support repeated practice), meaning dissection is not educationally necessary."}, "position": {"x": 1020, "y": 280}}, {"data": {"id": "e-arg-eee3558356", "source": "arg-eee3558356", "target": "arg-de512f584a", "ls": "dashed", "label": "undercut", "detail": "arg-eee3558356 (AG2 defeat) → arg-de512f584a\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-7f835d93fe", "kind": "defeat", "label": "AG1 defeat\nEven if AP/NGSS do not require animal di", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-7f835d93fe\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-7b477dcd79\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Given that dissection is not required for the stated learning standards, does not provide a unique preparation benefit for medical training, and can be replaced by equally effective alternatives that avoid animal suffering and additional environmental harm, students should not dissect animals.\"\n}\n\nEven if AP/NGSS do not require animal dissection, that does not mean dissection is ineffective or educationally unwarranted, because education standards set learning outcomes rather than banning specific methods. In practice, dissection provides first-hand evidence of real anatomy and structure–function relationships and can build core biology skills (guided observation, interpretation, and practical competencies like fine motor control and hand-eye coordination) that students can’t get in the same way from simulations alone. And the ethical tradeoff can be substantially reduced in typical classroom use when dissection specimens are already dead and—at least for common fetal pig cases—are meat-industry byproducts rather than newly taken living animals. So, the combination of educational value and reduced welfare cost supports allowing students to dissect animals as part of biology education, rather than concluding that they should not."}, "position": {"x": 1190.0, "y": 140}}, {"data": {"id": "e-arg-7f835d93fe", "source": "arg-7f835d93fe", "target": "arg-7b477dcd79", "ls": "solid", "label": "rebut", "detail": "arg-7f835d93fe (AG1 defeat) → arg-7b477dcd79\nattack: rebut\ntarget_field: Conc\ntarget_statement: Given that dissection is not required for the stated learning standards, does not provide a unique preparation benefit for medical training, and can be replaced by equally effective alternatives that avoid animal suffering and additional environmental harm, students should not dissect animals."}}, {"data": {"id": "arg-9141b02116", "kind": "defeat", "label": "AG2 defeat\nThe target’s educational-justification r", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-9141b02116\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-7f835d93fe\",\n  \"target_field\": \"Ass\"\n}\n\nThe target’s educational-justification relies on this weak negation assumption: “students can’t get core biology skills in the same way from simulations alone.” That assumption is not true. The substantive skills it names—guided observation, interpreting structure–function relationships, and strengthening critical thinking—are skills of analyzing biological information and patterns, which synthetic models and computer simulations (plus structured virtual/interactive labs and model-based ‘dissections’) can train directly. And the fine-motor/hand-eye components don’t inherently require dead animal tissue; students can develop those same competencies using non-animal models and lab tools designed for specimen manipulation. So dissection’s claimed “unique” learning value compared to non-animal alternatives is overstated; alternatives can teach the same core competencies, undercutting the rationale for allowing real animal dissection."}, "position": {"x": 1190, "y": 280}}, {"data": {"id": "e-arg-9141b02116", "source": "arg-9141b02116", "target": "arg-7f835d93fe", "ls": "dashed", "label": "undercut", "detail": "arg-9141b02116 (AG2 defeat) → arg-7f835d93fe\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-a7e73bff30", "kind": "defeat", "label": "AG1 defeat\nStudents should be allowed to dissect an", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-a7e73bff30\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-7b477dcd79\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"students should not dissect animals\"\n}\n\nStudents should be allowed to dissect animals in biology classes because dissection is a substantively effective teaching method for core biology learning goals, not merely a nonessential add-on: it gives students real, first-hand observation of anatomical structures and structure–function relationships while also building fine motor skills, hand-eye coordination, and critical thinking from analyzing actual specimens. The availability of simulations and models doesn’t fully remove this educational value because they generally can’t replicate the real anatomical variability and tactile tissue experience that develop those competencies. And the ethical concern about “killing for the class” is reduced in typical classroom practice because the vast majority of specimens used are already dead (e.g., over 98%), and fetal pigs used for dissection are meat-industry byproducts destined for disposal rather than living animals taken for the lesson. Given these points, dissection can provide strong educational benefits while keeping the animal-welfare tradeoff comparatively low in common settings, so students should dissect animals."}, "position": {"x": 1360.0, "y": 140}}, {"data": {"id": "e-arg-a7e73bff30", "source": "arg-a7e73bff30", "target": "arg-7b477dcd79", "ls": "solid", "label": "rebut", "detail": "arg-a7e73bff30 (AG1 defeat) → arg-7b477dcd79\nattack: rebut\ntarget_field: Conc\ntarget_statement: students should not dissect animals"}}, {"data": {"id": "arg-a657b8f9a1", "kind": "defeat", "label": "AG2 defeat\nThe target’s “comparatively low” animal-", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-a657b8f9a1\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-a7e73bff30\",\n  \"target_field\": \"Ass\"\n}\n\nThe target’s “comparatively low” animal-welfare tradeoff depends on a weak premise: that dissection specimens are “already dead” and (at least for common cases) fetal pigs are mainly meat-industry byproducts, so the activity does not drive additional harm. But that premise is not reliably true in real school supply chains: approximately 99% of dissection animals are caught in the wild for classroom use, and wild-capture reduces local populations and biodiversity. If most specimens are wild-caught rather than already-dead byproducts, then dissection does involve substantial welfare and environmental harms, meaning the argument’s claim that the ethical cost is low (and thus outweighed by educational benefits) rests on an incorrect assumption about sourcing."}, "position": {"x": 1360, "y": 280}}, {"data": {"id": "e-arg-a657b8f9a1", "source": "arg-a657b8f9a1", "target": "arg-a7e73bff30", "ls": "dashed", "label": "undercut", "detail": "arg-a657b8f9a1 (AG2 defeat) → arg-a7e73bff30\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-507f43e3a3", "kind": "main", "label": "AG1 main\nStudents should dissect animals as part ", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-507f43e3a3\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nStudents should dissect animals as part of biology education because animal dissection is a uniquely valuable hands-on way to build the kinds of practical biology competencies that standards aim to develop in students: students must directly observe real anatomical structures, interpret structure–function relationships from intact tissues, and do careful analysis that strengthens critical thinking (not just memorization). That real-tissue, first-hand interaction is also what commonly produces memorable “aha moments” that translate curiosity into sustained scientific interest.\n\nEthically, the classroom practice can be a low incremental-cost use of animals rather than an additional harm: in typical dissection programs, the vast majority of specimens are already deceased (over 98%), and fetal pigs used for dissection are meat-industry byproducts destined for landfill. In that case, prohibiting dissection doesn’t meaningfully “save” those animals; it mainly removes an educational benefit while leaving those byproducts to be discarded.\n\nWith both (1) uniquely valuable learning/career-engagement benefits and (2) credible mitigation through predominantly already-deceased byproduct specimens, the best interpretation of the issue supports allowing students to dissect animals."}, "position": {"x": 1785.0, "y": 0}}, {"data": {"id": "arg-df44b11979", "kind": "defeat", "label": "AG2 defeat\nThe “uniquely valuable hands-on” and “ah", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-df44b11979\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-507f43e3a3\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"With both (1) uniquely valuable learning/career-engagement benefits and (2) credible mitigation through predominantly already-deceased byproduct specimens, the best interpretation of the issue supports allowing students to dissect animals.\"\n}\n\nThe “uniquely valuable hands-on” and “aha moments” claims about dissection are not substantively justified: for the biology learning goals (anatomy/structure–function relationships and critical analysis), synthetic models and computer simulations can teach the same concepts and still require students to observe, interpret, and reason—often as well as or better—without relying on dead/harmed animals. If the educational outcomes can be achieved with effective non-animal alternatives, then dissection is not a uniquely necessary method for classroom learning or sustained science interest; it becomes an avoidable use of animals rather than an essential teaching advantage."}, "position": {"x": 1530.0, "y": 140}}, {"data": {"id": "e-arg-df44b11979", "source": "arg-df44b11979", "target": "arg-507f43e3a3", "ls": "solid", "label": "rebut", "detail": "arg-df44b11979 (AG2 defeat) → arg-507f43e3a3\nattack: rebut\ntarget_field: Conc\ntarget_statement: With both (1) uniquely valuable learning/career-engagement benefits and (2) credible mitigation through predominantly already-deceased byproduct specimens, the best interpretation of the issue supports allowing students to dissect animals."}}, {"data": {"id": "arg-a44c65f0bb", "kind": "defeat", "label": "AG1 defeat\nThe target relies on the weak negation a", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-a44c65f0bb\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-df44b11979\",\n  \"target_field\": \"Ass\"\n}\n\nThe target relies on the weak negation assumption that synthetic models/computer simulations can teach the same anatomy/structure–function concepts “often as well as or better” while still giving students the kind of first-hand observation and analysis that dissection provides. But in real classroom practice, dissection uniquely involves tactile, three-dimensional interaction with intact tissues (including how tissues actually feel, tear, and behave) and the psychomotor practice of performing careful manipulations with real instruments. Simulations and models can support understanding, but they don’t replicate that tactile feedback and real anatomical variability in intact specimens in the way dissection does. Therefore, the assumption that non-animal methods can achieve dissection-equivalent learning outcomes is not true, and dissection remains a uniquely valuable method for building the practical and analytical competencies the target says are replaceable."}, "position": {"x": 1530, "y": 280}}, {"data": {"id": "e-arg-a44c65f0bb", "source": "arg-a44c65f0bb", "target": "arg-df44b11979", "ls": "dashed", "label": "undercut", "detail": "arg-a44c65f0bb (AG1 defeat) → arg-df44b11979\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-f7db488bb8", "kind": "defeat", "label": "AG2 defeat\nThe ethical/ecological mitigation claim ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-f7db488bb8\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-507f43e3a3\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"the best interpretation of the issue supports allowing students to dissect animals.\"\n}\n\nThe ethical/ecological mitigation claim in the pro-dissection case is not credibly established. In reality, dissection supply is often dominated by wild-caught animals: approximately 99% are caught in the wild. That wild-capture harms local ecosystems by reducing local populations and biodiversity, so dissection does not reliably offer a “low tradeoff” educational use. If animals are largely taken from the wild (rather than being already dead, landfill-bound byproducts), then dissection adds environmental harm on top of animal welfare harms—so the justification for allowing dissection collapses."}, "position": {"x": 1700.0, "y": 140}}, {"data": {"id": "e-arg-f7db488bb8", "source": "arg-f7db488bb8", "target": "arg-507f43e3a3", "ls": "solid", "label": "rebut", "detail": "arg-f7db488bb8 (AG2 defeat) → arg-507f43e3a3\nattack: rebut\ntarget_field: Conc\ntarget_statement: the best interpretation of the issue supports allowing students to dissect animals."}}, {"data": {"id": "arg-e6f06e25ba", "kind": "defeat", "label": "AG1 defeat\nThe target’s key negation assumption is ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-e6f06e25ba\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-f7db488bb8\",\n  \"target_field\": \"Ass\"\n}\n\nThe target’s key negation assumption is that “dissection supply is often dominated by wild-caught animals” (≈99%). That assumption is not what’s true for common classroom dissections: the predominant school specimens are already dead—reported as over 98% already deceased—and fetal pig specimens are meat-industry byproducts destined for disposal (e.g., landfill), not animals newly taken from the wild for the classroom.\n\nIf typical classroom supplies are predominantly already-deceased byproducts rather than ~99% wild-caught, then the target’s proposed ecological/welfare “high tradeoff” premise does not hold, and the ethical/ecological mitigation rationale in the pro-dissection case is substantively supported rather than undermined."}, "position": {"x": 1700, "y": 280}}, {"data": {"id": "e-arg-e6f06e25ba", "source": "arg-e6f06e25ba", "target": "arg-f7db488bb8", "ls": "dashed", "label": "undercut", "detail": "arg-e6f06e25ba (AG1 defeat) → arg-f7db488bb8\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-9042417357", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals beca", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-9042417357\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-507f43e3a3\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"With both (1) uniquely valuable learning/career-engagement benefits and (2) credible mitigation through predominantly already-deceased byproduct specimens, the best interpretation of the issue supports allowing students to dissect animals.\"\n}\n\nStudents should not dissect animals because (1) real animal dissection is not a uniquely necessary or uniquely effective way to meet biology learning goals: synthetic models and computer simulations can teach anatomy and structure–function relationships, and they can develop the same analysis skills without requiring dead/harmed animals; and (2) the claimed ethical/ecological “low tradeoff” is not reliably met in practice, because approximately 99% of dissection animals are caught in the wild, and wild-catching reduces local populations and biodiversity. If effective non-animal alternatives can achieve the learning objectives and dissection commonly depends on harmful wild-capture, then dissection is an avoidable harm rather than a justified educational method."}, "position": {"x": 1870.0, "y": 140}}, {"data": {"id": "e-arg-9042417357", "source": "arg-9042417357", "target": "arg-507f43e3a3", "ls": "solid", "label": "rebut", "detail": "arg-9042417357 (AG2 defeat) → arg-507f43e3a3\nattack: rebut\ntarget_field: Conc\ntarget_statement: With both (1) uniquely valuable learning/career-engagement benefits and (2) credible mitigation through predominantly already-deceased byproduct specimens, the best interpretation of the issue supports allowing students to dissect animals."}}, {"data": {"id": "arg-112431228b", "kind": "defeat", "label": "AG1 defeat\nThe target’s ethical/ecological premise ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-112431228b\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-9042417357\",\n  \"target_field\": \"Ass\"\n}\n\nThe target’s ethical/ecological premise depends on a weak negation assumption: that dissection “commonly depends on harmful wild-capture” (about 99% of specimens are wild-caught) such that dissection reliably reduces local populations and biodiversity.\n\nBut in typical school dissection programs, this is not the case: most specimens are already deceased (over 98%), and the fetal pigs commonly used are meat-industry byproducts destined for landfill. If the specimens are predominantly already dead byproducts rather than newly taken from the wild, then dissection does not reliably add biodiversity harm via wild capture—so the target’s claim of a non-mitigated, environmentally damaging “low tradeoff” failure is undermined."}, "position": {"x": 1870, "y": 280}}, {"data": {"id": "e-arg-112431228b", "source": "arg-112431228b", "target": "arg-9042417357", "ls": "dashed", "label": "undercut", "detail": "arg-112431228b (AG1 defeat) → arg-9042417357\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-83dadc3093", "kind": "defeat", "label": "AG2 defeat\nThe pro-dissection case’s ethical point ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-83dadc3093\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-507f43e3a3\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"prohibiting dissection doesn’t meaningfully “save” those animals; it mainly removes an educational benefit while leaving those byproducts to be discarded\"\n}\n\nThe pro-dissection case’s ethical point depends on the assumption that if schools stopped dissecting, they would not meaningfully “save” animals—i.e., that the relevant specimens are mainly byproducts that would simply be discarded anyway. But if dissection specimens are predominantly obtained through wild-capture (about 99%), then dissection demand is part of what drives that capture. In that case, prohibiting dissection would reduce the need to catch animals for classroom use, helping protect local populations and biodiversity rather than leaving a comparable number of animals to be killed anyway. Therefore, the claim that dissection has a low incremental ethical/ecological cost because it doesn’t meaningfully change what happens to the animals is not substantively supported."}, "position": {"x": 2040.0, "y": 140}}, {"data": {"id": "e-arg-83dadc3093", "source": "arg-83dadc3093", "target": "arg-507f43e3a3", "ls": "dashed", "label": "undercut", "detail": "arg-83dadc3093 (AG2 defeat) → arg-507f43e3a3\nattack: undercut\ntarget_field: Ass\ntarget_statement: prohibiting dissection doesn’t meaningfully “save” those animals; it mainly removes an educational benefit while leaving those byproducts to be discarded"}}, {"data": {"id": "arg-08aad6444c", "kind": "counter", "label": "AG1 counter\nThe ethical “low incremental cost” claim", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-08aad6444c\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-83dadc3093\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"the relevant dissection specimens are predominantly obtained through wild-capture (about 99%) so dissection demand meaningfully drives that capture\"\n}\n\nThe ethical “low incremental cost” claim is supported because, in the common classroom practice the policy question targets, dissection specimens largely come from a food-production byproduct pipeline rather than from fresh wild-capture that would be reduced if schools stopped. In particular, fetal pigs used for dissection are produced in the meat industry and are destined for disposal (landfill). That means classroom demand does not determine how many of these animals are captured/killed in the first place; the number is driven primarily by meat production. So even if some non-byproduct sourcing exists somewhere in the supply chain, the relevant classroom case still has the core feature needed for mitigation: students are dissecting predominantly already-dead byproduct animals, making dissection comparatively low incremental welfare/ecological cost rather than a practice that relies on substantial wild-capture harms."}, "position": {"x": 2040, "y": 280}}, {"data": {"id": "e-arg-08aad6444c", "source": "arg-08aad6444c", "target": "arg-83dadc3093", "ls": "dashed", "label": "undercut", "detail": "arg-08aad6444c (AG1 counter) → arg-83dadc3093\nattack: undercut\ntarget_field: Ass\ntarget_statement: the relevant dissection specimens are predominantly obtained through wild-capture (about 99%) so dissection demand meaningfully drives that capture"}}, {"data": {"id": "end-arg-44beb2ed62", "label": "終了: overruled（反論できず敗北）"}, "position": {"x": 170, "y": 665.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "end-arg-7b477dcd79", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 1360, "y": 385.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "end-arg-507f43e3a3", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 2040, "y": 385.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 2210, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>30<\/td><\/tr><tr><td>attack_turn_count<\/td><td>27<\/td><\/tr><tr><td>main_argument_count<\/td><td>3<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>1<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.106276<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Students should **not** dissect animals in standard school biology classes; schools should use high-quality non-animal alternatives (synthetic models and computer/virtual dissection) that teach the same anatomy and structure–function concepts without relying on killing or sourcing sentient animals.\n\n### Why this is the best-supported conclusion\n1. **Real animal dissection is not required for core learning outcomes**\n   - The dissection opponent’s point is decisive here: major biology education frameworks (e.g., AP Biology/NGSS) do not require real animal dissection to achieve the expected core competencies.\n   - Likewise, the argument that dissection is primarily for biology education (not medical training) doesn’t rescue it, because the relevant question is whether dissection is **uniquely necessary** when effective alternatives exist.\n\n2. **Medical training doesn’t depend on dissection**\n   - The “no U.S./Canadian medical schools use animals for physician training” claim matters because it undercuts the idea that dissection is a prerequisite for legitimate career pathways in medicine.\n   - While dissection may motivate some students toward science generally, motivation alone doesn’t outweigh avoidable harm when the standards’ learning goals can be met with safer methods.\n\n3. **Non-animal alternatives can cover the learning goals**\n   - The anti-dissection case argues that synthetic models and computer simulations can teach anatomy/structure–function relationships **as well or better**, while also supporting the key reasoning and analysis skills teachers want students to develop.\n   - The pro-dissection case emphasizes tactile experience, fine motor skills, and “aha moments,” but it does not establish—by the level of evidentiary certainty the standard requires—that these benefits are **uniquely irreplaceable** relative to well-designed non-animal labs.\n\n4. **Ethical/ecological “mitigation” is not reliably established**\n   - The pro-dissection position relies on a mitigation claim: most specimens are already dead (e.g., “over 98%”) and common fetal pig specimens are meat-industry byproducts destined for landfill.\n   - The anti-dissection position directly attacks the reliability of that mitigation by claiming around **99%** of dissection animals are wild-caught and that wild-capture harms local populations and biodiversity.\n   - In the debate, this key factual dispute about sourcing was not conclusively resolved. Because the ethical justification for allowing dissection depends on this being true (predominantly already-dead/byproduct animals, not wild-caught), the “low tradeoff” premise cannot be treated as established.\n\n### The most important unresolved point (and why it still leads to “no”)\nThe specific, unresolved issue is **how reliably dissection specimens are already dead/byproduct animals versus wild-caught animals** (and thus the true magnitude of animal welfare and biodiversity harm). Since that central mitigation claim isn’t credibly settled, schools can’t justify dissecting animals on an evidence-based “reduced harm” rationale—especially when alternatives are available that can meet the learning objectives.\n\n### Bottom line\nGiven (i) the lack of requirement for dissection in core standards/medical training, (ii) credible effectiveness of non-animal alternatives for anatomy and structure–function learning, and (iii) unresolved reliability around the ethical/ecological mitigation claim, the best-supported policy answer is **no: students should not dissect animals**.<\/pre><\/details><div>justification_status: <b>fallback_no_consensus<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}], "schema": [{"run": 1, "question": "Should students dissect animals?", "elements": [{"data": {"id": "arg-dd12b3edaf", "kind": "main", "label": "AG1 main\nYes—students should dissect animals in s", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-dd12b3edaf\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection-based labs are structured biology learning activities in which students examine real animal anatomy through direct hands-on observation and manipulation.\",\n            \"In school biology, direct engagement with real biological structures provides more meaningful learning than learning that relies only on indirect substitutes (e.g., text-only or purely secondhand materials).\"\n          ],\n          \"weak_negation\": [\n            \"No evidence exists that, in typical school implementations, dissection-based labs do not involve students directly examining real animal anatomy.\"\n          ]\n        },\n        \"consequent\": \"Dissection-based labs provide students with more meaningful biology learning opportunities.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection-based labs provide students with more meaningful biology learning opportunities.\",\n            \"Dissection requires careful, precise handling and analysis (e.g., cutting, separating, and identifying structures), which can develop fine motor skills, hand-eye coordination, and critical thinking.\"\n          ],\n          \"weak_negation\": [\n            \"No evidence exists that students can develop these fine motor skills, hand-eye coordination, and critical thinking from dissection activities as effectively without performing a comparable hands-on dissection task.\"\n          ]\n        },\n        \"consequent\": \"Dissection helps develop students’ fine motor skills, hand-eye coordination, and critical thinking.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection helps develop students’ fine motor skills, hand-eye coordination, and critical thinking.\",\n            \"Hands-on experiences that meaningfully engage students in real biology can increase student enthusiasm for science and encourage interest in science careers.\"\n          ],\n          \"weak_negation\": [\n            \"No evidence exists that dissection-based labs systematically fail to increase student enthusiasm or career interest in typical school contexts.\"\n          ]\n        },\n        \"consequent\": \"Dissection can increase student enthusiasm for science and encourage interest in science careers.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection can increase student enthusiasm for science and encourage interest in science careers.\",\n            \"Animal dissection is a productive use of animals that are already dead or agricultural byproducts, rather than creating a need to harm additional animals (e.g., over 98% of dissected animals were already deceased, and fetal pigs are meat industry byproducts destined for landfills).\"\n          ],\n          \"weak_negation\": [\n            \"No evidence exists that the relevant school dissection programs require creating new demand for live animals beyond what was already going to be dead/byproduct.\"\n          ]\n        },\n        \"consequent\": \"Animal dissection is a productive use of animals that are already dead or agricultural byproducts, rather than creating a need to harm additional animals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection-based labs provide students with more meaningful biology learning opportunities.\",\n            \"Dissection helps develop students’ fine motor skills, hand-eye coordination, and critical thinking.\",\n            \"Dissection can increase student enthusiasm for science and encourage interest in science careers.\",\n            \"Animal dissection is a productive use of animals that are already dead or agricultural byproducts, rather than creating a need to harm additional animals.\"\n          ],\n          \"weak_negation\": [\n            \"No strong countervailing reason exists that these educational benefits are outweighed by harms that go beyond using already-deceased/byproduct animals in school dissection.\"\n          ]\n        },\n        \"consequent\": \"Yes—students should dissect animals in school biology when the dissection uses already-deceased/agricultural byproduct animals, because it meaningfully improves learning, builds valuable skills, can inspire science interest and careers, and does not require harming additional animals.\"\n      }\n    ],\n    \"Conc\": [\n      \"Dissection-based labs provide students with more meaningful biology learning opportunities.\",\n      \"Dissection helps develop students’ fine motor skills, hand-eye coordination, and critical thinking.\",\n      \"Dissection can increase student enthusiasm for science and encourage interest in science careers.\",\n      \"Animal dissection is a productive use of animals that are already dead or agricultural byproducts, rather than creating a need to harm additional animals.\",\n      \"Yes—students should dissect animals in school biology when the dissection uses already-deceased/agricultural byproduct animals, because it meaningfully improves learning, builds valuable skills, can inspire science interest and careers, and does not require harming additional animals.\"\n    ],\n    \"Ass\": [\n      \"No evidence exists that, in typical school implementations, dissection-based labs do not involve students directly examining real animal anatomy.\",\n      \"No evidence exists that students can develop these fine motor skills, hand-eye coordination, and critical thinking from dissection activities as effectively without performing a comparable hands-on dissection task.\",\n      \"No evidence exists that dissection-based labs systematically fail to increase student enthusiasm or career interest in typical school contexts.\",\n      \"No evidence exists that the relevant school dissection programs require creating new demand for live animals beyond what was already going to be dead/byproduct.\",\n      \"No strong countervailing reason exists that these educational benefits are outweighed by harms that go beyond using already-deceased/byproduct animals in school dissection.\"\n    ]\n  }\n}"}, "position": {"x": 510.0, "y": 0}}, {"data": {"id": "arg-b104640de1", "kind": "defeat", "label": "AG2 defeat\nNo—students should not dissect animals i", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-b104640de1\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-dd12b3edaf\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Yes—students should dissect animals in school biology when the dissection uses already-deceased/agricultural byproduct animals, because it meaningfully improves learning, builds valuable skills, can inspire science interest and careers, and does not require harming additional animals.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of animals used for dissection in schools are caught in the wild rather than being captive-bred or guaranteed non-wild-caught byproducts.\",\n            \"Wild-catching is part of the typical supply chain for dissection animals.\"\n          ],\n          \"weak_negation\": [\n            \"There is no evidence that typical school dissection supply uses mostly captive-bred (non-wild-caught) animals instead of wild-caught animals.\"\n          ]\n        },\n        \"consequent\": \"In typical school dissection programs, supplying dissection animals relies on wild capture rather than only using already-deceased/byproduct animals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In typical school dissection programs, supplying dissection animals relies on wild capture rather than only using already-deceased/byproduct animals.\",\n            \"Wild-capture decreases local wildlife populations and reduces biodiversity.\"\n          ],\n          \"weak_negation\": [\n            \"It is not the case that wild capture for school dissections leaves local populations and biodiversity unaffected.\"\n          ]\n        },\n        \"consequent\": \"Dissection supply through wild capture causes population decline and biodiversity loss.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection supply through wild capture causes population decline and biodiversity loss.\",\n            \"Wild-capture and transport are ethically harmful to animals (e.g., stress, injury, death).\"\n          ],\n          \"weak_negation\": [\n            \"There is no evidence that the wild-capture-and-transport process used for dissection avoids significant animal suffering.\"\n          ]\n        },\n        \"consequent\": \"School animal dissection inherently entails ethically harmful treatment of animals and environmental biodiversity loss.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"College Board AP Biology and NGSS do not require animal dissection to meet mandated biology learning objectives.\",\n            \"No U.S. or Canadian medical schools use animals for physician training.\"\n          ],\n          \"weak_negation\": [\n            \"There is no evidence that animal dissection is currently required for physician training in U.S./Canadian medical schools or for AP Biology/NGSS competencies.\"\n          ]\n        },\n        \"consequent\": \"Animal dissection is not necessary to achieve the required biology/medical education goals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"School animal dissection inherently entails ethically harmful treatment of animals and environmental biodiversity loss.\",\n            \"Animal dissection is not necessary to achieve the required biology/medical education goals.\",\n            \"Synthetic models and computer simulations can teach students biology at least as effectively as dissection.\"\n          ],\n          \"weak_negation\": [\n            \"There is no evidence that effective alternatives are unavailable for typical schools where dissection is proposed.\"\n          ]\n        },\n        \"consequent\": \"No—students should not dissect animals in school biology.\"\n      }\n    ],\n    \"Conc\": [\n      \"In typical school dissection programs, supplying dissection animals relies on wild capture rather than only using already-deceased/byproduct animals.\",\n      \"Dissection supply through wild capture causes population decline and biodiversity loss.\",\n      \"School animal dissection inherently entails ethically harmful treatment of animals and environmental biodiversity loss.\",\n      \"Animal dissection is not necessary to achieve the required biology/medical education goals.\",\n      \"No—students should not dissect animals in school biology.\"\n    ],\n    \"Ass\": [\n      \"There is no evidence that typical school dissection supply uses mostly captive-bred (non-wild-caught) animals instead of wild-caught animals.\",\n      \"It is not the case that wild capture for school dissections leaves local populations and biodiversity unaffected.\",\n      \"There is no evidence that the wild-capture-and-transport process used for dissection avoids significant animal suffering.\",\n      \"There is no evidence that animal dissection is currently required for physician training in U.S./Canadian medical schools or for AP Biology/NGSS competencies.\",\n      \"There is no evidence that effective alternatives are unavailable for typical schools where dissection is proposed.\"\n    ]\n  }\n}"}, "position": {"x": 0.0, "y": 140}}, {"data": {"id": "e-arg-b104640de1", "source": "arg-b104640de1", "target": "arg-dd12b3edaf", "ls": "solid", "label": "rebut", "detail": "arg-b104640de1 (AG2 defeat) → arg-dd12b3edaf\nattack: rebut\ntarget_field: Conc\ntarget_statement: Yes—students should dissect animals in school biology when the dissection uses already-deceased/agricultural byproduct animals, because it meaningfully improves learning, builds valuable skills, can inspire science interest and careers, and does not require harming additional animals."}}, {"data": {"id": "arg-2d91422a80", "kind": "defeat", "label": "AG1 defeat\nThere is evidence that typical school di", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-2d91422a80\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-b104640de1\",\n  \"target_field\": \"Ass\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Over 98% of animals used for dissection were already deceased before classroom use.\",\n            \"Fetal pigs commonly used for dissection are meat-industry byproducts destined for landfills.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical school dissection animals are predominantly agricultural byproducts of slaughter/landfill disposal and are not live wild-caught animals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Typical school dissection animals are predominantly agricultural byproducts of slaughter/landfill disposal and are not live wild-caught animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical school dissection supply uses mostly non-wild-caught animals (e.g., captive-bred/slaughter-byproduct animals) rather than wild-caught animals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Typical school dissection supply uses mostly non-wild-caught animals (e.g., captive-bred/slaughter-byproduct animals) rather than wild-caught animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"There is evidence that typical school dissection supply uses mostly captive-bred (non-wild-caught) animals rather than wild-caught animals.\"\n      }\n    ],\n    \"Conc\": [\n      \"Typical school dissection animals are predominantly agricultural byproducts of slaughter/landfill disposal and are not live wild-caught animals.\",\n      \"Typical school dissection supply uses mostly non-wild-caught animals (e.g., captive-bred/slaughter-byproduct animals) rather than wild-caught animals.\",\n      \"There is evidence that typical school dissection supply uses mostly captive-bred (non-wild-caught) animals rather than wild-caught animals.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0, "y": 280}}, {"data": {"id": "e-arg-2d91422a80", "source": "arg-2d91422a80", "target": "arg-b104640de1", "ls": "dashed", "label": "undercut", "detail": "arg-2d91422a80 (AG1 defeat) → arg-b104640de1\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-c815110a3a", "kind": "defeat", "label": "AG2 defeat\nNo—students should not dissect animals i", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-c815110a3a\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-dd12b3edaf\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Yes—students should dissect animals in school biology when the dissection uses already-deceased/agricultural byproduct animals, because it meaningfully improves learning, builds valuable skills, can inspire science interest and careers, and does not require harming additional animals.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target argument holds that dissection meaningfully improves learning and builds valuable skills/interest compared with relying on indirect substitutes.\",\n            \"Synthetic models and computer simulations can teach biology anatomy at least as effectively as dissection for achieving students’ learning objectives.\"\n          ],\n          \"weak_negation\": [\n            \"It is not the case that dissection provides uniquely superior learning outcomes (compared with high-quality simulations/models) for typical school settings.\"\n          ]\n        },\n        \"consequent\": \"Dissection does not provide unique educational benefits relative to non-animal alternatives (synthetic models and simulations).\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection does not provide unique educational benefits relative to non-animal alternatives (synthetic models and simulations).\",\n            \"Students can learn required anatomy concepts and related competencies using non-animal instructional approaches rather than dead animals.\"\n          ],\n          \"weak_negation\": [\n            \"It is not the case that non-animal alternatives are unavailable to typical schools that propose dissection.\"\n          ]\n        },\n        \"consequent\": \"Students can meet the intended biology learning goals without dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Students can meet the intended biology learning goals without dissection.\",\n            \"Animal dissection is unnecessary and we oppose it because the practice depends on animal exploitation and is harmful to animals and the environment.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"No—students should not dissect animals in school biology; non-animal alternatives should be used instead.\"\n      }\n    ],\n    \"Conc\": [\n      \"Dissection does not provide unique educational benefits relative to non-animal alternatives (synthetic models and simulations).\",\n      \"Students can meet the intended biology learning goals without dissection.\",\n      \"No—students should not dissect animals in school biology; non-animal alternatives should be used instead.\"\n    ],\n    \"Ass\": [\n      \"It is not the case that dissection provides uniquely superior learning outcomes (compared with high-quality simulations/models) for typical school settings.\",\n      \"It is not the case that non-an
