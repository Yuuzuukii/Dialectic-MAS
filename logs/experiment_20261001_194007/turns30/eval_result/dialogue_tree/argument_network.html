ection provides more meaningful biology learning than simulations/models in typical school settings.\",\n            \"Dissection requires careful, precise handling and analysis (e.g., cutting, separating, and identifying structures), which develops fine motor skills, hand-eye coordination, and critical thinking.\"\n          ],\n          \"weak_negation\": [\n            \"No evidence exists that simulations/models can replicate the fine motor/hand-eye coordination demands of physically cutting and separating real tissue at the same level.\"\n          ]\n        },\n        \"consequent\": \"Dissection uniquely builds fine-motor skills, hand-eye coordination, and critical thinking compared with simulations/models.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection provides more meaningful biology learning than simulations/models in typical school settings.\",\n            \"Dissection uniquely builds fine-motor skills, hand-eye coordination, and critical thinking compared with simulations/models.\"\n          ],\n          \"weak_negation\": [\n            \"No evidence exists that simulations/models can match dissection across these learning outcomes (meaningful anatomical understanding plus lab-skill development) in typical school implementations.\"\n          ]\n        },\n        \"consequent\": \"Dissection provides uniquely superior learning outcomes compared with high-quality simulations/models in typical school settings.\"\n      }\n    ],\n    \"Conc\": [\n      \"Dissection provides more meaningful biology learning than simulations/models in typical school settings.\",\n      \"Dissection uniquely builds fine-motor skills, hand-eye coordination, and critical thinking compared with simulations/models.\",\n      \"Dissection provides uniquely superior learning outcomes compared with high-quality simulations/models in typical school settings.\"\n    ],\n    \"Ass\": [\n      \"No evidence exists that, in typical school settings, simulations/models can provide the same level of direct engagement with real animal anatomical structures as dissection.\",\n      \"No evidence exists that simulations/models can replicate the fine motor/hand-eye coordination demands of physically cutting and separating real tissue at the same level.\",\n      \"No evidence exists that simulations/models can match dissection across these learning outcomes (meaningful anatomical understanding plus lab-skill development) in typical school implementations.\"\n    ]\n  }\n}"}, "position": {"x": 170, "y": 280}}, {"data": {"id": "e-arg-4b5c108e00", "source": "arg-4b5c108e00", "target": "arg-c815110a3a", "ls": "dashed", "label": "undercut", "detail": "arg-4b5c108e00 (AG1 defeat) → arg-c815110a3a\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-0a7919b22e", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals in s", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-0a7919b22e\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-dd12b3edaf\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Yes—students should dissect animals in school biology when the dissection uses already-deceased/agricultural byproduct animals, because it meaningfully improves learning, builds valuable skills, can inspire science interest and careers, and does not require harming additional animals.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of animals used for dissection in schools are caught in the wild rather than being captive-bred or guaranteed non-wild-caught byproducts.\",\n            \"Wild-catching is part of the typical supply chain for dissection animals.\"\n          ],\n          \"weak_negation\": [\n            \"There is no evidenc l schools use animals for physician training.\",\n            \"Synthetic models and computer simulations can teach students biology (including anatomy) at least as effectively as dissection for school learning goals.\"\n          ],\n          \"weak_negation\": [\n            \"There is no evidence that effective non-animal alternatives are unavailable in typical schools where dissection is proposed.\"\n          ]\n        },\n        \"consequent\": \"Students should not dissect animals in school biology; non-animal alternatives should be used.\"\n      }\n    ],\n    \"Conc\": [\n      \"Typical school dissection supply relies on wild-caught animals rather than only already-deceased/agricultural byproducts.\",\n      \"Wild-caught dissection supply causes population decline and biodiversity loss.\",\n      \"Wild-capture and transport for school dissection entail ethically harmful suffering to animals.\",\n      \"School animal dissection is ethically and environmentally unjustified.\",\n      \"Students should not dissect animals in school biology; non-animal alternatives should be used.\"\n    ],\n    \"Ass\": [\n      \"There is no evidence that typical school dissection supply uses mostly captive-bred (non-wild-caught) animals instead of wild-caught animals.\",\n      \"It is not the case that wild capture for school dissections leaves local populations and biodiversity unaffected.\",\n      \"It is not the case that the wild-capture-and-transport process used for dissection avoids significant animal suffering.\",\n      \"It is not the case that animal and environmental harms of typical school dissection are negligible or fully avoided.\",\n      \"There is no evidence that effective non-animal alternatives are unavailable in typical schools where dissection is proposed.\"\n    ]\n  }\n}"}, "position": {"x": 850.0, "y": 140}}, {"data": {"id": "e-arg-dfc1ed0b04", "source": "arg-dfc1ed0b04", "target": "arg-dd12b3edaf", "ls": "solid", "label": "rebut", "detai wild-capture.\",\n      \"It is not the case that wild capture for school dissections leaves local populations and biodiversity unaffected.\",\n      \"It is not the case that wild-capture-and-transport steps avoid significant animal suffering.\",\n      \"It is not the case that these animal and environmental harms are negligible or fully avoided in typical school dissection programs.\",\n      \"There is no evidence that effective non-animal alternatives are unavailable in typical schools that propose dissection.\"\n    ]\n  }\n}"}, "position": {"x": 1020.0, "y": 140}}, {"data": {"id": "e-arg-9667fc9bd6", "source": "arg-9667fc9bd6", "target": "arg-dd12b3edaf", "ls": "solid", "label": "rebut", "detail": "arg-9667fc9bd6 (AG2 defeat) → arg-dd12b3edaf\nattack: rebut\ntarget_field: Conc\ntarget_statement: Yes—students should dissect animals in school biology when the dissection uses already-deceased/agricultural byproduct animals, because it meaningfully improves learning, builds valuable skills, can inspire science interest and careers, and does not require harming additional animals."}}, {"data": {"id": "arg-3c1829f09d", "kind": "defeat", "label": "AG1 defeat\nThe target’s weak_negation assumption—\"I", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-3c1829f09d\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-9667fc9bd6\",\n  \"target_field\": \"Ass\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Over 98% of animals used in school dissection were already deceased before the dissection lab.\",\n            \"Fetal pigs used in dissection are meat industry byproducts destined for landfills.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical school dissection programs use mostly already-deceased/agricultural byproduct animals, rather than relying primarily on wild-caught animals that must be captured for the lab.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Typical school dissection programs use mostly already-deceased/agricultural byproduct animals, rather than relying primarily on wild-caught animals that must be captured for the lab.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The target’s weak_negation assumption—\\\"It is not the case that typical school dissection programs use mostly already-deceased/byproduct animals that avoid wild-capture\\\"—is false (so that assumption cannot support the target’s wild-capture-based harm claims).\"\n      }\n    ],\n    \"Conc\": [\n      \"Typical school dissection programs use mostly already-deceased/agricultural byproduct animals, rather than relying primarily on wild-caught animals that must be captured for the lab.\",\n      \"The target’s weak_negation assumption—\\\"It is not the case that typical school dissection programs use mostly already-deceased/byproduct animals that avoid wild-capture\\\"—is false (so that assumption cannot support the target’s wild-capture-based harm claims).\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 1020, "y": 280}}, {"data": {"id": "e-arg-3c1829f09d", "source": "arg-3c1829f09d", "target": "arg-9667fc9bd6", "ls": "dashed", "label": "undercut", "detail": "arg-3c1829f09d (AG1 defeat) → arg-9667fc9bd6\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-b18fb86cdc", "kind": "main", "label": "AG2 main\nNo—students should not dissect animals i", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#2ca02c", "detail": "{\n  \"id\": \"arg-b18fb86cdc\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"justified\",\n  \"closed_by_budget\": false\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"College Board AP Biology and NGSS learning objectives for biology can be met without requiring dissection of real animals.\",\n            \"No U.S. or Canadian medical schools use animals for physician training, and medical studies do not require or benefit from animal dissection for student learning in school biology.\",\n            \"Synthetic models and computer simulations can teach biology (including anatomy) at least as effectively as dissection.\"\n          ],\n          \"weak_negation\": [\n            \"There is no evidence that meeting the relevant biology learning objectives uniquely requires hands-on dissection of real animals in typical school settings.\"\n          ]\n        },\n        \"consequent\": \"Non-animal alternatives can meet students’ required biology learning goals without dissection of real animals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Non-animal alternatives can meet students’ required biology learning goals without dissection of real animals.\",\n            \"Because alternatives can meet the goals, dissection would be an educationally unnecessary imposition of animal harm, which we oppose.\"\n          ],\n          \"weak_negation\": [\n            \"It is not the case that dissection provides uniquely necessary learning outcomes that alternatives cannot provide.\"\n          ]\n        },\n        \"consequent\": \"If dissection is not educationally necessary, it is unjustified to require students to participate in dissection of real animals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Non-animal alternatives can meet students’ required biology learning goals without dissection of real animals.\",\n            \"Animal dissection in schools involves harming animals (including through sourcing and handling practices).\"\n          ],\n          \"weak_negation\": [\n            \"It is not the case that animal harm from school dissection cannot be avoided when alternatives are used.\"\n          ]\n        },\n        \"consequent\": \"Because alternatives can meet learning goals, the harms of school dissection are avoidable.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"If dissection is not educationally necessary, it is unjustified to require students to participate in dissection of real animals.\",\n            \"Because alternatives can meet learning goals, the harms of school dissection are avoidable.\",\n            \"Animal dissection supply methods are inhumane and bad for the environment (including harm to biodiversity).\"\n          ],\n          \"weak_negation\": [\n            \"It is not the case that animal and environmental harms from school dissection are negligible or fully mitigated in typical implementations.\"\n          ]\n        },\n        \"consequent\": \"Therefore, school animal dissection is ethically and environmentally unjustified.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Therefore, school animal dissection is ethically and environmentally unjustified.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"No—students should not dissect animals in school biology; non-animal alternatives should be used.\"\n      }\n    ],\n    \"Conc\": [\n      \"Non-animal alternatives can meet students’ required biology learning goals without dissection of real animals.\",\n      \"If dissection is not educationally necessary, it is unjustified to require students to participate in dissection of real animals.\",\n      \"Because alternatives can meet learning goals, the harms of school dissection are avoidable.\",\n      \"Therefore, school animal dissection is ethically and environmentally unjustified.\",\n      \"No—students should not dissect animals in school biology; non-animal alternatives should be used.\"\n    ],\n    \"Ass\": [\n      \"There is no evidence that meeting the relevant biology learning objectives uniquely requires hands-on dissection of real animals in typical school settings.\",\n      \"It is not the case that dissection provides uniquely necessary learning outcomes that alternatives cannot provide.\",\n      \"It is not the case that animal harm from school dissection cannot be avoided when alternatives are used.\",\n      \"It is not the case that animal and environmental harms from school dissection are negligible or fully mitigated in typical implementations.\"\n    ]\n  }\n}"}, "position": {"x": 1190, "y": 0}}, {"data": {"id": "end-arg-dd12b3edaf", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 1020, "y": 385.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "end-arg-b18fb86cdc", "label": "終了: justified（全ての攻撃を撃退）"}, "position": {"x": 1190, "y": 105.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>16<\/td><\/tr><tr><td>attack_turn_count<\/td><td>14<\/td><\/tr><tr><td>main_argument_count<\/td><td>2<\/td><\/tr><tr><td>justified_proven_count<\/td><td>1<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>0<\/td><\/tr><tr><td>defensible_count<\/td><td>1<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.1256<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Students should **not** dissect animals in school biology; schools should use **non-animal alternatives** (synthetic models, lab-safe preserved alternatives when appropriate, and computer simulations) to teach anatomy and related learning goals.\n\n### Why this answers the question\n1. **The required learning goals don’t depend on real-animal dissection**\n   - The biology learning objectives set by **AP Biology** and **NGSS** can be met **without** requiring students to dissect real animals.\n   - There’s also no indication that real-animal dissection is necessary for the kinds of science preparation those programs aim to provide, and medical training norms don’t rely on animal dissection for physician training in the way would be implied if dissection were indispensable for learning.\n\n2. **Even if dissection can be educational, it is not educationally necessary**\n   - It’s reasonable to think dissection can provide memorable hands-on experiences and can support learning and lab engagement.\n   - But the key point is that the same core biology objectives can be achieved using alternatives. When the “same learning outcomes” are available without requiring dissection, then requiring dissection becomes an avoidable imposition.\n\n3. **Alternatives make the ethical and environmental burden avoidable**\n   - Animal dissection in schools is connected to **animal harm** and (in many supply chains) **environmental damage**.\n   - Importantly, the anti-dissection concern is not only about whether an animal is dead when it reaches the classroom, but also about the broader sourcing/handling practices used to provide specimens.\n\n4. **Addressing the pro-dissection claim about “already-deceased” byproducts**\n   - It may be true in some cases that many specimens come from the meat industry and are “already deceased” before classroom use (for example, fetal pigs as meat-industry byproducts).\n   - However, even granting that, requiring dissection still fails the “necessity” test: if alternatives teach just as well or better, then the harms tied to dissection practices (including procurement and handling, plus environmental impacts) are **avoidable**, and schools should not impose them on students.\n\n### Bottom line\nBecause **non-animal methods can meet the required biology learning goals** and make the associated **animal and environmental harms avoidable**, school policies should shift away from animal dissection and toward **synthetic/computer-based alternatives** rather than requiring students to dissect real animals.<\/pre><\/details><div>justification_status: <b>ag2_main_justified<\/b><\/div><div>consensus_reached: <b>True<\/b><\/div>"}]}};
