<script>
const DATA = {"animal_dissection": {"no_schema": [{"run": 1, "question": "Should students dissect animals?", "elements": [{"data": {"id": "arg-50338ff682", "kind": "main", "label": "AG1 main\nYes—students should dissect animals beca", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"arg-50338ff682\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"overruled\",\n  \"closed_by_budget\": false\n}\n\nYes—students should dissect animals because it meaningfully improves biology learning and does so using animals that are already dead or meat-industry byproducts.\n\nFirst, dissection provides learning opportunities that purely indirect methods often can’t: students can work with real anatomical structures, which strengthens biology understanding through direct observation and careful, task-based reasoning. That hands-on work also develops fine motor skills and hand–eye coordination, and it trains critical thinking as students predict, locate, and interpret organ systems during the procedure.\n\nSecond, dissection can increase student motivation and career interest in science. Handling real specimens can create “aha moments” that make scientific fields feel tangible and rewarding, which can encourage more students to pursue STEM pathways.\n\nThird, dissection is a productive use of dead animals rather than an ethical waste: over 98% of dissected animals were already deceased. In cases like fetal pigs, the specimens are typically meat-industry byproducts that would otherwise be destined for landfills.\n\nGiven these combined educational benefits (skills, understanding, critical thinking), motivational benefits (career inspiration), and the practical ethical point that most animals used are already dead or byproducts, animal dissection is a worthwhile component of teaching biology."}, "position": {"x": 0.0, "y": 0}}, {"data": {"id": "arg-e582760de4", "kind": "defeat", "label": "AG2 defeat\nI hold true that school animal dissectio", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-e582760de4\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-50338ff682\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"dissection does so using animals that are already dead or meat-industry byproducts.\"\n}\n\nI hold true that school animal dissection is not primarily carried out with animals that were already dead or meat-industry byproducts. Instead, dissection programs commonly rely on animals sourced from the wild: wild-capture to supply specimens reduces local populations and biodiversity. Because the animal “supply chain” is typically built on hunting/collecting animals, the ethical tradeoff in the pro-dissection case is not “no harm, just using dead specimens,” but harm through inhumane wild-taking plus ecological damage. Therefore, the “already dead/byproducts” rationale does not support the claim that students should dissect animals."}, "position": {"x": 0.0, "y": 140}}, {"data": {"id": "e-arg-e582760de4", "source": "arg-e582760de4", "target": "arg-50338ff682", "ls": "dashed", "label": "undercut", "detail": "arg-e582760de4 (AG2 defeat) → arg-50338ff682\nattack: undercut\ntarget_field: Ass\ntarget_statement: dissection does so using animals that are already dead or meat-industry byproducts."}}, {"data": {"id": "arg-371356967b", "kind": "counter", "label": "AG1 counter\nI hold true that, for school dissection,", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-371356967b\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-e582760de4\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"Instead, dissection programs commonly rely on animals sourced from the wild: wild-capture to supply specimens reduces local populations and biodiversity.\"\n}\n\nI hold true that, for school dissection, the relevant ethical “supply chain” usually involves specimens that are already dead—commonly obtained from agricultural/food production channels—so the practice does not inherently depend on wild-capture that reduces local populations and biodiversity. When dissection uses animals that are already produced and killed for meat (i.e., meat-industry byproducts), students are not adding an extra layer of hunting/collecting pressure on wild animals; instead, the specimens are repurposed for educational use. Therefore, the “already dead/byproducts” rationale remains substantively applicable to supporting the case for allowing student dissection (because it targets the specific ethical tradeoff the wild-capture critique claims is unavoidable)."}, "position": {"x": 0.0, "y": 280}}, {"data": {"id": "e-arg-371356967b", "source": "arg-371356967b", "target": "arg-e582760de4", "ls": "dashed", "label": "undercut", "detail": "arg-371356967b (AG1 counter) → arg-e582760de4\nattack: undercut\ntarget_field: Ass\ntarget_statement: Instead, dissection programs commonly rely on animals sourced from the wild: wild-capture to supply specimens reduces local populations and biodiversity."}}, {"data": {"id": "arg-e499bf999a", "kind": "defeat", "label": "AG2 defeat\nI hold true that, for school dissection,", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-e499bf999a\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-371356967b\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"the relevant ethical “supply chain” usually involves specimens that are already dead—commonly obtained from agricultural/food production channels—so the practice does not inherently depend on wild-capture that reduces local populations and biodiversity\"\n}\n\nI hold true that, for school dissection, the relevant supply chain usually does *not* come primarily from animals that were already dead as agricultural/food byproducts. Instead, dissection specimens are predominantly sourced through wild capture, meaning the practice inherently depends on hunting/collecting wild animals. That wild-taking reduces local populations and biodiversity. So the “already dead/byproducts” rationale does not properly address the key ethical tradeoff—because wild-capture supply is typically what makes dissection harmful."}, "position": {"x": 0, "y": 420}}, {"data": {"id": "e-arg-e499bf999a", "source": "arg-e499bf999a", "target": "arg-371356967b", "ls": "dashed", "label": "undercut", "detail": "arg-e499bf999a (AG2 defeat) → arg-371356967b\nattack: undercut\ntarget_field: Ass\ntarget_statement: the relevant ethical “supply chain” usually involves specimens that are already dead—commonly obtained from agricultural/food production channels—so the practice does not inherently depend on wild-capture that reduces local populations and biodiversity"}}, {"data": {"id": "arg-a2bad54840", "kind": "main", "label": "AG2 main\nStudents should not dissect animals in s", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-a2bad54840\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nStudents should not dissect animals in school.\n\nFirst, animal dissection is not required for the biology learning goals typically assessed in the U.S./Canada—neither College Board AP Biology nor the Next Generation Science Standards requires dissection to meet those objectives. Likewise, U.S. and Canadian medical schools do not use animals for physician training.\n\nSecond, because dissection is not an instructional necessity, the ethical and environmental downsides of using dead animals are not justified by any required educational gain.\n\nThird, the learning aims can be met with alternatives—synthetic models and computer simulations—that can teach the same anatomy/physiology concepts and allow skill practice without using dead animals.\n\nSo, since dissection is not required for course standards or medical training and effective alternatives exist, students should use alternatives instead of dissecting real animals."}, "position": {"x": 510.0, "y": 0}}, {"data": {"id": "arg-dfe9d3224e", "kind": "defeat", "label": "AG1 defeat\nI hold true that even if dissection is n", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-dfe9d3224e\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a2bad54840\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"So, since dissection is not required for course standards or medical training and effective alternatives exist, students should use alternatives instead of dissecting real animals.\"\n}\n\nI hold true that even if dissection is not strictly required by specific standards (or isn’t used for medical training), it can still be justified because it uniquely advances biology education in ways models/simulations generally cannot—students get direct observation of real anatomical structures and practice the fine motor skills, hand–eye coordination, and critical thinking involved in locating and interpreting organ systems. I also hold true that the ethical/environmental tradeoff is substantially different from the “avoidable downside” picture: most dissection specimens are already deceased (over 98%), often coming from meat-industry byproducts, so dissection is typically a productive repurposing rather than additional harm. Therefore students should dissect animals when programs use properly sourced, already-deceased specimens, because the educational gains outweigh the mitigated ethical concerns and alternatives don’t fully replicate the hands-on anatomical learning dissection provides."}, "position": {"x": 170.0, "y": 140}}, {"data": {"id": "e-arg-dfe9d3224e", "source": "arg-dfe9d3224e", "target": "arg-a2bad54840", "ls": "solid", "label": "rebut", "detail": "arg-dfe9d3224e (AG1 defeat) → arg-a2bad54840\nattack: rebut\ntarget_field: Conc\ntarget_statement: So, since dissection is not required for course standards or medical training and effective alternatives exist, students should use alternatives instead of dissecting real animals."}}, {"data": {"id": "arg-43068370f1", "kind": "defeat", "label": "AG2 defeat\nThe target’s key weak_negation assumptio", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-43068370f1\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-dfe9d3224e\",\n  \"target_field\": \"Ass\"\n}\n\nThe target’s key weak_negation assumption is that “properly sourced, already-deceased specimens” are what dissection programs *typically* use—so the practice is “typically a productive repurposing rather than additional harm.” I hold true that this assumption is false: dissection-specimen supply is commonly based on wild capture, and wild-taking reduces local populations and biodiversity. Because that sourcing means additional ecological harm is often built into dissection itself, the target’s claim that the ethical/environmental tradeoff is “mitigated” by using already-deceased/byproduct specimens does not hold."}, "position": {"x": 170, "y": 280}}, {"data": {"id": "e-arg-43068370f1", "source": "arg-43068370f1", "target": "arg-dfe9d3224e", "ls": "dashed", "label": "undercut", "detail": "arg-43068370f1 (AG2 defeat) → arg-dfe9d3224e\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-fd784a39f3", "kind": "defeat", "label": "AG1 defeat\nI hold true that students should be allo", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-fd784a39f3\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a2bad54840\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"So, since dissection is not required for course standards or medical training and effective alternatives exist, students should use alternatives instead of dissecting real animals.\"\n}\n\nI hold true that students should be allowed to dissect animals when programs use properly sourced, already-deceased specimens, because the educational value of dissection is not limited to what specific standards “require” or what medical schools use. In particular, real dissections provide benefits that models/simulations generally cannot fully replace: students gain direct observation of real anatomical structures and the hands-on fine motor skills, hand–eye coordination, and critical thinking involved in locating and interpreting organ systems. I also hold true that dissection adds a substantive motivational benefit—creating “aha moments” that make scientific fields feel tangible—which can increase students’ interest in science careers. Therefore, even if dissection is not mandated by course standards or used in medical training, its unique learning and motivation gains can justify the tradeoff, especially when the ethical downside is mitigated by using already-deceased/byproduct animals."}, "position": {"x": 340.0, "y": 140}}, {"data": {"id": "e-arg-fd784a39f3", "source": "arg-fd784a39f3", "target": "arg-a2bad54840", "ls": "solid", "label": "rebut", "detail": "arg-fd784a39f3 (AG1 defeat) → arg-a2bad54840\nattack: rebut\ntarget_field: Conc\ntarget_statement: So, since dissection is not required for course standards or medical training and effective alternatives exist, students should use alternatives instead of dissecting real animals."}}, {"data": {"id": "arg-ada9ea801f", "kind": "defeat", "label": "AG2 defeat\nI can undercut the target’s key justific", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-ada9ea801f\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-fd784a39f3\",\n  \"target_field\": \"Ass\"\n}\n\nI can undercut the target’s key justification by challenging its weak negation assumption that dissection’s benefits are “generally” unique—i.e., that models/simulations cannot fully replace what students learn from real dissections.\n\nI hold that the specific learning and skill gains the target claims (direct observation of anatomical structures, fine-motor/hand–eye work, and locating/interpreting organ systems) can be taught with high-quality non-animal alternatives—synthetic models plus computer simulations and scaffolded lab activities—so those outcomes are not uniquely dependent on students cutting up dead animals. Likewise, the claimed “aha” motivational effect is not inherently tied to animal death; alternatives can still provide engaging, interactive, hands-on learning that achieves the same conceptual and motivational goals.\n\nTherefore, the target’s tradeoff calculation fails at its starting point: if the purported unique educational/motivational gains aren’t uniquely available from dissection, there’s no justified reason to impose the ethical/environmental costs of using real animals in the first place."}, "position": {"x": 340, "y": 280}}, {"data": {"id": "e-arg-ada9ea801f", "source": "arg-ada9ea801f", "target": "arg-fd784a39f3", "ls": "dashed", "label": "undercut", "detail": "arg-ada9ea801f (AG2 defeat) → arg-fd784a39f3\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-ae36ff7573", "kind": "defeat", "label": "AG1 defeat\nI hold true that, even if school standar", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-ae36ff7573\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a2bad54840\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals in school.\"\n}\n\nI hold true that, even if school standards or medical training don’t require dissection, dissection can still be substantively justified because it uniquely delivers real, three-dimensional anatomical observation plus the psychomotor practice (fine motor skills and hand–eye coordination) and critical thinking involved in locating and interpreting organ systems. I also hold true that realistic specimen work can create “aha moments” that increase student motivation toward science careers. Finally, when programs use properly sourced specimens that are already deceased and often meat-industry byproducts, dissection does not inherently depend on adding new harm; instead, it repurposes what is already produced and killed. Therefore, students should be allowed to dissect animals in school when these educational and sourcing conditions are met, rather than being limited to alternatives that generally can’t fully replicate these hands-on learning and skill benefits."}, "position": {"x": 510.0, "y": 140}}, {"data": {"id": "e-arg-ae36ff7573", "source": "arg-ae36ff7573", "target": "arg-a2bad54840", "ls": "solid", "label": "rebut", "detail": "arg-ae36ff7573 (AG1 defeat) → arg-a2bad54840\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals in school."}}, {"data": {"id": "arg-764959de06", "kind": "defeat", "label": "AG2 defeat\nThe target argument relies on a weak neg", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-764959de06\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-ae36ff7573\",\n  \"target_field\": \"Ass\"\n}\n\nThe target argument relies on a weak negation assumption: that dissection “does not inherently depend on adding new harm” when specimens are “properly sourced” and already dead/meat-industry byproducts. \n\nI hold true that school dissection generally *does* depend on added harm because the supply chain is not reliably limited to byproducts: approximately 99% of dissection animals are caught in the wild. Wild-capture to obtain specimens reduces local populations and biodiversity, and it requires continued extraction to meet ongoing classroom demand. \n\nTherefore, the ethical tradeoff the target tries to neutralize (by assuming sourcing avoids extra harm) does not hold in practice: dissection inherently contributes to the harm through wild-taking, so the “when these sourcing conditions are met” permission is not substantively justified."}, "position": {"x": 510, "y": 280}}, {"data": {"id": "e-arg-764959de06", "source": "arg-764959de06", "target": "arg-ae36ff7573", "ls": "dashed", "label": "undercut", "detail": "arg-764959de06 (AG2 defeat) → arg-ae36ff7573\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-d919ddf1db", "kind": "defeat", "label": "AG1 defeat\nI hold true that “not required by course", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-d919ddf1db\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a2bad54840\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals in school.\"\n}\n\nI hold true that “not required by course standards or medical training” does not settle the issue against school dissection. Even if dissection is not a minimum requirement, it can still be a valuable instructional method because it gives students direct, real anatomical observation plus hands-on psychomotor practice (fine motor skills and hand–eye coordination) and critical thinking in locating and interpreting organ systems—benefits that purely model/simulation-based approaches do not fully replicate. I also hold true that the ethical/environmental downsides are substantially different when programs use properly sourced specimens that are already deceased—often meat-industry byproducts (with over 98% already deceased)—so dissection is typically a repurposing of dead animals rather than an additional driver of harm. Therefore students should be allowed to dissect animals when properly sourced specimens are used, rather than being restricted to alternatives on the grounds that dissection is not explicitly required by standards."}, "position": {"x": 680.0, "y": 140}}, {"data": {"id": "e-arg-d919ddf1db", "source": "arg-d919ddf1db", "target": "arg-a2bad54840", "ls": "solid", "label": "rebut", "detail": "arg-d919ddf1db (AG1 defeat) → arg-a2bad54840\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals in school."}}, {"data": {"id": "arg-53d42b232a", "kind": "defeat", "label": "AG2 defeat\nI undercut the target’s assumption that,", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-53d42b232a\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-d919ddf1db\",\n  \"target_field\": \"Ass\"\n}\n\nI undercut the target’s assumption that, in school dissection, the “properly sourced / already deceased / often meat-industry byproduct” scenario is usually true so that dissection is typically “repurposing rather than an additional driver of harm.” I hold true that dissection supply chains commonly rely on animals obtained through wild-capture (or sourcing that functionally depends on collecting wild animals), which undermines the claim that ethical/environmental downsides are substantially mitigated by “already dead” byproduct sourcing. Because wild-taking directly reduces local populations and biodiversity, the target’s idea that dissection’s harms are usually limited to what would have happened anyway is substantively unreliable. Therefore, the target’s ethical-tradeoff framing rests on an incorrect premise about how dissection specimens are typically sourced, not merely on whether standards “require” dissection."}, "position": {"x": 680, "y": 280}}, {"data": {"id": "e-arg-53d42b232a", "source": "arg-53d42b232a", "target": "arg-d919ddf1db", "ls": "dashed", "label": "undercut", "detail": "arg-53d42b232a (AG2 defeat) → arg-d919ddf1db\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-3006a79af4", "kind": "defeat", "label": "AG1 defeat\nI hold true that students can benefit fr", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-3006a79af4\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a2bad54840\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"So, since dissection is not required for course standards or medical training and effective alternatives exist, students should use alternatives instead of dissecting real animals.\"\n}\n\nI hold true that students can benefit from school dissection in ways that are substantively not interchangeable with synthetic models/simulations: students gain direct, real anatomical observation and the hands-on psychomotor practice (fine motor skills and hand–eye coordination) plus critical thinking involved in locating and interpreting organ systems, and dissection can also produce “aha moments” that increase students’ science motivation and career interest. I also hold true that the ethical/environmental downsides are substantially mitigated when dissection uses properly sourced specimens that are already deceased—often meat-industry byproducts (including fetal pigs) repurposed for education rather than involving additional hunting/extra killing or disposal waste. Therefore, the absence of an explicit requirement in course standards does not settle the issue against dissection, and students should be allowed to dissect animals when these educational and sourcing conditions are met."}, "position": {"x": 850, "y": 140}}, {"data": {"id": "e-arg-3006a79af4", "source": "arg-3006a79af4", "target": "arg-a2bad54840", "ls": "solid", "label": "rebut", "detail": "arg-3006a79af4 (AG1 defeat) → arg-a2bad54840\nattack: rebut\ntarget_field: Conc\ntarget_statement: So, since dissection is not required for course standards or medical training and effective alternatives exist, students should use alternatives instead of dissecting real animals."}}, {"data": {"id": "arg-3cd89eb03e", "kind": "main", "label": "AG1 main\nStudents should be allowed to dissect re", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-3cd89eb03e\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nStudents should be allowed to dissect real animals because real dissection provides learning benefits that standardized synthetic models/computer simulations typically can’t replicate: students encounter authentic 3D anatomical variation and must do real tactile/spatial mapping while cutting and locating interconnected structures (which strengthens critical thinking and scientific realism), not just view an idealized representation. That same work also builds the specific lab skills dissection is uniquely good at—fine motor control, hand–eye coordination, and the ability to interpret organ systems from direct observation—and dissection experiences can create “aha moments” that increase students’ interest in science careers.\n\nImportantly, this educational case depends on dissection programs using specimens that are predominantly already dead and/or meat-industry byproducts (e.g., claims like “over 98% already deceased” and the common use of fetal pigs as meat byproducts), so the practice is repurposing rather than relying on additional killing.\n\nBecause (1) dissection meaningfully improves both anatomy understanding and hands-on skills plus motivation, (2) the specimens are predominantly already-dead/byproducts, and (3) alternatives are not shown to teach the same anatomy/physiology concepts and dissection-specific skills (especially dealing with real variability and tactile/3D mapping) as well or better, students should dissect animals in school under proper sourcing conditions."}, "position": {"x": 1275.0, "y": 0}}, {"data": {"id": "arg-a2259b1b77", "kind": "defeat", "label": "AG2 defeat\nI hold true that the learning aims targe", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-a2259b1b77\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-3cd89eb03e\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"alternatives are not shown to teach the same anatomy/physiology concepts and dissection-specific skills (especially dealing with real variability and tactile/3D mapping) as well or better\"\n}\n\nI hold true that the learning aims target assumes dissection uniquely provides—mastering anatomy/physiology concepts and developing spatial/tactile “real variability” skills—can be met with synthetic models and computer/virtual simulations at least as effectively as using dead animals. Interactive 3D simulations (including manipulable, zoomable structures) and well-designed physical models let students study real anatomical relationships, practice locating organ systems repeatedly, and correct mistakes without being limited to a one-time specimen. Because alternatives can teach the same concepts and train the relevant skills (with added repetition and flexibility) without the ethical and ecological downsides of using dead animals, dissection is not the educationally necessary method the pro-dissection case claims."}, "position": {"x": 1275.0, "y": 140}}, {"data": {"id": "e-arg-a2259b1b77", "source": "arg-a2259b1b77", "target": "arg-3cd89eb03e", "ls": "dashed", "label": "undercut", "detail": "arg-a2259b1b77 (AG2 defeat) → arg-3cd89eb03e\nattack: undercut\ntarget_field: Ass\ntarget_statement: alternatives are not shown to teach the same anatomy/physiology concepts and dissection-specific skills (especially dealing with real variability and tactile/3D mapping) as well or better"}}, {"data": {"id": "arg-bdb2c11116", "kind": "counter", "label": "AG1 counter\nI hold true that alternatives can let st", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-bdb2c11116\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a2259b1b77\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Because alternatives can teach the same concepts and train the relevant skills (with added repetition and flexibility) without the ethical and ecological downsides of using dead animals, dissection is not the educationally necessary method the pro-dissection case claims.\"\n}\n\nI hold true that alternatives can let students view and practice anatomy, but they do not provide an equivalent kind of learning experience for the specific “skills” part of the pro-dissection case: in real dissection, students must make irreversible, physical decisions (where to cut, what to expose, how to avoid damaging structures) and then interpret what they actually uncover—even when tissue is altered by their own technique. That forces deeper critical thinking and scientific judgment than virtual or simulation environments, which typically allow easy repetition/correction (e.g., undoing actions, reloading idealized views, and not producing real tissue damage). Because that dissection-specific critical-thinking/skill component cannot be matched simply by “being able to correct mistakes repeatedly,” synthetic models and virtual simulations cannot reasonably be treated as teaching the same skills “at least as effectively as” real dissection. Therefore, the claim that dissection is not educationally necessary doesn’t hold up."}, "position": {"x": 1020, "y": 280}}, {"data": {"id": "e-arg-bdb2c11116", "source": "arg-bdb2c11116", "target": "arg-a2259b1b77", "ls": "solid", "label": "rebut", "detail": "arg-bdb2c11116 (AG1 counter) → arg-a2259b1b77\nattack: rebut\ntarget_field: Conc\ntarget_statement: Because alternatives can teach the same concepts and train the relevant skills (with added repetition and flexibility) without the ethical and ecological downsides of using dead animals, dissection is not the educationally necessary method the pro-dissection case claims."}}, {"data": {"id": "arg-57fec9e4f3", "kind": "counter", "label": "AG1 counter\nI hold true that interactive simulations", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-57fec9e4f3\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a2259b1b77\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"dissection uniquely provides spatial/tactile “real variability” skills can be met with synthetic models and computer/virtual simulations at least as effectively as using dead animals; therefore dissection is not the educationally necessary method\"\n}\n\nI hold true that interactive simulations can teach some anatomy relationships, but they typically do not match dissection’s “spatial/tactile real variability” and decision-making demands *equally well or better*: real specimens vary from animal to animal (structure shapes, position, attachment density, tissue thickness, and even what is visibly exposed), and dissection also involves imperfect visibility and heterogeneous tissue resistance that students must work around. That means students are not just “locating organ systems repeatedly” on a standardized model; they must repeatedly adapt their interpretation and technique to non-ideal, variable, real biological conditions. Because simulations and idealized models generally abstract away that variability and tactile uncertainty, they do not substantively provide the same learning of anatomy/physiology concepts and dissection-specific skills, so dissection remains educationally necessary when those assessed goals are dissection-linked and variability/tactile interpretation are central."}, "position": {"x": 1190, "y": 280}}, {"data": {"id": "e-arg-57fec9e4f3", "source": "arg-57fec9e4f3", "target": "arg-a2259b1b77", "ls": "solid", "label": "rebut", "detail": "arg-57fec9e4f3 (AG1 counter) → arg-a2259b1b77\nattack: rebut\ntarget_field: Conc\ntarget_statement: dissection uniquely provides spatial/tactile “real variability” skills can be met with synthetic models and computer/virtual simulations at least as effectively as using dead animals; therefore dissection is not the educationally necessary method"}}, {"data": {"id": "arg-880870e829", "kind": "counter", "label": "AG1 counter\nI hold true that even if synthetic model", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-880870e829\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a2259b1b77\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Because alternatives can teach the same concepts and train the relevant skills (with added repetition and flexibility) without the ethical and ecological downsides of using dead animals, dissection is not the educationally necessary method the pro-dissection case claims.\"\n}\n\nI hold true that even if synthetic models and interactive 3D simulations can teach students anatomy/physiology concepts, they typically do not reproduce dissection’s motivational and career-interest effects “at least as effectively.” Real dissection creates distinctive, emotionally salient “aha moments” by giving students tangible, multisensory contact with real tissues and the reality of biological structure—so it more directly makes science feel real and rewarding. Because the pro-dissection educational case depends not only on concept/skill acquisition but also on these motivation/career-interest benefits, alternatives that focus on simulation-based learning do not meet the full set of goals “as well or better.” Therefore, dissection can still be educationally necessary as part of achieving the course’s broader learning aims, not merely a preferred method."}, "position": {"x": 1360, "y": 280}}, {"data": {"id": "e-arg-880870e829", "source": "arg-880870e829", "target": "arg-a2259b1b77", "ls": "solid", "label": "rebut", "detail": "arg-880870e829 (AG1 counter) → arg-a2259b1b77\nattack: rebut\ntarget_field: Conc\ntarget_statement: Because alternatives can teach the same concepts and train the relevant skills (with added repetition and flexibility) without the ethical and ecological downsides of using dead animals, dissection is not the educationally necessary method the pro-dissection case claims."}}, {"data": {"id": "arg-f47ff6d408", "kind": "counter", "label": "AG1 counter\nI hold true that, even when interactive ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-f47ff6d408\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a2259b1b77\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Because alternatives can teach the same concepts and train the relevant skills (with added repetition and flexibility) without the ethical and ecological downsides of using dead animals, dissection is not the educationally necessary method the pro-dissection case claims.\"\n}\n\nI hold true that, even when interactive 3D simulations and physical models can teach students anatomy/physiology facts, they generally do not teach the same dissection-specific *skill* learning outcomes “at least as effectively” as real dissection—especially the fine motor control and hand–eye coordination involved in using real dissection instruments on real tissue. Real dissection requires coordinated, tool-by-tool tactile control (cutting depth, tool pressure, and delicate manipulation) while interpreting what you physically expose, whereas simulations typically rely on mouse/controller interactions and idealized, frictionless visuals that don’t reproduce the same haptic feedback and instrument–tissue resistance. Because the pro-dissection case depends on dissection producing that uniquely practiced psychomotor/critical-judgment skill component (not just “concept exposure”), it remains educationally necessary for achieving the stated dissection-linked learning aims, assuming properly sourced, predominantly already-deceased/byproduct specimens."}, "position": {"x": 1530, "y": 280}}, {"data": {"id": "e-arg-f47ff6d408", "source": "arg-f47ff6d408", "target": "arg-a2259b1b77", "ls": "solid", "label": "rebut", "detail": "arg-f47ff6d408 (AG1 counter) → arg-a2259b1b77\nattack: rebut\ntarget_field: Conc\ntarget_statement: Because alternatives can teach the same concepts and train the relevant skills (with added repetition and flexibility) without the ethical and ecological downsides of using dead animals, dissection is not the educationally necessary method the pro-dissection case claims."}}, {"data": {"id": "end-arg-50338ff682", "label": "終了: overruled（反論できず敗北）"}, "position": {"x": 0, "y": 525.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "end-arg-a2bad54840", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 850, "y": 245.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "end-arg-3cd89eb03e", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 1530, "y": 385.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 1700, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>20<\/td><\/tr><tr><td>attack_turn_count<\/td><td>17<\/td><\/tr><tr><td>main_argument_count<\/td><td>3<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>1<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.070027<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>No—students should not dissect real animals in school.\n\n**Rationale (grounded in the decision conditions):**\n\n1. **Dissection is not clearly necessary for the relevant learning requirements.**  \n   The opposition case notes that dissection is not required to meet major U.S./Canadian biology curriculum objectives (e.g., AP Biology/NGSS) and is not part of physician training in the U.S./Canada. Even if dissection can be beneficial, the key question is whether it’s *needed* to achieve the assessed biology objectives—and the debate did not establish that those objectives *cannot* be met with non-animal methods.\n\n2. **Alternatives are plausibly at least as good for core anatomy/physiology learning, and the debate didn’t provide decisive evidence that they are not.**  \n   The pro-dissection side argued that real dissection uniquely trains fine motor, tactile/spatial “real variability,” and irreversible decision-making, and that simulations/models may not match those skills “equally well or better.” However, the debate did not produce credible comparative evidence showing alternatives demonstrably *worse* for the specific concepts and skills tied to school assessment. Without that, the conditions for justifying real-animal dissection aren’t met.\n\n3. **The supply-chain condition (“predominantly already dead and/or meat-industry byproducts”) was not credibly established.**  \n   The pro side relied on claims like “over 98% already deceased” and fetal pigs as meat-industry byproducts. The opposition directly challenged this by claiming the specimens are **mostly wild-caught (around 99%)**, which would materially change the ethical and environmental calculus. The debate did not resolve this disagreement with reliable sourcing data. Because the justification depends on *predominantly* byproduct/already-dead animals—and that premise remains in serious doubt—students should not be put into an activity that depends on an unverified assumption about how animals are obtained.\n\n**Bottom line:** Even granting that dissection can be engaging and can develop certain hands-on skills, the debate did not satisfy the full set of justification requirements—especially the evidence needed that specimens are *predominantly* already-dead/byproduct and that alternatives cannot teach the assessed goals equally well or better. Given those unresolved gaps, the best-supported conclusion is to use synthetic models and computer simulations instead of dissecting real animals.<\/pre><\/details><div>justification_status: <b>fallback_no_consensus<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}], "schema": [{"run": 1, "question": "Should students dissect animals?", "elements": [{"data": {"id": "arg-877d487aa7", "kind": "main", "label": "AG1 main\nYes—students should dissect animals as p", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"arg-877d487aa7\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"overruled\",\n  \"closed_by_budget\": false\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is a hands-on classroom activity in which students closely examine real anatomical structures using their own manual work and observation.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection provides students with meaningful hands-on training in fine motor skills, hand-eye coordination, and critical thinking.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection provides students with meaningful hands-on training in fine motor skills, hand-eye coordination, and critical thinking.\",\n            \"Hands-on science experiences can generate enthusiasm and career interest by producing “aha moments” that spark motivation to pursue science-related careers.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection can encourage students to pursue careers in science by generating enthusiasm and career interest.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection can encourage students to pursue careers in science by generating enthusiasm and career interest.\",\n            \"In the usual case, over 98% of dissected animals were already deceased before dissection, and fetal pigs used for dissection are meat-industry byproducts destined for landfills.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"School animal dissection is a productive use of already-deceased specimens (including meat-industry byproducts) rather than creating new animal harm in the usual case.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"School animal dissection is a productive use of already-deceased specimens (including meat-industry byproducts) rather than creating new animal harm in the usual case.\",\n            \"Animal dissection provides students with meaningful hands-on training in fine motor skills, hand-eye coordination, and critical thinking.\",\n            \"Animal dissection can encourage students to pursue careers in science by generating enthusiasm and career interest.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Yes—students should dissect animals as part of biology teaching, when schools use already-deceased specimens in typical classroom dissection programs.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection provides students with meaningful hands-on training in fine motor skills, hand-eye coordination, and critical thinking.\",\n      \"Animal dissection can encourage students to pursue careers in science by generating enthusiasm and career interest.\",\n      \"School animal dissection is a productive use of already-deceased specimens (including meat-industry byproducts) rather than creating new animal harm in the usual case.\",\n      \"Yes—students should dissect animals as part of biology teaching, when schools use already-deceased specimens in typical classroom dissection programs.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0.0, "y": 0}}, {"data": {"id": "arg-b969e098eb", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals as p", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-b969e098eb\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-877d487aa7\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Yes—students should dissect animals as part of biology teaching, when schools use already-deceased specimens in typical classroom dissection programs.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of animals used for dissection are caught in the wild (so dissection is not mainly a use of already-deceased specimens), and wild-catching decreases local populations and reduces biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection relies largely on wild capture that harms local populations and biodiversity, contradicting the idea that it is “impact-free” or mainly uses already-deceased specimens.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection relies largely on wild capture that harms local populations and biodiversity, contradicting the idea that it is “impact-free” or mainly uses already-deceased specimens.\",\n            \"Practices that cause substantial harm to animals and biodiversity are ethically unacceptable and environmentally harmful.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection is ethically unacceptable and environmentally harmful.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is ethically unacceptable and environmentally harmful.\",\n            \"Medical studies do not require or benefit from animal dissection, it is not required by AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection is not necessary to meet biology/medical learning goals in the relevant education and training contexts.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is not necessary to meet biology/medical learning goals in the relevant education and training contexts.\",\n            \"Synthetic models and computer simulations teach equally well or better than dissecting dead animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students can achieve equal or better learning with effective non-animal alternatives.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is ethically unacceptable and environmentally harmful.\",\n            \"Animal dissection is not necessary to meet biology/medical learning goals in the relevant education and training contexts.\",\n            \"Students can achieve equal or better learning with effective non-animal alternatives.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals as part of biology teaching.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection relies largely on wild capture that harms local populations and biodiversity, contradicting the idea that it is “impact-free” or mainly uses already-deceased specimens.\",\n      \"Animal dissection is ethically unacceptable and environmentally harmful.\",\n      \"Animal dissection is not necessary to meet biology/medical learning goals in the relevant education and training contexts.\",\n      \"Students can achieve equal or better learning with effective non-animal alternatives.\",\n      \"Students should not dissect animals as part of biology teaching.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0.0, "y": 140}}, {"data": {"id": "e-arg-b969e098eb", "source": "arg-b969e098eb", "target": "arg-877d487aa7", "ls": "solid", "label": "rebut", "detail": "arg-b969e098eb (AG2 defeat) → arg-877d487aa7\nattack: rebut\ntarget_field: Conc\ntarget_statement: Yes—students should dissect animals as part of biology teaching, when schools use already-deceased specimens in typical classroom dissection programs."}}, {"data": {"id": "arg-1364aae634", "kind": "counter", "label": "AG1 counter\nStudents should dissect animals in biolo", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-1364aae634\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-b969e098eb\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals as part of biology teaching.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In typical school dissection programs, over 98% of dissected animals were already deceased before dissection, and fetal pigs used for dissection are meat-industry byproducts destined for landfills.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical school animal dissection mainly uses already-deceased specimens rather than relying on large-scale wild capture.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Typical school animal dissection mainly uses already-deceased specimens rather than relying on large-scale wild capture.\",\n            \"Repurposing already-deceased specimens in the usual case does not require additional killing or capture of wild animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, the ethical and biodiversity impacts of typical classroom dissection are substantially reduced compared with practices that depend on wild capture.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is a hands-on classroom activity where students closely examine real anatomical structures using their own manual work and observation.\",\n            \"Such hands-on work develops fine motor skills, hand-eye coordination, and critical thinking, and can create “aha moments” that motivate interest in science careers.\",\n            \"Non-animal alternatives generally cannot fully replicate the tactile, psychomotor learning from physically dissecting real anatomy.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, animal dissection provides unique and significant educational value that schools cannot always match with non-animal alternatives.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Therefore, the ethical and biodiversity impacts of typical classroom dissection are substantially reduced compared with practices that depend on wild capture.\",\n            \"Therefore, animal dissection provides unique and significant educational value that schools cannot always match with non-animal alternatives.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students s
