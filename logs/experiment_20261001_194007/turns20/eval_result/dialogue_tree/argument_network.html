          \"When a biology activity both (a) uses already-deceased/byproduct specimens as its usual source and (b) provides meaningful hands-on learning and motivation, schools have a strong reason to recommend it rather than excluding it.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Schools should recommend student animal dissection in biology classes when they can verify the already-deceased/byproduct sourcing condition.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Schools should recommend student animal dissection in biology classes when they can verify the already-deceased/byproduct sourcing condition.\",\n            \"If a school cannot clearly establish the already-deceased/byproduct sourcing condition (so the wild-capture/inhu mane-harm concern cannot be ruled out), requiring dissection would reintroduce the very harms that justify not doing it; therefore schools should use non-animal alternatives until sourcing is confirmed.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Yes—students should dissect animals in biology classes when the school uses verified already-deceased (including meat-industry byproduct) specimens as its usual source; if that sourcing can’t be clearly confirmed, schools should use non-animal alternatives instead until it is verified. \"\n      }\n    ],\n    \"Conc\": [\n      \"In such programs, the key inhumane wild-capture/biodiversity harms asserted by opponents are not the basis for the dissection activity.\",\n      \"Dissection in these verified already-deceased/byproduct programs plausibly delivers significant educational benefits and science-interest benefits.\",\n      \"Schools should recommend student animal dissection in biology classes when they can verify the already-deceased/byproduct sourcing condition.\",\n      \"Yes—students should dissect animals in biology classes when the school uses verified already-deceased (including meat-industry byproduct) specimens as its usual source; if that sourcing can’t be clearly confirmed, schools should use non-animal alternatives instead until it is verified.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 637.5, "y": 0}}, {"data": {"id": "arg-a30cd1ebb3", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals; sch", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-a30cd1ebb3\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-535fae79cf\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Yes—students should dissect animals in biology classes when the school uses verified already-deceased (including meat-industry byproduct) specimens as its usual source; if that sourcing can’t be clearly confirmed, schools should use non-animal alternatives instead until it is verified. \"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is not required or shown to benefit learning goals in the relevant education/training benchmarks (it is not required by College Board AP Biology or Next Generation Science Standards), and no U.S. or Canadian medical schools use animals for physician training.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection is not necessary to achieve the biology/medical learning goals in these contexts.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is not necessary to achieve the biology/medical learning goals in these contexts.\",\n            \"Synthetic models and computer simulations can teach anatomy and related concepts equally well or better than dissecting dead animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Effective non-animal alternatives can achieve the intended learning outcomes.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is not necessary to achieve the biology/medical learning goals in these contexts.\",\n            \"Effective non-animal alternatives can achieve the intended learning outcomes.\",\n            \"Dissection’s animal-supply practices are inhumane and environmentally harmful (with about 99% of dissection animals caught in the wild, reducing local populations and biodiversity).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Requiring animal dissection imposes avoidable harm when alternatives can meet the goals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Requiring animal dissection imposes avoidable harm when alternatives can meet the goals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals; schools should use non-animal alternatives instead.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection is not necessary to achieve the biology/medical learning goals in these contexts.\",\n      \"Effective non-animal alternatives can achieve the intended learning outcomes.\",\n      \"Requiring animal dissection imposes avoidable harm when alternatives can meet the goals.\",\n      \"Students should not dissect animals; schools should use non-animal alternatives instead.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 637.5, "y": 140}}, {"data": {"id": "e-arg-a30cd1ebb3", "source": "arg-a30cd1ebb3", "target": "arg-535fae79cf", "ls": "solid", "label": "rebut", "detail": "arg-a30cd1ebb3 (AG2 defeat) → arg-535fae79cf\nattack: rebut\ntarget_field: Conc\ntarget_statement: Yes—students should dissect animals in biology classes when the school uses verified already-deceased (including meat-industry byproduct) specimens as its usual source; if that sourcing can’t be clearly confirmed, schools should use non-animal alternatives instead until it is verified. "}}, {"data": {"id": "arg-f4a6ca51a6", "kind": "counter", "label": "AG1 counter\nStudents should dissect animals in biolo", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-f4a6ca51a6\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a30cd1ebb3\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals; classrooms should use non-animal alternatives instead. \"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"AP Biology and Next Generation Science Standards (and physician-training requirements) are not exhaustive evaluations of every beneficial classroom teaching method; they specify what is required for certain benchmarks/contexts, not the full set of valuable learning outcomes.\",\n            \"Therefore, the fact that animal dissection is not required by those benchmarks or medical physician training does not by itself show that dissection cannot provide useful or educationally necessary learning for school biology goals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Not being required by AP Biology/NGSS or physician-training contexts does not establish that animal dissection cannot be useful or educationally necessary for valued school biology learning goals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Not being required by AP Biology/NGSS or physician-training contexts does not establish that animal dissection cannot be useful or educationally necessary for valued school biology learning goals.\",\n            \"Animal dissection provides meaningful hands-on training in fine motor skills, hand-eye coordination, and critical thinking, and can create “aha moments” that spark science enthusiasm and career interest.\",\n            \"Non-animal alternatives (even if they teach some anatomy concepts) generally cannot fully replicate the tactile/psychomotor learning of physically dissecting real anatomy. \"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection can be educationally necessary to achieve hands-on psychomotor and motivation learning goals that alternatives may not fully replicate.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection can be educationally necessary to achieve hands-on psychomotor and motivation learning goals that alternatives may not fully replicate.\",\n            \"In school programs that use already-deceased specimens as the usual source (e.g., over 98% already deceased) and use fetal pigs that are meat-industry byproducts destined for landfills, dissection does not depend on widespread wild-capture sourcing for the lesson.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"When schools use verified already-deceased/byproduct specimens, dissection avoids the inhumane wild-capture/biodiversity harms that opponents emphasize as the main ethical downside.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection can be educationally necessary to achieve hands-on psychomotor and motivation learning goals that alternatives may not fully replicate.\",\n            \"When schools use verified already-deceased/byproduct specimens, dissection avoids the inhumane wild-capture/biodiversity harms that opponents emphasize as the main ethical downside.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Schools can justify recommending student dissection because it delivers significant educational benefits while not triggering the main ethically harmful supply-chain concerns.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Schools can justify recommending student dissection because it delivers significant educational benefits while not triggering the main ethically harmful supply-chain concerns.\",\n            \"If a school cannot clearly verify that specimens are already-deceased/byproducts (so the wild-capture harms cannot be ruled out), then requiring dissection would risk reintroducing the ethically problematic downside.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should dissect animals in biology classes only when the school can verify already-deceased/byproduct sourcing; otherwise schools should use non-animal alternatives until sourcing is confirmed. \"\n      }\n    ],\n    \"Conc\": [\n      \"Not being required by AP Biology/NGSS or physician-training contexts does not establish that animal dissection cannot be useful or educationally necessary for valued school biology learning goals.\",\n      \"Animal dissection can be educationally necessary to achieve hands-on psychomotor and motivation learning goals that alternatives may not fully replicate.\",\n      \"When schools use verified already-deceased/byproduct specimens, dissection avoids the inhumane wild-capture/biodiversity harms that opponents emphasize as the main ethical downside.\",\n      \"Schools can justify recommending student dissection because it delivers significant educational benefits while not triggering the main ethically harmful supply-chain concerns.\",\n      \"Students should dissect animals in biology classes only when the school can verify already-deceased/byproduct sourcing; otherwise schools should use non-animal alternatives until sourcing is confirmed.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 510, "y": 280}}, {"data": {"id": "e-arg-f4a6ca51a6", "source": "arg-f4a6ca51a6", "target": "arg-a30cd1ebb3", "ls": "solid", "label": "rebut", "detail": "arg-f4a6ca51a6 (AG1 counter) → arg-a30cd1ebb3\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals; classrooms should use non-animal alternatives instead. "}}, {"data": {"id": "arg-a683c1b6b1", "kind": "counter", "label": "AG1 counter\nStudents should dissect animals in biolo", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-a683c1b6b1\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a30cd1ebb3\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals; schools should use non-animal alternatives instead.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"When schools use dissection specimens that are already deceased and are meat-industry byproducts (e.g., fetal pigs), the specimens are otherwise destined for disposal (e.g., landfills).\",\n            \"Using those byproduct carcasses for dissection repurposes them for education rather than requiring additional live-capture or killing for the lesson.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In verified already-deceased/byproduct programs, the major ethical downside opponents emphasize (harm from sourcing live animals for dissection) is largely avoided and the byproducts are instead repurposed rather than landfilled.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection is a hands-on biology activity where students closely examine real anatomical structures using manual work and observation.\",\n            \"This hands-on dissection builds fine motor skills, hand-eye coordination, and critical thinking, and can create “aha moments” that foster enthusiasm and science-career interest.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Real-animal dissection in school provides meaningful educational and motivation benefits for students.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In verified already-deceased/byproduct programs, the major ethical downside opponents emphasize (harm from sourcing live animals for dissection) is largely avoided and the byproducts are instead repurposed rather than landfilled.\",\n            \"Real-animal dissection in school provides meaningful educational and motivation benefits for students.\",\n            \"When an activity avoids the main avoidable harms while still delivering substantial learning and motivation benefits, schools have a strong reason not to ban the activity outright.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In schools that verify already-deceased/byproduct sourcing, there is a strong pro-dissection justification rather than an across-the-board “students should not dissect” prohibition.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In schools that verify already-deceased/byproduct sourcing, there is a strong pro-dissection justification rather than an across-the-board “students should not dissect” prohibition.\",\n            \"If a school cannot clearly verify the specimens are already-deceased/byproducts, then the harm-from-sourcing concern cannot be ruled out, so non-animal alternatives are the safer default until sourcing is confirmed.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should dissect animals in biology classes when the school uses verified already-deceased (including meat-industry byproduct) specimens; if sourcing can’t be verified, schools should use non-animal alternatives instead.\"\n      }\n    ],\n    \"Conc\": [\n      \"In verified already-deceased/byproduct programs, the major ethical downside opponents emphasize (harm from sourcing live animals for dissection) is largely avoided and the byproducts are instead repurposed rather than landfilled.\",\n      \"Real-animal dissection in school provides meaningful educational and motivation benefits for students.\",\n      \"In schools that verify already-deceased/byproduct sourcing, there is a strong pro-dissection justification rather than an across-the-board “students should not dissect” prohibition.\",\n      \"Students should dissect animals in biology classes when the school uses verified already-deceased (including meat-industry byproduct) specimens; if sourcing can’t be verified, schools should use non-animal alternatives instead.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 765.0, "y": 280}}, {"data": {"id": "e-arg-a683c1b6b1", "source": "arg-a683c1b6b1", "target": "arg-a30cd1ebb3", "ls": "solid", "label": "rebut", "detail": "arg-a683c1b6b1 (AG1 counter) → arg-a30cd1ebb3\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals; schools should use non-animal alternatives instead."}}, {"data": {"id": "arg-5dc8fc3f78", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals; sch", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-5dc8fc3f78\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a683c1b6b1\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should dissect animals in biology classes when the school uses verified already-deceased (including meat-industry byproduct) specimens; if sourcing can’t be verified, schools should use non-animal alternatives instead.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of animals used for dissection are caught in the wild.\",\n            \"If dissection animals are predominantly wild-caught, then schools are not actually using only “verified already-deceased (meat-industry byproduct)” specimens as the usual source.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In typical school programs, the “verified already-deceased/byproduct specimens” condition required to justify dissection is not met as a practical matter.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In typical school programs, the “verified already-deceased/byproduct specimens” condition required to justify dissection is not met as a practical matter.\",\n            \"Wild-catching for dissection harms local populations and reduces biodiversity and also involves inhumane treatment tied to capture and transport.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical student dissection therefore involves inhumane and biodiversity-damaging animal harms, not just use of already-deceased byproducts.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Typical student dissection therefore involves inhumane and biodiversity-damaging animal harms, not just use of already-deceased byproducts.\",\n            \"Synthetic models and computer simulations teach equally well or better than dissecting dead animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Because effective non-animal alternatives exist, schools should avoid activities that impose inhumane, biodiversity-damaging harm.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Because effective non-animal alternatives exist, schools should avoid activities that impose inhumane, biodiversity-damaging harm.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals; schools should use non-animal alternatives instead.\"\n      }\n    ],\n    \"Conc\": [\n      \"In typical school programs, the “verified already-deceased/byproduct specimens” condition required to justify dissection is not met as a practical matter.\",\n      \"Typical student dissection therefore involves inhumane and biodiversity-damaging animal harms, not just use of already-deceased byproducts.\",\n      \"Because effective non-animal alternatives exist, schools should avoid activities that impose inhumane, biodiversity-damaging harm.\",\n      \"Students should not dissect animals; schools should use non-animal alternatives instead.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 765.0, "y": 420}}, {"data": {"id": "e-arg-5dc8fc3f78", "source": "arg-5dc8fc3f78", "target": "arg-a683c1b6b1", "ls": "solid", "label": "rebut", "detail": "arg-5dc8fc3f78 (AG2 defeat) → arg-a683c1b6b1\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should dissect animals in biology classes when the school uses verified already-deceased (including meat-industry byproduct) specimens; if sourcing can’t be verified, schools should use non-animal alternatives instead."}}, {"data": {"id": "arg-75bad70a14", "kind": "counter", "label": "AG1 counter\nStudents should not dissect animals in b", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-75bad70a14\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-5dc8fc3f78\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should dissect animals in biology classes when the school uses verified already-deceased (including meat-industry byproduct) specimens; if sourcing can’t be clearly confirmed, schools should use non-animal alternatives instead until it is verified.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of animals used for dissection are caught in the wild rather than being predominantly already-deceased meat-industry byproducts.\",\n            \"Because dissection specimens are predominantly wild-caught, schools generally cannot reliably satisfy the “verified already-deceased/byproduct” sourcing condition as the typical source for student dissections.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In typical school programs, the “verified already-deceased/byproduct specimens” condition is not reliably satisfied as the usual sourcing.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In typical school programs, the “verified already-deceased/byproduct specimens” condition is not reliably satisfied as the usual sourcing.\",\n            \"If specimens are predominantly wild-caught, dissection necessarily involves inhumane capture/transport harms and biodiversity loss rather than only repurposing already-deceased animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical student dissection in practice involves inhumane and biodiversity-damaging animal harms, not just use of already-deceased byproducts.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Typical student dissection in practice involves inhumane and biodiversity-damaging animal harms, not just use of already-deceased byproducts.\",\n            \"Effective non-animal alternatives (synthetic models and computer simulations) can teach anatomy/related concepts equally well or better.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"When effective non-animal alternatives exist and typical dissection entails inhumane/biodiversity harms, schools should use non-animal alternatives instead of requiring dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"When effective non-animal alternatives exist and typical dissection entails inhumane/biodiversity harms, schools should use non-animal alternatives instead of requiring dissection.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals in biology classes in typical school practice; classrooms should use non-animal alternatives instead. \"\n      }\n    ],\n    \"Conc\": [\n      \"In typical school programs, the “verified already-deceased/byproduct specimens” condition is not reliably satisfied as the usual sourcing.\",\n      \"Typical student dissection in practice involves inhumane and biodiversity-damaging animal harms, not just use of already-deceased byproducts.\",\n      \"When effective non-animal alternatives exist and typical dissection entails inhumane/biodiversity harms, schools should use non-animal alternatives instead of requiring dissection.\",\n      \"Students should not dissect animals in biology classes in typical school practice; classrooms should use non-animal alternatives instead.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 680, "y": 560}}, {"data": {"id": "e-arg-75bad70a14", "source": "arg-75bad70a14", "target": "arg-5dc8fc3f78", "ls": "solid", "label": "rebut", "detail": "arg-75bad70a14 (AG1 counter) → arg-5dc8fc3f78\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should dissect animals in biology classes when the school uses verified already-deceased (including meat-industry byproduct) specimens; if sourcing can’t be clearly confirmed, schools should use non-animal alternatives instead until it is verified."}}, {"data": {"id": "arg-ad65f4ea70", "kind": "counter", "label": "AG1 counter\nIf sourcing can’t be verified, schools s", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-ad65f4ea70\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-5dc8fc3f78\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals; schools should use non-animal alternatives instead.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Schools can set procurement requirements for dissection specimens, including requiring suppliers to provide documentation that the specimens are already-deceased meat-industry byproducts (i.e., verification via supplier certification/chain-of-custody before purchase).\",\n            \"Schools can implement these procurement requirements as part of choosing what activities to offer.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, the “verified already-deceased/byproduct specimens” condition is practically achievable in at least some school dissection programs when schools use verified suppliers.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Therefore, the “verified already-deceased/byproduct specimens” condition is practically achievable in at least some school dissection programs when schools use verified suppliers.\",\n            \"The main ethical downside emphasized by opponents targets sourcing that requires capturing/transporting animals (wild-capture) for the lesson.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"When schools actually verify specimens are already-deceased byproducts before the lesson, wild-capture/biodiversity harms are not what the activity is relying on.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"When schools actually verify specimens are already-deceased byproducts before the lesson, wild-capture/biodiversity harms are not what the activity is relying on.\",\n            \"Animal dissection is a hands-on classroom activity that can build fine motor skills, hand-eye coordination, critical thinking, and can create “aha moments” that motivate science interest/career curiosity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In verified-byproduct programs, dissection remains a productive educational activity while avoiding the key inhumane/wild-capture downside.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In verified-byproduct programs, dissection remains a productive educational activity while avoiding the key inhumane/wild-capture downside.\",\n            \"When an activity has substantial educational value and avoids the key ethical harms, schools have reason to recommend it rather than banning it outright.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Schools should allow student animal dissection when they can verify that specimens are already-deceased meat-industry byproducts.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Schools should allow student animal dissection when they can verify that specimens are already-deceased meat-industry byproducts.\",\n            \"If a school cannot verify sourcing, then it cannot rule out wild-capture harms.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"If sourcing can’t be verified, schools should use non-animal alternatives until verification is obtained. \"\n      }\n    ],\n    \"Conc\": [\n      \"Therefore, the “verified already-deceased/byproduct specimens” condition is practically achievable in at least some school dissection programs when schools use verified suppliers.\",\n      \"When schools actually verify specimens are already-deceased byproducts before the lesson, wild-capture/biodiversity harms are not what the activity is relying on.\",\n      \"In verified-byproduct programs, dissection remains a productive educational activity while avoiding the key inhumane/wild-capture downside.\",\n      \"Schools should allow student animal dissection when they can verify that specimens are already-deceased meat-industry byproducts.\",\n      \"If sourcing can’t be verified, schools should use non-animal alternatives until verification is obtained.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 850, "y": 560}}, {"data": {"id": "e-arg-ad65f4ea70", "source": "arg-ad65f4ea70", "target": "arg-5dc8fc3f78", "ls": "solid", "label": "rebut", "detail": "arg-ad65f4ea70 (AG1 counter) → arg-5dc8fc3f78\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals; schools should use non-animal alternatives instead."}}, {"data": {"id": "arg-c2bf38b473", "kind": "main", "label": "AG2 main\nStudents should not dissect animals; sch", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-c2bf38b473\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of animals used for dissection are caught in the wild.\",\n            \"Wild-catching decreases local populations and reduces biodiversity, and it necessarily involves inhumane treatment tied to capture and transport (e.g., stress/injury/death).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical school dissection involves inhumane wild-capture sourcing and biodiversity loss.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Typical school dissection involves inhumane wild-capture sourcing and biodiversity loss.\",\n            \"Practices that cause substantial harm to animals and biodiversity are ethically unacceptable when avoidable through alternative methods.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Requiring dissection imposes avoidable ethical/environmental harm.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Requiring dissection imposes avoidable ethical/environmental harm.\",\n            \"Synthetic models and computer simulations can teach anatomy and related concepts at least as effectively as dissecting dead animals.\",\n            \"Non-animal alternatives can be designed as hands-on, interactive activities (e.g., tactile/simulated dissections), so students can still get the learning and engagement benefits (including “aha moments”) without using dissection animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Schools can meet students’ biology learning goals with hands-on non-animal alternatives instead of dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Requiring dissection imposes avoidable ethical/environmental harm.\",\n            \"Schools can meet students’ biology learning goals with hands-on non-animal alternatives instead of dissection.\",\n            \"When avoidable harm can be avoided while still achieving the educational goals, schools should choose the non-harmful alternative.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals; schools should use non-animal alternatives instead. \"\n      }\n    ],\n    \"Conc\": [\n      \"Typical school dissection involves inhumane wild-capture sourcing and biodiversity loss.\",\n      \"Requiring dissection imposes avoidable ethical/environmental harm.\",\n      \"Schools can meet students’ biology learning goals with hands-on non-animal alternatives instead of dissection.\",\n      \"Students should not dissect animals; schools should use non-animal alternatives instead.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 1105.0, "y": 0}}, {"data": {"id": "arg-6ce68a1756", "kind": "defeat", "label": "AG1 defeat\nSchools should allow students to dissect", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-6ce68a1756\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-c2bf38b473\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals; schools should use non-animal alternatives instead.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations cannot fully replicate the tactile/psychomotor learning that comes from physically dissecting real anatomy (e.g., the fine motor skills and hand-eye coordination built by manually manipulating organs).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Non-animal alternatives generally cannot achieve the same learning outcomes as real dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Non-animal alternatives generally cannot achieve the same learning outcomes as real dissection.\",\n            \"Animal dissection provides meaningful fine motor skills, hand-eye coordination, and critical thinking, and can produce “aha moments” that foster science enthusiasm and career interest.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Replacing dissection with non-animal alternatives will necessarily lose some of the dissection’s key educational benefits.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Replacing dissection with non-animal alternatives will necessarily lose some of the dissection’s key educational benefits.\",\n            \"Our educational-ethics tradeoff is different when dissection uses already-deceased specimens (including meat-industry byproducts) rather than requiring additional live-capture/kil l": "AG2 counter\nStudents should not dissect animals in b", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-3bfd76ab5d\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-6ce68a1756\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Schools should allow students to dissect animals in biology classes (using already-deceased specimens) rather than requiring non-animal alternatives in every case.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of animals used for dissection are caught in the wild (rather than being predominantly already-deceased meat-industry byproducts).\",\n            \"So, in typical school dissection, the ethically relevant “already-deceased-byproduct” tradeoff AG1 relies on is not the common case.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical dissection in schools does not generally eliminate the wild-capture/biodiversity harms by being “already-deceased byproduct” centered.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Typical dissection in schools does not generally eliminate the wild-capture/biodiversity harms by being “already-deceased byproduct” centered.\",\n            \"Practices that harm animals and biodiversity are ethically unacceptable when effective alternative methods exist.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Requiring dissection imposes avoidable ethical/environmental harm when non-animal alternatives exist.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Requiring dissection imposes avoidable ethical/environmental harm when non-animal alternatives exist.\",\n            \"Effective non-animal alternatives (synthetic models/computer simulations) teach anatomy and related concepts equally well or better, and dissection is not required/beneficial in the relevant education/benchmark contexts (e.g., AP Biology/NGSS; not used for physician training).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The claim that students necessarily lose crucial educational benefits by using alternatives does not justify imposing dissection harms, because alternatives can meet the learning goals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The claim that students necessarily lose crucial educational benefits by using alternatives does not justify imposing dissection harms, because alternatives can meet the learning goals.\",\n            \"Schools should avoid imposing avoidable ethical/environmental harm when effective alternatives achieve the goals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals in biology classes; schools should use non-animal alternatives instead.\"\n      }\n    ],\n    \"Conc\": [\n      \"Typical dissection in schools does not generally eliminate the wild-capture/biodiversity harms by being “already-deceased byproduct” centered.\",\n      \"Requiring dissection imposes avoidable ethical/environmental harm when non-animal alternatives exist.\",\n      \"The claim that students necessarily lose crucial educational benefits by using alternatives does not justify imposing dissection harms, because alternatives can meet the learning goals.\",\n      \"Students should not dissect animals in biology classes; schools should use non-animal alternatives instead.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 1105.0, "y": 280}}, {"data": {"id": "e-arg-3bfd76ab5d", "source": "arg-3bfd76ab5d", "target": "arg-6ce68a1756", "ls": "solid", "label": "rebut", "detail": "arg-3bfd76ab5d (AG2 counter) → arg-6ce68a1756\nattack: rebut\ntarget_field: Conc\ntarget_statement: Schools should allow students to dissect animals in biology classes (using already-deceased specimens) rather than requiring non-animal alternatives in every case."}}, {"data": {"id": "arg-98c0a5e5b4", "kind": "defeat", "label": "AG1 defeat\nStudents should not dissect animals; sch", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-98c0a5e5b4\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-3bfd76ab5d\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Schools should allow students to dissect animals in biology classes (using already-deceased specimens) rather than requiring non-animal alternatives in every case.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of animals used for dissection are caught in the wild.\",\n            \"If dissection animals are predominantly wild-caught, then typical dissection is not generally 'verified already-deceased/byproduct'-centered in a way that eliminates wild-capture/biodiversity harms.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In typical school programs, dissection does not generally eliminate wild-capture/biodiversity harms by being 'already-deceased/byproduct' centered.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In typical school programs, dissection does not generally eliminate wild-capture/biodiversity harms by being 'already-deceased/byproduct' centered.\",\n            \"Practices that cause substantial harm to animals and biodiversity are ethically unacceptable when avoidable through alternative methods.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Requiring typical student dissection imposes avoidable ethical/environmental harm.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Requiring typical student dissection imposes avoidable ethical/environmental harm.\",\n            \"Synthetic models and computer simulations can teach anatomy and related concepts equally well or better than dissecting dead animals.\",\n            \"Non-animal alternatives can be designed as hands-on, interactive activities (e.g., tactile/simulated dissections) so students still get learning/engagement benefits (including “aha moments”).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Schools can meet students’ biology learning goals with hands-on non-animal alternatives instead of dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Schools can meet students’ biology learning goals with hands-on non-animal alternatives instead of dissection.\",\n            \"When avoidable harm can be avoided while still achieving the educational goals, schools should choose the non-harmful alternative.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals; schools should use non-animal alternatives instead. \"\n      }\n    ],\n    \"Conc\": [\n      \"In typical school programs, dissection does not generally eliminate wild-capture/biodiversity harms by being 'already-deceased/byproduct' centered.\",\n      \"Requiring typical student dissection imposes avoidable ethical/environmental harm.\",\n      \"Schools can meet students’ biology learning goals with hands-on non-animal alternatives instead of dissection.\",\n      \"Students should not dissect animals; schools should use non-animal alternatives instead.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 1020, "y": 420}}, {"data": {"id": "e-arg-98c0a5e5b4", "source": "arg-98c0a5e5b4", "target": "arg-3bfd76ab5d", "ls": "solid", "label": "rebut", "detail": "arg-98c0a5e5b4 (AG1 defeat) → arg-3bfd76ab5d\nattack: rebut\ntarget_field: Conc\ntarget_statement: Schools should allow students to dissect animals in biology classes (using already-deceased specimens) rather than requiring non-animal alternatives in every case."}}, {"data": {"id": "arg-82499ccee2", "kind": "defeat", "label": "AG1 defeat\nStudents should be allowed to dissect an", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-82499ccee2\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-3bfd76ab5d\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals; schools should use non-animal alternatives instead.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"What matters for the ethical downside opponents cite is the sourcing of the specific specimens used for the *school classroom lesson*, not the overall mix of dissection animals across the entire dissection supply chain.\",\n            \"If a school’s classroom specimens are already-deceased meat-industry byproducts, then that classroom activity does not require the wild-capture/biodiversity harms opponents associate with dissection sourcing.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The opponent’s inference from “most dissection animals are wild-caught” to “typical school dissection can’t avoid the harms” is not established unless it’s shown that the *actual school specimens* come from that wild-caught sourcing.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The opponent’s inference from “most dissection animals are wild-caught” to “typical school dissection can’t avoid the harms” is not established unless it’s shown that the *actual school specimens* come from that wild-caught sourcing.\",\n            \"Schools can specify/choose suppliers who provide specimens that are already-deceased meat-industry byproducts (so schools can satisfy a verified already-deceased/byproduct condition for the classroom activity).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"It is practically possible for schools to run dissection lessons using verified already-deceased/byproduct specimens, even if other parts of the dissection market involve wild-caught animals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"It is practically possible for schools to run dissection lessons using verified already-deceased/byproduct specimens, even if other parts of the dissection market involve wild-caught animals.\",\n            \"When students dissect real anatomical structures, they gain meaningful hands-on benefits (fine motor skills, hand-eye coordination, and critical thinking) and can experience “aha moments” that foster enthusiasm and science-career interest.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"When sourcing is verified as already-deceased/byproduct, dissection delivers substantial educational and motivation benefits without depending on the wild-capture harms opponents emphasize.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"When sourcing is verified as already-deceased/byproduct, dissection delivers substantial educational and motivation benefits without depending on the wild-capture harms opponents emphasize.\",\n            \"If sourcing cannot be verified, schools should instead use non-animal alternatives until the verified condition is met.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should be allowed to dissect animals in biology classes when the school uses verified already-deceased (including meat-industry byproduct) specimens; if sourcing cannot be verified, schools should use non-animal alternatives instead.\"\n      }\n    ],\n    \"Conc\": [\n      \"The opponent’s inference from “most dissection animals are wild-caught” to “typical school dissection can’t avoid the harms” is not established unless it’s shown that the *actual school specimens* come from that wild-caught sourcing.\",\n      \"It is practically possible for schools to run dissection lessons using verified already-deceased/byproduct specimens, even if other parts of the dissection market involve wild-caught animals.\",\n      \"When sourcing is verified as already-deceased/byproduct, dissection delivers substantial educational and motivation benefits without depending on the wild-capture harms opponents emphasize.\",\n      \"Students should be allowed to dissect animals in biology classes when the school uses verified already-deceased (including meat-industry byproduct) specimens; if sourcing cannot be verified, schools should use non-animal alternatives instead.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 1190, "y": 420}}, {"data": {"id": "e-arg-82499ccee2", "source": "arg-82499ccee2", "target": "arg-3bfd76ab5d", "ls": "solid", "label": "rebut", "detail": "arg-82499ccee2 (AG1 defeat) → arg-3bfd76ab5d\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals; schools should use non-animal alternatives instead."}}, {"data": {"id": "end-arg-877d487aa7", "label": "終了: overruled（反論できず敗北）"}, "position": {"x": 0, "y": 385.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "end-arg-75ab6464e5", "label": "終了: overruled（反論できず敗北）"}, "position": {"x": 340, "y": 525.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "end-arg-535fae79cf", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 850, "y": 665.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "end-arg-c2bf38b473", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 1190, "y": 525.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG1", "label": "AG1: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 1360, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 1360, "y": 84.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>20<\/td><\/tr><tr><td>attack_turn_count<\/td><td>16<\/td><\/tr><tr><td>main_argument_count<\/td><td>4<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>2<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.238957<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Students *should be allowed to dissect animals only when the school can verify that the specimens are already-deceased and are legitimate meat-industry byproducts* (for example, fetal pigs used are documented as meat-industry byproducts), with that sourcing confirmed before the lesson.  \n\nIf the school **cannot clearly verify** that sourcing condition—so the usual ethical/environmental downside (such as wild-capture causing inhumane treatment and biodiversity loss) cannot be ruled out—then students **should not dissect animals**, and classrooms should use **non-animal alternatives** (synthetic/tactile models and simulations designed to meet the same learning goals).\n\n### Rationale (handling the key points from both sides)\n\n1) **Learning value can be real**\n- With verified already-deceased/byproduct specimens, dissection can provide meaningful **hands-on psychomotor practice** (fine motor skills, hand-eye coordination) and **critical thinking**, and it can create **engagement/“aha moments”** that encourage interest in science careers.\n\n2) **The main moral/environmental objection is about sourcing, not the existence of dissection itself**\n- The strongest ethical concern is that dissection programs may rely on sourcing that involves **inhumane treatment and wild-capture harms** (claimed to be roughly ~99% in typical cases), which can reduce local populations and biodiversity.\n- Therefore, the deciding factor is whether a school can **prevent that avoidable harm** by using **documented already-deceased byproducts** and not relying on wild-caught specimens.\n\n3) **Dissection is not uniquely required by major benchmarks—so safer alternatives are a legitimate substitute**\n- The objection that dissection is unnecessary is strongest where it’s not required by widely used curricular/benchmark expectations (e.g., AP Biology / NGSS) and where medical training doesn’t depend on it in the relevant way.\n- Given that point, when alternatives are available and capable of teaching effectively (often at least **equally well**), requiring dissection becomes harder to justify—especially when sourcing ethics can’t be verified.\n\n### Bottom line\n- **Yes, but only under verifiable “already-deceased byproduct” sourcing.**\n- **No, as the default when sourcing can’t be confirmed**—use non-animal, high-quality alternatives instead.<\/pre><\/details><div>justification_status: <b>fallback_no_consensus<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}]}};

  Object.keys(DATA).forEach(t=>btn(T,t,t===st.topic,()=>{st.topic=t;st.run=0;
    if(!DATA[t][st.method])st.method=METHODS.find(m=>DATA[t][m]);show();}));
  METHODS.filter(m=>DATA[st.topic][m]).forEach(m=>btn(M,m,m===st.method,()=>{st.method=m;st.run=0;show();}));
  DATA[st.topic][st.method].forEach((r,i)=>btn(R,'#'+r.run,i===st.run,()=>{st.run=i;show();}));
}
function show(){
  renderTabs();
  const r=DATA[st.topic][st.method][st.run];
  document.getElementById('q').textContent=r.question;
  document.getElementById('legend2').textContent=r.lane
    ?'点線: 発話順からの推定（直前の相手発話への応答）'
    :'木構造: 上 = 攻撃された論証、下 = それを攻撃/反論した論証（矢印は攻撃の向き）。実線 rebut / 破線 undercut ／ 枠 緑=justified 黄=defensible 灰=overruled';
  document.getElementById('meta').innerHTML=r.meta;
  document.getElementById('detail').textContent='ノードをクリック';
  cy.elements().remove(); cy.add(r.elements);
  cy.layout({name:'preset',fit:true,padding:40}).run();
}
st.topic=Object.keys(DATA)[0];st.method=METHODS.find(m=>DATA[st.topic][m]);show();
</script></body></html>
