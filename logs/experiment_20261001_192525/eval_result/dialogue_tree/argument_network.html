<script>
const DATA = {"animal_dissection": {"no_schema": [{"run": 1, "question": "Should students dissect animals?", "elements": [{"data": {"id": "arg-c6b474f90b", "kind": "main", "label": "AG1 main\nYes—students should dissect animals, bec", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-c6b474f90b\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nYes—students should dissect animals, because dissection provides learning and inspiration that alternative methods typically cannot match and because it uses animals that were already going to be dead.\n\nFirst, dissection gives students unique, hands-on biology experience that builds practical capabilities tied to meaningful learning: it develops fine motor skills, strengthens hand-eye coordination, and promotes critical thinking as students observe anatomy and connect structure to function.\n\nSecond, dissection can increase students’ interest in science careers. The close, real-anatomy experience often produces “aha” moments and hands-on engagement that can spark enthusiasm and encourage students to pursue science.\n\nThird, animal dissection can be a productive use of deceased animals rather than an added harm: the stance notes that over 98% of dissected animals were already deceased, and that fetal pigs used for dissection are meat-industry byproducts destined for landfills.\n\nGiven these points—the strong educational benefits, career-inspiring engagement, and the productive use of animals already dead—animal dissection is a worthwhile part of teaching biology, so students should dissect animals."}, "position": {"x": 85.0, "y": 0}}, {"data": {"id": "arg-2cf7d1b2ac", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals beca", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-2cf7d1b2ac\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-c6b474f90b\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Given these points—the strong educational benefits, career-inspiring engagement, and the productive use of animals already dead—animal dissection is a worthwhile part of teaching biology, so students should dissect animals.\"\n}\n\nStudents should not dissect animals because (1) the educational goals cited for dissection don’t require real dead animals—synthetic models and computer simulations can teach the same anatomy concepts as well or better, so students don’t gain essential learning that alternatives can’t provide; (2) major biology curricula and medical training don’t depend on animal dissection—animal dissection is not required by AP Biology or the NGSS, and U.S./Canadian medical schools do not use animals for physician training; and (3) animal dissection is not “no added harm”—as approximately 99% of dissection animals are caught in the wild, dissection depends on wild-capture that harms individual animals and reduces local populations and biodiversity, which is both inhumane and environmentally damaging."}, "position": {"x": 0.0, "y": 140}}, {"data": {"id": "e-arg-2cf7d1b2ac", "source": "arg-2cf7d1b2ac", "target": "arg-c6b474f90b", "ls": "solid", "label": "rebut", "detail": "arg-2cf7d1b2ac (AG2 defeat) → arg-c6b474f90b\nattack: rebut\ntarget_field: Conc\ntarget_statement: Given these points—the strong educational benefits, career-inspiring engagement, and the productive use of animals already dead—animal dissection is a worthwhile part of teaching biology, so students should dissect animals."}}, {"data": {"id": "arg-447fd20e55", "kind": "defeat", "label": "AG1 defeat\nThe target’s added-harm claim relies on ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-447fd20e55\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-2cf7d1b2ac\",\n  \"target_field\": \"Ass\"\n}\n\nThe target’s added-harm claim relies on a negated assumption: that it is *not* the case that most dissection animals were already dead (and thus that dissection largely depends on fresh wild-capture). I hold the opposite: it is the case that the vast majority of animals used for dissection were already deceased—e.g., over 98% of dissected animals were already dead. Also, fetal pigs used for dissection are meat-industry byproducts destined for landfills. If that is true, then dissection is not primarily driven by wild capture of live animals, so the “~99% wild-caught” harm mechanism the target invokes is not what typically happens. That invalidates the target’s crucial assumption behind its third reason against dissection."}, "position": {"x": 0, "y": 280}}, {"data": {"id": "e-arg-447fd20e55", "source": "arg-447fd20e55", "target": "arg-2cf7d1b2ac", "ls": "dashed", "label": "undercut", "detail": "arg-447fd20e55 (AG1 defeat) → arg-2cf7d1b2ac\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-a368b18980", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals beca", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-a368b18980\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-c6b474f90b\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Given these points—the strong educational benefits, career-inspiring engagement, and the productive use of animals already dead—animal dissection is a worthwhile part of teaching biology, so students should dissect animals.\"\n}\n\nStudents should not dissect animals because the claimed benefits don’t justify using dead animals when equivalent educational outcomes can be achieved with non-animal alternatives. Synthetic anatomical models and computer simulations can teach the same structures and functions with hands-on engagement, removing the “alternatives can’t match” premise. Also, major biology education and medical training do not require dissection—animal dissection is not required by AP Biology/NGSS and U.S./Canadian medical schools do not use animals for physician training—so dissection is not an educational necessity. Finally, dissection is not meaningfully “no added harm”: contrary to the “already dead” framing, roughly 99% of dissection animals are supplied via wild-capture, which harms individual animals and reduces local populations and biodiversity, making dissection ethically and environmentally bad."}, "position": {"x": 170.0, "y": 140}}, {"data": {"id": "e-arg-a368b18980", "source": "arg-a368b18980", "target": "arg-c6b474f90b", "ls": "solid", "label": "rebut", "detail": "arg-a368b18980 (AG2 defeat) → arg-c6b474f90b\nattack: rebut\ntarget_field: Conc\ntarget_statement: Given these points—the strong educational benefits, career-inspiring engagement, and the productive use of animals already dead—animal dissection is a worthwhile part of teaching biology, so students should dissect animals."}}, {"data": {"id": "arg-2866ecf3a8", "kind": "defeat", "label": "AG1 defeat\nThe target argument depends on a weak-ne", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-2866ecf3a8\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-a368b18980\",\n  \"target_field\": \"Ass\"\n}\n\nThe target argument depends on a weak-negation assumption that alternative methods (models/simulations) can achieve learning outcomes equivalent to real animal dissection—i.e., that it is *not the case* that dissection provides distinctive educational benefits that alternatives can’t reproduce. I hold that this assumption is false: real dissection uniquely supplies a full 3D, tactile, variable, real-tissue experience (actual organ textures/fragility and authentic anatomical variation) that is essential to the specific benefits claimed—building fine motor skills and hand-eye coordination through cutting/opening real specimens, and fostering critical thinking as students must interpret genuine anatomical structure and function under non-scripted conditions. Because alternatives at best provide conceptual/visual familiarity but can’t reliably reproduce that real-tissue, real-structure practice, they do not provide genuinely equivalent learning and inspiration, so dissection can be educationally necessary even when non-animal options exist."}, "position": {"x": 170, "y": 280}}, {"data": {"id": "e-arg-2866ecf3a8", "source": "arg-2866ecf3a8", "target": "arg-a368b18980", "ls": "dashed", "label": "undercut", "detail": "arg-2866ecf3a8 (AG1 defeat) → arg-a368b18980\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-cc8679452f", "kind": "main", "label": "AG2 main\nStudents should not dissect animals beca", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-cc8679452f\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nStudents should not dissect animals because the educational benefits AG1 cites are not uniquely dependent on killing and handling real dead animals, while dissection does require harmful animal sourcing.\n\nFirst, the claimed learning gains—hands-on anatomical learning that builds fine-motor/hand-eye coordination and critical thinking—can be achieved with non-animal alternatives. Synthetic anatomy models and computer/simulation-based labs let students manipulate anatomical structures and analyze structure-to-function relationships without needing real animal bodies.\n\nSecond, the claimed engagement/career inspiration from “real anatomy” is likewise not dependent on dissection with dead animals; the key driver is active exposure to biology content, and that can be provided through alternatives that keep students actively engaged.\n\nThird, because dissection is not educationally necessary for these outcomes, the harms it entails are unjustified. Dissection depends on sourcing animals in ways that are inhumane and environmentally damaging: approximately 99% are caught in the wild, which harms individual animals and reduces local populations and biodiversity.\n\nSo, when students can meet the intended learning and engagement goals without dead animals, schools should choose alternatives rather than requiring animal dissection."}, "position": {"x": 425.0, "y": 0}}, {"data": {"id": "arg-5862ae0ece", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals because ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-5862ae0ece\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-cc8679452f\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"So, when students can meet the intended learning and engagement goals without dead animals, schools should choose alternatives rather than requiring animal dissection.\"\n}\n\nStudents should dissect animals because (1) the educational outcomes AG2 calls “achievable with alternatives” are specifically tied to working with real anatomical tissue—students gain tactile, spatial, and fine-motor learning (and related critical-thinking practice) from actual dissection that synthetic models/simulations generally can’t replicate in the same way; and (2) the harm rationale AG2 uses is based on a false premise about sourcing: most dissection animals are already deceased (over 98%), and fetal pigs used for dissection are meat-industry byproducts already destined for landfills, so dissection is a comparatively low-additional-harm use. With both irreplaceable hands-on learning and limited additional harm, animal dissection remains a worthwhile biology teaching practice."}, "position": {"x": 340.0, "y": 140}}, {"data": {"id": "e-arg-5862ae0ece", "source": "arg-5862ae0ece", "target": "arg-cc8679452f", "ls": "solid", "label": "rebut", "detail": "arg-5862ae0ece (AG1 defeat) → arg-cc8679452f\nattack: rebut\ntarget_field: Conc\ntarget_statement: So, when students can meet the intended learning and engagement goals without dead animals, schools should choose alternatives rather than requiring animal dissection."}}, {"data": {"id": "arg-1da03da1d2", "kind": "defeat", "label": "AG2 defeat\nThe target relies on the negation assump", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-1da03da1d2\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-5862ae0ece\",\n  \"target_field\": \"Ass\"\n}\n\nThe target relies on the negation assumption that it is *not* the case that most dissection animals are obtained via wild-capture (i.e., that “most are already deceased” is true, making dissection comparatively low-additional-harm). But a core fact about dissection supply is that about 99% of dissection animals are caught in the wild. That wild-catching process harms individual animals and reduces local populations and biodiversity, so animal dissection involves substantial additional harm and environmental damage—not “limited additional harm”—which undercuts the target’s harm-based justification."}, "position": {"x": 340, "y": 280}}, {"data": {"id": "e-arg-1da03da1d2", "source": "arg-1da03da1d2", "target": "arg-5862ae0ece", "ls": "dashed", "label": "undercut", "detail": "arg-1da03da1d2 (AG2 defeat) → arg-5862ae0ece\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-c29e6d1e9d", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals because ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-c29e6d1e9d\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-cc8679452f\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"the educational benefits AG1 cites are not uniquely dependent on killing and handling real dead animals\"\n}\n\nStudents should dissect animals because (1) the specific educational benefits AG1 cites aren’t just “content delivery”: they depend on working with real anatomical tissue, where students get direct tactile/spatial experience (e.g., how organs actually relate, the physical resistance/structure of connective tissue, and real variability in anatomy) that synthetic models/simulations typically can’t reproduce in the same way; and (2) the harm/sourcing premise in AG2’s case is inaccurate: dissection is commonly done with animals that are already deceased (over 98% per AG1’s stance) and with fetal pigs that are meat-industry byproducts destined for landfills—so dissection is a comparatively low-additional-harm use rather than an intrinsically new cruelty supply chain. With both irreplaceable real-tissue learning and limited added harm, dissection remains a worthwhile biology teaching practice."}, "position": {"x": 510.0, "y": 140}}, {"data": {"id": "e-arg-c29e6d1e9d", "source": "arg-c29e6d1e9d", "target": "arg-cc8679452f", "ls": "dashed", "label": "undercut", "detail": "arg-c29e6d1e9d (AG1 defeat) → arg-cc8679452f\nattack: undercut\ntarget_field: Ass\ntarget_statement: the educational benefits AG1 cites are not uniquely dependent on killing and handling real dead animals"}}, {"data": {"id": "arg-3e60b6ffe1", "kind": "counter", "label": "AG2 counter\nEven if dissection gives a kind of tacti", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-3e60b6ffe1\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-c29e6d1e9d\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"With both irreplaceable real-tissue learning and limited added harm, dissection remains a worthwhile biology teaching practice.\"\n}\n\nEven if dissection gives a kind of tactile/spatial experience, that does not justify making students dissect animals, because animal dissection is not required to meet the biology learning goals that schools are supposed to cover: it is not required by College Board AP Biology or the Next Generation Science Standards, and no U.S./Canadian medical schools use animals for physician training. So “real-tissue” dissection is not an educational necessity for achieving the relevant curriculum/career outcomes; schools can meet those outcomes with non-animal methods instead of imposing animal killing and handling on students."}, "position": {"x": 510, "y": 280}}, {"data": {"id": "e-arg-3e60b6ffe1", "source": "arg-3e60b6ffe1", "target": "arg-c29e6d1e9d", "ls": "solid", "label": "rebut", "detail": "arg-3e60b6ffe1 (AG2 counter) → arg-c29e6d1e9d\nattack: rebut\ntarget_field: Conc\ntarget_statement: With both irreplaceable real-tissue learning and limited added harm, dissection remains a worthwhile biology teaching practice."}}, {"data": {"id": "end-arg-c6b474f90b", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 170, "y": 385.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "end-arg-cc8679452f", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 510, "y": 385.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG1", "label": "AG1: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 680, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 680, "y": 84.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>10<\/td><\/tr><tr><td>attack_turn_count<\/td><td>8<\/td><\/tr><tr><td>main_argument_count<\/td><td>2<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>0<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.031669<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>No. Students should not dissect animals in typical school biology classes; schools should meet the learning goals with non-animal alternatives.\n\n### Why the “no dissection” conclusion is best supported\n1. **The targeted educational outcomes don’t require real animal dissection**\n   - The dissection case relies on benefits like **hands-on anatomical understanding** that strengthens **fine-motor skills/hand–eye coordination**, supports **critical thinking**, and creates **“aha” engagement** that can spark **science/career interest**.\n   - However, the best-supported policy standard in the integrated criteria is: if those same outcomes can be achieved **at least as well** using **synthetic anatomy models and computer/simulation labs**, then dissection is not justified.\n   - The opposing view also notes that dissection is **not required** by **AP Biology/NGSS** and is **not used for physician training** in U.S./Canadian medical education—meaning the curriculum/career objectives dissection is often used to justify are not contingent on animal killing and handling.\n\n2. **The environmental/ethical “added harm” is not resolved well enough to justify animal use**\n   - The pro-dissection argument claims **most animals are already dead** (e.g., “over 98%”), including **fetal pigs as meat-industry byproducts** destined for landfills.\n   - The anti-dissection argument instead claims **most animals are wild-caught** (e.g., “approximately 99%”), with harms to individual animals and **reduced local populations/biodiversity**.\n   - The debate did not settle which sourcing picture is generally correct. Because the justification depends on “no significant additional harm” from dissection, and that key premise is **not decisively established**, the ethical risk cannot be discounted.\n\n### What remains an unresolved issue (and why it doesn’t change the recommendation)\n- **Unresolved point:** whether dissection supply chains are typically dominated by **byproducts from already-deceased animals** (supporting “minimal additional harm”) or by **wild-caught animals** (supporting “substantial additional harm”).\n- **Why the recommendation still leans “no”:** even if dissection sometimes uses already-dead specimens, the question isn’t only “does dissection teach something?”—it’s whether schools should impose animal dissection when (a) **non-animal methods can address the learning objectives**, and (b) the **harm assessment isn’t securely resolved** to meet the “no significant additional harm” standard.\n\n**Bottom line:** Because dissection is not educationally necessary for the relevant curriculum/training goals and because the sourcing/harm premise isn’t convincingly settled, the most defensible approach is to use **non-animal alternatives** instead of requiring students to dissect animals.<\/pre><\/details><div>justification_status: <b>fallback_no_consensus<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}, {"run": 2, "question": "Should students dissect animals?", "elements": [{"data": {"id": "arg-b36bd57486", "kind": "main", "label": "AG1 main\nStudents should dissect animals in schoo", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-b36bd57486\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nStudents should dissect animals in school biology because dissection provides unique, high-value learning that directly develops key scientific abilities and motivation, while also using specimens that are already dead and are otherwise headed for disposal.\n\nFirst, dissection is a valuable part of teaching biology because it offers more learning opportunities than purely visual or simulated methods: students must actively observe real anatomy and use their knowledge to interpret what they see. Second, working through an actual dissection builds fine motor skills, hand-eye coordination, and critical thinking as students handle specimens and analyze structures step-by-step. Third, these hands-on “aha moments” can encourage students to pursue careers in science by giving them direct experience that sparks genuine interest.\n\nFinally, the ethical tradeoff is reduced because animal dissection can be conducted with animals that were already deceased—over 98% of dissected animals were already dead—and fetal pigs used for dissection are meat industry byproducts destined for landfills rather than being wasted.\n\nGiven the strong educational benefits (skills + critical thinking + career inspiration) and the low added animal-harm concern (use of already-deceased byproduct animals), the best overall conclusion is that students should dissect animals."}, "position": {"x": 170.0, "y": 0}}, {"data": {"id": "arg-fe263717cf", "kind": "defeat", "label": "AG2 defeat\nMost school dissection specimens are not", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-fe263717cf\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-b36bd57486\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"the ethical tradeoff is reduced because animal dissection can be conducted with animals that were already deceased—over 98% of dissected animals were already dead—and fetal pigs used for dissection are meat industry byproducts destined for landfills rather than being wasted\"\n}\n\nMost school dissection specimens are not low-harm “already-dead” byproducts. In practice, roughly ~99% of animals used for dissection are caught in the wild, and that wild-catching reduces local populations and biodiversity—so dissection’s ethical cost is substantial, not “reduced.”\n\nAlso, real-animal dissection is not necessary for achieving biology learning goals: synthetic models and computer simulations can teach the same anatomy/structure and give students effective practice without killing animals. Therefore, students should not dissect animals in school biology."}, "position": {"x": 170.0, "y": 140}}, {"data": {"id": "e-arg-fe263717cf", "source": "arg-fe263717cf", "target": "arg-b36bd57486", "ls": "dashed", "label": "undercut", "detail": "arg-fe263717cf (AG2 defeat) → arg-b36bd57486\nattack: undercut\ntarget_field: Ass\ntarget_statement: the ethical tradeoff is reduced because animal dissection can be conducted with animals that were already deceased—over 98% of dissected animals were already dead—and fetal pigs used for dissection are meat industry byproducts destined for landfills rather than being wasted"}}, {"data": {"id": "arg-f95b06327d", "kind": "counter", "label": "AG1 counter\nEven if some programs obtain specimens i", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-f95b06327d\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-fe263717cf\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Therefore, students should not dissect animals in school biology.\"\n}\n\nEven if some programs obtain specimens in ways that raise concerns, the ethical and educational case for dissection in schools does not hinge on “wild-caught” animals being involved at all; it hinges on how specimens are sourced and on what biology education is trying to train students to do. \n\n1) Ethical tradeoff: Dissection is ethically supportable when schools use animals that were already dead (e.g., byproducts from the meat industry) rather than treating dissection as inherently equivalent to wild-capture. So the claim that dissection’s ethical cost is automatically “substantial” is too general for deciding what students should do in school. \n\n2) Learning goals: The opponent’s “simulations can teach the same anatomy” point addresses only conceptual familiarity with structures. But biology education also aims to build real lab practice—student scientific reasoning that comes from working with an intact specimen, together with the hands-on observational and analytical skills gained from physically handling and examining real tissue. Those are precisely the learning opportunities dissection adds beyond visuals/simulations, and they are hard to replicate with models alone.\n\nBecause (a) ethical dissection can be conducted using already-deceased byproduct animals instead of live-capture, and (b) real specimens provide distinctive training in scientific practice beyond concept recall, students should be allowed to dissect animals as part of school biology."}, "position": {"x": 0, "y": 280}}, {"data": {"id": "e-arg-f95b06327d", "source": "arg-f95b06327d", "target": "arg-fe263717cf", "ls": "solid", "label": "rebut", "detail": "arg-f95b06327d (AG1 counter) → arg-fe263717cf\nattack: rebut\ntarget_field: Conc\ntarget_statement: Therefore, students should not dissect animals in school biology."}}, {"data": {"id": "arg-aec2707068", "kind": "counter", "label": "AG1 counter\nThe opponent’s claim that dissection “is", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-aec2707068\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-fe263717cf\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Therefore, students should not dissect animals in school biology.\"\n}\n\nThe opponent’s claim that dissection “is not necessary” rests on treating anatomy/structure knowledge as the main (or only) biology learning goal. But dissection is also used in schools to build sustained scientific engagement—those hands-on “aha moments” that translate into students choosing to pursue science (and careers in science) because they had direct, memorable experience doing real lab work rather than only seeing diagrams or screen-based representations.\n\nSo even if models/simulations can cover anatomical concepts, dissection is still pedagogically necessary for schools that aim to motivate students and develop interest in science, not merely to transmit information. Given that educational aim, students should be allowed to dissect animals in school biology."}, "position": {"x": 170, "y": 280}}, {"data": {"id": "e-arg-aec2707068", "source": "arg-aec2707068", "target": "arg-fe263717cf", "ls": "solid", "label": "rebut", "detail": "arg-aec2707068 (AG1 counter) → arg-fe263717cf\nattack: rebut\ntarget_field: Conc\ntarget_statement: Therefore, students should not dissect animals in school biology."}}, {"data": {"id": "arg-4c4c322bd4", "kind": "counter", "label": "AG1 counter\nThe ethical premise of the attack is wro", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-4c4c322bd4\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-fe263717cf\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Therefore, students should not dissect animals in school biology.\"\n}\n\nThe ethical premise of the attack is wrong: school dissection programs typically use animals that were already deceased, and the byproduct animals used for dissection (e.g., fetal pigs from the meat industry) are headed for disposal otherwise. So dissection need not impose the “substantial” added harm the opponent claims.\n\nSeparately, even if models and simulations can teach some anatomy concepts, they don’t replicate the distinctive hands-on training from manipulating real tissue—especially the development of fine motor skills and hand-eye coordination that come from physically performing a dissection step-by-step.\n\nBecause (1) appropriate dissection uses already-deceased, otherwise-disposed animals, and (2) dissection provides irreplaceable real-tissue lab practice for core biological skills, students should dissect animals in school biology."}, "position": {"x": 340, "y": 280}}, {"data": {"id": "e-arg-4c4c322bd4", "source": "arg-4c4c322bd4", "target": "arg-fe263717cf", "ls": "solid", "label": "rebut", "detail": "arg-4c4c322bd4 (AG1 counter) → arg-fe263717cf\nattack: rebut\ntarget_field: Conc\ntarget_statement: Therefore, students should not dissect animals in school biology."}}, {"data": {"id": "arg-af0d0b16fb", "kind": "main", "label": "AG2 main\nStudents should not dissect animals in s", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-af0d0b16fb\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nStudents should not dissect animals in school biology because animal dissection is not necessary to achieve the learning and training outcomes society actually requires.\n\n1) Required learning outcomes: College Board AP Biology and the Next Generation Science Standards do not require animal dissection to learn the biology concepts students are expected to master.\n\n2) Professional training: No U.S. or Canadian medical schools use animals for physician training, so dissection is not an essential pipeline step for becoming a doctor.\n\n3) Tradeoff: Since dissection is unnecessary for these required outcomes, schools should not impose the animal-killing/inhumane and environmentally harmful aspects of dissection when the educational goals can be met using alternatives (e.g., synthetic models and computer simulations).\n\nGiven that dissection provides no required educational or professional benefit under the relevant standards while still involving harming animals, the humane and responsible choice is to prohibit animal dissection in school."}, "position": {"x": 510.0, "y": 0}}, {"data": {"id": "arg-2281c2bfcc", "kind": "defeat", "label": "AG1 defeat\nThe key mistake in the attack is treatin", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-2281c2bfcc\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-af0d0b16fb\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"animal dissection is not necessary to achieve the learning and training outcomes society actually requires\"\n}\n\nThe key mistake in the attack is treating “not explicitly required” by standards (or “not needed for physician training”) as meaning animal dissection is not necessary for the learning society cares about in school biology.\n\nSchool biology is supposed to train students’ ability to do real scientific inquiry—e.g., examining biological structures directly, using evidence from observations/measurements, and applying scientific reasoning to authentic specimens. Those are precisely the kinds of scientific practices dissection supports because it requires students to work with real tissue, follow a procedure step-by-step, and interpret what they observe in anatomical context. Computer/synthetic tools may help teach concepts, but they don’t fully replicate the hands-on investigation and evidence-based reasoning that comes from working on an actual organism.\n\nTherefore, dissection provides needed educational value for biology learning goals, so students should be allowed to dissect animals in school biology."}, "position": {"x": 510.0, "y": 140}}, {"data": {"id": "e-arg-2281c2bfcc", "source": "arg-2281c2bfcc", "target": "arg-af0d0b16fb", "ls": "dashed", "label": "undercut", "detail": "arg-2281c2bfcc (AG1 defeat) → arg-af0d0b16fb\nattack: undercut\ntarget_field: Ass\ntarget_statement: animal dissection is not necessary to achieve the learning and training outcomes society actually requires"}}, {"data": {"id": "arg-0329343476", "kind": "counter", "label": "AG2 counter\nI hold that the “real scientific inquiry", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-0329343476\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-2281c2bfcc\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"Computer/synthetic tools may help teach concepts, but they don’t fully replicate the hands-on investigation and evidence-based reasoning that comes from working on an actual organism.\"\n}\n\nI hold that the “real scientific inquiry/evidence-based reasoning” benefit the attack points to does not require animal dissection with real animal tissue. The core inquiry skills targeted in school biology (observing structures, following procedures, recording evidence, and interpreting results) are process skills that can be taught through synthetic models and computer simulations that give students hands-on practice with the same structures—without killing animals. \n\nTherefore, the attack’s premise that only dissection can provide the needed investigation/evidence-based learning is false; dissection is not necessary for the biology learning goals, so students should not dissect animals in school."}, "position": {"x": 510.0, "y": 280}}, {"data": {"id": "e-arg-0329343476", "source": "arg-0329343476", "target": "arg-2281c2bfcc", "ls": "dashed", "label": "undercut", "detail": "arg-0329343476 (AG2 counter) → arg-2281c2bfcc\nattack: undercut\ntarget_field: Ass\ntarget_statement: Computer/synthetic tools may help teach concepts, but they don’t fully replicate the hands-on investigation and evidence-based reasoning that comes from working on an actual organism."}}, {"data": {"id": "arg-0e43b82149", "kind": "defeat", "label": "AG1 defeat\nI hold that teaching “real scientific in", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-0e43b82149\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-0329343476\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"The core inquiry skills targeted in school biology (observing structures, following procedures, recording evidence, and interpreting results) are process skills that can be taught through synthetic models and computer simulations that give students effective practice with the same structures—without killing animals.\"\n}\n\nI hold that teaching “real scientific inquiry/evidence-based reasoning” in a way that students can actually practice and develop requires more than conceptual familiarity with anatomy—it requires working with authentic biological specimens where the evidence is physically encountered and not idealized.\n\nSynthetic models and computer simulations may represent structures, but they cannot fully replicate the way real tissue behaves and varies: students don’t just “view” anatomy, they must manipulate real tissue, deal with biological variability and imperfections, and interpret observations that emerge from the specimen itself (rather than from a fixed digital depiction). Those are core parts of the inquiry and reasoning process, and they directly support the hands-on learning and critical thinking dissection provides.\n\nSo, dissection is genuinely necessary for those inquiry/reasoning learning goals in school biology, meaning students should be allowed to dissect animals."}, "position": {"x": 510.0, "y": 420}}, {"data": {"id": "e-arg-0e43b82149", "source": "arg-0e43b82149", "target": "arg-0329343476", "ls": "dashed", "label": "undercut", "detail": "arg-0e43b82149 (AG1 defeat) → arg-0329343476\nattack: undercut\ntarget_field: Ass\ntarget_statement: The core inquiry skills targeted in school biology (observing structures, following procedures, recording evidence, and interpreting results) are process skills that can be taught through synthetic models and computer simulations that give students effective practice with the same structures—without killing animals."}}, {"data": {"id": "arg-2ff7a9d790", "kind": "counter", "label": "AG2 counter\nI hold that “authentic, real tissue” is ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-2ff7a9d790\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-0e43b82149\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Therefore, dissection provides needed educational value for biology learning goals, so students should be allowed to dissect animals in school biology.\"\n}\n\nI hold that “authentic, real tissue” is not necessary to develop the evidence-based inquiry skills schools are aiming for, because what drives good inquiry training is students practicing observation, procedure-following, recording evidence, and interpreting results—not that the evidence must come from killing a real animal.\n\nReal-animal dissection has major pedagogical limits: it is largely one-time and destructive (students can’t repeat the same investigation to test uncertainty), the quality/condition of specimens varies, and students often end up focusing on simply getting through the dissection rather than making systematic, repeatable comparisons and interpreting evidence across cases. Those are features that undermine evidence-based reasoning.\n\nBy contrast, synthetic models and computer simulations can be used repeatedly under consistent conditions, letting students rerun observations, compare multiple “cases,” and practice interpreting results from evidence they collect—still building the same inquiry workflow (observe → record → analyze → interpret) without killing animals.\n\nTherefore, dissection is not needed for the inquiry/learning goals, so students should not be allowed to dissect animals in school biology."}, "position": {"x": 510, "y": 560}}, {"data": {"id": "e-arg-2ff7a9d790", "source": "arg-2ff7a9d790", "target": "arg-0e43b82149", "ls": "solid", "label": "rebut", "detail": "arg-2ff7a9d790 (AG2 counter) → arg-0e43b82149\nattack: rebut\ntarget_field: Conc\ntarget_statement: Therefore, dissection provides needed educational value for biology learning goals, so students should be allowed to dissect animals in school biology."}}, {"data": {"id": "end-arg-b36bd57486", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 340, "y": 385.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "end-arg-af0d0b16fb", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 510, "y": 665.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG1", "label": "AG1: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 680, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 680, "y": 84.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>10<\/td><\/tr><tr><td>attack_turn_count<\/td><td>8<\/td><\/tr><tr><td>main_argument_count<\/td><td>2<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>0<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.049518<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Students **should not** dissect animals in school biology.\n\n### Rationale (why the “should” conditions aren’t met)\nTo justify animal dissection, the argument has to satisfy **both** of the following:\n\n1) **Real dissection must provide uniquely high educational value** that alternatives (synthetic models/computer simulations) can’t match—e.g., developing fine motor skills, hand-eye coordination, and critical thinking, plus “aha moments” that meaningfully boost motivation/career interest.  \n2) **The animal-harm impact must be low**, specifically because specimens are effectively already dead/byproducts (e.g., predominantly already deceased; fetal pigs being meat-industry byproducts headed for disposal).\n\nIn the debate, the educational-benefit claim was strong in principle (fine motor skills, real anatomy observation, engagement). However, the overall justification fails because the other required component is not established convincingly, and the “need” component was not met:\n\n### The key missing piece: dissection isn’t required for mandated outcomes\nThe opposing case directly argues that **College Board AP Biology** and the **Next Generation Science Standards** do **not require** animal dissection for the required concepts, and that **U.S./Canadian medical schools** do **not use animals for physician training**. The pro-dissection responses did not successfully negate this “not required” point; they argued instead that dissection is valuable for authentic inquiry and motivation. But under the conditions for allowing dissection, *value alone* is not enough—if dissection is not necessary to achieve the outcomes society requires, then it shouldn’t be imposed when alternatives exist.\n\n### The ethical/harm component is also not resolved in favor of dissection being “low-harm”\nThe pro-dissection side claims a low-harm tradeoff based on:\n- **Over 98%** of dissected animals already being dead, and  \n- **Fetal pigs as meat-industry byproducts destined for landfills**.\n\nThe anti-dissection side counters that:\n- about **99%** are **caught in the wild**, reducing local populations and biodiversity.\n\nThose two sourcing pictures are in direct tension, and the debate did not fully reconcile them with evidence strong enough to establish that dissection’s added animal-harm impact is reliably “low because specimens are already byproducts.” Even if some programs use byproducts, the central harm question remains contested—meaning the “low impact” requirement for permitting dissection is not clearly satisfied.\n\n### Alternatives reduce the justification further\nEven assuming dissection can build real skills, the anti-dissection side argues alternatives (synthetic models, computer simulations) can teach **equally well or better** for the learning goals. Since dissection is not shown to be **required**, and the harm-to-benefit tradeoff is not demonstrated as clearly low-risk, the humane choice is to use alternatives.\n\n---\n\n## Bottom line\nBecause **animal dissection is not required** by the cited educational/professional expectations, and because the claim that the animal-harm impact is **consistently low** (already-deceased/byproduct sourcing) was **not definitively supported against strong counterclaims about wild-capture**, the best-supported conclusion is: **students should not dissect animals** in school biology.<\/pre><\/details><div>justification_status: <b>fallback_no_consensus<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}, {"run": 3, "question": "Should students dissect animals?", "elements": [{"data": {"id": "arg-d3691f4bea", "kind": "main", "label": "AG1 main\nStudents should dissect animals because ", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-d3691f4bea\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nStudents should dissect animals because it directly improves biology learning through hands-on study: it provides more learning opportunities than purely observational methods, while building fine motor skills, hand-eye coordination, and critical thinking. Those same “aha moments” and real lab experience can also motivate students to pursue science careers by making the subject feel tangible and inspiring. Finally, dissection is a productive use of animals that are already dead—more than 98% of dissected animals were already deceased—and fetal pigs used in many school dissections are meat-industry byproducts that would otherwise be destined for landfills. Taken together, dissection supports core educational goals, can increase long-term interest in science, and uses dead animals in a way that reduces waste, so it is worthwhile for students."}, "position": {"x": 85.0, "y": 0}}, {"data": {"id": "arg-b46342c9e5", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals beca", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-b46342c9e5\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-d3691f4bea\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"so it is worthwhile for students (students should dissect animals)\"\n}\n\nStudents should not dissect animals because the educational benefits claimed for dissection are not unique and do not justify the harms. Biology learning (including anatomy understanding and related reasoning) does not require dead animals: synthetic models and computer simulations can teach equally well or better. Meanwhile, dissection programs rely on inhumane and environmentally damaging sourcing—about 99% of dissection animals are caught in the wild, and wild-catching decreases local populations and reduces biodiversity. So even if dissection is framed as hands-on or as using “already dead” animals, it still imposes unnecessary animal suffering and biodiversity loss without a necessary educational advantage."}, "position": {"x": 0.0, "y": 140}}, {"data": {"id": "e-arg-b46342c9e5", "source": "arg-b46342c9e5", "target": "arg-d3691f4bea", "ls": "solid", "label": "rebut", "detail": "arg-b46342c9e5 (AG2 defeat) → arg-d3691f4bea\nattack: rebut\ntarget_field: Conc\ntarget_statement: so it is worthwhile for students (students should dissect animals)"}}, {"data": {"id": "arg-bfa56e3acf", "kind": "defeat", "label": "AG1 defeat\nA key weak negation assumption in the ta", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-bfa56e3acf\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-b46342c9e5\",\n  \"target_field\": \"Ass\"\n}\n\nA key weak negation assumption in the target is: “dissection programs rely on inhumane and environmentally damaging sourcing—about 99% of dissection animals are caught in the wild.” That’s not the case for the typical school-dissection supply. In practice, more than 98% of dissected animals were already deceased, meaning the program is largely using specimens that did not involve wild capture for the sake of dissection. In addition, fetal pigs commonly used in school dissections are meat-industry byproducts that would otherwise be headed to landfills. If the animals are predominantly already dead/byproducts rather than wild-caught, then the target’s claim that dissection imposes largely “unnecessary” wild-capture suffering and biodiversity loss is undermined—its main harms premise is built on an incorrect sourcing assumption."}, "position": {"x": 0, "y": 280}}, {"data": {"id": "e-arg-bfa56e3acf", "source": "arg-bfa56e3acf", "target": "arg-b46342c9e5", "ls": "dashed", "label": "undercut", "detail": "arg-bfa56e3acf (AG1 defeat) → arg-b46342c9e5\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-98bc72e723", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals beca", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-98bc72e723\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-d3691f4bea\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should dissect animals because it directly improves biology learning through hands-on study: it provides more learning opportunities than purely observational methods, while building fine motor skills, hand-eye coordination, and critical thinking... Taken together, dissection supports core educational goals, can increase long-term interest in science, and uses dead animals in a way that reduces waste, so it is worthwhile for students.\"\n}\n\nStudents should not dissect animals because animal dissection is not necessary to meet the relevant educational and medical purposes the target invokes. Dissection is not required by College Board AP Biology or by the Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training. So the “core educational goals” justification doesn’t establish a need for harming animals; schools can achieve the stated learning purposes without dissection (using non-animal methods that align with the standards)."}, "position": {"x": 170.0, "y": 140}}, {"data": {"id": "e-arg-98bc72e723", "source": "arg-98bc72e723", "target": "arg-d3691f4bea", "ls": "solid", "label": "rebut", "detail": "arg-98bc72e723 (AG2 defeat) → arg-d3691f4bea\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should dissect animals because it directly improves biology learning through hands-on study: it provides more learning opportunities than purely observational methods, while building fine motor skills, hand-eye coordination, and critical thinking... Taken together, dissection supports core educational goals, can increase long-term interest in science, and uses dead animals in a way that reduces waste, so it is worthwhile for students."}}, {"data": {"id": "arg-57c8cefe05", "kind": "defeat", "label": "AG1 defeat\nThe target undercuts by assuming that sc", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-57c8cefe05\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-98bc72e723\",\n  \"target_field\": \"Ass\"\n}\n\nThe target undercuts by assuming that schools can meet the relevant “core educational goals” without dissection (i.e., that non-animal methods can fully substitute for the specific learning gains it invokes). But the target’s negation rests on the weak premise that alternative methods provide the same kind of learning opportunities.\n\nI hold that dissection uniquely supplies experiential, psychomotor “hands-on” training—fine motor skills, hand-eye coordination, and real lab reasoning from manipulating and tracing real anatomy—along with vivid “aha” moments that can meaningfully increase students’ engagement and interest in science. Because these are exactly the kinds of gains the target treats as achievable without harming animals, the substitution assumption is false: simulations/models and non-dissection alternatives may teach concepts, but they do not replicate the same level of real specimen manipulation and the attendant learning/skill outcomes."}, "position": {"x": 170, "y": 280}}, {"data": {"id": "e-arg-57c8cefe05", "source": "arg-57c8cefe05", "target": "arg-98bc72e723", "ls": "dashed", "label": "undercut", "detail": "arg-57c8cefe05 (AG1 defeat) → arg-98bc72e723\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-e2b36ac945", "kind": "main", "label": "AG2 main\nStudents should not dissect animals beca", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-e2b36ac945\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\nStudents should not dissect animals because dissection is not a necessary method for meeting the relevant educational and medical purposes, and when a harmful practice isn’t necessary, schools should replace it with harm-minimizing alternatives. First, animal dissection is not required by AP Biology (College Board) or by the Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training—so dissection is optional rather than required for competence or mandated learning outcomes. Second, synthetic models and computer simulations can teach anatomy/biology just as well or better than using dead animals. Third, dissection carries serious ethical and environmental costs: the vast majority of dissection animals are caught in the wild (about 99%), and wild-catching decreases local populations and biodiversity. Putting these together: since schools can achieve the learning goals without dissection and dissection imposes avoidable animal suffering and biodiversity loss, the correct educational choice is to use non-animal alternatives rather than dissect animals."}, "position": {"x": 425.0, "y": 0}}, {"data": {"id": "arg-e3bf2b439e", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals because ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-e3bf2b439e\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-e2b36ac945\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals because dissection is not a necessary method for meeting the relevant educational and medical purposes… synthetic models and computer simulations can teach… just as well or better… and dissection carries serious ethical and environmental costs… putting these together… the correct educational choice is to use non-animal alternatives rather than dissect animals.\"\n}\n\nStudents should dissect animals because (1) it provides educational benefits that go beyond typical observation: direct anatomical manipulation gives students more learning opportunities and builds fine motor skills, hand-eye coordination, and critical thinking, producing “aha moments” that make biology feel real; (2) those hands-on experiences can increase students’ interest in science careers; and (3) dissection, as commonly practiced in schools, is usually a productive use of animals that are already dead—more than 98% of dissected animals were already deceased—and fetal pigs used in many school dissections are meat-industry byproducts that would otherwise contribute to landfill waste. Given these educational gains and the minimized “new harm” from using already-deceased/byproduct animals, dissection is a worthwhile biology teaching method for students."}, "position": {"x": 340.0, "y": 140}}, {"data": {"id": "e-arg-e3bf2b439e", "source": "arg-e3bf2b439e", "target": "arg-e2b36ac945", "ls": "solid", "label": "rebut", "detail": "arg-e3bf2b439e (AG1 defeat) → arg-e2b36ac945\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals because dissection is not a necessary method for meeting the relevant educational and medical purposes… synthetic models and computer simulations can teach… just as well or better… and dissection carries serious ethical and environmental costs… putting these together… the correct educational choice is to use non-animal alternatives rather than dissect animals."}}, {"data": {"id": "arg-76a1e77c6c", "kind": "defeat", "label": "AG2 defeat\nThe target relies on the weak_negation a", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-76a1e77c6c\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-e3bf2b439e\",\n  \"target_field\": \"Ass\"\n}\n\nThe target relies on the weak_negation assumption that “dissection, as commonly practiced in schools, is usually a productive use of animals that are already dead/byproducts,” which is what makes the “new harm” minimal. That premise is not the case: roughly 99% of dissection animals are sourced by catching them in the wild, and wild-catching decreases local populations and reduces biodiversity. Therefore, dissection commonly creates substantial additional harm rather than “minimized” new harm—even before considering any learning-related tradeoff."}, "position": {"x": 340, "y": 280}}, {"data": {"id": "e-arg-76a1e77c6c", "source": "arg-76a1e77c6c", "target": "arg-e3bf2b439e", "ls": "dashed", "label": "undercut", "detail": "arg-76a1e77c6c (AG2 defeat) → arg-e3bf2b439e\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "arg-0e51b35bad", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals because ", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-0e51b35bad\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-e2b36ac945\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals.\"\n}\n\nStudents should dissect animals because real dissection provides learning and skill development that simulations and models cannot fully replicate: students directly manipulate real organ structures in 3D and practice the specific fine-motor, hand–eye coordination, and critical-reasoning steps involved in anatomical investigation. Also, the ethical/environmental-cost picture in the “most are wild-caught” framing is overstated for typical school dissections: dissection specimens are commonly already dead, and fetal pigs used in many classes are meat-industry byproducts that would otherwise be disposed of rather than used. So dissection is a worthwhile educational method with largely “no additional” harm relative to the animal supply that already exists, and its unique hands-on benefits outweigh the costs."}, "position": {"x": 510.0, "y": 140}}, {"data": {"id": "e-arg-0e51b35bad", "source": "arg-0e51b35bad", "target": "arg-e2b36ac945", "ls": "solid", "label": "rebut", "detail": "arg-0e51b35bad (AG1 defeat) → arg-e2b36ac945\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals."}}, {"data": {"id": "arg-d11e3e1e3f", "kind": "defeat", "label": "AG2 defeat\nTarget relies on a key negation assumpti", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-d11e3e1e3f\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-0e51b35bad\",\n  \"target_field\": \"Ass\"\n}\n\nTarget relies on a key negation assumption: that the “harm costs” are mostly overstated for typical school dissections—i.e., dissection creates largely “no additional” harm because specimens are commonly already dead and fetal pigs are meat-industry byproducts that would otherwise be discarded.\n\nBut that assumption is false: about 99% of dissection animals are caught in the wild, so dissection demand directly fuels wild-catching. Wild-catching reduces local populations and harms biodiversity, meaning dissection imposes additional ecological harm rather than being a low-impact reuse of animals that would definitely have been discarded anyway. Therefore, the claim that dissection has largely “no additional” harm is not justified, and the conclusion that the unique educational benefits outweigh the costs collapses once the harm-minimization premise is removed."}, "position": {"x": 510, "y": 280}}, {"data": {"id": "e-arg-d11e3e1e3f", "source": "arg-d11e3e1e3f", "target": "arg-0e51b35bad", "ls": "dashed", "label": "undercut", "detail": "arg-d11e3e1e3f (AG2 defeat) → arg-0e51b35bad\nattack: undercut\ntarget_field: Ass\ntarget_statement: None"}}, {"data": {"id": "end-arg-d3691f4bea", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 170, "y": 385.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "end-arg-e2b36ac945", "label": "終了: ターン上限到達 → defensible"}, "position": {"x": 510, "y": 385.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG1", "label": "AG1: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 680, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 680, "y": 84.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>10<\/td><\/tr><tr><td>attack_turn_count<\/td><td>8<\/td><\/tr><tr><td>main_argument_count<\/td><td>2<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>0<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.02239<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Students should generally **not** dissect animals in school; schools should use **non-animal alternatives** (synthetic models and computer simulations) instead.\n\n### Rationale (covering both the learning and harm considerations)\n\n1. **The practice is not educationally required in the relevant standards/medical context**\n   - The case for dissection relies on it being a helpful teaching method, but the opposing case is stronger on the “necessity” point: animal dissection is **not required** by major biology education frameworks (e.g., AP Biology / NGSS), and the medical-training justification doesn’t apply as a reason to require dissection in schools.\n   - When an approach is **optional rather than required**, the ethical burden is higher: schools should prefer alternatives that avoid harming animals.\n\n2. **Non-animal alternatives are available and plausibly teach the same goals**\n   - Even if dissection can provide engagement and hands-on feel, the debate did not conclusively establish that real-animal dissection provides learning gains that are clearly **unmatched** by high-quality synthetic/computer tools.\n   - Given that alternatives exist and are designed to teach anatomy and biology learning outcomes, “dissection is just better” isn’t demonstrated strongly enough to outweigh ethical concerns—especially when it’s not required.\n\n3. **The harm-minimization justification is not reliably established**\n   - The pro-dissection argument depends on claims like “**over 98%** of specimens were already deceased” and that many are meat-industry byproducts (e.g., fetal pigs destined for landfill).\n   - The anti-dissection argument directly challenges this with a different sourcing claim—roughly “**99% are caught in the wild**,” which would mean dissection demand contributes to population declines and biodiversity loss.\n   - **This key empirical conflict was not resolved** in the discussion. Under the governing conditions for whether dissection is permissible, dissection is only justified if you can show strong harm/waste minimization (predominantly already dead/byproduct), and that condition depends on sourcing data that remains disputed here.\n\n### The best-supported bottom line\nBecause dissection is **not necessary** for meeting the stated educational/medical purposes, and because the evidence about **whether specimens are predominantly already dead/byproduct versus wild-caught** was not resolved, the safest conclusion supported by the overall conditions is:\n\n- **Use non-animal alternatives instead of animal dissection.**\n\n### Important nuance (what would need to be true to reverse this)\nIf a school could **verify** that its dissection specimens are overwhelmingly **already deceased/byproducts** (not wild-caught) *and* could credibly demonstrate that learning gains from real dissection are **materially better** than alternatives for its specific curriculum, then dissection could become defensible. But with the current unresolved harm-data and the availability of effective alternatives, the default should be **no dissection**.<\/pre><\/details><div>justification_status: <b>fallback_no_consensus<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}], "schema": [{"run": 1, "question": "Should students dissect animals?", "elements": [{"data": {"id": "arg-accb89f8c4", "kind": "main", "label": "AG1 main\nStudents should dissect animals as part ", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-accb89f8c4\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In school biology, meaningful learning about anatomy depends on students directly examining real biological structures.\",\n            \"Animal dissection allows students to directly examine organs and tissues.\"\n          ],\n          \"weak_negation\": [\n            \"It is not the case that classroom animal dissection is purely theoretical and does not involve direct study of real structures.\"\n          ]\n        },\n        \"consequent\": \"Animal dissection gives students meaningful hands-on learning opportunities and real anatomical understanding.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection gives students meaningful hands-on learning opportunities and real anatomical understanding.\",\n            \"Directly handling and interpreting real dissected anatomy requires precise manual manipulation and attentive observation.\"\n          ],\n          \"weak_negation\": [\n            \"It is not the case that these manual handling and observation activities fail to build fine motor skills, hand-eye coordination, and critical thinking.\"\n          ]\n        },\n        \"consequent\": \"Because students study real anatomy directly, dissection builds fine motor skills, hand-eye coordination, and critical thinking relevant to biology learning.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Because students study real anatomy directly, dissection builds fine motor skills, hand-eye coordination, and critical thinking relevant to biology learning.\",\n            \"Hands-on encounters with real biological structures can make science feel tangible and exciting, increasing motivation and interest.\"\n          ],\n          \"weak_negation\": [\n            \"It is not the case that this kind of hands-on learning leaves most students uninterested in pursuing science.\"\n          ]\n        },\n        \"consequent\": \"Those hands-on learning gains can inspire interest in science and motivate students to pursue science careers.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Those hands-on learning gains can inspire interest in science and motivate students to pursue science careers.\",\n            \"Over 98% of dissected animals were already deceased, and fetal pigs used for dissection are meat-industry byproducts destined for landfill.\"\n          ],\n          \"weak_negation\": [\n            \"It is not the case that most school dissections primarily require creating new animals specifically for classroom use.\"\n          ]\n        },\n        \"consequent\": \"Students should dissect animals as part of biology education.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection gives students meaningful hands-on learning opportunities and real anatomical understanding.\",\n      \"Because students study real anatomy directly, dissection builds fine motor skills, hand-eye coordination, and critical thinking relevant to biology learning.\",\n      \"Those hands-on learning gains can inspire interest in science and motivate students to pursue science careers.\",\n      \"Students should dissect animals as part of biology education.\"\n    ],\n    \"Ass\": [\n      \"It is not the case that classroom animal dissection is purely theoretical and does not involve direct study of real structures.\",\n      \"It is not the case that these manual handling and observation activities fail to build fine motor skills, hand-eye coordination, and critical thinking.\",\n      \"It is not the case that this kind of hands-on learning leaves most students uninterested in pursuing science.\",\n      \"It is not the case that most school dissections primarily require creating new animals specifically for classroom use.\"\n    ]\n  }\n}"}, "position": {"x": 0.0, "y": 0}}, {"data": {"id": "arg-c77ddc103a", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals in b", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-c77ddc103a\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-accb89f8c4\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should dissect animals as part of biology education.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of animals used for school dissection are captured from the wild for that purpose.\",\n            \"Wild-catching of animals reduces local populations and biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection commonly depends on wild capture that decreases local populations and biodiversity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection commonly depends on wild capture that decreases local populations and biodiversity.\",\n            \"Wild capture and subsequent killing/dissection involve animal suffering and killing.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection imposes significant ethical harms on animals and significant environmental harms.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"AP Biology and NGSS do not require animal dissection for achieving required learning objectives.\",\n            \"Synthetic models and computer simulations can teach anatomy at least as effectively (equally well or better) as dissecting dead animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection is not educationally necessary because non-animal alternatives can meet anatomy-learning goals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection imposes significant ethical harms on animals and significant environmental harms.\",\n            \"Dissection is not educationally necessary because non-animal alternatives can meet anatomy-learning goals.\",\n            \"In the U.S. and Canada, medical school
