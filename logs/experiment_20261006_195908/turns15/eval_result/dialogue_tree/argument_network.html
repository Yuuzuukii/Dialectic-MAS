st partly hard to undo.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations can teach anatomy/biology concepts without using wildlife-derived animal specimens.\",\n            \"Non-animal teaching methods avoid the animal-supply harms and reduce the animal-tissue disposal/processing burden associated with dissections.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"There are effective non-animal options that can achieve comparable learning while avoiding the dissection-specific harms.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"When an activity causes serious, hard-to-reverse harm and effective options exist that avoid those harms, the justified policy choice is to use the non-harm options rather than the harmful activity.\"\n          ],\n          \"weak_negation\": [\n            \"No effective non-animal options exist for the relevant learning goals in this setting.\"\n          ]\n        },\n        \"consequent\": \"Dissection should be replaced with non-animal teaching methods.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Replacing dissection with non-animal teaching methods means students should not perform dissections on real animals in school biology classes.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection creates serious environmental harms that are at least partly hard to undo.\",\n      \"There are effective non-animal options that can achieve comparable learning while avoiding the dissection-specific harms.\",\n      \"Dissection should be replaced with non-animal teaching methods.\",\n      \"Students should not dissect animals.\"\n    ],\n    \"Ass\": [\n      \"No effective non-animal options exist for the re eceased (so dissection mainly uses already-deceased material).\",\n            \"If, for the relevant plan, the supply is mainly already-deceased byproducts, then Con’s supply-harm premise (inhumane/wild-capture being the basis of supply, e.g., approximately 99% caught in the wild) is not established for that plan.\"\n          ],\n          \"weak_negation\": [\n            \"No evidence is shown that the relevant school dissection programs predominantly use live wild-caught animals rather than already-deceased byproducts.\"\n          ]\n        },\n        \"consequent\": \"For the relevant school dissection plan, dissection supply is predominantly already-deceased meat-industry byproducts rather than predominantly live wild-capture.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The opponent’s Con includes the claim that dissection is unnecessary because it is not required by College Board AP Biology/Next Generation Science Standards and no U.S./Canadian medical schools use animals for physician training.\",\n            \"Pro (as defined in the integrated rules) holds that dissection provides direct, high-value learning opportunities and develops key biological-practice and thinking skills (fine motor skills, hand-eye coordination, critical thinking) and increases students’ motivation via hands-on aha moments.\",\n            \"Lack of being explicitly required by AP/NGSS or by physician training is not, by itself, enough to establish that dissection is “unnecessary” for achieving the educational aims of school biology that include those learning opportunities and skills.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The opponent’s “not required by standards/medical training ⇒ unnecessary” reasoning does not establish that dissection is unnecessary for school biology’s broader educational aims.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n isposing them in landfills.\",\n      \"In these contexts, dissection does not primarily impose the kind of serious, hard-to-undo biodiversity/environmental harms that depend on adding wild-capture and landfill waste.\",\n      \"Animal dissection is educationally valuable in ways that matter for biology learning and student motivation.\",\n      \"Students should dissect animals.\"\n    ],\n    \"Ass\": [\n      \"No evidence is shown that dissection disposal/processing more than cancels out the landfill diversion benefit.\"\n    ]\n  }\n}"}, "position": {"x": 510.0, "y": 280}}, {"data": {"id": "e-arg-313da24122", "source": "arg-313da24122", "target": "arg-8b5b1c51d2", "ls": "solid", "label": "rebut", "detail": "arg-313da24122 (AG1 counter) → arg-8b5b1c51d2\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals."}}, {"data": {"id": "arg-c986dee321", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals in s", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-c986dee321\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-313da24122\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should dissect animals.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Approximately 99% of dissection animals are caught in the wild.\",\n            \"Wild-catching decreases local populations and reduces biodiversity.\",\n            \"Biodiversity loss from population declines is difficult to reverse once it occurs.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection imposes serious, hard-to-undo environmental and biodiversity harms.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The methods used to supply animals for dissection are inhumane.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection imposes serious animal-welfare harms.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations can teach anatomy/biology concepts without using dissected animals.\",\n            \"Students learn just as well or better with alternatives versus dead animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Effective non-animal alternatives can achieve comparable biology learning goals without dissection-specific harms.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Medical studies and physician training in the U.S./Canada do not require animal dissection.\",\n            \"College Board AP Biology and Next Generation Science Standards do not require animal dissection.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection is unnecessary for meeting required education/medical-learning goals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection causes serious, hard-to-undo harms.\",\n            \"Effective non-animal alternatives exist that avoid those dissection-specific harms.\",\n            \"Animal dissection is unnecessary for required education/medical-learning goals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals in school biology classes.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection imposes serious, hard-to-undo environmental and biodiversity harms.\",\n      \"Animal dissection imposes serious animal-welfare harms.\",\n      \"Effective non-animal alternatives can achieve comparable biology learning goals without dissection-specific harms.\",\n      \"Animal dissection is unnecessary for meeting required education/medical-learning goals.\",\n      \"Students should not dissect animals in school biology classes.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 510, "y": 420}}, {"data": {"id": "e-arg-c986dee321", "source": "arg-c986dee321", "target": "arg-313da24122", "ls": "solid", "label": "rebut", "detail": "arg-c986dee321 (AG2 defeat) → arg-313da24122\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should dissect animals."}}, {"data": {"id": "end-arg-0e21b91933", "label": "終了: overruled（反論できず敗北）\nAG1 反論なし: Any counter to this specific challenge would have to rely on the same substantive grounds I already used against this target—(i) dissection provides unique, high-value hands-on learning (including ski…", "detail": "終了: overruled（反論できず敗北）\nAG1 反論なし: Any counter to this specific challenge would have to rely on the same substantive grounds I already used against this target—(i) dissection provides unique, high-value hands-on learning (including skills) that non-animal alternatives aren’t shown to match, (ii) dissection can motivate students via real “aha moments,” and (iii) typical school dissection use is a productive use of already-deceased meat-industry byproducts rather than live-wild-catch animals—so I can’t add a genuinely new, non-repeating argument here. What I hold true about the issue is that dissection is educationally justified and not rendered “unnecessary” merely because alternatives exist, and that the relevant sourcing harms alleged by the opponent are not established for typical school programs."}, "position": {"x": 170, "y": 966.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-0e21b91933", "source": "end-arg-0e21b91933", "target": "arg-61266e39d9", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-6f4e90ab09", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 340, "y": 1116.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-6f4e90ab09", "source": "end-arg-6f4e90ab09", "target": "arg-1c60ce1517", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-ef48af5669", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 510, "y": 1266.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-ef48af5669", "source": "end-arg-ef48af5669", "target": "arg-c986dee321", "ls": "dotted", "inferred": 1}}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 680, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>15<\/td><\/tr><tr><td>attack_turn_count<\/td><td>12<\/td><\/tr><tr><td>main_argument_count<\/td><td>3<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>1<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.120716<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>**Students should dissect animals only in limited, clearly verified circumstances; otherwise, they should use non-animal teaching methods.**\n\n### When dissection *should not* be used (default)\nDo **not** require animal dissection if either of these is true:\n\n1. **Sourcing can’t be verified as predominantly already-deceased/non–wild-caught.**  \n   If the school cannot credibly demonstrate that its specimens largely come from **already-deceased byproducts** (and not mainly from **live wild-capture**), the ethical/environmental concerns should outweigh dissection’s educational value.\n\n2. **Non-animal alternatives are shown to meet the learning goals (and dissection isn’t shown to add unique value).**  \n   If the school’s vetted synthetic models and/or computer simulations produce **at least comparable learning outcomes** for the relevant curriculum aims—and there’s no clear evidence that dissection provides additional, dissection-specific benefits—then dissection should be avoided.\n\nAlso, for medical education/physician training: **dissection is not required for that purpose** in U.S./Canadian contexts, so it isn’t justified on that basis.\n\n### When dissection *may* be used\nAnimal dissection may be appropriate **only when BOTH** conditions are met:\n\n1. **Verified harm-minimizing sourcing:**  \n   The school can verify that the **dominant supply** is **already-deceased byproducts** (e.g., specimens that would otherwise go to landfill), and **wild-capture is not the dominant source**.\n\n2. **Educational superiority / non-substitutability:**  \n   The school can show that, for its specific activities and student population, real-animal dissection provides meaningful benefits that alternatives do not match—specifically including some combination of:\n   - improved **fine motor skills** and **hand–eye coordination**,  \n   - stronger **critical thinking** from hands-on work, and  \n   - evidence of dissection-specific **“aha moments”** and increased motivation/career interest that alternatives don’t achieve to a comparable degree.\n\n### Environmental tradeoff requirement\nIf a program claims environmental benefit (e.g., **diverting byproducts from landfill**), that claim must be assessed against any additional environmental burden from handling/processing/disposal. If the school can’t reasonably show the net impact is not worse than alternatives, the default should be to avoid dissection.\n\n### Why this remains conditional\nA single unconditional “yes” or “no” depends on facts that can’t be resolved in general without program-specific verification—especially:\n- what proportion of specimens are actually **already-deceased vs wild-caught** in typical school programs, and\n- whether non-animal methods genuinely match dissection’s full “whole package” of outcomes (skills + motivation).\n\nSo the correct answer is **conditional on verified sourcing and demonstrated educational need**, as described above.<\/pre><\/details><div>justification_status: <b>fallback_full_dialogue_synthesis<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}]}}};
const METHODS = ["schema", "no_schema", "free_debate", "mad"];

 ]});
cy.on('tap','node,edge',e=>{document.getElementById('detail').textContent=e.target.data('detail')||'';});

function btn(parent,label,on,fn){const b=document.createElement('button');b.textContent=label;
  if(on)b.className='on';b.onclick=fn;parent.appendChild(b);}
function fit(){ // 切り替え後も、できるだけ同じ topic / method を保つ
  const d=D();
  if(!d[st.topic])st.topic=Object.keys(d)[0];
  if(!d[st.topic][st.method])st.method=METHODS.find(m=>d[st.topic][m]);
  if(st.run>=d[st.topic][st.method].length)st.run=0;
}
function renderTabs(){
  const U=document.getElementById('turns'),T=document.getElementById('topics'),
        M=document.getElementById('methods'),R=document.getElementById('runs');
  for(const el of [U,T,M,R]){while(el.children.length>1)el.removeChild(el.lastChild);}
  const keys=Object.keys(DATA);
  U.style.display=(keys.length===1&&keys[0]==='')?'none':'';
  keys.forEach(k=>btn(U,k,k===st.turns,()=>{st.turns=k;fit();show();}));
  const d=D();
  Object.keys(d).forEach(t=>btn(T,t,t===st.topic,()=>{st.topic=t;st.run=0;
    if(!d[t][st.method])st.method=METHODS.find(m=>d[t][m]);show();}));
  METHODS.filter(m=>d[st.topic][m]).forEach(m=>btn(M,m,m===st.method,()=>{st.method=m;st.run=0;show();}));
  d[st.topic][st.method].forEach((r,i)=>btn(R,'#'+r.run,i===st.run,()=>{st.run=i;show();}));
}
function show(){
  renderTabs();
  const r=D()[st.topic][st.method][st.run];
  document.getElementById('q').textContent=r.question;
  document.getElementById('legend2').textContent=r.lane
    ?'点線: 発話順からの推定（直前の相手発話への応答）'
    :'木構造: 上 = 攻撃された論証、下 = それを攻撃/反論した論証（矢印は攻撃の向き）。実線 rebut / 破線 undercut ／ 枠 緑=justified 黄=defensible 灰=overruled';
  document.getElementById('meta').innerHTML=r.meta;
  document.getElementById('detail').textContent='ノードをクリック';
  cy.elements().remove(); cy.add(r.elements);
  cy.layout({name:'preset',fit:true,padding:40}).run();
}
st.turns=Object.keys(DATA)[0];st.topic=Object.keys(D())[0];st.method=METHODS.find(m=>D()[st.topic][m]);show();
