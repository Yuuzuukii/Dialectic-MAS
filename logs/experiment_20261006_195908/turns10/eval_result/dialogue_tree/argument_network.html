<script>
const DATA = {"": {"alternative_energy": {"schema": [{"run": 1, "question": "Can alternative energies effectively replace fossil fuels?", "elements": [{"data": {"id": "arg-04c54944bd", "kind": "main", "label": "AG1 main\nYes—alternative energies can effectively", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-04c54944bd\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Several countries already operate with very high shares of electricity from renewable sources: Iceland (~85%), Paraguay (~99.9%), Costa Rica (~99.78%), and Norway (~98%).\",\n            \"These cases demonstrate that renewable transitions to large electricity shares are achievable in real-world national energy systems.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Renewables can supply large fractions of electricity in operating, national-scale energy systems rather than remaining only theoretical.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"We already possess the knowledge and tools needed to deploy alternative energy technologies.\",\n            \"If renewables can supply large fractions of electricity in real-world systems, then deploying alternative energies can replace fossil-fuel electricity generation as part of transitioning the overall energy supply away from fossil fuels.\",\n            \"The question asks whether alternative energies can effectively replace fossil fuels, not whether they are the only technology needed.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energies (especially renewables) can be deployed to effectively replace fossil-fuel electricity generation as a core part of moving energy systems away from fossil fuels.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Nuclear energy is a low-carbon source of alternative energy.\",\n            \"Nuclear is the quickest way to end dependence on fossil fuels.\",\n            \"Nuclear requires far less land than renewables.\",\n            \"If the quickest low-carbon alternative with a smaller land requirement is available, then fossil-fuel replacement can be carried out effectively and more rapidly.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Adding nuclear enables a faster, land-efficient low-carbon replacement of fossil-fuel dependence.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Renewables can supply large electricity fractions in practice.\",\n            \"Alternative energies can therefore replace fossil-fuel electricity generation during an energy-system transition.\",\n            \"Nuclear provides a quickest, low-carbon, low-land path to ending fossil-fuel dependence.\",\n            \"Together, renewables (scalable electricity supply) and nuclear (rapid end to fossil-fuel dependence) cover the central practical constraints on replacement: supply scale and transition speed.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Yes—alternative energies can effectively replace fossil fuels.\"\n      }\n    ],\n    \"Conc\": [\n      \"Renewables can supply large fractions of electricity in operating, national-scale energy systems rather than remaining only theoretical.\",\n      \"Alternative energies (especially renewables) can be deployed to effectively replace fossil-fuel electricity generation as a core part of moving energy systems away from fossil fuels.\",\n      \"Adding nuclear enables a faster, land-efficient low-carbon replacement of fossil-fuel dependence.\",\n      \"Yes—alternative energies can effectively replace fossil fuels.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170.0, "y": 0}}, {"data": {"id": "arg-3dd484c44b", "kind": "defeat", "label": "AG2 defeat\nEven counting nuclear does not remove th", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-3dd484c44b\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-04c54944bd\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Yes—alternative energies can effectively replace fossil fuels.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Fossil fuels are not used only for electricity generation; they also supply major shares of transportation fuels and direct heating in the real economy.\",\n            \"To effectively replace fossil fuels overall, alternative energies must cover these energy services at scale, not merely supply some electricity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energies that primarily replace electricity (but not transport and heating at comparable scale) cannot effectively replace fossil fuels overall.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"U.S. alternative energy use has never exceeded 20% historically.\",\n            \"If alternative energies cannot reach effective replacement levels even in a country with major resources and infrastructure, then they cannot be said to effectively replace fossil fuels in large countries anytime soon.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In large countries like the U.S., alternative energies have not scaled to a level consistent with effectively replacing fossil fuels.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Renewable electricity (e.g., wind and solar) is variable and weather-dependent.\",\n            \"Electric grids must meet demand reliably, including during low-wind/low-sun periods, which requires firm/dispatchable backup or equivalent balancing capacity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Because variable renewables require firm backup to maintain reliability, they cannot fully eliminate fossil-fuel generation as the near-term system backup.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Natural gas is a fossil fuel bridge fuel.\",\n            \"Using natural gas takes advantage of existing infrastructure to achieve rapid emissions reductions while other capacity is built out.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Meeting net-zero goals realistically requires keeping fossil-fuel generation in the form of natural gas as a bridge rather than assuming full replacement by alternatives.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Nuclear energy is too dangerous and ineffective to be a serious global-warming solution.\",\n            \"Accidents like Fukushima remove carbon-free electricity gains and demonstrate major risks.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Even counting nuclear does not remove the safety/feasibility problems that prevent a reliable, rapid, global shift away from fossil fuels. \"\n      }\n    ],\n    \"Conc\": [\n      \"Alternative energies that primarily replace electricity (but not transport and heating at comparable scale) cannot effectively replace fossil fuels overall.\",\n      \"In large countries like the U.S., alternative energies have not scaled to a level consistent with effectively replacing fossil fuels.\",\n      \"Because variable renewables require firm backup to maintain reliability, they cannot fully eliminate fossil-fuel generation as the near-term system backup.\",\n      \"Meeting net-zero goals realistically requires keeping fossil-fuel generation in the form of natural gas as a bridge rather than assuming full replacement by alternatives.\",\n      \"Even counting nuclear does not remove the safety/feasibility problems that prevent a reliable, rapid, global shift away from fossil fuels.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170.0, "y": 140}}, {"data": {"id": "e-arg-3dd484c44b", "source": "arg-3dd484c44b", "target": "arg-04c54944bd", "ls": "solid", "label": "rebut", "detail": "arg-3dd484c44b (AG2 defeat) → arg-04c54944bd\nattack: rebut\ntarget_field: Conc\ntarget_statement: Yes—alternative energies can effectively replace fossil fuels."}}, {"data": {"id": "arg-2b33d5ef1a", "kind": "counter", "label": "AG1 counter\nAlternative energies can effectively rep", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-2b33d5ef1a\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-3dd484c44b\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Alternative energies that primarily replace electricity (but not transport and heating at comparable scale) cannot effectively replace fossil fuels overall.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Fossil fuels supply major energy services beyond electricity—especially transportation fuels and direct heating in the real economy.\",\n            \"Transportation can be served by electric vehicles that use electricity instead of liquid fossil fuels.\",\n            \"Heating can be served by heat pumps that use electricity instead of burning fossil fuels directly.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Replacing fossil fuels in transport and heating is compatible with switching those end uses to electricity.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"We already possess the knowledge and tools needed to deploy alternative energy technologies.\",\n            \"Renewables and nuclear provide low-carbon electricity that can supply electrical demand.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energy deployment can supply the low-carbon electricity needed for electrified transport and heating.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Transportation and heating can be switched to electricity (so the key fossil-fuel end uses are not inherently tied to combustion).\",\n            \"Alternative energies can supply low-carbon electricity for that switched demand.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energies can effectively replace fossil fuels overall, not merely fossil-fuel electricity generation.\"\n      }\n    ],\n    \"Conc\": [\n      \"Replacing fossil fuels in transport and heating is compatible with switching those end uses to electricity.\",\n      \"Alternative energy deployment can supply the low-carbon electricity needed for electrified transport and heating.\",\n      \"Alternative energies can effectively replace fossil fuels overall, not merely fossil-fuel electricity generation.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0, "y": 280}}, {"data": {"id": "e-arg-2b33d5ef1a", "source": "arg-2b33d5ef1a", "target": "arg-3dd484c44b", "ls": "solid", "label": "rebut", "detail": "arg-2b33d5ef1a (AG1 counter) → arg-3dd484c44b\nattack: rebut\ntarget_field: Conc\ntarget_statement: Alternative energies that primarily replace electricity (but not transport and heating at comparable scale) cannot effectively replace fossil fuels overall."}}, {"data": {"id": "arg-41a2f1e4a2", "kind": "counter", "label": "AG1 counter\nAlternative energies can effectively rep", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-41a2f1e4a2\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-3dd484c44b\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Alternative energies that primarily replace electricity (but not transport and heating at comparable scale) cannot effectively replace fossil fuels overall.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Fossil fuels are used not only for electricity generation but also for major transportation fuels and direct heating in the real economy.\",\n            \"To effectively replace fossil fuels overall, replacements must cover these energy services, not only supply some electricity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"An effective overall replacement must address transport fuels and direct heating energy services, not just power-sector emissions.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Renewables and nuclear can provide low-carbon electricity.\",\n            \"Low-carbon electricity can be converted into hydrogen and synthetic (e-fuel) fuels using established processes (e.g., electrolysis and fuel synthesis).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energy can be transformed into low-carbon hydrogen and synthetic fuels that are usable as fuels in fossil-fuel-dependent sectors.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Hydrogen and synthetic fuels can be used to substitute for fossil fuels in transportation and heating applications (including where direct electrification is difficult).\",\n            \"Therefore, alternative energies need not be limited to replacing electricity generation to cover non-electric fossil-fuel uses.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energies can replace fossil-fuel energy services beyond electricity—specifically transport fuels and direct heating.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Alternative energies can supply low-carbon replacement fuels for transport and heating.\",\n            \"Alternative energies also can supply low-carbon electricity in large-scale power systems (as shown by multiple real-world high-renewables electricity systems).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energies can effectively replace fossil fuels overall.\"\n      }\n    ],\n    \"Conc\": [\n      \"An effective overall replacement must address transport fuels and direct heating energy services, not just power-sector emissions.\",\n      \"Alternative energy can be transformed into low-carbon hydrogen and synthetic fuels that are usable as fuels in fossil-fuel-dependent sectors.\",\n      \"Alternative energies can replace fossil-fuel energy services beyond electricity—specifically transport fuels and direct heating.\",\n      \"Alternative energies can effectively replace fossil fuels overall.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170, "y": 280}}, {"data": {"id": "e-arg-41a2f1e4a2", "source": "arg-41a2f1e4a2", "target": "arg-3dd484c44b", "ls": "solid", "label": "rebut", "detail": "arg-41a2f1e4a2 (AG1 counter) → arg-3dd484c44b\nattack: rebut\ntarget_field: Conc\ntarget_statement: Alternative energies that primarily replace electricity (but not transport and heating at comparable scale) cannot effectively replace fossil fuels overall."}}, {"data": {"id": "arg-8909d07df6", "kind": "counter", "label": "AG1 counter\nAlternative energies can effectively rep", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-8909d07df6\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-3dd484c44b\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Alternative energies that primarily replace electricity (but not transport and heating at comparable scale) cannot effectively replace fossil fuels overall.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Several countries already operate with very high shares of electricity from renewables (Iceland ~85%, Paraguay ~99.9%, Costa Rica ~99.78%, Norway ~98%).\",\n            \"If a country can operate a national electricity system at that scale with renewables dominating, then the grid can be balanced to meet demand reliably with little need for fossil fuels as dominant backup.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Renewable-heavy electricity systems can meet demand reliably without relying on fossil fuels as the dominant short-term backup.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Variable renewables (wind/solar) can be balanced in power systems using a combination of grid balancing tools and low-carbon dispatchable resources (e.g., hydro/geothermal/nuclear), plus grid interconnection, storage, and demand response.\",\n            \"If variability can be balanced using these tools and dispatchable low-carbon supply, then variability does not inherently block full (power-sector) replacement of fossil-fuel generation.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The variability of renewables does not inherently prevent near-complete fossil-fuel displacement in electricity supply when low-carbon dispatch and grid balancing are used.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Nuclear provides firm, low-carbon electricity that is not weather-dependent.\",\n            \"Nuclear can therefore function as dispatchable low-carbon capacity to stabilize renewable-heavy grids.\",\n            \"Even if nuclear carries risks, those risks do not negate nuclear’s role as a low-carbon firm power source for replacing fossil-fuel generation.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Including nuclear makes it feasible to provide firm low-carbon power needed to stabilize grids dominated by variable renewables.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Fossil fuels are used for energy services beyond electricity (notably transport fuels and heating/industrial energy).\",\n            \"Low-carbon energy systems can cover these non-electric fossil uses by using low-carbon electricity as an input to established conversion/electrification pathways (so non-electric fossil combustion need not remain the only option).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energy can cover major fossil-fuel energy services beyond electricity, not just power-sector generation.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Renewable-heavy grids can operate reliably with little dominant fossil backup.\",\n            \"Variability can be balanced and firm low-carbon supply (including nuclear) can stabilize renewable-heavy systems.\",\n            \"Alternative energy can also cover non-electric fossil energy services through established low-carbon pathways.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energies can effectively replace fossil fuels overall.\"\n      }\n    ],\n    \"Conc\": [\n      \"Renewable-heavy electricity systems can meet demand reliably without relying on fossil fuels as the dominant short-term backup.\",\n      \"The variability of renewables does not inherently prevent near-complete fossil-fuel displacement in electricity supply when low-carbon dispatch and grid balancing are used.\",\n      \"Including nuclear makes it feasible to provide firm low-carbon power needed to stabilize grids dominated by variable renewables.\",\n      \"Alternative energy can cover major fossil-fuel energy services beyond electricity, not just power-sector generation.\",\n      \"Alternative energies can effectively replace fossil fuels overall.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 340, "y": 280}}, {"data": {"id": "e-arg-8909d07df6", "source": "arg-8909d07df6", "target": "arg-3dd484c44b", "ls": "solid", "label": "rebut", "detail": "arg-8909d07df6 (AG1 counter) → arg-3dd484c44b\nattack: rebut\ntarget_field: Conc\ntarget_statement: Alternative energies that primarily replace electricity (but not transport and heating at comparable scale) cannot effectively replace fossil fuels overall."}}, {"data": {"id": "arg-e5df479c4d", "kind": "main", "label": "AG2 main\nAlternative energies cannot effectively ", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"arg-e5df479c4d\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"overruled\",\n  \"closed_by_budget\": false\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Fossil fuels are used for major non-electric energy services (notably transportation fuels and direct heating), so eliminating them requires end-use substitution via electricity-based pathways (direct electrification where possible, and/or converting electricity into hydrogen/e-fuels where direct electrification is difficult).\",\n            \"Electricity-to-fuel/heat pathways involve multiple conversion steps that are not perfectly efficient (e.g., electrolysis and fuel synthesis incur energy losses).\",\n            \"Therefore, delivering the same amount of energy services without fossil combustion requires substantially more low-carbon electricity than the energy content of the fossil fuels being displaced.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Overall fossil-fuel replacement with alternative energies implies an amplified requirement for low-carbon electricity supply (far more than a 1-to-1 swap of fossil energy).\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In large countries like the U.S., alternative energy use has never exceeded 20% historically.\",\n            \"Effective replacement would require building alternative/low-carbon electricity capacity to meet the amplified electricity requirement for displacing fossil-fuel energy services.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Because U.S. alternative energy has historically capped well below what an amplified electricity requirement implies, alternatives cannot effectively replace fossil fuels in large countries anytime soon.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Variable renewables require firm/dispatchable generation to meet demand reliably.\",\n            \"Nuclear energy is too dangerous and ineffective to be a serious global-warming solution (accidents like Fukushima demonstrate risks that eliminate carbon-free electricity gains).\",\n            \"Natural gas is a fossil bridge fuel that leverages existing infrastructure to provide rapid emissions reductions while other capacity is built.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"With reliability needs and nuclear ruled out as a serious reliable solution, natural gas must remain a near-term bridge (so fossil fuels are not eliminated by alternatives).\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"If alternatives cannot meet the amplified electricity scale needed for fossil-fuel replacement, and fossil natural gas must remain for dispatchable reliability, then alternatives cannot effectively replace fossil fuels.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energies cannot effectively replace fossil fuels; achieving net-zero realistically requires natural gas as a bridge while alternatives scale.\"\n      }\n    ],\n    \"Conc\": [\n      \"Overall fossil-fuel replacement with alternative energies implies an amplified requirement for low-carbon electricity supply (far more than a 1-to-1 swap of fossil energy).\",\n      \"Because U.S. alternative energy has historically capped well below what an amplified electricity requirement implies, alternatives cannot effectively replace fossil fuels in large countries anytime soon.\",\n      \"With reliability needs and nuclear ruled out as a serious reliable solution, natural gas must remain a near-term bridge (so fossil fuels are not eliminated by alternatives).\",\n      \"Alternative energies cannot effectively replace fossil fuels; achieving net-zero realistically requires natural gas as a bridge while alternatives scale.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 510.0, "y": 0}}, {"data": {"id": "arg-8941e57c92", "kind": "defeat", "label": "AG1 defeat\nAlternative energies can effectively rep", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-8941e57c92\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-e5df479c4d\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Alternative energies cannot effectively replace fossil fuels; achieving net-zero realistically requires natural gas as a bridge while alternatives scale.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target claims that replacing fossil fuels requires ‘substantially more’ low-carbon electricity due to efficiency losses in electricity-to-fuel/heat pathways (electrolysis/fuel synthesis).\",\n            \"But many major fossil-fuel end uses can be replaced with direct electrification (EVs and heat pumps) rather than full reliance on low-efficiency conversion-to-fuels, and these technologies are typically more energy-efficient than combustion.\",\n            \"Therefore, the energy-services transition does not imply an infeasible amplification of energy demand that blocks effective fossil-fuel replacement.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Efficiency losses do not make effective replacement of fossil fuels impossible because direct electrification covers key end uses more efficiently than fossil combustion.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Several countries already operate electricity systems with very high renewable shares (Iceland ~85%, Paraguay ~99.9%, Costa Rica ~99.78%, Norway ~98%).\",\n            \"If renewable-heavy electricity systems can be run at those scales in real countries, then meeting additional low-carbon electricity demand from electrification is practically achievable.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Scaling low-carbon electricity to cover electrification-driven demand is practically achievable, as shown by real high-renewables countries.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target argues reliability requires firm/dispatchable backup and concludes that natural gas must remain as a bridge because nuclear is not a serious option.\",\n            \"My stance holds that nuclear is a low-carbon dispatchable alternative, and it is the quickest way to end dependence on fossil fuels while requiring far less land than renewables.\",\n            \"So low-carbon firm capacity (including nuclear) can address reliability needs without making continued fossil fuel use necessary as a ‘realistic’ bridge condition for effective replacement.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Reliability needs can be met with firm low-carbon power (including nuclear), removing the basis for requiring natural gas as the near-term bridging condition for replacement.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Efficiency losses do not block electrification at the level required for replacement of fossil energy services.\",\n            \"Low-carbon electricity scaling is achievable in practice.\",\n            \"Firm low-carbon capacity (including nuclear) can handle reliability needs without depending on fossil natural gas as a bridge.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energies can effectively replace fossil fuels, so fossil-fuel ‘bridging’ with natural gas is not a necessary condition for effective replacement. \"\n      }\n    ],\n    \"Conc\": [\n      \"Efficiency losses do not make effective replacement of fossil fuels impossible because direct electrification covers key end uses more efficiently than fossil combustion.\",\n      \"Scaling low-carbon electricity to cover electrification-driven demand is practically achievable, as shown by real high-renewables countries.\",\n      \"Reliability needs can be met with firm low-carbon power (including nuclear), removing the basis for requiring natural gas as the near-term bridging condition for replacement.\",\n      \"Alternative energies can effectively replace fossil fuels, so fossil-fuel ‘bridging’ with natural gas is not a necessary condition for effective replacement.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 510, "y": 140}}, {"data": {"id": "e-arg-8941e57c92", "source": "arg-8941e57c92", "target": "arg-e5df479c4d", "ls": "solid", "label": "rebut", "detail": "arg-8941e57c92 (AG1 defeat) → arg-e5df479c4d\nattack: rebut\ntarget_field: Conc\ntarget_statement: Alternative energies cannot effectively replace fossil fuels; achieving net-zero realistically requires natural gas as a bridge while alternatives scale."}}, {"data": {"id": "arg-497137c0a3", "kind": "main", "label": "AG2 main\nNo—alternative energies cannot effective", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-497137c0a3\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Nuclear energy is too dangerous and ineffective to be a serious global-warming solution; accidents like Fukushima eliminate carbon-free electricity gains.\",\n            \"Meeting net-zero realistically requires a quickest, reliable, low-carbon way to end fossil-fuel dependence (i.e., firm/dispatchable low-carbon capacity).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Because nuclear is not a serious reliable option, fossil-fuel dependence cannot be ended quickly using nuclear as the firm/dispatchable low-carbon backbone.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Variable renewables (wind/solar) require firm/dispatchable backup to meet demand reliably during low-output periods.\",\n            \"So, any plan to eliminate fossil-fuel generation must supply dispatchable reliability without relying primarily on fossil fuels.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternatives alone cannot guarantee reliable operation without some dispatchable backup resource.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"If nuclear is not an available/serious dispatchable low-carbon backup, and reliable operation still requires firm/dispatchable backup, then dispatchable reliability must come from something else.\",\n            \"Natural gas is a fossil bridge fuel that leverages existing infrastructure to provide rapid emissions reductions while other capacity is built.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Natural gas must remain the near-term bridge for dispatchable reliability rather than fossil fuels being eliminated by alternatives.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In large countries like the U.S., alternative energy use has never exceeded 20% historically.\",\n            \"Effective fossil-fuel replacement requires alternatives to reach dominant shares sufficient to displace fossil fuels (including the additional capacity needed to cover reliability/backup needs during transition).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternatives have not historically scaled to the level consistent with effective replacement of fossil fuels in large countries.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dispatchable reliability in the near term therefore requires a natural-gas bridge, and alternatives have not scaled to displacement-consistent levels.\",\n            \"If net-zero realistically requires natural gas bridging while alternatives cannot scale enough to displace fossil fuels, then alternative energies cannot effectively replace fossil fuels.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"No—alternative energies cannot effectively replace fossil fuels; achieving net-zero realistically requires natural gas bridging while alternatives scale.\"\n      }\n    ],\n    \"Conc\": [\n      \"Because nuclear is not a serious reliable option, fossil-fuel dependence cannot be ended quickly using nuclear as the firm/dispatchable low-carbon backbone.\",\n      \"Alternatives alone cannot guarantee reliable operation without some dispatchable backup resource.\",\n      \"Natural gas must remain the near-term bridge for dispatchable reliability rather than fossil fuels being eliminated by alternatives.\",\n      \"Alternatives have not historically scaled to the level consistent with effective replacement of fossil fuels in large countries.\",\n      \"No—alternative energies cannot effectively replace fossil fuels; achieving net-zero realistically requires natural gas bridging while alternatives scale.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 680.0, "y": 0}}, {"data": {"id": "arg-c88026ae0b", "kind": "defeat", "label": "AG1 defeat\nAlternative energies can effectively rep", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-c88026ae0b\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-497137c0a3\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"No—alternative energies cannot effectively replace fossil fuels; achieving net-zero realistically requires natural gas bridging while alternatives scale.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Nuclear energy is a low-carbon source of alternative energy.\",\n            \"Nuclear provides firm/dispatchable low-carbon electricity that can stabilize power systems and does not depend on weather like wind/solar.\",\n            \"Nuclear is the quickest way to end dependence on fossil fuels, requiring far less land than renewables.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Nuclear can realistically function as a serious firm/dispatchable low-carbon backbone for ending fossil-fuel dependence.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Variable renewables (wind/solar) require balancing to meet demand reliably.\",\n            \"Reliability can be achieved by combining grid balancing tools and low-carbon firm supply (e.g., nuclear, hydro, geothermal), plus storage and demand response.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"A renewable-heavy electricity system can maintain reliable operation using low-carbon firm supply and grid balancing, without requiring fossil fuels as the dominant backup.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"If dispatchable reliability can be provided by low-carbon firm sources (including nuclear) and grid balancing, then a natural-gas bridge is not a necessary condition for reliably eliminating fossil-fuel generation in the power sector.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Achieving fossil-fuel replacement does not realistically require keeping natural gas as the near-term bridge for the reliability backbone.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Several countries already operate with very high shares of electricity from renewables: Iceland (~85%), Paraguay (~99.9%), Costa Rica (~99.78%), and Norway (~98%).\",\n            \"If high renewable shares are already operational at national scale, then alternatives can scale to displacement-consistent levels rather than being limited to small historical shares.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Real-world operation of near-total renewable electricity in multiple countries shows alternatives can scale to levels consistent with displacing fossil fuels.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Nuclear can provide firm low-carbon reliability quickly.\",\n            \"Renewable-heavy grids can be kept reliable with low-carbon firm capacity and balancing rather than fossil dominant backup.\",\n            \"Alternatives can scale to large electricity shares, as demonstrated by multiple countries.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energies can effectively replace fossil fuels; net-zero does not realistically depend on a natural-gas bridging requirement while alternatives scale.\"\n      }\n    ],\n    \"Conc\": [\n      \"Nuclear can realistically function as a serious firm/dispatchable low-carbon backbone for ending fossil-fuel dependence.\",\n      \"A renewable-heavy electricity system can maintain reliable operation using low-carbon firm supply and grid balancing, without requiring fossil fuels as the dominant backup.\",\n      \"Achieving fossil-fuel replacement does not realistically require keeping natural gas as the near-term bridge for the reliability backbone.\",\n      \"Real-world operation of near-total renewable electricity in multiple countries shows alternatives can scale to levels consistent with displacing fossil fuels.\",\n      \"Alternative energies can effectively replace fossil fuels; net-zero does not realistically depend on a natural-gas bridging requirement while alternatives scale.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 680.0, "y": 140}}, {"data": {"id": "e-arg-c88026ae0b", "source": "arg-c88026ae0b", "target": "arg-497137c0a3", "ls": "solid", "label": "rebut", "detail": "arg-c88026ae0b (AG1 defeat) → arg-497137c0a3\nattack: rebut\ntarget_field: Conc\ntarget_statement: No—alternative energies cannot effectively replace fossil fuels; achieving net-zero realistically requires natural gas bridging while alternatives scale."}}, {"data": {"id": "arg-3baf728595", "kind": "counter", "label": "AG2 counter\nAlternative energies cannot effectively ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-3baf728595\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-c88026ae0b\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Alternative energies can effectively replace fossil fuels; net-zero does not realistically depend on a natural-gas bridging requirement while alternatives scale.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Ending fossil-fuel dependence in practice requires dispatchable, firm low-carbon generation to become available quickly enough to maintain grid reliability while fossil capacity is retired (especially as renewables are variable).\",\n            \"Nuclear capacity expansion typically faces long lead times (multi-year to multi-decade construction and commissioning) and availability is limited by long refueling/maintenance cycles and project delays.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Nuclear cannot realistically ramp up fast enough to serve as the needed near-term firm/dispatchable backbone for rapid fossil-fuel elimination.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Variable renewables require firm/dispatchable backup to meet demand reliably during low-output periods.\",\n            \"If nuclear cannot provide that firm backup quickly enough, then grid reliability during the transition must be supported by other dispatchable resources.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Without fast nuclear ramp-up, reliable operation during transition requires a non-nuclear dispatchable backup.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Natural gas is a fossil bridge fuel that can provide dispatchable power rapidly using existing infrastructure while alternatives scale.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"A natural-gas bridge is the realistic way to supply dispatchable backup during the period when nuclear cannot ramp up quickly enough.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"If reliable transition away from fossil fuels requires a natural-gas bridge because nuclear cannot provide firm backup quickly enough, then alternatives cannot effectively replace fossil fuels overall (they cannot eliminate fossil fuels on their own within the needed timeframe).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energies cannot effectively replace fossil fuels; meeting net-zero realistically depends on natural gas as a bridge during the transition.\"\n      }\n    ],\n    \"Conc\": [\n      \"Nuclear cannot realistically ramp up fast enough to serve as the needed near-term firm/dispatchable backbone for rapid fossil-fuel elimination.\",\n      \"Without fast nuclear ramp-up, reliable operation during transition requires a non-nuclear dispatchable backup.\",\n      \"A natural-gas bridge is the realistic way to supply dispatchable backup during the period when nuclear cannot ramp up quickly enough.\",\n      \"Alternative energies cannot effectively replace fossil fuels; meeting net-zero realistically depends on natural gas as a bridge during the transition.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 680, "y": 280}}, {"data": {"id": "e-arg-3baf728595", "source": "arg-3baf728595", "target": "arg-c88026ae0b", "ls": "solid", "label": "rebut", "detail": "arg-3baf728595 (AG2 counter) → arg-c88026ae0b\nattack: rebut\ntarget_field: Conc\ntarget_statement: Alternative energies can effectively replace fossil fuels; net-zero does not realistically depend on a natural-gas bridging requirement while alternatives scale."}}, {"data": {"id": "end-arg-04c54944bd", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 340, "y": 406.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-04c54944bd", "source": "end-arg-04c54944bd", "target": "arg-8909d07df6", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-e5df479c4d", "label": "終了: overruled（反論できず敗北）\nAG2 反論なし: Repeats a reason I already used (closest earlier argument: arg-e5df479c4d); there is no new reason to add.", "detail": "終了: overruled（反論できず敗北）\nAG2 反論なし: Repeats a reason I already used (closest earlier argument: arg-e5df479c4d); there is no new reason to add."}, "position": {"x": 510, "y": 556.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-e5df479c4d", "source": "end-arg-e5df479c4d", "target": "arg-8941e57c92", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-497137c0a3", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 680, "y": 706.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-497137c0a3", "source": "end-arg-497137c0a3", "target": "arg-3baf728595", "ls": "dotted", "inferred": 1}}, {"data": {"id": "nomain-AG1", "label": "AG1: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 850, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>10<\/td><\/tr><tr><td>attack_turn_count<\/td><td>7<\/td><\/tr><tr><td>main_argument_count<\/td><td>3<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>1<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.080739<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support alternative energies replacing fossil fuels.\nYou believe alternative energies not only can but must replace fossil fuels if we want to continue living on Earth, as we already possess the knowledge and tools needed.\nYou believe many countries are already operating on significant renewable energy sources, including Iceland (85% renewable), Paraguay (99.9%), Costa Rica (99.78%), and Norway (98%), demonstrating that renewable transitions are achievable.\nYou believe nuclear energy, a low-carbon source of alternative energy, is the quickest way to end dependence on fossil fuels, requiring far less land than renewables.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose the idea that alternative energies can effectively replace fossil fuels.\nYou believe natural gas, a fossil fuel, is an appropriate and necessary bridge fuel to meet net-zero emissions goals, as existing infrastructure allows rapid emissions reductions.\nYou believe the idea that renewable energies will fill the energy needs of large countries anytime soon hinders realistic change, as U.S. alternative energy use has never exceeded 20% historically.\nYou believe nuclear energy is too dangerous and ineffective to be a serious solution to global warming, as accidents like Fukushima eliminate carbon-free electricity gains.<\/pre><\/details><details><summary>final_answer<\/summary><pre>**Yes—alternative energies can effectively replace fossil fuels, but only under specific system-level conditions.** It’s not an unconditional “switch today” proposition; it depends on what “replace” covers and how the energy system is redesigned for reliability and for non-electric fossil uses.\n\n### What “replace fossil fuels” must include\nTo effectively replace fossil fuels, the plan must cover **major fossil-fuel energy services**, not only electricity generation:\n\n1. **Electricity sector:** replace fossil power with low-carbon electricity.\n2. **Transportation and heating (thermal needs):**\n   - **Where electrification is feasible** (e.g., **EVs**, **heat pumps**), fossil use can be replaced by switching energy services to electricity.\n   - **Where electrification is difficult** (some industrial processes, parts of long-haul transport), replacement likely requires **conversion pathways** such as **hydrogen/e-fuels**. These involve multiple conversion steps and **efficiency losses**, meaning they require **substantially more low-carbon electricity** than a simple one-to-one fuel swap.\n\n### Electricity replacement is achievable—if reliability is engineered in\nRenewables are already demonstrated at very high shares in some countries (e.g., **Iceland ~85%**, **Paraguay ~99.9%**, **Costa Rica ~99.78%**, **Norway ~98%**), showing fossil dominance is not inherent.\n\nBut high renewable penetration works **only if grids can maintain reliability**, because variable sources (wind/solar) need:\n- **firm/dispatchable low-carbon capacity**, and/or\n- **balancing tools** such as storage, demand response, and transmission/interconnection.\n\nUnder those reliability conditions, variable renewables do not inherently block near-complete displacement in the **power sector**.\n\n### The key timing/tradeoff: dispatchable low-carbon capacity must scale fast enough\nA central feasibility condition is whether a region can retire fossil plants **faster than** it can build enough **firm/dispatchable low-carbon** resources.\n\n- **If** firm/dispatchable low-carbon capacity can be scaled rapidly enough (including through options like hydro/geothermal and potentially other sources), then fossil fuels can be reduced aggressively with alternatives as the backbone.\n- **If not**, then **some fossil backup may be used temporarily** to prevent reliability failures while clean capacity is ramped up.\n\n### How “bridge fuel” fits—without implying permanent dependence\nIf dispatchable low-carbon reliability cannot arrive quickly enough, **natural gas may be used as a temporary bridge** to maintain system stability during the transition. In that case, “alternatives alone” would not eliminate fossil fuels immediately—but the intent can still be credible net-zero without making fossil fuels permanent.\n\n### Nuclear: potentially important, but the debate’s decisive disagreement is unresolved\nNuclear is treated as a potentially key **firm, low-carbon** option because it can stabilize grids and is land-efficient.\n\nHowever, the synthesis leaves an **explicit unresolved element**: it does **not** settle a universal claim that nuclear is unequivocally safe/effective enough to be the quickest feasible global solution, nor that it is unequivocally not serious due to safety/feasibility concerns. So nuclear’s role is **conditional on country- and project-specific** safety outcomes and build/commission timelines.\n\n### Final decision rule (bottom line)\n**Alternative energies can effectively replace fossil fuels if**:\n- major fossil-fuel **energy services** are replaced (including transport/heating where possible via electrification, and via conversion pathways where not),\n- the grid includes sufficient **firm/dispatchable low-carbon capacity** and balancing,\n- low-carbon supply scales fast enough to meet the **amplified electricity needs** created by electrification (and electro-fuels where used),\n- any near-term gaps are handled with an explicit transition strategy.\n\n**If** those reliability and scaling conditions can’t be met quickly enough, then **temporary natural-gas bridging** may be consistent with achieving net-zero without relying on fossil fuels permanently.\n\nSo the correct answer is **conditional**: *Yes in principle and in power-sector practice when system reliability and full end-use replacement are addressed; sometimes “not in the near term without bridging” if dispatchable low-carbon capacity can’t scale fast enough.*<\/pre><\/details><div>justification_status: <b>fallback_full_dialogue_synthesis<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}]}}};
const METHODS = ["schema", "no_schema", "free_debate", "mad"];
const st = {turns:null, topic:null, method:null, run:0};
const D = ()=>DATA[st.turns];

 style:[

    'text-background-color':getComputedStyle(document.body).backgroundColor,'text-background-opacity':0.85,

 ]});
cy.on('tap','node,edge',e=>{document.getElementById('detail').textContent=e.target.data('detail')||'';});

function btn(parent,label,on,fn){const b=document.createElement('button');b.textContent=label;
  if(on)b.className='on';b.onclick=fn;parent.appendChild(b);}
function fit(){ // 切り替え後も、できるだけ同じ topic / method を保つ
  const d=D();
  if(!d[st.topic])st.topic=Object.keys(d)[0];
  if(!d[st.topic][st.method])st.method=METHODS.find(m=>d[st.topic][m]);
  if(st.run>=d[st.topic][st.method].length)st.run=0;
}
function renderTabs(){
  const U=document.getElementById('turns'),T=document.getElementById('topics'),
        M=document.getElementById('methods'),R=document.getElementById('runs');
  for(const el of [U,T,M,R]){while(el.children.length>1)el.removeChild(el.lastChild);}
  const keys=Object.keys(DATA);
  U.style.display=(keys.length===1&&keys[0]==='')?'none':'';
  keys.forEach(k=>btn(U,k,k===st.turns,()=>{st.turns=k;fit();show();}));
  const d=D();
  Object.keys(d).forEach(t=>btn(T,t,t===st.topic,()=>{st.topic=t;st.run=0;
    if(!d[t][st.method])st.method=METHODS.find(m=>d[t][m]);show();}));
  METHODS.filter(m=>d[st.topic][m]).forEach(m=>btn(M,m,m===st.method,()=>{st.method=m;st.run=0;show();}));
  d[st.topic][st.method].forEach((r,i)=>btn(R,'#'+r.run,i===st.run,()=>{st.run=i;show();}));
}
function show(){
  renderTabs();
  const r=D()[st.topic][st.method][st.run];
  document.getElementById('q').textContent=r.question;
  document.getElementById('legend2').textContent=r.lane
    ?'点線: 発話順からの推定（直前の相手発話への応答）'
    :'木構造: 上 = 攻撃された論証、下 = それを攻撃/反論した論証（矢印は攻撃の向き）。実線 rebut / 破線 undercut ／ 枠 緑=justified 黄=defensible 灰=overruled';
  document.getElementById('meta').innerHTML=r.meta;
  document.getElementById('detail').textContent='ノードをクリック';
  cy.elements().remove(); cy.add(r.elements);
  cy.layout({name:'preset',fit:true,padding:40}).run();
}
st.turns=Object.keys(DATA)[0];st.topic=Object.keys(D())[0];st.method=METHODS.find(m=>D()[st.topic][m]);show();
