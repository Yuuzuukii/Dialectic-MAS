ent\": \"Non-animal alternatives can achieve the relevant biology learning goals at least as well as animal dissection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Using animals for dissections causes serious ethical and environmental harms\",\n            \"Approximately 99% of dissection animals are caught in the wild\",\n            \"Wild-catching decreases local populations and reduces biodiversity\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection depends on inhumane/environmentally harmful supply practices that are avoidable.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Non-animal alternatives avoid the need for wild-caught animal specimens\",\n            \"Non-animal alternatives avoid the inhumane/environmental harms associated with supplying dissection specimens\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Non-animal alternatives can avoid the relevant inhumane/environmental harms while still enabling biology learning.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Non-animal alternatives can achieve the relevant biology learning goals at least as well as animal dissection\",\n            \"Non-animal alternatives can avoid the relevant inhumane/environmental harms while still enabling biology learning\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"There is adequate basis (evidence) to say that non-animal alternatives can achieve the same combined learning goals at least as well while also avoiding the relevant inhumane/environmental harms.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection relies on avoidable inhumane/environmentally harmful supply practices\",\n            \"Non-animal alternatives can meet the combined learning goals at erlying grounds I already used earlier in this thread. Substantively, I hold that students should dissect because real dissection reliably provides uniquely valuable hands-on tissue manipulation that develops fine-motor/hand-eye coordination, supports critical thinking from real anatomical variability, and creates strong aha/career inspiration; and that school dissections largely use animals that are already deceased or meat-industry byproducts, making dissection a productive use rather than additional wild capture or waste."}, "position": {"x": 510, "y": 1106.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-f6c03bdbfe", "source": "end-arg-f6c03bdbfe", "target": "arg-9de6502289", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-a517b943a3", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 1870, "y": 1256.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-a517b943a3", "source": "end-arg-a517b943a3", "target": "arg-23621df5f6", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-e15d8e3e6b", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 2040, "y": 1406.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-e15d8e3e6b", "source": "end-arg-e15d8e3e6b", "target": "arg-9a367f7360", "ls": "dotted", "inferred": 1}}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 2210, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>25<\/td><\/tr><tr><td>attack_turn_count<\/td><td>22<\/td><\/tr><tr><td>main_argument_count<\/td><td>3<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>1<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.214151<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Students **should dissect animals only under strict, verification-based conditions**; otherwise schools should **use non-animal alternatives**.\n\n### Direct rule\n**Allow animal dissection in biology classes only if the school can verify all three of the following:**\n\n1. **Instructional equivalence in practice:**  \n   Non-animal alternatives (e.g., synthetic models and computer simulations) are shown—*in that school’s typical classroom implementation*—to **not** achieve the **combined** learning and engagement aims **at least as well** as dissection.  \n   This includes not just conceptual knowledge, but also the kinds of hands-on/procedural learning dissection is claimed to support (e.g., real 3D tissue navigation, tool/tissue handling time per student, and comparable safety-critical lab workflow practice), plus engagement/motivation effects.\n\n2. **Verified low or no biodiversity/species impact from sourcing:**  \n   Specimens must be documented to be **already deceased / byproducts** (or otherwise not requiring additional capture or killing for classroom use), and procurement practices must indicate **no meaningful additional wild-capture or biodiversity harm attributable to dissection demand**.  \n   If the school cannot provide this verification, dissection should not be used.\n\n3. **Avoidance or strict control of toxic chemicals and hazardous waste:**  \n   The school must demonstrate that dissection **does not rely on toxic preservation chemicals**, or that any necessary chemicals and resulting waste are managed under **robust environmental and safety controls** such that the harms are not avoidable in practice.\n\n### If any condition fails\nIf **any one** of the conditions above cannot be met (e.g., equivalence can be reasonably achieved with alternatives, sourcing cannot be verified as byproduct/low-impact, or toxic chemical/hazardous waste harms cannot be avoided or properly controlled), then **dissection must be prohibited** and **non-animal alternatives required**.\n\n### Why this is the governing policy\nBecause the educational benefits of dissection are acknowledged while the potential harms (animal supply practices, biodiversity impacts, and toxic chemical waste) are serious and partly unresolved, the correct approach is **not categorical**. It is a **default to alternatives** unless the school can **prove dissection is necessary and minimizes avoidable harm** in the real-world classroom context.<\/pre><\/details><div>justification_status: <b>fallback_full_dialogue_synthesis<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}]}}};

function renderTabs(){
  const U=document.getElementById('turns'),T=document.getElementById('topics'),
        M=document.getElementById('methods'),R=document.getElementById('runs');
