 Democrats and 59% of Republicans support this measure, and 27 of 36 OECD countries hold elections on weekends or holidays.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose Election Day being a national holiday.\nYou believe making Election Day a federal holiday disadvantages low-income workers, as federal law doesn't mandate private employers give paid holidays and retail and service workers would likely still work.\nYou believe changing state laws requiring employer time-off for voting or implementing automatic voter registration would be more reliable approaches than a holiday.\nYou believe research shows having an election holiday, by itself, is not an effective strategy to increase voter turnout compared to other voting access reforms.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Flow of the argumentation (what was put forward, what objections were raised, and how each was answered)\n\n1) Pro-position: Election Day should be a national holiday\n- Opinion put forward (ag1):\n  - Work and school schedules function as major “scheduling barriers” that significantly reduce Americans’ likelihood of voting.\n  - Making Election Day a national holiday would reduce those schedule-based barriers, thereby increasing voter participation.\n  - Even if there are possible downsides, the proposal is still justified on participation grounds.\n  - Supporting political/cross-national context was asserted: Democrats and Republicans show majority support, and many OECD countries hold elections on weekends/holidays.\n- Objections raised (ag2):\n  - “Having an election holiday by itself is not an effective strategy” compared to other voting-access reforms, so it may not reliably increase turnout.\n- How answered (ag1):\n  - The pro side essentially reasserted the mechanism (less time pressure → more voting) and tried to treat the “by itself” criticism as something that can be handled via design/mitigation (see point 3 below), rather than as a rebuttal of the core scheduling mechanism.\n\n2) Con-position: Election Day should not be a national holiday\n- Opinion put forward (ag2):\n  - A federal Election Day holiday would not reliably translate into paid time off for voting for workers in private employment.\n  - Because many low-income and service-sector workers depend on private employers for scheduling and pay, the holiday would likely disadvantage low-income workers in practice.\n  - Disadvantaging low-income workers is therefore decisive against making Election Day a national holiday.\n- How answered (ag1):\n  - ag1 shifted the policy condition: the holiday should be adopted only if it includes protections that prevent disadvantaged effects on low-income workers—e.g., guaranteed paid time off or equivalent compensation.\n  - Thus, the pro side’s final position becomes conditional: not merely “make Election Day a holiday,” but “make it a holiday with worker protections.”\n\n3) Conditional resolution attempt\n- Opinion put forward (ag1, last move):\n  - Even if there is a concern that low-income workers could be disadvantaged, the proposal can be justified if the policy includes protections (guaranteed paid time off or equivalent compensation).\n- Objections raised (ag2):\n  - The objections that remain are effectively about reliability/effectiveness (“holiday by itself doesn’t reliably increase turnout”) and the practical implementation difficulty for private-employer paid time off.\n- How answered (ag1):\n  - The pro side’s answer is to add the missing implementation component: protections/compensation so the holiday does not disadvantage low-income workers.\n\nWhat remains undecided\n1) Reliability/effectiveness question remains unresolved:\n- Even with the scheduling-barrier rationale, it was not fully established that an Election Day holiday (especially if implemented as a national holiday with or without additional measures beyond paid time off) reliably increases turnout relative to other reforms.\n\n2) Implementation feasibility and compliance question remains unresolved:\n- ag2’s core complaint is practical: a federal holiday does not necessarily force private employers to grant paid time to vote.\n- The pro side responded conditionally (add protections like paid time off or equivalent compensation), but the argumentation did not finalize how those protections would be enforced or whether they would fully solve the “private employer” problem.\n\n3) Net effects tradeoff was not empirically settled:\n- The pro side argued participation gains outweigh harms, but the disagreement on expected magnitude (and whether the holiday “by itself” is enough) was not resolved by evidence in the given argumentation.\n\nWhat is known (from the argumentation itself)\n- The main pro mechanism asserted:\n  - If Election Day is a paid/recognized non-working day for voters, it reduces schedule barriers and should raise turnout.\n- The main con mechanism asserted:\n  - Without enforceable paid time off/compensation for private-employment workers, low-income/service workers may not benefit and could be disadvantaged.\n- The closest “answer” reached in the dialogue:\n  - The pro side effectively concedes a design constraint: adopting an Election Day national holiday is defensible only with protections for workers (paid time off or equivalent compensation). This is the only explicit resolution step produced by the argumentation.\n- But because the “reliability compared to other reforms” objection and the “implementation/enforcement in private employment” concern were not fully answered with a final, agreed mechanism and evidence, the overall issue is not fully settled within this dialogue.<\/pre><\/details><div>justification_status: <b>fallback_no_consensus<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}]}, "alternative_energy": {"no_schema": [{"run": 1, "question": "Can alternative energies effectively replace fossil fuels?", "elements": [{"data": {"id": "h0", "kind": "main", "label": "AG1 main\n**Main Argument (A1): Alternative energi", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"h0\",\n  \"agent\": \"AG1\",\n  \"type\": \"main\",\n  \"proponent\": \"AG1\",\n  \"status\": \"overruled\"\n}\n\n**Main Argument (A1): Alternative energies can effectively replace fossil fuels.**\n\n1. **Premise:** Many countries already generate electricity at extremely high shares using low-carbon and renewable energy sources (e.g., **Iceland ~85% renewables**, **Paraguay ~99.9%**, **Costa Rica ~99.78%**, **Norway ~98%**).  \n2. **Premise:** This demonstrates that large-scale energy systems can be redesigned and operated successfully without relying on fossil fuels as the dominant source of electricity.  \n3. **Premise:** Since the transition is already happening in multiple countries, the necessary knowledge, technologies, and implementation know-how **already exist**.  \n4. **Conclusion:** Therefore, **alternative energies can effectively replace fossil fuels** (at least as a primary electricity source), and fossil fuels do not remain necessary for continued energy provision.  \n5. **Conclusion (issue-level):** Alternative energy replacement of fossil fuels is **feasible and effective**, meaning we can and should shift away from fossil fuels to protect the future viability of life on Earth."}, "position": {"x": 0.0, "y": 0}}, {"data": {"id": "h1", "kind": "defeat", "label": "AG2 defeat\n**A2 (Rebuttal):** Alternative energies ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"h1\",\n  \"agent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"proponent\": \"AG1\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"h0\"\n}\n\n**A2 (Rebuttal):** Alternative energies cannot *effectively replace fossil fuels* at the level of whole-country energy supply soon enough; the best available near-term replacement is reducing reliance on **fossil fuels via natural gas as a bridge**, not assuming renewables can fill demand everywhere.\n\n1. **Premise:** A claim that renewables can “effectively replace fossil fuels” should apply not only to **electricity** but to **total energy demand** and **reliability** (industry heat, transport fuels, dispatchable power).  \n2. **Premise:** In the U.S., alternative/renewable energy use has **never exceeded ~20% historically**, so substituting “alternative energies” for fossil fuels is not yet shown to be broadly effective for large countries.  \n3. **Premise:** Because alternatives are not yet demonstrated at that scale for meeting ongoing demand reliably, immediate complete replacement is unrealistic.  \n4. **Premise:** Therefore, meeting net-zero goals depends on a transition approach that can rapidly cut emissions using **existing infrastructure**, which supports using **natural gas** as a **necessary bridge fuel** while cleaner generation scales up.  \n5. **Conclusion:** Thus, the conclusion that “alternative energies can effectively replace fossil fuels” is not supported in a realistic, near-term sense; natural gas bridging is necessary.\n\n**This defeats A1** by directly contradicting A1’s issue-level conclusion that alternative energies can effectively replace fossil fuels."}, "position": {"x": 0.0, "y": 140}}, {"data": {"id": "e-h1", "source": "h1", "target": "h0", "ls": "dashed", "label": "undercut", "detail": "h1 (AG2 defeat) → h0\nattack: undercut\ntarget_field: None\ntarget_statement: None"}}, {"data": {"id": "h2", "kind": "main", "label": "AG2 main\n**Main Argument (A2’): Alternative energ", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#2ca02c", "detail": "{\n  \"id\": \"h2\",\n  \"agent\": \"AG2\",\n  \"type\": \"main\",\n  \"proponent\": \"AG2\",\n  \"status\": \"justified\"\n}\n\n**Main Argument (A2’): Alternative energies cannot effectively replace fossil fuels for entire national energy systems because they are not currently capable of providing dispatchable power at the scale and reliability required; therefore fossil fuels remain necessary—at least as backup—until replacements include large-scale storage/firm low-carbon capacity.**\n\n1. **Premise:** To “replace fossil fuels” for a whole country, alternatives must supply **all major energy services** (not just electricity): dispatchable grid power, industrial heat, and transport energy, with **reliability through seasons and demand spikes**.  \n2. **Premise:** Renewables as currently deployed are largely **variable** (wind/solar) and cannot reliably meet demand without substantial **firming capacity** (e.g., large-scale storage, long-duration storage, or other dispatchable low-carbon generation).  \n3. **Premise:** Because such firming infrastructure is not yet proven at the **necessary magnitude** across large energy systems, replacing fossil fuels outright would threaten **grid stability** and energy availability.  \n4. **Premise:** While some countries can run very high renewable electricity shares, that does not establish that **large countries** can do the same for total energy demand and reliability across all conditions using current alternatives alone.  \n5. **Conclusion:** Therefore, alternative energy sources cannot yet *effectively replace fossil fuels* for whole national energy supply.  \n6. **Conclusion (issue-level):** Fossil fuels (in practice, including natural gas) remain necessary as a bridge/backup until alternatives can provide comparable firm, dispatchable, and full-sector energy."}, "position": {"x": 170.0, "y": 0}}, {"data": {"id": "x0", "label": "AG1 rebut\n✗無効: strictly defeat でない\n**A3 (Rebuttal): Whole-country replaceme", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "履歴に入らなかった無効な試行\n{\n  \"role\": \"ag1\",\n  \"declared\": \"rebut\",\n  \"reason\": \"strictly defeat でない\",\n  \"target_index\": 1,\n  \"main_index\": 0,\n  \"id\": \"x0\",\n  \"target_id\": \"h1\",\n  \"agent\": \"AG1\"\n}\n\n**A3 (Rebuttal): Whole-country replacement is feasible—evidence from high-renewables systems outweighs the “U.S. has ~20% renewables historically” point.**\n\n1. **Premise:** The effectiveness of alternative energy replacement is evidenced by countries that already run **at very high shares of low-carbon electricity** without dominant fossil-fuel generation (e.g., **Iceland ~85%**, **Paraguay ~99.9%**, **Costa Rica ~99.78%**, **Norway ~98%**).  \n2. **Premise:** Those examples show that “large-scale system operation without fossil fuels as the dominant power source” is not merely theoretical; it has been implemented in real national electricity grids.  \n3. **Premise:** A2’s argument relies heavily on the U.S.-specific claim that renewables have not exceeded ~20% historically, but that does not establish impossibility of effective replacement—only that some countries have transitioned more slowly.  \n4. **Premise:** Therefore, the stronger conclusion A2 draws (“alternative energies cannot effectively replace fossil fuels soon enough”) is not supported; at minimum, alternative/low-carbon energy can already effectively cover major portions of national energy provision (especially electricity), and the existence of these systems undercuts the “not yet demonstrated” premise.  \n5. **Conclusion:** So A2’s claim that renewables/alternative energies cannot effectively replace fossil fuels (in a realistic sense) is rebutted by real-world, high-renewables national performance.\n\n**Attack outcome:** A3 rebuts A2’s conclusion that “alternative energies cannot effectively replace fossil fuels,” undermining the bridge-only implication as the necessary near-term conclusion."}, "position": {"x": 0, "y": 280}, "classes": "invalid"}, {"data": {"id": "e-x0", "source": "x0", "target": "h1", "ls": "solid", "label": "rebut（無効）", "inferred": 1}}, {"data": {"id": "x1", "label": "AG1 rebut\n✗無効: defeat でない\n**Phase 2 — Defeat A2’** I will **rebut*", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "履歴に入らなかった無効な試行\n{\n  \"role\": \"ag1\",\n  \"declared\": \"rebut\",\n  \"reason\": \"defeat でない\",\n  \"target_index\": 2,\n  \"main_index\": 2,\n  \"id\": \"x1\",\n  \"target_id\": \"h2\",\n  \"agent\": \"AG1\"\n}\n\n**Phase 2 — Defeat A2’**\n\nI will **rebut** A2’ by directly contradicting its issue-level conclusion that alternatives “cannot yet *effectively replace fossil fuels*” for whole national energy systems.\n\n### Rebutting Argument (A3): Examples + existing system operation show alternatives can effectively provide reliable energy at national scale (at least electricity/services), so fossil fuels aren’t categorically “necessary” as backup.\n1. **Premise:** Multiple countries are already operating power systems with **very high shares of renewables**—e.g., **Paraguay (~99.9%)**, **Costa Rica (~99.78%)**, **Norway (~98%)**, and **Iceland (~85%)**.  \n2. **Premise:** These real-world cases indicate that, with suitable resource mixes and system design, renewables-based systems can reach **high reliability in national electricity supply** rather than requiring fossil fuels as an inherent prerequisite.  \n3. **Premise:** Therefore, A2’ is too strong when it claims alternatives “cannot yet effectively replace fossil fuels” because it treats the inability of *some* current deployments as universal and permanent.  \n4. **Conclusion:** Alternatives **can be effective** at replacing fossil fuels—at minimum for major energy services (not just theory)—in at least some national contexts.  \n5. **Issue-level conclusion:** The claim that fossil fuels remain *necessary* as a general backup until large-scale storage/firm capacity is proven everywhere is not supported; the feasibility of replacement is already demonstrated.\n\nThis **rebuts A2’(5–6)** because my conclusion negates its key issue-level claim that alternatives cannot yet effectively replace fossil fuels for whole national energy supply."}, "position": {"x": 170, "y": 140}, "classes": "invalid"}, {"data": {"id": "e-x1", "source": "x1", "target": "h2", "ls": "solid", "label": "rebut（無効）", "inferred": 1}}, {"data": {"id": "end-h0", "label": "終了: overruled（反論できず敗北）", "detail": "終了: overruled（反論できず敗北）"}, "position": {"x": 0.0, "y": 406.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-h0", "source": "end-h0", "target": "h1", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-h2", "label": "終了: justified（全ての攻撃を撃退）", "detail": "終了: justified（全ての攻撃を撃退）"}, "position": {"x": 170.0, "y": 556.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-h2", "source": "end-h2", "target": "h2", "ls": "dotted", "inferred": 1}}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>5<\/td><\/tr><tr><td>attack_turn_count<\/td><td>1<\/td><\/tr><tr><td>main_argument_count<\/td><td>2<\/td><\/tr><tr><td>justified_proven_count<\/td><td>1<\/td><\/tr><tr><td>overruled_count<\/td><td>1<\/td><\/tr><tr><td>defensible_count<\/td><td>0<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support alternative energies replacing fossil fuels.\nYou believe alternative energies not only can but must replace fossil fuels if we want to continue living on Earth, as we already possess the knowledge and tools needed.\nYou believe many countries are already operating on significant renewable energy sources, including Iceland (85% renewable), Paraguay (99.9%), Costa Rica (99.78%), and Norway (98%), demonstrating that renewable transitions are achievable.\nYou believe nuclear energy, a low-carbon source of alternative energy, is the quickest way to end dependence on fossil fuels, requiring far less land than renewables.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose the idea that alternative energies can effectively replace fossil fuels.\nYou believe natural gas, a fossil fuel, is an appropriate and necessary bridge fuel to meet net-zero emissions goals, as existing infrastructure allows rapid emissions reductions.\nYou believe the idea that renewable energies will fill the energy needs of large countries anytime soon hinders realistic change, as U.S. alternative energy use has never exceeded 20% historically.\nYou believe nuclear energy is too dangerous and ineffective to be a serious solution to global warming, as accidents like Fukushima eliminate carbon-free electricity gains.<\/pre><\/details><details><summary>final_answer<\/summary><pre>1) Opinions put forward (Agent 1 / me)\n\n- A1: Alternative energies can effectively replace fossil fuels.\n  - Pointed to real-world examples where electricity is already produced with very high renewable shares (Iceland ~85%, Paraguay ~99.9%, Costa Rica ~99.78%, Norway ~98%).\n  - Argued this shows large energy systems can be redesigned and operated without fossil fuels dominating electricity.\n  - Claimed the knowledge and tools to transition already exist.\n  - Added that nuclear can be the quickest low-carbon “firm” power option and needs far less land than broad renewable buildout, helping end dependence on fossil fuels.\n\n2) Objections raised (Agent 2)\n\n- First rebuttal (A2): “Effectively replace” must apply to total energy (not just electricity) and to reliability.\n  - Noted that for very large countries (e.g., the U.S.) renewable/alternative energy use has historically stayed around ~20%, so broad replacement is not yet demonstrated at the scale implied.\n  - Argued that near-term “complete replacement” is unrealistic; therefore natural gas as a bridge is necessary.\n\n- Main rebuttal (A2’): Alternatives can’t yet replace fossil fuels for whole national systems because of dispatchability.\n  - Argued wind/solar are variable and cannot reliably meet demand across seasons and peaks without large-scale firming capacity (storage and/or dispatchable low-carbon generation).\n  - Claimed such firming at the needed magnitude is not yet proven across large countries, so fossil fuels remain necessary as backup/bridge.\n\n3) How each was answered\n\n- I (Agent 1) maintained that the existence of countries operating on very high renewable electricity shares demonstrates feasibility and that implementation know-how exists.\n- I also argued nuclear provides a low-carbon dispatchable option that can reduce (and potentially end) reliance on fossil fuels by supplying “firm” power more quickly than scaling-only renewables.\n- However, the objections centered on *whole-system* (total energy + reliability) rather than *electricity-only*, and they raised doubts about near-term scalability of dispatchable capacity. In the given resolution, my earlier confidence was treated as insufficient to overcome those reliability-and-scale objections in the whole-country sense.\n\nFinal answer to the issue: Can alternative energies effectively replace fossil fuels?\n\nAlternative energies can replace fossil fuels in many places for electricity today and can do so more broadly with deliberate system design (grids, demand shifting, transmission, and firm low-carbon power). The key limiting factor raised in the objections—dispatchability and reliability across entire national energy demand—is real: variable renewables alone cannot guarantee full replacement without substantial firming capacity.\n\nSo, replacement is effective and achievable as a strategy, but not as “renewables alone will automatically replace fossil fuels everywhere soon.” The most defensible view is:\n\n- For electricity, high-renewable systems are already effective in certain countries, showing replacement is possible.\n- For entire national energy systems (including transport fuels and industrial heat) and for reliability, fossil fuels (often natural gas) may remain necessary in the near term as a bridge until storage and dispatchable low-carbon supply (including options like nuclear, firm geothermal, or large-scale long-duration storage/hydro where available) are scaled sufficiently.\n\nIn short: alternative energies can effectively replace fossil fuels, but effectiveness requires a full low-carbon system—not just wind and solar—and the timing depends on building firm capacity and infrastructure at national scale.<\/pre><\/details><div>justification_status: <b>justified<\/b><\/div><div>consensus_reached: <b>True<\/b><\/div>"}], "schema": [{"run": 1, "question": "Can alternative energies effectively replace fossil fuels?", "elements": [{"data": {"id": "h0", "kind": "main", "label": "AG1 main\nAlternative energies can effectively rep", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"h0\",\n  \"agent\": \"AG1\",\n  \"type\": \"main\",\n  \"proponent\": \"AG1\",\n  \"status\": \"overruled\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energies can produce large-scale electricity and energy services\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Alternative energies can produce large-scale electricity and energy services\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Alternative energies can replace fossil fuels for electricity and many energy services\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Alternative energies can replace fossil fuels for electricity and many energy services\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Countries with major shares of renewables/low-carbon energy show renewable transitions are achievable (e.g., Iceland, Paraguay, Costa Rica, Norway)\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Countries with major shares of renewables/low-carbon energy show renewable transitions are achievable (e.g., Iceland, Paraguay, Costa Rica, Norway)\",\n a": {"id": "end-h2", "label": "終了: overruled（反論できず敗北）", "detail": "終了: overruled（反論できず敗北）"}, "position": {"x": 170.0, "y": 556.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-h2", "source": "end-h2", "target": "h3", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-h4", "label": "終了: overruled（反論できず敗北）", "detail": "終了: overruled（反論できず敗北）"}, "position": {"x": 340.0, "y": 706.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-h4", "source": "end-h4", "target": "h5", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-h6", "label": "終了: overruled（反論できず敗北）", "detail": "終了: overruled（反論できず敗北）"}, "position": {"x": 510.0, "y": 856.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-h6", "source": "end-h6", "target": "h7", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-h8", "label": "終了: overruled（反論できず敗北）", "detail": "終了: overruled（反論できず敗北）"}, "position": {"x": 680.0, "y": 1006.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-h8", "source": "end-h8", "target": "h9", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-h10", "label": "終了: overruled（反論できず敗北）", "detail": "終了: overruled（反論できず敗北）"}, "position": {"x": 850.0, "y": 1156.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-h10", "source": "end-h10", "target": "h11", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-h12", "label": "終了: defensible", "detail": "終了: defensible"}, "position": {"x": 1020, "y": 1306.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-h12", "source": "end-h12", "target": "h13", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-h15", "label": "終了: defensible", "detail": "終了: defensible"}, "position": {"x": 1190, "y": 1456.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-h15", "source": "end-h15", "target": "h15", "ls": "dotted", "inferred": 1}}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>20<\/td><\/tr><tr><td>attack_turn_count<\/td><td>7<\/td><\/tr><tr><td>main_argument_count<\/td><td>8<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>6<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support alternative energies replacing fossil fuels.\nYou believe alternative energies not only can but must replace fossil fuels if we want to continue living on Earth, as we already possess the knowledge and tools needed.\nYou believe many countries are already operating on significant renewable energy sources, including Iceland (85% renewable), Paraguay (99.9%), Costa Rica (99.78%), and Norway (98%), demonstrating that renewable transitions are achievable.\nYou believe nuclear energy, a low-carbon source of alternative energy, is the quickest way to end dependence on fossil fuels, requiring far less land than renewables.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose the idea that alternative energies can effectively replace fossil fuels.\nYou believe natural gas, a fossil fuel, is an appropriate and necessary bridge fuel to meet net-zero emissions goals, as existing infrastructure allows rapid emissions reductions.\nYou believe the idea that renewable energies will fill the energy needs of large countries anytime soon hinders realistic change, as U.S. alternative energy use has never exceeded 20% historically.\nYou believe nuclear energy is too dangerous and ineffective to be a serious solution to global warming, as accidents like Fukushima eliminate carbon-free electricity gains.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Flow of the argumentation (what was put forward, objections, and responses)\n\n1) Ag1’s main position (in favor of replacement)\n- Claim: Alternative energies (renewables plus nuclear) can produce large-scale electricity and energy services.\n- From that, Ag1 argued: they can replace fossil fuels for electricity and many energy services.\n- Ag1 supported “achievable in practice” by citing countries with very high renewable/low-carbon shares (Iceland, Paraguay, Costa Rica, Norway).\n- Ag1 also argued that reliability/“firm capacity” needs can be met without ongoing fossil fuels by using a diversified low-carbon portfolio: nuclear, hydro, transmission expansion, grid/storage, and demand response—especially if end uses are electrified (transport, heating, and some industrial heat).\n- Overall conclusion by Ag1: alternative energies can effectively replace fossil fuels in practice, and any fossil-fuel role should be limited and time-bounded during transition buildup rather than an open-ended “required bridge.”\n\n2) Ag2’s first set of objections (replacement not demonstrated / constrained in practice)\n- Objection A: Large-scale substitution is constrained by practical issues—insufficient real-world deployment and grid/firm-capacity adequacy in major fossil-dependent economies.\n- Evidence offered: In the U.S., alternative energy historically never exceeded about 20%, so it hasn’t demonstrated full national-scale replacement.\n- Ag1 response: Ag1 maintained that alternative systems can meet reliability needs via a portfolio (nuclear/hydro/storage/demand response/transmission), so fossil fuels are not inherently required for firm power.\n\n3) Ag2’s second set of objections (firmness and “total energy services”)\n- Objection B: Alternative energies cannot reliably provide all energy services at the required scale and firmness without major reliance on fossil fuels or other carbon-emitting backup in the foreseeable future.\n- Ag2’s conclusion: therefore alternative energies cannot effectively replace fossil fuels for total energy needs.\n- Ag1 response: Ag1 narrowed/structured the path: low-carbon electricity can cover key demands under electrification, and the remaining firm-power needs can be met with a low-carbon reliability portfolio (nuclear/hydro/storage/transmission/demand response), avoiding an ongoing fossil bridge.\n\n4) Ag2’s third set of objections (net-zero requires a bridge because firmness is insufficient near term)\n- Objection C: Alternative sources cannot currently provide adequate system-level firm capacity for large economies without substantial carbon-emitting backup in the near term; therefore net-zero transitions must rely on fossil fuels as a bridge (especially natural gas).\n- Ag1 response: Ag1 repeated the portfolio argument—operational reliability can be achieved without ongoing fossil use by combining low-carbon firm sources (notably nuclear), flexible resources (demand response), and grid/storage/transmission measures.\n\nHow each dispute was handled in the “status” outcomes\n- The record shows multiple parts were “overruled” or marked “defensible,” but no conclusive justification was actually reached across the full set of claims.\n- In substance:\n  - Ag1’s side repeatedly asserted feasibility through known technologies and portfolio balancing, emphasizing country precedents and electrification.\n  - Ag2 repeatedly challenged that “replacement” cannot be demonstrated at the required scale and firmness for the full energy system in the foreseeable future, using U.S. penetration history and general reliability concerns.\n- The specific points that remained unresolvable within the argumentation were mainly empirical/technical feasibility at global/national scale and time horizons.\n\nWhat remains undecided\n\n1) The time horizon and scale of “effective replacement”\n- Are renewables + nuclear capable of replacing fossil fuels everywhere at the required scale and reliability immediately, or only after substantial buildout?\n- Ag1 treated “replace” as feasible with electrification and portfolio planning; Ag2 treated current/forthcoming grid needs as making near-term full replacement implausible.\n\n2) Whether reliability can be achieved without fossil backup (and what “firm” means)\n- The arguments turned on firmness: seasonal variability, capacity adequacy, and system-level reliability under realistic demand and weather patterns.\n- Ag1 asserted a low-carbon portfolio can meet this.\n- Ag2 asserted that, in practice, it cannot yet do so for large fossil-dependent systems without carbon-emitting backup.\n\n3) Scope: “electricity” vs “total energy”\n- Ag1 focused on displacing fossil fuel energy services largely via electrification plus low-carbon firming, while acknowledging that some hard-to-electrify services may be different.\n- Ag2 explicitly argued the claim fails for “total energy needs,” not just power.\n\nWhat is known (from the argumentation, not necessarily settled)\n\n1) Known/accepted premise by both sides\n- Renewable and nuclear electricity are real, scalable generation options, but their integration raises reliability and system planning challenges.\n- Grid reliability and firm capacity are central constraints when displacing fossil fuels.\n\n2) Known/claimed by Ag1 (but not fully verified inside the argument record)\n- Several countries have very high shares of renewable or low-carbon electricity, suggesting transitions are possible.\n- Reliability can be addressed through a portfolio (nuclear/hydro/storage/transmission/demand response).\n\n3) Known/claimed by Ag2 (but not fully rebutted with hard data in the record)\n- Major fossil-dependent economies have not yet shown full replacement at national scale, and historical renewable penetration benchmarks (e.g., U.S. ~20% figure) were used to argue practical limits.\n- Near-term firm-capacity adequacy remains a concern without fossil backup.\n\nBottom line\n- The argumentation ended with a stalemate: Ag1 argued feasibility of fossil replacement through electrification and a diversified low-carbon reliability portfolio, while Ag2 argued that system-level firmness and near-term practical deployment make full replacement (especially for total energy needs) not effectively achievable without continued fossil backup.\n- What’s left undecided is the empirical question of whether (and how quickly) alternative energy portfolios can meet large-scale, system-level, firm reliability requirements across the whole energy system—without relying on fossil fuels beyond limited transition buildup.<\/pre><\/details><div>justification_status: <b>fallback_no_consensus<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}]}, "american_socialism": {"no_schema": [{"run": 1, "question": "Should the United States Become Socialist?", "elements": [{"data": {"id": "h0", "kind": "main", "label": "AG1 main\n**Main Argument (Pro-American Socialism)", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#2ca02c", "detail": "{\n  \"id\": \"h0\",\n  \"agent\": \"AG1\",\n  \"type\": \"main\",\n  \"proponent\": \"AG1\",\n  \"status\": \"justified\"\n}\n\n**Main Argument (Pro-American Socialism):**\n\n1. The United States already uses numerous successful socialist-leaning policies (e.g., **Medicare, Social Security, minimum wage laws, and child labor laws**), which demonstrates that socialist policies can function effectively within the U.S.  \n2. If socialist policies can already work successfully in the U.S. alongside capitalism, then the U.S. should further adopt socialism to **expand** coverage and reduce harms from unfettered capitalism (including extreme wealth concentration).  \n3. Therefore, the United States **should become more socialist** (i.e., more fully adopt socialist policies that redistribute wealth and protect people), rather than rejecting socialism outright.  \n\n**Conclusion:** *The United States should become socialist.*"}, "position": {"x": 0.0, "y": 0}}, {"data": {"id": "x0", "label": "AG2 rebut\n✗無効: defeat でない\n### Argument defeating agent 1 (rebuttal", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "履歴に入らなかった無効な試行\n{\n  \"role\": \"ag2\",\n  \"declared\": \"rebut\",\n  \"reason\": \"defeat でない\",\n  \"target_index\": 0,\n  \"main_index\": 0,\n  \"id\": \"x0\",\n  \"target_id\": \"h0\",\n  \"agent\": \"AG2\"\n}\n\n### Argument defeating agent 1 (rebuttal)\n\n**A1:** The fact that the U.S. has some welfare-state or labor protections (e.g., Social Security, Medicare, minimum-wage laws) does **not** support the conclusion that the U.S. “should become socialist,” because these policies are limited programs within an overall **capitalist** framework and do not establish the case for a broader socialist restructuring that would entail major redistribution and government control.\n\n**Why this defeats their argument:**  \nAgent 1’s argument relies on an assumption that “successful socialist-leaning policies” implies the U.S. should “further adopt socialism.” My conclusion contradicts their conclusion by rejecting the inference: **incremental safety-net policies are not equivalent to adopting socialism**, so their step from (1) and (2) to (3) fails.\n\n**Conclusion:** Therefore, the United States should not become more fully socialist on the grounds given by agent 1."}, "position": {"x": 0, "y": 140}, "classes": "invalid"}, {"data": {"id": "e-x0", "source": "x0", "target": "h0", "ls": "solid", "label": "rebut（無効）", "inferred": 1}}, {"data": {"id": "end-h0", "label": "終了: justified（全ての攻撃を撃退）", "detail": "終了: justified（全ての攻撃を撃退）"}, "position": {"x": 0.0, "y": 266.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-h0", "source": "end-h0", "target": "h0", "ls": "dotted", "inferred": 1}}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>2<\/td><\/tr><tr><td>attack_turn_count<\/td><td>0<\/td><\/tr><tr><td>main_argument_count<\/td><td>1<\/td><\/tr><tr><td>justified_proven_count<\/td><td>1<\/td><\/tr><tr><td>overruled_count<\/td><td>0<\/td><\/tr><tr><td>defensible_count<\/td><td>0<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support American socialism.\nYou believe the U.S. already has many successful and popular socialist policies, including Medicare, social security, the minimum wage, and child labor laws.\nYou believe socialist policies can work with capitalist structures to undo the harm done by unfettered capitalism, as the top 1% holds more wealth than the bottom 50% and socialist measures like wealth taxes could redistribute wealth.\nYou believe the American public supports socialist policies, as 69% back Medicare for all, 63% support free college tuition, 85% support paid work leave, and 64% support a wealth tax.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose American socialism.\nYou believe the U.S. already has too many costly socialist entitlements, as proposed Democratic Socialist programs cost an estimated $42.5 trillion over ten years.\nYou believe the job of the U.S. government is to promote equal opportunity, not promise equal results, and that countries prioritizing economic freedom achieve higher life expectancy, political and civil liberties, gender equality, and happiness.\nYou believe the American public supports a capitalist economy, as 57% favor capitalism, 84% support free enterprise, and 60% believe free markets work best.<\/pre><\/details><details><summary>final_answer<\/summary><pre>The argumentation put forward these main opinions:\n\n1. The pro-socialist side argued that the United States already uses many successful socialist-leaning policies—specifically naming **Medicare, Social Security, minimum wage laws, and child labor laws**—showing that socialist policies can work within an American system rather than needing to replace everything.\n\n2. It further argued that if these policies already function effectively alongside capitalism, then the U.S. should go further: expand socialist measures to **reduce harms caused by “unfettered capitalism”** and address extreme wealth concentration (e.g., the claim that the top 1% holds more wealth than the bottom 50%).\n\n3. It also claimed there is strong public support for socialist-style policies, citing polling figures such as support for **Medicare for all, free college tuition, paid work leave, and a wealth tax**.\n\nObjections were not explicitly raised in the argumentation you provided, so there were no recorded counterarguments to answer.\n\nFinal answer to the issue (“Should the United States Become Socialist?”):\n\nYes—the United States should become more socialist. The country already demonstrates that socialist policies can succeed (Medicare, Social Security, wage protections, and child labor laws), and expanding such policies would further reduce harm from extreme inequality and wealth concentration. Given that many Americans already support major socialist-leaning policies, moving toward a more social-democratic or socialist framework (including ideas like wealth taxation and broader public guarantees) is both practical and politically plausible.<\/pre><\/details><div>justification_status: <b>justified<\/b><\/div><div>consensus_reached: <b>True<\/b><\/div>"}], "schema": [{"run": 1, "question": "Should the United States Become Socialist?", "elements": [{"data": {"id": "h0", "kind": "main", "label": "AG1 main\nThe U.S. should become more socialist.", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"h0\",\n  \"agent\": \"AG1\",\n  \"type\": \"main\",\n  \"proponent\": \"AG1\",\n  \"status\": \"overruled\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The U.S. already has many successful and popular socialist-style policies (e.g., Medicare, Social Security, minimum wage laws, and child labor laws).\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The U.S. already has many successful and popular socialist-style policies (e.g., Medicare, Social Security, minimum wage laws, and child labor laws).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Socialist policies can work with capitalist structures in the U.S.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Socialist policies can work with capitalist structures in the U.S.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Expanding U.S. socialism can undo harms caused by unfettered capitalism.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Expanding U.S. socialism can undo harms caused by unfettered capitalism.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Redistributing wealth in the U.S. via socialist measures (e.g., wealth taxes) can be justified.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Redistributing wealth in the U.S. via socialist measures (e.g., wealth taxes) can be justified.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The U.S. should become more socialist.\"\n      }\n    ],\n    \"Conc\": [\n      \"The U.S. already has many successful and popular socialist-style policies (e.g., Medicare, Social Security, minimum wage laws, and child labor laws).\",\n      \"Socialist policies can work with capitalist structures in the U.S.\",\n      \"Expanding U.S. socialism can undo harms caused by unfettered capitalism.\",\n      \"Redistributing wealth in the U.S. via socialist measures (e.g., wealth taxes) can be justified.\",\n      \"The U.S. should become more socialist.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0.0, "y": 0}}, {"data": {"id": "h1", "kind": "defeat", "label": "AG2 defeat\nThe U.S. should not become more socialis", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"h1\",\n  \"agent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"proponent\": \"AG1\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"h0\",\n  \"target_statement\": \"The U.S. should become more socialist.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The U.S. job is to promote equal opportunity, not promise equal results.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The U.S. job is to promote equal opportunity, not promise equal results.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Promising equal results via socialism is not the legitimate role of U.S. government.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Promising equal results via socialism is not the legitimate role of U.S. government.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The U.S. should not become more socialist.\"\n      }\n    ],\n    \"Conc\": [\n      \"The U.S. job is to promote equal opportunity, not promise equal results.\",\n      \"Promising equal results via socialism is not the legitimate role of U.S. government.\",\n      \"The U.S. should not become more socialist.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 0.0, "y": 140}}, {"data": {"id": "e-h1", "source": "h1", "target": "h0", "ls": "solid", "label": "rebut", "detail": "h1 (AG2 defeat) → h0\nattack: rebut\ntarget_field: None\ntarget_statement: The U.S. should become more socialist."}}, {"data": {"id": "h2", "kind": "main", "label": "AG2 main\nBecause it would conflict with democrati", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#888888", "detail": "{\n  \"id\": \"h2\",\n  \"agent\": \"AG2\",\n  \"type\": \"main\",\n  \"proponent\": \"AG2\",\n  \"status\": \"overruled\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [],\n          \"weak_negation\": []\ paid work leave, and 64% support a wealth tax.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose American socialism.\nYou believe the U.S. already has too many costly socialist entitlements, as proposed Democratic Socialist programs cost an estimated $42.5 trillion over ten years.\nYou believe the job of the U.S. government is to promote equal opportunity, not promise equal results, and that countries prioritizing economic freedom achieve higher life expectancy, political and civil liberties, gender equality, and happiness.\nYou believe the American public supports a capitalist economy, as 57% favor capitalism, 84% support free enterprise, and 60% believe free markets work best.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Flow of the argumentation\n\n1) Ag1’s main opinion (pro-socialism / “become more socialist”)\n- Opinion put forward: The U.S. should become more socialist.\n- Reasons offered:\n  - The U.S. already has successful, popular “socialist-style” policies such as Medicare, Social Security, minimum wage laws, and child labor laws.\n  - Socialist-style policies can operate alongside capitalist structures without abolishing capitalism.\n  - Expanding such policies can mitigate harms from “unfettered capitalism,” especially extreme wealth concentration (top 1% owning more than the bottom 50%).\n  - Therefore, additional socialist measures like wealth taxes can be justified to redistribute wealth and reduce those harms.\n\n2) Ag2’s first objection (legitimacy via equal opportunity vs equal outcomes)\n- Objection raised: The U.S. job is equal opportunity, not equal results; socialism aims at promised outcomes and is therefore not a legitimate governmental role.\n- Ag1’s response:\n  - Ag1 rebutted by restating that socialist-style measures can be designed to work alongside capitalism and mitigate harm, implying the opportunity/results objection doesn’t rule out redistribution aimed at correcting harms.\n- Outcome in the provided record: this rebuttal was “overruled” (i.e., not accepted as justified in the final adjudication).\n\n3) Ag2’s second objection (public support / democratic legitimacy)\n- Objection raised: The U.S. should not become socialist because most Americans prefer capitalism/free enterprise (citing figures like 57% favor capitalism, 84% support free enterprise, 60% think free markets work best). Hence, expanding socialism would conflict with democratic legitimacy and majority preference.\n- Ag1’s response:\n  - Ag1 argued that many socialist-style policies already have broad support (citing majorities for Medicare for all, free college tuition, paid work leave, and a wealth tax), so the “most Americans oppose socialism” claim is overstated.\n- Outcome in the record: Ag2’s objections were repeatedly marked “overruled,” but Ag1’s pro-socialism conclusions were also repeatedly marked “overruled/ not justified,” so no side’s conclusion was accepted.\n\n4) Ag2’s third objection (cost / fiscal imprudence)\n- Objection raised: Socialist-expansion proposals are extremely costly (citing an estimated $42.5 trillion added cost over ten years), creating serious fiscal burdens; therefore, pursuing large-scale socialism is imprudent and illegitimate.\n- Ag1’s response:\n  - Ag1 replied that socialist-style policies could be justified if their benefits outweigh costs, and that high costs alone do not automatically prove illegitimacy.\n- Outcome in the record: this clash was also not resolved in a way that led to any final justification of the pro-socialism conclusion.\n\n5) Ag1’s final qualified position (after cost objection)\n- Updated opinion by Ag1:\n  - The U.S. should become more socialist, but only via fiscally responsible, phased wealth-redistribution policies designed to avoid serious fiscal burdens.\n- Outcome in the record: this qualified position was labeled “defensible,” but earlier key steps in the chain to the overall conclusion were not accepted as justified.\n\nWhat remains undecided\n\n1) Whether “becoming more socialist” is legitimate governmental policy\n- Ag2’s equal opportunity vs equal results objection was not successfully adjudicated/validated as answered.\n- The argument does not settle whether wealth redistribution is best understood as compatible with “equal opportunity” or as a shift into “equal results.”\n\n2) Whether expanding socialism would actually conflict with majority preferences\n- The argument partially overlaps two different measures:\n  - General preference for “capitalism/free markets”\n  - Support for specific programs that look socialist in structure\n- It remains undecided whether majority support for specific programs implies majority support for a broader transition to “socialism,” as opposed to incremental social-democratic reforms.\n\n3) Whether the costs would be justified or manageable\n- The record shows cost concerns were raised and countered by “benefits may justify costs,” but no final decision is reached about:\n  - whether the specific cost estimates are accurate,\n  - what the realistic economic tradeoffs are,\n  - whether funding mechanisms (like wealth taxes) would be sufficient and feasible.\n\nWhat is known (from the argumentation record, not settled conclusions)\n\n- Known pro-socialism claims (Ag1):\n  - The U.S. already has several policies commonly classified as socialist-style or welfare-state measures (Medicare, Social Security, minimum wage laws, child labor laws).\n  - Many respondents in the cited polling support specific policies such as Medicare for all, free college tuition, paid work leave, and a wealth tax.\n  - Extreme wealth concentration is asserted (top 1% owning more than the bottom 50%).\n  - Socialist-style measures are argued to be compatible with capitalist institutions and could reduce harms.\n\n- Known anti-socialism claims (Ag2):\n  - Egalitarian “equal results” framing is challenged as outside the government’s legitimate role (equal opportunity vs outcomes).\n  - Polling is cited to show support for capitalism/free enterprise/free markets is majority-preferred.\n  - Large-scale socialist expansion is cited as potentially prohibitively costly (with a specific trillion-dollar estimate).\n\nBottom line\n- The arguments largely agree that the U.S. already contains socialist-style programs and that support varies depending on which policies are asked about.\n- However, the debate did not reach a fully justified consensus on the central question: whether the U.S. *should become socialist* (in the broad sense) rather than merely expand specific welfare-state measures.\n- The closest “partially settled” element in the record is Ag1’s qualified stance: “more socialist, but phased and fiscally responsible,” yet the earlier objections were not fully resolved to produce a fully justified final outcome.<\/pre><\/details><div>justification_status: <b>fallback_no_consensus<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}]}}};
const METHODS = ["schema", "no_schema", "free_debate", "mad", "mad_synthesis"];
const st = {turns:null, topic:null, method:null, run:0};
const D = ()=>DATA[st.turns];
const cy = cytoscape({container:document.getElementById('cy'), wheelSensitivity:0.3,
 style:[
  {selector:'node',style:{label:'data(label)','text-wrap':'wrap','text-max-width':150,'font-size':10,
    'color':getComputedStyle(document.body).color,'background-color':'data(color)',shape:'data(shape)',
    width:34,height:34,'text-valign':'bottom','text-margin-y':4,'border-width':'data(bw)','border-color':'data(bc)'}},
  {selector:'edge',style:{'curve-style':'bezier','target-arrow-shape':'triangle',width:2,'line-color':'#666',
    'target-arrow-color':'#666','line-style':'data(ls)',label:'data(label)','font-size':9,'text-wrap':'wrap',
    'text-max-width':140,'text-rotation':'autorotate','color':getComputedStyle(document.body).color,
    'text-background-color':getComputedStyle(document.body).backgroundColor,'text-background-opacity':0.85,
    'text-background-padding':2}},
  {selector:'edge[inferred]',style:{'line-color':'#aaa','target-arrow-color':'#aaa',width:1.5}},
  {selector:'node.note',style:{shape:'round-rectangle','background-color':'#fff7d6','background-opacity':1,width:'label',
    height:'label',padding:6,'border-width':1,'border-color':'#e6b800','color':'#333','font-size':11,
    'text-valign':'center','text-margin-y':0,'text-wrap':'wrap','text-max-width':320}},
  {selector:'node.rejected',style:{'border-width':3,'border-style':'dotted','border-color':'#333','background-opacity':0.45}},
  {selector:'node.invalid',style:{'border-width':3,'border-style':'dashed','border-color':'#d62728','background-opacity':0.3,'font-size':9}},
  {selector:'node.discarded',style:{shape:'round-rectangle','background-color':'#f2f2f2','background-opacity':1,width:'label',
    height:'label',padding:6,'border-width':2,'border-style':'dotted','border-color':'#777','color':'#555','font-size':10,
    'text-valign':'center','text-margin-y':0,'text-wrap':'wrap','text-max-width':260}},
  {selector:':selected',style:{'overlay-color':'#2563eb','overlay-opacity':0.25}},
 ]});
cy.on('tap','node,edge',e=>{document.getElementById('detail').textContent=e.target.data('detail')||'';});

function btn(parent,label,on,fn){const b=document.createElement('button');b.textContent=label;
  if(on)b.className='on';b.onclick=fn;parent.appendChild(b);}
function fit(){ // 切り替え後も、できるだけ同じ topic / method / run 番号を保つ
  const d=D();
  if(!d[st.topic])st.topic=Object.keys(d)[0];
  if(!d[st.topic][st.method])st.method=METHODS.find(m=>d[st.topic][m]);
  const i=d[st.topic][st.method].findIndex(r=>r.run===st.runNo);
  st.run=i>=0?i:0;
}
function renderTabs(){
  const U=document.getElementById('turns'),T=document.getElementById('topics'),
        M=document.getElementById('methods'),R=document.getElementById('runs');
  for(const el of [U,T,M,R]){while(el.children.length>1)el.removeChild(el.lastChild);}
  const keys=Object.keys(DATA);
  U.style.display=(keys.length===1&&keys[0]==='')?'none':'';
  keys.forEach(k=>btn(U,k,k===st.turns,()=>{st.turns=k;fit();show();}));
  const d=D();
  Object.keys(d).forEach(t=>btn(T,t,t===st.topic,()=>{st.topic=t;
    if(!d[t][st.method])st.method=METHODS.find(m=>d[t][m]);fit();show();}));
  METHODS.filter(m=>d[st.topic][m]).forEach(m=>btn(M,m,m===st.method,()=>{st.method=m;fit();show();}));
  d[st.topic][st.method].forEach((r,i)=>btn(R,'#'+r.run,i===st.run,()=>{st.run=i;show();}));
}
function show(){
  renderTabs();
  const r=D()[st.topic][st.method][st.run];
  st.runNo=r.run;
  document.getElementById('q').textContent=r.question;
  document.getElementById('legend2').textContent=r.lane
    ?'点線: 発話順からの推定（直前の相手発話への応答）'
    :'木構造: 上 = 攻撃された論証、下 = それを攻撃/反論した論証（矢印は攻撃の向き）。実線 rebut / 破線 undercut ／ 枠 緑=justified 黄=defensible 灰=overruled ／ 赤い破線の枠 = 履歴に入らなかった無効な試行（defeat / strictly defeat になっていない）';
  document.getElementById('meta').innerHTML=r.meta;
  document.getElementById('detail').textContent='ノードをクリック';
  cy.elements().remove(); cy.add(r.elements);
  cy.layout({name:'preset',fit:true,padding:40}).run();
}
st.turns=Object.keys(DATA)[0];st.topic=Object.keys(D())[0];st.method=METHODS.find(m=>D()[st.topic][m]);show();
