vity uses already-dead/byproduct specimens.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection provides substantive skill-building educational value (fine motor skills, hand-eye coordination, and critical-thinking about anatomy).\",\n      \"Animal dissection both improves biology learning and can increase students’ motivation/interest in science through hands-on 'aha moments'.\",\n      \"Even when dissection is not strictly necessary for baseline learning goals, it can remain justified by its additional learning and motivation benefits.\",\n      \"In typical school settings that use already-dead/byproduct specimens, the tradeoff is mainly educational benefit rather than added killing/suffering.\",\n      \"Students should dissect animals as part of biology education when the activity uses already-dead/byproduct specimens.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170.0, "y": 140}}, {"data": {"id": "e-arg-ad123fd7a8", "source": "arg-ad123fd7a8", "target": "arg-c1169e53ce", "ls": "solid", "label": "rebut", "detail": "arg-ad123fd7a8 (AG1 defeat) → arg-c1169e53ce\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals."}}, {"data": {"id": "arg-9179c913ea", "kind": "counter", "label": "AG2 counter\nStudents should not dissect animals.", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-9179c913ea\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-ad123fd7a8\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should dissect animals as part of biology education when the activity uses already-dead/byproduct specimens.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target’s ethical justification treats “already-deceased/byproduct specimens” as meaning dissection avoids (or at least does not involve) additional killing/suffering for education.\",\n            \"In reality, “already-dead/byproduct” specimens still originate from upstream slaughter/harvesting processes that kill/harvest animals and create environmental harm.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, even when animals are already dead by the time of classroom dissection, the activity still relies on animal killing/harvesting and associated environmental harm rather than avoiding it.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Therefore, even when animals are already dead by the time of classroom dissection, the activity still relies on animal killing/harvesting and associated environmental harm rather than avoiding it.\",\n            \"Education should not require students to participate in practices that rely on killing/harvesting animals and cause environmental harm when that reliance is not morally necessary.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Requiring animal dissection therefore imposes unacceptable animal/environment harm that is not morally justified for education.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Requiring animal dissection therefore imposes unacceptable animal/environment harm that is not morally justified for education.\",\n            \"Synthetic models and computer simulations can teach anatomy/structure–function content without using animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Because effective non-animal alternatives exist, there is no need to impose dissection’s unacceptable harms.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Because effective non-animal alternatives exist, there is no need to impose dissection’s unacceptable harms.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals.\"\n      }\n    ],\n    \"Conc\": [\n      \"Therefore, even when animals are already dead by the time of classroom dissection, the activity still relies on animal killing/harvesting and associated environmental harm rather than avoiding it.\",\n      \"Requiring animal dissection therefore imposes unacceptable animal/environment harm that is not morally justified for education.\",\n      \"Because effective non-animal alternatives exist, there is no need to impose dissection’s unacceptable harms.\",\n      \"Students should not dissect animals.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170.0, "y": 280}}, {"data": {"id": "e-arg-9179c913ea", "source": "arg-9179c913ea", "target": "arg-ad123fd7a8", "ls": "solid", "label": "rebut", "detail": "arg-9179c913ea (AG2 counter) → arg-ad123fd7a8\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should dissect animals as part of biology education when the activity uses already-dead/byproduct specimens."}}, {"data": {"id": "arg-515a1fbf14", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals in schoo", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-515a1fbf14\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-9179c913ea\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target’s ethical justification treats classroom dissection with “already-deceased/byproduct” specimens as not requiring additional killing/suffering for education.\",\n            \"If the specimens are already dead by the time they reach the classroom, then classroom dissection does not increase the number of animals slaughtered/harvested for educational purposes (it reuses what already exists).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Upstream slaughter/harvesting origin does not mean the classroom dissection itself relies on additional killing/harvesting for education.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Upstream slaughter/harvesting origin does not mean the classroom dissection itself relies on additional killing/harvesting for education.\",\n            \"Education can be ethically justified in reusing otherwise-dead byproduct specimens when no additional killing/suffering is imposed beyond what would have occurred anyway.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In byproduct-based, already-dead dissection settings, the morally relevant harm is not newly imposed by dissection, so the activity is ethically permissible as a productive reuse.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In byproduct-based, already-dead dissection settings, the morally relevant harm is not newly imposed by dissection, so the activity is ethically permissible as a productive reuse.\",\n            \"Animal dissection provides meaningful, hands-on biology learning opportunities in school.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Because dissection is educationally valuable and does not add killing/suffering in already-dead byproduct settings, dissection can be justified for students.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Because dissection is educationally valuable and does not add killing/suffering in already-dead byproduct settings, dissection can be justified for students.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should dissect animals in school settings that use already-dead byproduct specimens.\"\n      }\n    ],\n    \"Conc\": [\n      \"Upstream slaughter/harvesting origin does not mean the classroom dissection itself relies on additional killing/harvesting for education.\",\n      \"In byproduct-based, already-dead dissection settings, the morally relevant harm is not newly imposed by dissection, so the activity is ethically permissible as a productive reuse.\",\n      \"Because dissection is educationally valuable and does not add killing/suffering in already-dead byproduct settings, dissection can be justified for students.\",\n      \"Students should dissect animals in school settings that use already-dead byproduct specimens.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170.0, "y": 420}}, {"data": {"id": "e-arg-515a1fbf14", "source": "arg-515a1fbf14", "target": "arg-9179c913ea", "ls": "solid", "label": "rebut", "detail": "arg-515a1fbf14 (AG1 defeat) → arg-9179c913ea\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals."}}, {"data": {"id": "arg-41a86f6baa", "kind": "counter", "label": "AG2 counter\nStudents should not dissect animals in s", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-41a86f6baa\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-515a1fbf14\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should dissect animals in school settings that use already-dead byproduct specimens.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target’s ethical justification depends on the idea that, in “already-dead/byproduct” settings, dissection does not newly impose additional animal slaughter/harvesting (i.e., dissection does not increase the relevant harm beyond what would have happened anyway).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Using dissection specimens for classroom education is not automatically “harm-free” just because animals are dead by the time students receive them.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Using dissection specimens for classroom education is not automatically “harm-free” just because animals are dead by the time students receive them.\",\n            \"If schools create demand for specific dissection specimens, suppliers must obtain/acquire enough specimens to meet that demand, which tends to increase slaughter/harvesting compared with a no-dissection counterfactual.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Classroom dissection can increase animal slaughter/harvesting rather than keeping it fixed at a “byproduct-only” level.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Classroom dissection can increase animal slaughter/harvesting rather than keeping it fixed at a “byproduct-only” level.\",\n            \"Our stance holds that dissection supply methods that rely on killing/harvesting are inhumane and also harm biodiversity/environment.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, even “already-dead/byproduct” dissection is still linked to inhumane killing/harvesting and environmental harm, so it is not ethically justified as a productive reuse.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Therefore, even “already-dead/byproduct” dissection is still linked to inhumane killing/harvesting and environmental harm, so it is not ethically justified as a productive reuse.\",\n            \"Non-animal alternatives (synthetic models and computer simulations) can teach anatomy/structure–function without using animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Given effective non-animal alternatives, requiring dissection is unjustified.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Given effective non-animal alternatives, requiring dissection is unjustified.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals in school.\"\n      }\n    ],\n    \"Conc\": [\n      \"Using dissection specimens for classroom education is not automatically “harm-free” just because animals are dead by the time students receive them.\",\n      \"Classroom dissection can increase animal slaughter/harvesting rather than keeping it fixed at a “byproduct-only” level.\",\n      \"Therefore, even “already-dead/byproduct” dissection is still linked to inhumane killing/harvesting and environmental harm, so it is not ethically justified as a productive reuse.\",\n      \"Given effective non-animal alternatives, requiring dissection is unjustified.\",\n      \"Students should not dissect animals in school.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170.0, "y": 560}}, {"data": {"id": "e-arg-41a86f6baa", "source": "arg-41a86f6baa", "target": "arg-515a1fbf14", "ls": "solid", "label": "rebut", "detail": "arg-41a86f6baa (AG2 counter) → arg-515a1fbf14\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should dissect animals in school settings that use already-dead byproduct specimens."}}, {"data": {"id": "arg-71f2340c09", "kind": "defeat", "label": "AG1 defeat\nStudents should dissect animals in schoo", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-71f2340c09\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-41a86f6baa\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals in school.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In typical school dissection programs, common specimens (e.g., fetal pigs) are meat-industry byproducts and are destined for disposal/landfill rather than being selected for classroom use while still living.\",\n            \"More than 98% of dissected animals in typical school programs were already deceased before dissection.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In typical settings, classroom dissection uses specimens that are already dead and already slated for disposal as byproducts.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In typical settings, classroom dissection uses specimens that are already dead and already slated for disposal as byproducts.\",\n            \"Meat-industry production happens regardless of whether schools later use those byproducts for dissection, so classroom use functions as reuse/diversion rather than creating additional slaughter/harvesting for education.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Classroom dissection demand does not increase killing/harvesting beyond what would occur anyway in typical byproduct-based supply.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Classroom dissection demand does not increase killing/harvesting beyond what would occur anyway in typical byproduct-based supply.\",\n            \"Therefore the “already-dead/byproduct” practice is not unjustified on the grounds that it increases animal slaughter/harvesting.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The premise that classroom dissection can increase slaughter/harvesting in these “already-dead/byproduct” cases is false for typical school settings.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The premise that classroom dissection can increase slaughter/harvesting in these “already-dead/byproduct” cases is false for typical school settings.\",\n            \"Animal dissection provides substantive hands-on learning that builds students' fine motor skills, hand-eye coordination, and critical thinking, and it can create motivating 'aha moments' that support interest in science.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"When the activity uses already-dead/byproduct specimens, dissection is educationally valuable and does not impose additional animal harm for education.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"When the activity uses already-dead/byproduct specimens, dissection is educationally valuable and does not impose additional animal harm for education.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should dissect animals in school settings that use already-dead/byproduct specimens.\"\n      }\n    ],\n    \"Conc\": [\n      \"In typical settings, classroom dissection uses specimens that are already dead and already slated for disposal as byproducts.\",\n      \"Classroom dissection demand does not increase killing/harvesting beyond what would occur anyway in typical byproduct-based supply.\",\n      \"The premise that classroom dissection can increase slaughter/harvesting in these “already-dead/byproduct” cases is false for typical school settings.\",\n      \"When the activity uses already-dead/byproduct specimens, dissection is educationally valuable and does not impose additional animal harm for education.\",\n      \"Students should dissect animals in school settings that use already-dead/byproduct specimens.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 170, "y": 700}}, {"data": {"id": "e-arg-71f2340c09", "source": "arg-71f2340c09", "target": "arg-41a86f6baa", "ls": "solid", "label": "rebut", "detail": "arg-71f2340c09 (AG1 defeat) → arg-41a86f6baa\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals in school."}}, {"data": {"id": "arg-4172c360aa", "kind": "main", "label": "AG1 main\nStudents should dissect animals in biolo", "color": "#1f77b4", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-4172c360aa\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"A school dissection activity that uses only verified “otherwise-dead byproduct specimens” (e.g., meat-industry fetal pigs already dead as byproducts) and prohibits live/wild-caught sourcing avoids creating additional killing/harvesting for the educational activity beyond what already occurs in the byproduct supply chain.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In byproduct-only, no-wild-capture classroom settings, dissection does not impose additional killing/harvesting harm for education.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In byproduct-only, no-wild-capture classroom settings, dissection does not impose additional killing/harvesting harm for education.\",\n            \"Using such otherwise-dead byproduct specimens as hands-on material for biology is a productive and worthwhile use for education (the materials are already dead and are put to educational use rather than discarded).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In byproduct-only, no-wild-capture classroom settings, dissection is a productive and worthwhile educational use of otherwise-dead byproduct specimens.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In byproduct-only, no-wild-capture classroom settings, dissection is a productive and worthwhile educational use of otherwise-dead byproduct specimens.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, dissection-permitted conditions for school biology are satisfied under byproduct-only, no-wild-capture procurement.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The dissection-prohibited condition in the harm-based objection requires that dissection “does impose harm” in the relevant way (i.e., it adds killing/harvesting harms for education).\",\n            \"In byproduct-only, no-wild-capture classroom settings, dissection does not impose additional killing/harvesting harm for education.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, the harm-based part of the dissection-prohibited condition does not apply in byproduct-only, no-wild-capture classroom settings.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Therefore, dissection-permitted conditions for school biology are satisfied under byproduct-only, no-wild-capture procurement.\",\n            \"Therefore, the harm-based part of the dissection-prohibited condition does not apply in byproduct-only, no-wild-capture classroom settings.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should dissect animals in biology education when schools use verified otherwise-dead byproduct specimens and prohibit live/wild-caught sourcing.\"\n      }\n    ],\n    \"Conc\": [\n      \"In byproduct-only, no-wild-capture classroom settings, dissection does not impose additional killing/harvesting harm for education.\",\n      \"In byproduct-only, no-wild-capture classroom settings, dissection is a productive and worthwhile educational use of otherwise-dead byproduct specimens.\",\n      \"Therefore, dissection-permitted conditions for school biology are satisfied under byproduct-only, no-wild-capture procurement.\",\n      \"Therefore, the harm-based part of the dissection-prohibited condition does not apply in byproduct-only, no-wild-capture classroom settings.\",\n      \"Students should dissect animals in biology education when schools use verified otherwise-dead byproduct specimens and prohibit live/wild-caught sourcing.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 425.0, "y": 0}}, {"data": {"id": "arg-6539849e14", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals for ", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-6539849e14\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-4172c360aa\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should dissect animals in biology education when schools use verified otherwise-dead byproduct specimens and prohibit live/wild-caught sourcing.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target’s justification treats “byproduct-only, no-wild-caught” dissection as meaning the classroom activity avoids morally relevant killing/harvesting harm for education beyond what already occurs.\",\n            \"Even when animals are already dead by the time of classroom dissection, the specimens necessarily originate from killing/harvesting animals, so dissection does not truly avoid the harm—it repurposes animal deaths for education rather than preventing them.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Byproduct-only dissection still relies on animal killing/harvesting and therefore does not eliminate the moral harm at issue.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Byproduct-only dissection still relies on animal killing/harvesting and therefore does not eliminate the moral harm at issue.\",\n            \"Animal dissection is not required by AP Biology/NGSS learning goals, and effective non-animal alternatives (synthetic models and computer simulations) can teach anatomy/structure–function without using animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Since dissection is unnecessary for required learning outcomes and alternatives exist, requiring dissection would impose avoidable harm.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Since dissection is unnecessary for required learning outcomes and alternatives exist, requiring dissection would impose avoidable harm.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals for school biology, including in “byproduct-only” settings.\"\n      }\n    ],\n    \"Conc\": [\n      \"Byproduct-only dissection still relies on animal killing/harvesting and therefore does not eliminate the moral harm at issue.\",\n      \"Since dissection is unnecessary for required learning outcomes and alternatives exist, requiring dissection would impose avoidable harm.\",\n      \"Students should not dissect animals for school biology, including in “byproduct-only” settings.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 425.0, "y": 140}}, {"data": {"id": "e-arg-6539849e14", "source": "arg-6539849e14", "target": "arg-4172c360aa", "ls": "solid", "label": "rebut", "detail": "arg-6539849e14 (AG2 defeat) → arg-4172c360aa\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should dissect animals in biology education when schools use verified otherwise-dead byproduct specimens and prohibit live/wild-caught sourcing."}}, {"data": {"id": "arg-ea70dfdb14", "kind": "counter", "label": "AG1 counter\nStudents should dissect animals in biolo", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-ea70dfdb14\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG1\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-6539849e14\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals for school biology, including in “byproduct-only” settings.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"If a school designs the dissection program with verified “otherwise-dead byproduct specimens” and with procurement rules that prohibit live/wild-caught sourcing for the activity, then the classroom dissection does not require additional animal killing/harvesting beyond what already occurred upstream to produce those byproducts.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In verified byproduct-only, no-live-sourcing programs, dissection does not “impose harm” in the incremental sense relevant to the harm-based prohibition.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In verified byproduct-only, no-live-sourcing programs, dissection does not “impose harm” in the incremental sense relevant to the harm-based prohibition.\",\n            \"The dissection-prohibited condition requires both (i) dissection being not necessary for the core competency-building justification and (ii) dissection “imposing harm.”\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Even if dissection is not strictly required by some standards, the prohibition does not follow unless the “impose harm” requirement holds.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Even if dissection is not strictly required by some standards, the prohibition does not follow unless the “impose harm” requirement holds.\",\n            \"In verified byproduct-only, no-live-sourcing programs, the “impose harm” requirement does not hold.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Therefore, the harm-based dissection prohibition does not apply to verified byproduct-only, no-live-sourcing school programs.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Therefore, the harm-based dissection prohibition does not apply to verified byproduct-only, no-live-sourcing school programs.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should dissect animals in biology education when schools use verified otherwise-dead byproduct specimens and prohibit live/wild-caught sourcing.\"\n      }\n    ],\n    \"Conc\": [\n      \"In verified byproduct-only, no-live-sourcing programs, dissection does not “impose harm” in the incremental sense relevant to the harm-based prohibition.\",\n      \"Even if dissection is not strictly required by some standards, the prohibition does not follow unless the “impose harm” requirement holds.\",\n      \"Therefore, the harm-based dissection prohibition does not apply to verified byproduct-only, no-live-sourcing school programs.\",\n      \"Students should dissect animals in biology education when schools use verified otherwise-dead byproduct specimens and prohibit live/wild-caught sourcing.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 425.0, "y": 280}}, {"data": {"id": "e-arg-ea70dfdb14", "source": "arg-ea70dfdb14", "target": "arg-6539849e14", "ls": "solid", "label": "rebut", "detail": "arg-ea70dfdb14 (AG1 counter) → arg-6539849e14\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals for school biology, including in “byproduct-only” settings."}}, {"data": {"id": "arg-1d12c8f033", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals, inc", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-1d12c8f033\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"undercut\",\n  \"target_id\": \"arg-ea70dfdb14\",\n  \"target_field\": \"Ass\",\n  \"target_statement\": \"That the harm-based dissection prohibition does not apply whenever dissection does not impose harm in an incremental sense (i.e., beyond what already happens upstream to produce byproducts).\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The ethical reason to oppose dissection is that it requires education to depend on animal killing/harvesting (and associated environmental harm), not specifically that it increases the number of animals killed beyond an upstream baseline.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Moral unacceptability does not turn on dissection causing additional (incremental) killing/harvesting beyond upstream production; reliance on killing/harvesting for education is sufficient for the objection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Moral unacceptability does not turn on dissection causing additional (incremental) killing/harvesting beyond upstream production; reliance on killing/harvesting for education is sufficient for the objection.\",\n            \"By “byproduct-only/no-live-sourcing,” schools still obtain dissection specimens by upstream killing/harvesting to produce those byproducts.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Byproduct-only classroom dissection still depends on animal killing/harvesting and thus does not eliminate the harm that grounds the objection.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Byproduct-only classroom dissection still depends on animal killing/harvesting and thus does not eliminate the harm that grounds the objection.\",\n            \"Animal dissection is not necessary to meet required biology learning outcomes, and effective non-animal alternatives exist (synthetic models and computer simulations).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Because dissection is unnecessary when alternatives are effective, requiring dissection cannot be justified despite the dependence on animal killing/harvesting.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Because dissection is unnecessary when alternatives are effective, requiring dissection cannot be justified despite the dependence on animal killing/harvesting.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals, including in byproduct-only/no-live-sourcing settings.\"\n      }\n    ],\n    \"Conc\": [\n      \"Moral unacceptability does not turn on dissection causing additional (incremental) killing/harvesting beyond upstream production; reliance on killing/harvesting for education is sufficient for the objection.\",\n      \"Byproduct-only classroom dissection still depends on animal killing/harvesting and thus does not eliminate the harm that grounds the objection.\",\n      \"Because dissection is unnecessary when alternatives are effective, requiring dissection cannot be justified despite the dependence on animal killing/harvesting.\",\n      \"Students should not dissect animals, including in byproduct-only/no-live-sourcing settings.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 340, "y": 420}}, {"data": {"id": "e-arg-1d12c8f033", "source": "arg-1d12c8f033", "target": "arg-ea70dfdb14", "ls": "dashed", "label": "undercut", "detail": "arg-1d12c8f033 (AG2 defeat) → arg-ea70dfdb14\nattack: undercut\ntarget_field: Ass\ntarget_statement: That the harm-based dissection prohibition does not apply whenever dissection does not impose harm in an incremental sense (i.e., beyond what already happens upstream to produce byproducts)."}}, {"data": {"id": "arg-706b642e8a", "kind": "defeat", "label": "AG2 defeat\nStudents should not dissect animals in s", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-706b642e8a\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG1\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-ea70dfdb14\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should dissect animals in biology education when schools use verified otherwise-dead byproduct specimens and prohibit live/wild-caught sourcing.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target’s conclusion depends on a sourcing condition: the activity uses verified otherwise-dead byproduct specimens and prohibits live/wild-caught sourcing.\",\n            \"In typical school dissection programs, approximately 99% of dissected animals are caught in the wild rather than being already-dead/byproducts.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical school dissection programs do not reliably satisfy the byproduct-only/no-wild-caught sourcing condition assumed by the target.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Typical school dissection programs do not reliably satisfy the byproduct-only/no-wild-caught sourcing condition assumed by the target.\",\n            \"Wild-catching decreases local populations and reduces biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Typical dissection practices cause environmental harm via population declines and biodiversity loss.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Typical dissection practices cause environmental harm via population declines and biodiversity loss.\",\n            \"The inhumane supply methods used for dissection (including wild-catching/harvesting) involve animal harm that is morally unacceptable for education.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Requiring students to dissect animals in typical school settings imposes unacceptable animal and environmental harm.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Requiring students to dissect animals in typical school settings imposes unacceptable animal and environmental harm.\",\n            \"Non-animal alternatives (synthetic models and computer simulations) can achieve the relevant anatomy/structure–function learning goals without using animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Because effective non-animal alternatives exist, requiring dissection is unjustified.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Because effective non-animal alternatives exist, requiring dissection is unjustified.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals in school.\"\n      }\n    ],\n    \"Conc\": [\n      \"Typical school dissection programs do not reliably satisfy the byproduct-only/no-wild-caught sourcing condition assumed by the target.\",\n      \"Typical dissection practices cause environmental harm via population declines and biodiversity loss.\",\n      \"Requiring students to dissect animals in typical school settings imposes unacceptable animal and environmental harm.\",\n      \"Because effective non-animal alternatives exist, requiring dissection is unjustified.\",\n      \"Students should not dissect animals in school.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 510, "y": 420}}, {"data": {"id": "e-arg-706b642e8a", "source": "arg-706b642e8a", "target": "arg-ea70dfdb14", "ls": "solid", "label": "rebut", "detail": "arg-706b642e8a (AG2 defeat) → arg-ea70dfdb14\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should dissect animals in biology education when schools use verified otherwise-dead byproduct specimens and prohibit live/wild-caught sourcing."}}, {"data": {"id": "arg-a6c4e5e080", "kind": "main", "label": "AG2 main\nStudents should not dissect animals.", "color": "#d62728", "shape": "round-rectangle", "bw": 4, "bc": "#e6b800", "detail": "{\n  \"id\": \"arg-a6c4e5e080\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"main\",\n  \"status\": \"defensible\",\n  \"closed_by_budget\": true\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"AP Biology and Next Generation Science Standards do not require animal dissection to achieve the relevant anatomy/structure–function learning goals.\",\n            \"Synthetic models and computer simulations can teach the required anatomy/structure–function content at least as effectively as dissection.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection is not necessary for the core competency-building justification.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Requiring student dissection creates demand for dissection specimens.\",\n            \"In the typical dissection supply chain, dissection specimens are often obtained via inhumane wild-catching/harvesting that harms animals and reduces local populations and biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Requiring dissection imposes animal and environmental harm.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection is not necessary for the core competency-building justification.\",\n            \"Requiring dissection imposes animal and environmental harm.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection-prohibited condition (package B) holds.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Synthetic models and computer simulations can teach the relevant anatomy/structure–function content at least as effectively as dissection.\",\n            \"An activity is not a “productive and worthwhile use for education” when it provides no educational advantage over effective alternatives while still depending on animal/environment harm.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection is not a productive and worthwhile educational use.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection-permitted condition (package A) requires both (i) use of otherwise-dead byproduct specimens and (ii) a “productive and worthwhile use for education.”\",\n            \"Dissection is not a productive and worthwhile educational use.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection-permitted condition (package A) does not hold.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection-prohibited condition (package B) holds.\",\n            \"Dissection-permitted condition (package A) does not hold.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals.\"\n      }\n    ],\n    \"Conc\": [\n      \"Dissection is not necessary for the core competency-building justification.\",\n      \"Requiring dissection imposes animal and environmental harm.\",\n      \"Dissection-prohibited condition (package B) holds.\",\n      \"Dissection is not a productive and worthwhile educational use.\",\n      \"Dissection-permitted condition (package A) does not hold.\",\n      \"Students should not dissect animals.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 765.0, "y": 0}}, {"data": {"id": "arg-78b499e6c3", "kind": "defeat", "label": "AG1 defeat\nDissection-permitted conditions are sati", "color": "#1f77b4", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-78b499e6c3\",\n  \"agent\": \"AG1\",\n  \"proponent\": \"AG2\",\n  \"type\": \"defeat\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-a6c4e5e080\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should not dissect animals.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection requires students to directly manipulate real anatomical specimens and interpret anatomical structures.\",\n            \"Direct manipulation of real anatomy builds students’ fine motor skills, hand-eye coordination, and critical-thinking about anatomy.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Animal dissection builds competency-relevant psychomotor skills and anatomy reasoning, not just factual knowledge.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Animal dissection builds competency-relevant psychomotor skills and anatomy reasoning, not just factual knowledge.\",\n            \"Alternatives like synthetic models and computer simulations generally provide less opportunity to practice the same tactile, spatial manipulation and fine-motor coordination skills that dissection practice develops.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection is necessary for the full competency-building justification that includes these psychomotor and interpretive skills.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection is necessary for the full competency-building justification that includes these psychomotor and interpretive skills.\",\n            \"The dissection-prohibited condition (package B) requires that dissection is not necessary for the core competency-building justification.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The “not necessary for core competency-building” requirement of package B does not hold when the justification includes psychomotor skill + anatomy reasoning.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The “not necessary for core competency-building” requirement of package B does not hold when the justification includes psychomotor skill + anatomy reasoning.\",\n            \"When schools restrict procurement to verified otherwise-dead byproduct specimens (no live/wild-caught sourcing for the activity), dissection does not add incremental killing/harvesting for education beyond what already occurs to produce those byproducts.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"In verified byproduct-only, no-live-sourcing programs, the harm-based objection also lacks its “impose harm” premise in the relevant incremental sense.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"In verified byproduct-only, no-live-sourcing programs, the harm-based objection also lacks its “impose harm” premise in the relevant incremental sense.\",\n            \"Dissection using otherwise-dead byproduct specimens can be a productive and worthwhile use for education (hands-on competency and motivation).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection-permitted conditions are satisfied (package A) and package B’s dissection-prohibited conditions are not jointly met, so students should dissect animals in such educational settings.\"\n      }\n    ],\n    \"Conc\": [\n      \"Animal dissection builds competency-relevant psychomotor skills and anatomy reasoning, not just factual knowledge.\",\n      \"Dissection is necessary for the full competency-building justification that includes these psychomotor and interpretive skills.\",\n      \"The “not necessary for core competency-building” requirement of package B does not hold when the justification includes psychomotor skill + anatomy reasoning.\",\n      \"In verified byproduct-only, no-live-sourcing programs, the harm-based objection also lacks its “impose harm” premise in the relevant incremental sense.\",\n      \"Dissection-permitted conditions are satisfied (package A) and package B’s dissection-prohibited conditions are not jointly met, so students should dissect animals in such educational settings.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 765.0, "y": 140}}, {"data": {"id": "e-arg-78b499e6c3", "source": "arg-78b499e6c3", "target": "arg-a6c4e5e080", "ls": "solid", "label": "rebut", "detail": "arg-78b499e6c3 (AG1 defeat) → arg-a6c4e5e080\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should not dissect animals."}}, {"data": {"id": "arg-9b31895c3d", "kind": "counter", "label": "AG2 counter\nStudents should not dissect animals in s", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-9b31895c3d\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-78b499e6c3\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should dissect animals in biology education when schools use verified otherwise-dead byproduct specimens and prohibit live/wild-caught sourcing.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target argues dissection is necessary for the “core competency-building justification” because it uniquely builds psychomotor skills (fine motor/hand-eye coordination) along with anatomy reasoning.\",\n            \"Synthetic models and computer/virtual simulations can provide repeated practice that builds fine-motor/hand-eye coordination and supports anatomy/structure–function reasoning without using animal bodies.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection is not necessary to build the psychomotor + anatomy reasoning competencies that dissection is claimed to provide.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection is not necessary to build the psychomotor + anatomy reasoning competencies that dissection is claimed to provide.\",\n            \"Package B requires that dissection is not necessary for the core competency-building justification.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The “not necessary for core competency-building” requirement of package B holds.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The “not necessary for core competency-building” requirement of package B holds.\",\n            \"Requiring dissection still depends on animal bodies and the inhumane animal-supply practices behind them, which our stance treats as morally unacceptable and also environmentally harmful.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Requiring dissection does impose morally unacceptable animal harm and environmental harm (so the harm part of package B applies).\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The “not necessary for core competency-building” requirement of package B holds.\",\n            \"Requiring dissection does impose morally unacceptable animal harm and environmental harm (so the harm part of package B applies).\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Package B holds, so students should not dissect animals.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Package B holds, so students should not dissect animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals in school biology, even when the school claims to be using only “byproduct” specimens.\"\n      }\n    ],\n    \"Conc\": [\n      \"Dissection is not necessary to build the psychomotor + anatomy reasoning competencies that dissection is claimed to provide.\",\n      \"The “not necessary for core competency-building” requirement of package B holds.\",\n      \"Requiring dissection does impose morally unacceptable animal harm and environmental harm (so the harm part of package B applies).\",\n      \"Package B holds, so students should not dissect animals.\",\n      \"Students should not dissect animals in school biology, even when the school claims to be using only “byproduct” specimens.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 680, "y": 280}}, {"data": {"id": "e-arg-9b31895c3d", "source": "arg-9b31895c3d", "target": "arg-78b499e6c3", "ls": "solid", "label": "rebut", "detail": "arg-9b31895c3d (AG2 counter) → arg-78b499e6c3\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should dissect animals in biology education when schools use verified otherwise-dead byproduct specimens and prohibit live/wild-caught sourcing."}}, {"data": {"id": "arg-da553be5be", "kind": "counter", "label": "AG2 counter\nStudents should not dissect animals.", "color": "#d62728", "shape": "ellipse", "bw": 0, "bc": "#ffffff", "detail": "{\n  \"id\": \"arg-da553be5be\",\n  \"agent\": \"AG2\",\n  \"proponent\": \"AG2\",\n  \"type\": \"counter\",\n  \"attack\": \"rebut\",\n  \"target_id\": \"arg-78b499e6c3\",\n  \"target_field\": \"Conc\",\n  \"target_statement\": \"Students should dissect animals in biology education when schools use verified otherwise-dead byproduct specimens and prohibit live/wild-caught sourcing.\"\n}\n\n{\n  \"Argument\": {\n    \"rules\": [\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The target claims dissection is “necessary” for the competency-building justification because it uniquely develops psychomotor skills (fine motor/hand-eye coordination) plus anatomy reasoning.\",\n            \"Our stance holds that synthetic models and computer simulations teach anatomy/structure–function effectively (equally well or better), and students can learn the relevant competencies without dead animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Dissection is not necessary to achieve the competency-building goals the target attributes to it.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Dissection is not necessary to achieve the competency-building goals the target attributes to it.\",\n            \"Package B’s “not necessary for the core competency-building justification” requirement is therefore satisfied.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"The dissection-prohibited condition (package B) holds regarding the “not necessary” component.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"The dissection-prohibited condition (package B) holds regarding the “not necessary” component.\",\n            \"Our stance holds that methods used to supply animals for dissections are inhumane and environmentally harmful because dissection depends on animal killing/harvesting that can reduce local populations and biodiversity.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Requiring dissection “does impose harm,” satisfying package B’s harm component.\"\n      },\n      {\n        \"antecedent\": {\n          \"strong\": [\n            \"Requiring dissection “does impose harm,” satisfying package B’s harm component.\",\n            \"When package B holds (not necessary + does impose harm), the outcome is that students should not dissect animals.\"\n          ],\n          \"weak_negation\": []\n        },\n        \"consequent\": \"Students should not dissect animals.\"\n      }\n    ],\n    \"Conc\": [\n      \"Dissection is not necessary to achieve the competency-building goals the target attributes to it.\",\n      \"The dissection-prohibited condition (package B) holds regarding the “not necessary” component.\",\n      \"Requiring dissection “does impose harm,” satisfying package B’s harm component.\",\n      \"Students should not dissect animals.\"\n    ],\n    \"Ass\": []\n  }\n}"}, "position": {"x": 850, "y": 280}}, {"data": {"id": "e-arg-da553be5be", "source": "arg-da553be5be", "target": "arg-78b499e6c3", "ls": "solid", "label": "rebut", "detail": "arg-da553be5be (AG2 counter) → arg-78b499e6c3\nattack: rebut\ntarget_field: Conc\ntarget_statement: Students should dissect animals in biology education when schools use verified otherwise-dead byproduct specimens and prohibit live/wild-caught sourcing."}}, {"data": {"id": "end-arg-3188adc224", "label": "終了: overruled（反論できず敗北）\nAG1 反論なし: I can’t construct a new, non-repetitive counterargument to the same target (arg-f3f3fe86a2) that wouldn’t substantially repeat the learning/necessity and ethical-byproduct reasoning already used in my…", "detail": "終了: overruled（反論できず敗北）\nAG1 反論なし: I can’t construct a new, non-repetitive counterargument to the same target (arg-f3f3fe86a2) that wouldn’t substantially repeat the learning/necessity and ethical-byproduct reasoning already used in my earlier response against it in this round."}, "position": {"x": 0, "y": 826.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-3188adc224", "source": "end-arg-3188adc224", "target": "arg-2f1b0a9768", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-c1169e53ce", "label": "終了: overruled（反論できず敗北）\nAG2 反論なし: Any counterargument that directly defeats the opponent’s claim here would have to rely on one of the same core lines we already used earlier in this thread (e.g., disputing “byproduct/already-dead” so…", "detail": "終了: overruled（反論できず敗北）\nAG2 反論なし: Any counterargument that directly defeats the opponent’s claim here would have to rely on one of the same core lines we already used earlier in this thread (e.g., disputing “byproduct/already-dead” sourcing via wild-capture; or arguing dissection is unnecessary because effective non-animal alternatives and required standards/medical training do not rely on it). Under the non-repetition constraint, that would amount to substantially repeating the same underlying reasoning, so I cannot construct a non-repetitive valid counterargument."}, "position": {"x": 170, "y": 976.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-c1169e53ce", "source": "end-arg-c1169e53ce", "target": "arg-71f2340c09", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-4172c360aa", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 510, "y": 1126.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-4172c360aa", "source": "end-arg-4172c360aa", "target": "arg-706b642e8a", "ls": "dotted", "inferred": 1}}, {"data": {"id": "end-arg-a6c4e5e080", "label": "終了: ターン上限到達 → defensible", "detail": "終了: ターン上限到達 → defensible"}, "position": {"x": 850, "y": 1276.0}, "classes": "note", "grabbable": false}, {"data": {"id": "end-e-arg-a6c4e5e080", "source": "end-arg-a6c4e5e080", "target": "arg-da553be5be", "ls": "dotted", "inferred": 1}}, {"data": {"id": "nomain-AG1", "label": "AG1: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 1020, "y": 0.0}, "classes": "note", "selectable": false, "grabbable": false}, {"data": {"id": "nomain-AG2", "label": "AG2: 新しい main を出せず\nDialogue turn budget (max_dialogue_turns) reached."}, "position": {"x": 1020, "y": 84.0}, "classes": "note", "selectable": false, "grabbable": false}], "lane": false, "meta": "<table><tr><td>total_dialogue_turns<\/td><td>20<\/td><\/tr><tr><td>attack_turn_count<\/td><td>16<\/td><\/tr><tr><td>main_argument_count<\/td><td>4<\/td><\/tr><tr><td>justified_proven_count<\/td><td>0<\/td><\/tr><tr><td>justified_by_budget_count<\/td><td>0<\/td><\/tr><tr><td>overruled_count<\/td><td>2<\/td><\/tr><tr><td>defensible_count<\/td><td>2<\/td><\/tr><tr><td>total_cost_usd<\/td><td>0.202649<\/td><\/tr><\/table><details><summary>agent1_stance<\/summary><pre>Your stance:\nYou support animal dissection.\nYou believe dissecting real animals provides students with more learning opportunities, as dissection is a valuable part of teaching biology in schools, developing fine motor skills, hand-eye coordination, and critical thinking.\nYou believe dissection can encourage students to pursue careers in science by providing hands-on experience that inspires career interest and creates aha moments that spark enthusiasm for scientific fields.\nYou believe animal dissection is a productive and worthwhile use of dead animals, as over 98% of dissected animals were already deceased and fetal pigs are meat industry byproducts destined for landfills.<\/pre><\/details><details><summary>agent2_stance<\/summary><pre>Your stance:\nYou oppose animal dissection.\nYou believe methods used to supply animals for dissections are inhumane and bad for the environment, as approximately 99% of dissection animals are caught in the wild and wild-catching decreases local populations and reduces biodiversity.\nYou believe medical studies do not require or benefit from animal dissection, as it is not required by College Board AP Biology or Next Generation Science Standards, and no U.S. or Canadian medical schools use animals for physician training.\nYou believe dissecting real animals is unnecessary because alternatives exist, as synthetic models and computer simulations teach equally well or better and students learn just as well or better with alternatives versus dead animals.<\/pre><\/details><details><summary>final_answer<\/summary><pre>Students should **not** dissect animals **as a general rule** in school biology. Dissection should be permitted only in **narrow, carefully controlled cases** where schools can **verify** that the specimens are **otherwise-dead byproducts** and the program **prohibits live or wild-caught sourcing**—and even then, only when dissection is used as a meaningful learning activity rather than as a default.\n\n## Rationale (how the main considerations cut)\n\n### 1) Why the default should be “no”: harmful and unnecessary in typical practice\n- **Supply harm and environmental impact:** The strongest objection is that many school dissection programs rely on sourcing practices that harm animals and local ecosystems—specifically, claims that roughly **99% of dissection animals are wild-caught** rather than already-dead byproducts. If that’s the reality of the program, then requiring students to dissect is ethically hard to justify.\n- **Not required by core biology/medical learning needs:** Dissection is also argued to be **unnecessary** because it is **not required** by major curriculum frameworks (AP Biology/NGSS) for the relevant learning goals, and because there’s no apparent reliance on animal use for **physician training** in the U.S. or Canada.  \n- **Alternatives can teach effectively:** The opposition also emphasizes that **synthetic models and computer simulations** can teach anatomy/structure–function **at least as well as** dissection—meaning dissection doesn’t provide a necessary educational advantage that would justify harm.\n\nTaken together, these points make it appropriate to oppose dissection in settings that can’t confidently meet the strict “verified byproduct-only, no live/wild sourcing” condition.\n\n### 2) When dissection *can* be justified: verified byproduct-only procurement\nThe pro-dissection case is strongest **only** when the harm-based concern is minimized. If a school can genuinely ensure:\n- the specimens are **verified otherwise-dead byproducts** (for example, the common claim involving **fetal pigs as meat-industry byproducts**), and\n- the program **prohibits live/wild-caught sourcing** for dissection purposes,\n\nthen the key “avoid imposing harm” rationale can plausibly hold in the incremental sense—because the school is **reusing** material that was already destined to be killed/processed rather than creating a new demand for live animals.\n\nIn those narrowly tailored circumstances, the educational benefits asserted by supporters become more weighty:\n- real, direct manipulation can improve **hands-on learning**, **fine motor skills/hand–eye coordination**, and **critical thinking** about anatomy;\n- it may create motivating “aha moments” that support interest in science careers.\n\n### 3) Important unresolved ethical tension (why confidence isn’t absolute)\nEven under “byproduct-only” procurement, there remains a philosophical issue: **byproducts originate from slaughter/harvesting upstream**, so critics argue the moral cost isn’t fully eliminated—it’s merely redirected. The debate did not completely settle whether “reusing byproducts for education” is morally acceptable despite that upstream killing.  \n\nStill, the best-supported policy response is to:\n- **avoid dissection where sourcing can’t be verified as byproduct-only**, and\n- **use alternatives whenever feasible**, since alternatives are claimed to match or outperform dissection for the relevant learning goals.\n\n## Bottom line\n- **Default policy:** Students **should not** dissect animals in school biology.\n- **Exception (only with strict safeguards):** Allow dissection **only** when schools can **verify** specimens are **otherwise-dead byproducts** with **no live/wild-caught sourcing**, and the activity is used for genuine educational value rather than for convenience.<\/pre><\/details><div>justification_status: <b>fallback_no_consensus<\/b><\/div><div>consensus_reached: <b>False<\/b><\/div>"}]}};
